<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Area 51 — Week 5 · The 5 Ps</title>
<style>
  :root{
    --bg:#eef3fd;
    --card:#ffffff;
    --card2:#e9f0ff;
    --line:#d5dff5;
    --line2:#c2cff0;
    --ink:#152046;
    --ink2:#38446e;
    --muted:#5d6b96;
    --accent:#3f5cc9;
    --accent2:#2f47a8;
    --soft:#dfe8ff;
    --pink:#b83c6e;
    --live:#12a05e;
    --shadow:0 1px 2px rgba(21,32,70,.05), 0 18px 40px -26px rgba(21,32,70,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  /* ambient animated blooms — reads as "web", not slide */
  #amb{position:fixed;inset:-30vh -20vw;z-index:0;pointer-events:none;filter:blur(70px);opacity:.6}
  #amb i{position:absolute;display:block;border-radius:50%}
  #amb i:nth-child(1){width:46vw;height:46vw;left:2vw;top:4vh;background:#cfe0ff;animation:drift1 26s ease-in-out infinite}
  #amb i:nth-child(2){width:38vw;height:38vw;right:4vw;bottom:2vh;background:#e3d6ff;animation:drift2 32s ease-in-out infinite}
  #amb i:nth-child(3){width:30vw;height:30vw;left:44vw;top:48vh;background:#d6f0ff;animation:drift3 38s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,5vh) scale(1.14)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-7vw,-4vh) scale(.94)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(-5vw,6vh) scale(1.12)}}

  #pbar{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:40;
        transition:width .4s cubic-bezier(.3,.9,.3,1);box-shadow:0 0 12px rgba(63,92,201,.5)}

  #stage{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;
         padding:clamp(20px,3.4vh,44px) clamp(26px,5vw,96px) 74px}
  #topbar{display:flex;justify-content:space-between;align-items:baseline;gap:20px;
          margin-bottom:clamp(10px,2vh,24px)}
  .kicker{font-size:clamp(12px,1.2vw,17px);letter-spacing:.24em;text-transform:uppercase;
          color:var(--accent);font-weight:800}
  .pagenum{font-size:clamp(12px,1.15vw,16px);color:var(--muted);font-weight:800;
           font-variant-numeric:tabular-nums;letter-spacing:.08em;white-space:nowrap}
  #body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}

  .pagein{animation:pagein .42s cubic-bezier(.2,.85,.3,1)}
  @keyframes pagein{from{opacity:0;transform:translateY(20px) scale(.994)}to{opacity:1;transform:none}}

  h1{font-size:clamp(46px,8vw,138px);line-height:.96;letter-spacing:-.03em;font-weight:800}
  h2{font-size:clamp(30px,4.5vw,72px);line-height:1.06;letter-spacing:-.02em;font-weight:800}
  h2.sm{font-size:clamp(27px,3.4vw,54px)}
  p{font-size:clamp(20px,2.2vw,38px);line-height:1.34;color:var(--ink2);max-width:26em}
  p.sm{font-size:clamp(18px,1.7vw,28px);line-height:1.42}
  p.big{font-size:clamp(24px,3.1vw,58px);line-height:1.16;font-weight:750;color:var(--ink);letter-spacing:-.012em}
  p.mega{font-size:clamp(32px,4.9vw,94px);line-height:1.06;font-weight:800;color:var(--ink);letter-spacing:-.028em}
  .muted{color:var(--muted)}
  .am{color:var(--accent)}
  .pk{color:var(--pink)}
  .sp{margin-top:clamp(10px,1.9vh,24px)}
  .sp2{margin-top:clamp(20px,3.6vh,50px)}
  strong{font-weight:800;color:var(--ink)}
  .label{font-size:clamp(13px,1.35vw,21px);letter-spacing:.26em;text-transform:uppercase;
         color:var(--accent);font-weight:800;margin-bottom:clamp(10px,1.8vh,22px)}
  .rule{height:1px;background:var(--line);margin:clamp(14px,2.4vh,30px) 0;max-width:24em}

  /* ---------- QR ---------- */
  .qrwrap{display:flex;gap:clamp(22px,3.4vw,64px);align-items:center;flex-wrap:wrap}
  .qrcard{background:#fff;border:2px solid var(--line);border-radius:24px;
          padding:clamp(12px,1.4vw,22px);width:clamp(180px,22vw,340px);box-shadow:var(--shadow);
          position:relative}
  .qrcard::after{content:'';position:absolute;inset:-9px;border-radius:30px;
                 border:2px dashed var(--soft);animation:ring 3.4s linear infinite}
  @keyframes ring{to{transform:rotate(360deg)}}
  .qrcard svg{display:block;width:100%;height:auto;position:relative;z-index:1}
  .qrurl{margin-top:9px;text-align:center;color:var(--ink);font-weight:800;
         font-size:clamp(11px,1.05vw,17px);position:relative;z-index:1}
  .rules{list-style:none;display:flex;flex-direction:column;gap:clamp(6px,1.3vh,16px)}
  .rules li{font-size:clamp(21px,2.5vw,46px);line-height:1.24;font-weight:750;letter-spacing:-.012em}
  .qstrip{background:var(--card);border:2px solid var(--line);border-radius:16px;
          padding:clamp(12px,1.7vh,20px) clamp(14px,1.6vw,26px);margin-top:clamp(16px,2.8vh,34px);
          display:flex;gap:clamp(14px,2.4vw,44px);flex-wrap:wrap;box-shadow:var(--shadow)}
  .qstrip div{font-size:clamp(14px,1.35vw,22px);color:var(--ink2);line-height:1.35;flex:1 1 200px}
  .qstrip b{color:var(--accent);margin-right:.65em;font-weight:800}

  /* ---------- LIVE panel ---------- */
  .lvhead{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
          margin-bottom:clamp(8px,1.5vh,16px)}
  .lvhead h2{font-size:clamp(22px,2.5vw,42px)}
  .lvmeta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .livebadge{display:inline-flex;align-items:center;gap:8px;background:#e6f8ef;
             border:1.5px solid #b6e7cd;color:#0c7a48;font-weight:800;font-size:13px;
             letter-spacing:.16em;padding:5px 12px;border-radius:999px}
  .livebadge i{width:9px;height:9px;border-radius:50%;background:var(--live);display:block;
               animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(18,160,94,.55)}
                   50%{opacity:.75;box-shadow:0 0 0 7px rgba(18,160,94,0)}}
  .ticknum{font-size:clamp(22px,2.4vw,38px);font-weight:800;color:var(--accent);
           font-variant-numeric:tabular-nums;line-height:1}
  .ticklab{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .panel{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);overflow:auto;padding-right:4px}
  .qcard{background:var(--card);border:2px solid var(--line);border-radius:15px;
         padding:clamp(8px,1.15vh,15px) clamp(12px,1.4vw,22px);transition:border-color .25s,background .25s}
  .qcard.rev{border-color:var(--accent);background:var(--card2)}
  .qrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .qt{font-size:clamp(14px,1.42vw,23px);font-weight:750;line-height:1.22;color:var(--ink)}
  .qright{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .qn{font-size:clamp(12px,1.1vw,16px);color:var(--muted);font-weight:800;white-space:nowrap;
      font-variant-numeric:tabular-nums}
  .bars{display:flex;flex-direction:column;gap:5px;margin-top:7px}
  .bar{display:flex;align-items:center;gap:10px;font-size:clamp(12px,1.12vw,18px)}
  .bar .lab{flex:0 0 clamp(140px,19vw,330px);color:var(--ink2);line-height:1.22;transition:color .2s}
  .bar .track{flex:1;height:clamp(11px,1.45vh,19px);background:#e7edfb;border-radius:6px;
              overflow:hidden;min-width:56px}
  .bar .fill{display:block;height:100%;width:0;background:#9fb2e0;border-radius:6px;
             transition:width .5s cubic-bezier(.25,.9,.3,1), background .25s}
  .bar .num{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;
            min-width:6.4em;text-align:right;font-weight:800}
  .bar.win .fill{background:var(--accent)}
  .bar.win .lab{color:var(--ink);font-weight:800}
  .bar.win .num{color:var(--accent)}
  .bar.bump .fill{background:var(--live)}
  .bar.bump .num{color:var(--live)}
  .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.b{font:inherit;font-weight:750;cursor:pointer;border-radius:10px;border:1.5px solid var(--line2);
           background:#fff;color:var(--ink2);padding:6px 13px;font-size:clamp(11px,1vw,15px);
           transition:transform .09s, border-color .15s, background .15s, color .15s}
  button.b:hover{border-color:var(--accent);color:var(--accent)}
  button.b:active{transform:scale(.96)}
  button.b.warn{border-color:#e8b7cc;color:var(--pink)}
  button.b.warn:hover{background:#fdf0f6;border-color:var(--pink);color:var(--pink)}
  button.b.go{border-color:var(--accent);background:var(--accent);color:#fff}
  button.b.go:hover{background:var(--accent2);color:#fff}
  button.b.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
  .truth{display:none;margin-top:8px;padding:9px 13px;border-radius:11px;background:var(--soft);
         border:1.5px solid var(--line2);font-size:clamp(13px,1.26vw,21px);font-weight:750;color:var(--accent2)}
  .truth.show{display:block;animation:pagein .35s ease}
  .gap{display:none;margin-top:10px;padding:clamp(10px,1.5vh,18px) clamp(14px,1.6vw,26px);
       background:#fff;border:2px dashed var(--line2);border-radius:13px}
  .gap.show{display:block;animation:pagein .4s ease}
  .gap .g{display:flex;align-items:center;gap:14px;font-size:clamp(16px,1.9vw,34px);font-weight:800;line-height:1.15}
  .gap .g+.g{margin-top:9px}
  .gap .g .n{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--accent);min-width:6em}
  .gap .g .r{height:clamp(14px,2vh,26px);background:var(--accent);border-radius:5px;min-width:3px;
             transition:width 1.1s cubic-bezier(.2,.85,.25,1)}
  .gap .g .r.tiny{background:var(--pink)}
  .gap .g .t{flex:0 0 auto;color:var(--muted);font-size:.6em;font-weight:800;letter-spacing:.02em}

  /* ---------- cards ---------- */
  .cols{display:flex;gap:clamp(14px,2.1vw,38px);flex-wrap:wrap}
  .col{flex:1 1 290px;background:var(--card);border:2px solid var(--line);border-radius:18px;
       padding:clamp(15px,2.1vh,30px) clamp(16px,1.8vw,32px);box-shadow:var(--shadow)}
  .col.hi{border-color:var(--accent);background:var(--card2)}
  .col .lab{font-size:clamp(11px,1.08vw,16px);letter-spacing:.17em;text-transform:uppercase;
            color:var(--muted);font-weight:800;margin-bottom:9px}
  .col.hi .lab{color:var(--accent)}
  .col .txt{font-size:clamp(18px,2.05vw,34px);line-height:1.28;font-weight:750;letter-spacing:-.012em}
  .col .txt.sm{font-size:clamp(16px,1.6vw,26px);font-weight:600;line-height:1.5;color:var(--ink2)}

  /* ---------- chrome ---------- */
  #chrome{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;
          align-items:center;padding:10px clamp(26px,5vw,96px);font-size:12px;color:#8b97bd;
          background:linear-gradient(180deg,rgba(238,243,253,0),rgba(238,243,253,.94) 50%);
          pointer-events:none;transition:opacity .2s}
  #chrome .k{display:flex;gap:12px;flex-wrap:wrap}
  kbd{font-family:inherit;font-size:11px;font-weight:800;color:var(--ink2);border:1.5px solid var(--line2);
      border-bottom-width:2px;border-radius:5px;padding:2px 6px;margin-right:4px;background:#fff}
  #notes{position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;background:#fff;
         border-top:3px solid var(--accent);padding:16px clamp(26px,5vw,96px) 20px;
         transform:translateY(101%);transition:transform .24s cubic-bezier(.3,.9,.3,1);z-index:30;
         box-shadow:0 -18px 50px -30px rgba(21,32,70,.55)}
  #notes.open{transform:none}
  #notes .nk{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
             font-weight:800;margin-bottom:10px}
  #notes .nb{font-size:16px;line-height:1.62;color:var(--ink2);max-width:72em}
  #notes .nb b{color:var(--ink)}#notes .nb ul{margin:8px 0 0 1.15em}#notes .nb li{margin:4px 0}
  body.notes-open #stage{padding-bottom:46vh}
  body.notes-open #chrome{opacity:0}
  .nflag{position:fixed;top:12px;right:clamp(26px,5vw,96px);font-size:11px;letter-spacing:.18em;
         text-transform:uppercase;color:#9fadd4;font-weight:800;z-index:31}
  .nflag.on{color:var(--accent)}
  #setup{position:fixed;inset:0;background:rgba(238,243,253,.9);backdrop-filter:blur(6px);
         display:none;place-items:center;z-index:60;padding:24px}
  #setup.on{display:grid}
  #setup .box{background:#fff;border:2px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);
              padding:26px 28px;max-width:560px;width:100%}
  #setup h2{font-size:22px;margin-bottom:10px}
  #setup p{font-size:15px;color:var(--muted);margin-bottom:16px;line-height:1.55}
  #setup input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:11px;
               border:2px solid var(--line2);background:#fbfcff;color:var(--ink);margin-bottom:14px}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--ink);
         color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:750;opacity:0;
         transition:opacity .25s, transform .25s;z-index:70;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="amb"><i></i><i></i><i></i></div>
<div id="pbar" style="width:0"></div>
<div class="nflag" id="nflag">N · notes</div>
<div class="toast" id="toast"></div>

<div id="stage">
  <div id="topbar">
    <div class="kicker" id="kicker"></div>
    <div class="pagenum" id="pagenum"></div>
  </div>
  <div id="body"></div>
</div>

<div id="chrome">
  <div class="k">
    <span><kbd>→</kbd> next</span><span><kbd>←</kbd> back</span>
    <span><kbd>L</kbd> live results</span><span><kbd>N</kbd> notes</span><span><kbd>F</kbd> fullscreen</span>
  </div>
  <div id="hint" style="font-weight:700"></div>
</div>

<div id="notes"><div class="nk">Presenter notes · 讲解备注</div><div class="nb" id="nb"></div></div>

<div id="setup">
  <div class="box">
    <h2>Presenter key</h2>
    <p>Paste your control key once. It is stored only in this browser and never written into the page.</p>
    <input id="keyin" type="password" placeholder="control key" autocomplete="off">
    <div style="display:flex;gap:10px">
      <button class="b go" id="keysave">Save</button>
      <button class="b" id="keycancel">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ==================== config ==================== */
const API = 'https://storm51-vote.hudsonwang.workers.dev';
const LS_KEY = 's51_ctrl_key';
const LIVE_INDEX = 9;

/* ==================== questions (must match /play) ==================== */
const QUESTIONS = [
  { id:'q1', short:'How many clicked “Going”?',
    opts:[{k:'a',t:'About 40,000'},{k:'b',t:'About 400,000'},{k:'c',t:'About 2,000,000'}],
    win:'c', truth:'About 2,000,000 clicked “Going”. Another 1,500,000 clicked “Interested”.' },
  { id:'q2', short:'What did the US Air Force do?',
    opts:[{k:'a',t:'Ignored it'},{k:'b',t:'Issued a public statement'},{k:'c',t:'Sent in troops'}],
    win:'b', truth:'The Air Force issued a public statement, discouraging anyone from coming.' },
  { id:'q3', short:'How many did the county prepare for?',
    opts:[{k:'a',t:'About 500'},{k:'b',t:'About 4,000'},{k:'c',t:'About 40,000'}],
    win:'c', truth:'Lincoln County prepared for 40,000 people — in a county with 184 hotel rooms.' },
  { id:'q4', short:'How many actually showed up?',
    opts:[{k:'a',t:'About 150'},{k:'b',t:'About 15,000'},{k:'c',t:'About 150,000'}],
    win:'a', truth:'About 150 people reached the two entrances.' },
  { id:'q5', short:'How did it end?',
    opts:[{k:'a',t:'The base was overrun'},{k:'b',t:'7 arrests — public urination'},{k:'c',t:'Nothing at all'}],
    win:'b', truth:'7 arrests. Public urination, alcohol offences, indecent exposure.' }
];

/* ==================== slides — one idea per page ==================== */
const SLIDES = [
{ kicker:'PMGT1852 · Week 5 · Facilitation',
  html:`<h1>The <span class="am">5 Ps</span></h1>
    <p class="sp2" style="font-size:clamp(17px,1.85vw,30px);letter-spacing:.03em;color:var(--ink2);font-weight:700">
      Purpose &nbsp;·&nbsp; Product &nbsp;·&nbsp; Participants &nbsp;·&nbsp; Probable Issues &nbsp;·&nbsp; Process</p>
    <p class="big sp2">A meeting with <span class="am">2,000,000 participants</span><br>that was never planned at all.</p>
    <p class="muted big sp2" style="font-size:clamp(17px,1.85vw,29px)">
      “They Can't Stop All of Us.” &nbsp;·&nbsp; Storm Area 51 &nbsp;·&nbsp; 20 September 2019</p>`,
  note:`<b>开场只说一句</b>
  <ul><li>「今天讲 Week 5 的 5 Ps。我用一个案例串起来——一场有 <b>200 万人报名、却从没开过筹备会</b>的『会』。」</li>
  <li>别说"这是个玩笑活动"或"最后没人来"，那会毁掉后面的悬念。</li>
  <li>右上角有页码，全程 25 页。</li></ul>` },

{ kicker:'The event', html:`<div class="label">27 Jun 2019</div>
    <p class="mega">Late at night, a 21-year-old in California creates a Facebook event.</p>
    <p class="mega sp am">It is a joke.</p>`,
  note:`<b>时间线 1/7</b><ul><li>只说事实，不加评论。念完直接翻页。</li></ul>` },

{ kicker:'The event', html:`<div class="label">The title</div>
    <p class="mega">“Storm Area 51,<br>They Can't Stop<br>All of Us.”</p>`,
  note:`<b>时间线 2/7</b><ul><li>全场笑点的核心句，念慢一点。</li>
  <li>补一句：「注意这句话的逻辑——它赌的是<b>人够多，就拦不住</b>。」</li></ul>` },

{ kicker:'The event', html:`<div class="label">What it asked</div>
    <p class="mega">Everyone meet at the gate of a classified US Air Force base.</p>
    <p class="mega sp am">And go in.</p>
    <p class="mega sp am">To see the aliens.</p>`,
  note:`<b>时间线 3/7</b><ul><li>三句分三个节拍念，中间各停半秒。</li></ul>` },

{ kicker:'The event', html:`<div class="label">The first three days</div>
    <p class="mega">Almost nobody responds.</p>`,
  note:`<b>时间线 4/7 ★ 关键停顿</b>
  <ul><li><b>这一页要停住</b>。一个字都不多说，直接翻页，让落差自己发生。</li></ul>` },

{ kicker:'The event', html:`<div class="label">Then</div>
    <p class="mega">It went viral.</p>
    <p class="mega sp am">Worldwide.</p>`,
  note:`<b>时间线 5/7</b><ul><li>不要在这里说数字（200 万）——那是测试题 Q1 的答案。</li></ul>` },

{ kicker:'The event', html:`<div class="label">August</div>
    <p class="big">Lincoln County, Nevada starts drafting an <span class="am">emergency declaration</span>.</p>
    <div class="rule"></div>
    <p class="big">Rachel, Nevada — population <span class="am">56</span> — warns on its own website:</p>
    <p class="big sp am">not enough food, water or fuel here.</p>`,
  note:`<b>时间线 6/7</b><ul><li>仍然不提 40,000（那是 Q3 的答案）。只说"县里开始起草紧急状态声明"。</li>
  <li>「56 人的小镇」这个对比要念出来。</li></ul>` },

{ kicker:'The event', html:`<div class="label">20 Sep 2019</div>
    <p class="mega">The day arrives.</p>`,
  note:`<b>时间线 7/7</b><ul><li>念完直接切到扫码页，不要预告结果。</li></ul>` },

/* ==================== engine ==================== */
const $ = id => document.getElementById(id);
const bodyEl = $('body'), kickerEl = $('kicker'), notesEl = $('notes'), nbEl = $('nb');
const pagenumEl = $('pagenum'), pbarEl = $('pbar'), hintEl = $('hint'), toastEl = $('toast');

let cur = 0, notesOpen = false;
let key = localStorage.getItem(LS_KEY) || '';
let live = { counts:{}, ctrl:{}, manual:false, showTruth:{}, manualCounts:{}, prev:{} };
let pollTimer = null, liveEls = null, gapAnimated = false;

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastEl._h); toastEl._h = setTimeout(()=>toastEl.classList.remove('on'), 1700);
}
function countUp(el, to, dur){
  const t0 = performance.now();
  (function step(t){
    const p = Math.min(1, (t - t0) / (dur || 900));
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * e).toLocaleString('en-US');
    if(p < 1) requestAnimationFrame(step);
  })(t0);
}

function render(){
  const s = SLIDES[cur];
  kickerEl.textContent = s.kicker || '';
  pagenumEl.textContent = (cur + 1) + ' / ' + SLIDES.length;
  pbarEl.style.width = ((cur + 1) / SLIDES.length * 100) + '%';
  try{ history.replaceState(null, '', '#' + (cur + 1)); }catch(e){}

  if(s.special === 'live'){
    buildLive();
    updateLive();
    startPolling();
    hintEl.textContent = 'press L for live results';
  } else {
    stopPolling(); liveEls = null; gapAnimated = false;
    bodyEl.innerHTML = '<div class="pagein" style="display:flex;flex-direction:column;justify-content:center;height:100%">' + (s.html || '') + '</div>';
    hintEl.textContent = '';
  }
  nbEl.innerHTML = s.note || '';
}

/* ---------- LIVE panel: built once, updated in place (keeps animations alive) ---------- */
function buildLive(){
  if(liveEls) return;

  const cards = QUESTIONS.map((q, qi) => `
    <div class="qcard" data-q="${q.id}">
      <div class="qrow">
        <div class="qt">${qi + 1}. ${q.short}</div>
        <div class="qright">
          <span class="qn" data-role="n">0 answers</span>
          <button class="b" data-act="lock" data-q="${q.id}">Lock</button>
          <button class="b" data-act="truth" data-q="${q.id}">Reveal truth</button>
        </div>
      </div>
      <div class="bars">
        ${q.opts.map(o => `<div class="bar" data-k="${o.k}">
            <span class="lab">${o.t}</span>
            <span class="track"><span class="fill"></span></span>
            <span class="num">0 &nbsp;0%</span>
          </div>`).join('')}
      </div>
      <div class="truth" data-role="truth">TRUTH → ${q.truth}</div>
      ${q.id === 'q4' ? `<div class="gap" data-role="gap">
          <div class="g"><span class="n" data-role="big">0</span><span class="r" data-role="bigbar" style="width:0"></span><span class="t">clicked “Going”</span></div>
          <div class="g"><span class="n" data-role="small">0</span><span class="r tiny" data-role="smallbar" style="width:0"></span><span class="t">showed up</span></div>
        </div>` : ''}
    </div>`).join('');

  bodyEl.innerHTML = `<div class="pagein" style="display:flex;flex-direction:column;height:100%;min-height:0">
      <div class="lvhead">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <h2>Live results</h2>
          <span class="livebadge"><i></i>LIVE</span>
        </div>
        <div class="lvmeta">
          <div style="text-align:right"><div class="ticknum" id="ticknum">0</div><div class="ticklab">answers in</div></div>
          <div class="ctrls">
            <button class="b warn" data-act="reset">⟲ &nbsp;Reset all</button>
            <button class="b" data-act="manual">Manual entry</button>
            <button class="b" data-act="truthall">Reveal all truths</button>
            <button class="b" data-act="key">Key…</button>
          </div>
        </div>
      </div>
      <div class="panel">${cards}</div>
    </div>`;

  liveEls = { tick: $('ticknum'), cards:{} };
  bodyEl.querySelectorAll('.qcard').forEach(card => {
    const qid = card.dataset.q;
    const ref = {
      root: card,
      n: card.querySelector('[data-role="n"]'),
      truth: card.querySelector('[data-role="truth"]'),
      gap: card.querySelector('[data-role="gap"]'),
      lock: card.querySelector('button[data-act="lock"]'),
      truthBtn: card.querySelector('button[data-act="truth"]'),
      bars: {}
    };
    card.querySelectorAll('.bar').forEach(b => { ref.bars[b.dataset.k] = b; });
    if(ref.gap){
      ref.big = ref.gap.querySelector('[data-role="big"]');
      ref.small = ref.gap.querySelector('[data-role="small"]');
      ref.bigbar = ref.gap.querySelector('[data-role="bigbar"]');
      ref.smallbar = ref.gap.querySelector('[data-role="smallbar"]');
    }
    liveEls.cards[qid] = ref;
  });

  bodyEl.querySelectorAll('button[data-act]').forEach(b =>
    b.addEventListener('click', () => liveAction(b.dataset.act, b.dataset.q)));
}

function onManualInput(){
  if(!liveEls) return;
  for(const q of QUESTIONS){
    const ref = liveEls.cards[q.id];
    const m = live.manualCounts[q.id] || {};
    const tot = Object.values(m).reduce((a,b)=>a+b,0);
    ref.n.textContent = tot + (tot === 1 ? ' answer' : ' answers');
    q.opts.forEach(o => {
      const n = m[o.k] || 0, pc = tot ? Math.round(n / tot * 100) : 0;
      const bar = ref.bars[o.k];
      bar.querySelector('.fill').style.width = pc + '%';
      const inp = bar.querySelector('input');
      if(!inp) bar.querySelector('.num').textContent = n + ' \u00a0' + pc + '%';
    });
  }
}

function updateLive(){
  if(!liveEls) return;
  let grand = 0;

  for(const q of QUESTIONS){
    const ref = liveEls.cards[q.id];
    const counts = live.counts[q.id] || {};
    const shown = live.manual ? (live.manualCounts[q.id] || {}) : counts;
    const tot = Object.values(shown).reduce((a,b)=>a+b,0);
    grand += tot;
    ref.n.textContent = tot + (tot === 1 ? ' answer' : ' answers');

    q.opts.forEach(o => {
      const n = shown[o.k] || 0;
      const pc = tot ? Math.round(n / tot * 100) : 0;
      const bar = ref.bars[o.k];
      bar.querySelector('.fill').style.width = pc + '%';
      const inp = bar.querySelector('input');
      if(!inp) bar.querySelector('.num').textContent = n + ' \u00a0' + pc + '%';
      bar.classList.toggle('win', !!live.showTruth[q.id] && o.k === q.win);

      const before = live.prev[q.id] ? (live.prev[q.id][o.k] || 0) : null;
      if(!live.manual && before !== null && n > before){
        bar.classList.add('bump');
        clearTimeout(bar._t);
        bar._t = setTimeout(()=>bar.classList.remove('bump'), 900);
      }
    });

    const locked = live.ctrl['locked_' + q.id] === '1';
    ref.lock.textContent = locked ? 'Locked' : 'Lock';
    ref.lock.classList.toggle('on', locked);

    const show = !!live.showTruth[q.id];
    ref.root.classList.toggle('rev', show);
    ref.truth.classList.toggle('show', show);
    ref.truthBtn.textContent = show ? 'Hide truth' : 'Reveal truth';
    ref.truthBtn.classList.toggle('on', show);

    if(ref.gap){
      ref.gap.classList.toggle('show', show);
      if(show && !gapAnimated){
        gapAnimated = true;
        countUp(ref.big, 2000000, 1100);
        countUp(ref.small, 150, 1100);
        ref.bigbar.style.width = 'calc(100% - 4px)';
        ref.smallbar.style.width = '6px';
      }
      if(!show){
        gapAnimated = false;
        ref.bigbar.style.width = '0';
        ref.smallbar.style.width = '0';
      }
    }
  }

  liveEls.tick.textContent = grand.toLocaleString('en-US');
  live.prev = JSON.parse(JSON.stringify(live.counts));
}

async function control(payload){
  if(!key){ openSetup(); return null; }
  try{
    const r = await fetch(API + '/api/control', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({key}, payload))
    });
    const d = await r.json();
    if(!d.ok){ toast(d.err === 'forbidden' ? 'Wrong key — press Key… to fix' : ('Error: ' + d.err)); return null; }
    return d;
  }catch(e){ toast('Network error'); return null; }
}

async function liveAction(act, q){
  if(act === 'reset'){
    if(!confirm('Clear every vote? Use this before a new run or while testing.')) return;
    const d = await control({action:'reset'});
    if(d){
      live.counts = {}; live.prev = {}; live.manualCounts = {}; live.showTruth = {};
      gapAnimated = false; updateLive(); toast('All votes cleared');
    }
    return;
  }
  if(act === 'manual'){
    live.manual = !live.manual;
    const btn = bodyEl.querySelector('button[data-act="manual"]');
    btn.textContent = live.manual ? 'Manual: ON' : 'Manual entry';
    btn.classList.toggle('on', live.manual);
    for(const qq of QUESTIONS){
      const ref = liveEls.cards[qq.id];
      qq.opts.forEach(o => {
        const num = ref.bars[o.k].querySelector('.num');
        if(live.manual){
          live.manualCounts[qq.id] = live.manualCounts[qq.id] || {};
          if(num.querySelector('input')) return;
          const inp = document.createElement('input');
          inp.className = 'mi'; inp.type = 'number'; inp.min = '0';
          inp.dataset.q = qq.id; inp.dataset.k = o.k;
          inp.value = live.manualCounts[qq.id][o.k] || 0;
          inp.style.cssText = 'width:5.6em;font:inherit;font-size:.92em;padding:3px 7px;border-radius:8px;' +
                              'border:1.5px solid var(--line2);background:#fff;color:var(--ink);text-align:right';
          inp.addEventListener('input', onManualInput);
          num.replaceChildren(inp);
        } else {
          const inp = num.querySelector('input');
          if(inp){ const s = document.createElement('span'); num.replaceChildren(s); }
        }
      });
    }
    updateLive();
    return;
  }
  if(act === 'key'){ openSetup(); return; }
  if(act === 'truthall'){
    const anyOff = QUESTIONS.some(x => !live.showTruth[x.id]);
    if(anyOff) gapAnimated = false;
    QUESTIONS.forEach(x => { live.showTruth[x.id] = anyOff; });
    updateLive(); return;
  }
  if(act === 'lock'){
    const isLocked = live.ctrl['locked_' + q] === '1';
    const d = await control({action: isLocked ? 'unlock' : 'lock', q});
    if(d){ live.ctrl['locked_' + q] = isLocked ? '0' : '1'; updateLive(); toast(isLocked ? 'Unlocked' : 'Locked'); }
    return;
  }
  if(act === 'truth'){
    live.showTruth[q] = !live.showTruth[q];
    if(!live.showTruth[q]) gapAnimated = false;
    updateLive(); return;
  }
}

async function poll(){
  try{
    const r = await fetch(API + '/api/state', {cache:'no-store'});
    const d = await r.json();
    if(!d.ok) return;
    live.counts = d.counts || {};
    live.ctrl = d.ctrl || {};
    if(SLIDES[cur].special !== 'live') return;
    if(live.manual) return;
    const ae = document.activeElement;
    if(ae && ae.tagName === 'INPUT') return;
    if($('setup').classList.contains('on')) return;
    updateLive();
  }catch(e){}
}
function startPolling(){ if(!pollTimer){ poll(); pollTimer = setInterval(poll, 1500); } }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

function next(){ if(cur < SLIDES.length - 1){ cur++; liveEls = null; gapAnimated = false; render(); } }
function prev(){ if(cur > 0){ cur--; liveEls = null; gapAnimated = false; render(); } }
function goto(i){ cur = Math.max(0, Math.min(SLIDES.length - 1, i)); liveEls = null; gapAnimated = false; render(); }

function openSetup(){ $('keyin').value = key; $('setup').classList.add('on'); setTimeout(()=>$('keyin').focus(), 60); }
$('keysave').addEventListener('click', ()=>{
  key = $('keyin').value.trim();
  localStorage.setItem(LS_KEY, key);
  $('setup').classList.remove('on');
  toast(key ? 'Key saved' : 'Key cleared');
});
$('keycancel').addEventListener('click', ()=>$('setup').classList.remove('on'));

document.addEventListener('keydown', e => {
  if($('setup').classList.contains('on')){
    if(e.key === 'Enter') $('keysave').click();
    if(e.key === 'Escape') $('keycancel').click();
    return;
  }
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  const k = e.key.toLowerCase();
  if(k==='arrowright'||k===' '||k==='enter'||k==='pagedown'){ e.preventDefault(); next(); return; }
  if(k==='arrowleft'||k==='pageup'){ e.preventDefault(); prev(); return; }
  if(k==='l'){ goto(LIVE_INDEX); return; }
  if(k==='n'){ notesOpen = !notesOpen; notesEl.classList.toggle('open', notesOpen);
               document.body.classList.toggle('notes-open', notesOpen); $('nflag').classList.toggle('on', notesOpen); return; }
  if(k==='f'){ document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.(); return; }
  if(k==='home'){ goto(0); return; }
  if(k==='end'){ goto(SLIDES.length - 1); return; }
});

/* deep link: hudsonwang.com/game/#12 jumps straight to page 12 (survives a refresh mid-talk) */
(function(){
  const n = parseInt((location.hash || '').replace('#',''), 10);
  if(n >= 1 && n <= SLIDES.length) cur = n - 1;
})();

render();
</script>
