<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Area 51 — Week 5 · The 5 Ps</title>
<style>
  :root{
    --bg:#eef3fd;
    --card:#ffffff;
    --card2:#e9f0ff;
    --line:#d5dff5;
    --line2:#c2cff0;
    --ink:#152046;
    --ink2:#38446e;
    --muted:#5d6b96;
    --accent:#3f5cc9;
    --accent2:#2f47a8;
    --soft:#dfe8ff;
    --pink:#b83c6e;
    --live:#12a05e;
    --shadow:0 1px 2px rgba(21,32,70,.05), 0 18px 40px -26px rgba(21,32,70,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  /* ambient animated blooms — reads as "web", not slide */
  #amb{position:fixed;inset:-30vh -20vw;z-index:0;pointer-events:none;filter:blur(70px);opacity:.6}
  #amb i{position:absolute;display:block;border-radius:50%}
  #amb i:nth-child(1){width:46vw;height:46vw;left:2vw;top:4vh;background:#cfe0ff;animation:drift1 26s ease-in-out infinite}
  #amb i:nth-child(2){width:38vw;height:38vw;right:4vw;bottom:2vh;background:#e3d6ff;animation:drift2 32s ease-in-out infinite}
  #amb i:nth-child(3){width:30vw;height:30vw;left:44vw;top:48vh;background:#d6f0ff;animation:drift3 38s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,5vh) scale(1.14)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-7vw,-4vh) scale(.94)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(-5vw,6vh) scale(1.12)}}

  /* ---------- layout: full-bleed pages ---------- */
  .bleedbg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bleedbg img{width:100%;height:100%;object-fit:cover;display:block;
               animation:bleedin 1.1s cubic-bezier(.2,.8,.3,1)}
  @keyframes bleedin{from{transform:scale(1.06);opacity:.4}to{transform:none;opacity:1}}
  .bleedbg::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(238,243,253,.34) 0%,rgba(238,243,253,.04) 26%,
               rgba(238,243,253,.55) 52%,rgba(238,243,253,.92) 74%,var(--bg) 92%)}
  body.bleed #stage{padding-bottom:clamp(150px,24vh,250px)}
  #amb{transition:opacity .6s ease}
  body.bleed #amb{opacity:0}
  #stage{position:relative;z-index:1}
  body.bleed #topbar{position:relative;z-index:3}
  body.bleed .pagein{text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .bleedmeta{font-size:clamp(13px,1.3vw,21px);letter-spacing:.18em;text-transform:uppercase;
             font-weight:800;color:var(--muted)}

  /* ---------- layout: horizontal timeline ---------- */
  .tlh{position:relative;display:flex;gap:clamp(10px,1.6vw,30px);align-items:flex-start}
  .tlh::before{content:'';position:absolute;left:0;right:0;top:clamp(6px,.55vw,9px);
               height:2.5px;background:var(--line);border-radius:2px}
  .thstop{position:relative;flex:1 1 0;min-width:0;padding-top:clamp(32px,4.6vh,62px)}
  .thstop .thdot{position:absolute;top:0;left:0;width:clamp(14px,1.3vw,22px);height:clamp(14px,1.3vw,22px);
                 border-radius:50%;background:#fff;border:3px solid var(--line2);z-index:2}
  .thstop .thdate{font-size:clamp(13px,1.35vw,22px);font-weight:800;letter-spacing:.14em;
                  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .thstop .thtext{font-size:clamp(18px,2.05vw,36px);line-height:1.26;font-weight:750;
                  color:var(--ink);letter-spacing:-.012em}
  .thstop.pivot .thdot{background:var(--pink);border-color:var(--pink)}
  .thstop.pivot .thdate{color:var(--pink)}
  .thstop.pivot .thtext{color:var(--pink)}

  /* ---------- layout: papers on a desk ---------- */
  .desk{position:relative;display:flex;align-items:center;justify-content:center;
        flex-wrap:nowrap;padding:clamp(14px,2.6vh,34px) 0}
  .desk .paper{flex:0 1 auto;max-width:34%}
  .desk .paper + .paper{margin-left:clamp(-34px,-2.2vw,-12px)}
  .desk .paper:nth-child(1){z-index:1}
  .desk .paper:nth-child(2){z-index:3}
  .desk .paper:nth-child(3){z-index:2}
  .paper{background:#fff;border:2px solid var(--line);border-radius:10px;
         padding:clamp(20px,3.2vh,48px) clamp(20px,2.2vw,42px);
         box-shadow:0 2px 4px rgba(21,32,70,.06),0 26px 50px -30px rgba(21,32,70,.55);
         transition:transform .35s cubic-bezier(.2,.85,.3,1)}
  .paper.r1{transform:rotate(-2.1deg)}
  .paper.r2{transform:rotate(1.4deg)}
  .paper.r3{transform:rotate(-1deg)}
  .paper:hover{transform:rotate(0) translateY(-5px)}
  .paper .lab{font-size:clamp(12px,1.2vw,19px);letter-spacing:.16em;text-transform:uppercase;
              color:var(--muted);font-weight:800;margin-bottom:11px}
  .paper.hi .lab{color:var(--accent)}
  .paper .txt{font-size:clamp(18px,2.05vw,36px);line-height:1.32;font-weight:750}
  .paper.big-txt .txt{font-size:clamp(24px,2.9vw,50px);letter-spacing:-.02em}
  .paper .txt .muted{font-size:.74em;font-weight:650}

  /* ---------- layout: tickets ---------- */
  .tickets{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
  .ticket{position:relative;flex:1 1 260px;background:#fff;border:2px solid var(--line);
          padding:clamp(22px,3.4vh,50px) clamp(22px,2.4vw,44px);
          box-shadow:0 2px 4px rgba(21,32,70,.06),0 22px 44px -28px rgba(21,32,70,.5)}
  .ticket:first-child{border-radius:14px 0 0 14px;border-right:none}
  .ticket:last-child{border-radius:0 14px 14px 0;border-left:none}
  .ticket::before,.ticket::after{content:'';position:absolute;width:clamp(14px,1.4vw,22px);
       height:clamp(14px,1.4vw,22px);border-radius:50%;background:var(--bg);
       border:2px solid var(--line);top:50%;transform:translateY(-50%)}
  .ticket:first-child::before{display:none}
  .ticket:last-child::after{display:none}
  .ticket:first-child::after{right:calc(-1 * clamp(7px,.7vw,11px) - 1px)}
  .ticket:last-child::before{left:calc(-1 * clamp(7px,.7vw,11px) - 1px)}
  .tear{flex:0 0 0;border-left:2px dashed var(--line2);position:relative}
  .ticket .lab{font-size:clamp(12px,1.2vw,19px);letter-spacing:.16em;text-transform:uppercase;
               color:var(--accent);font-weight:800;margin-bottom:12px}
  .ticket .txt{font-size:clamp(18px,2.05vw,36px);line-height:1.3;font-weight:750;color:var(--ink)}

  /* ---------- layout: five columns, one broken line ---------- */
  .pscols{position:relative;display:flex;gap:clamp(8px,1.1vw,20px);align-items:stretch}
  .psc{flex:1 1 0;min-width:0;background:#fff;border:2px solid var(--line);border-radius:14px;
       padding:clamp(16px,2.6vh,38px) clamp(13px,1.3vw,24px);display:flex;flex-direction:column;
       gap:clamp(9px,1.5vh,18px);box-shadow:0 2px 4px rgba(21,32,70,.05),0 18px 36px -26px rgba(21,32,70,.5)}
  .psc .psn{font-size:clamp(16px,1.8vw,31px);font-weight:800;color:var(--accent);letter-spacing:-.012em}
  .psc .psf{flex:1;font-size:clamp(15px,1.65vw,29px);line-height:1.3;font-weight:700;color:var(--ink2)}
  .psc .psv{font-size:clamp(14px,1.5vw,26px);font-weight:800;color:var(--pink);line-height:1.24}
  .pscols{padding-bottom:clamp(14px,2.2vh,28px)}
  .crack{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--pink);
         border-radius:4px;transform:rotate(-1.2deg);transform-origin:left center;
         box-shadow:0 0 12px rgba(184,60,110,.35);pointer-events:none;
         animation:crackin .7s cubic-bezier(.2,.85,.3,1) .15s backwards}
  @keyframes crackin{from{transform:rotate(-1.2deg) scaleX(0)}to{transform:rotate(-1.2deg) scaleX(1)}}

  /* ---------- redaction on the big numbers ---------- */
  .gap .g .n{position:relative}
  .gap .g .n.pre::after{content:'';position:absolute;inset:1px -5px;background:var(--ink);
        border-radius:4px;transform-origin:right center;
        transition:transform .6s cubic-bezier(.65,0,.35,1)}
  .gap .g .n.open::after{transform:scaleX(0)}

  /* ---------- story rail (replaces pager + progress bar) ---------- */
  /* live page, truths revealed: the panel takes the bottom, the rail gets out of the way */
  body.live-full #rail{opacity:0;transform:translateY(16px);pointer-events:none}
  body.live-full #stage{padding-bottom:clamp(8px,1.2vh,18px)}
  body.live-full #body{overflow:visible}
  body.live-full .pagein{overflow:visible;max-height:none}
  body.live-full .panel{overflow:auto;max-height:calc(100vh - 132px);padding-right:6px}
  body.live-full .livepill{opacity:0}
  #rail{position:fixed;left:0;right:0;bottom:0;z-index:22;
        padding:clamp(14px,2.4vh,30px) clamp(26px,5vw,96px) 14px;
        background:linear-gradient(180deg,rgba(238,243,253,0),rgba(238,243,253,.92) 42%,var(--bg) 100%);
        pointer-events:none;transition:opacity .26s,transform .26s}
  .railstops{position:relative;display:flex;justify-content:space-between;align-items:flex-start;
             max-width:1180px;margin:0 auto}
  .rstop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
         flex:1 1 0;min-width:0}
  .rstop .rdot{width:clamp(9px,.85vw,14px);height:clamp(9px,.85vw,14px);border-radius:50%;
               background:#fff;border:2.5px solid var(--line2);z-index:2;
               transition:background .3s,border-color .3s,transform .3s,box-shadow .3s}
  .rstop .rlab{font-size:clamp(10px,.95vw,14px);font-weight:800;letter-spacing:.1em;
               text-transform:uppercase;color:#a7b2d4;white-space:nowrap;
               transition:color .3s}
  .rstop.done .rdot{background:var(--accent);border-color:var(--accent)}
  .rstop.done .rlab{color:var(--muted)}
  .rstop.cur .rdot{background:var(--accent);border-color:var(--accent);
                   transform:scale(1.75);box-shadow:0 0 0 6px rgba(63,92,201,.18)}
  .rstop.cur .rlab{color:var(--accent)}
  .railine{position:relative;max-width:1180px;margin:0 auto;
           height:2.5px;background:var(--line);border-radius:2px;
           transform:translateY(calc(clamp(9px,.85vw,14px) / 2 + 0px))}
  .railine i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;
             transition:width .45s cubic-bezier(.3,.9,.3,1)}
  .railstops{margin-top:calc(-1 * (clamp(9px,.85vw,14px) / 2))}
  .railkeys{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
            margin-top:clamp(10px,1.8vh,20px);font-size:12px;color:#93a0c4}

  /* ---------- persistent live pill ---------- */
  .livepill{position:fixed;right:clamp(20px,4vw,72px);bottom:clamp(104px,15vh,150px);z-index:23;
            display:inline-flex;align-items:center;gap:9px;background:#fff;
            border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;
            box-shadow:0 2px 4px rgba(21,32,70,.05),0 14px 34px -20px rgba(21,32,70,.5);
            font-weight:800;font-size:clamp(12px,1.15vw,17px);color:var(--ink2);
            transition:opacity .3s,transform .3s;pointer-events:none}
  .livepill .lpdot{width:8px;height:8px;border-radius:50%;background:var(--live);
                   animation:pulse 1.5s ease-in-out infinite}
  .livepill .lpnum{font-variant-numeric:tabular-nums;color:var(--accent);
                   font-size:clamp(15px,1.5vw,24px)}
  .livepill .lplab{font-size:.72em;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .livepill .lpspark{display:block;width:clamp(28px,3vw,54px);height:16px;overflow:visible}
  .livepill .lpspark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;
                              stroke-linejoin:round;stroke-linecap:round;opacity:.75}
  .livepill.hide{opacity:0;transform:translateY(10px)}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(18,160,94,.5)}
                   50%{opacity:.7;box-shadow:0 0 0 6px rgba(18,160,94,0)}}

  /* ---------- live panel grows out of the pill ---------- */
  .grow{transform-origin:100% 100%;animation:grow .55s cubic-bezier(.2,.85,.3,1)}
  @keyframes grow{from{opacity:0;transform:scale(.06)}to{opacity:1;transform:scale(1)}}

  /* ---------- redaction bar ---------- */
  .redact{position:relative;display:inline-block;overflow:hidden;vertical-align:baseline}
  .redact::after{content:'';position:absolute;inset:-3px -5px;background:var(--ink);border-radius:3px;
                 transform-origin:right center;
                 transition:transform .55s cubic-bezier(.65,0,.35,1) .35s}
  .redact.open::after{transform:scaleX(0)}

  #stage{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;
         transition:padding-bottom .3s cubic-bezier(.3,.9,.3,1);
         padding:clamp(18px,3vh,40px) clamp(26px,5vw,96px) clamp(140px,19vh,200px)}
  #topbar{display:flex;justify-content:space-between;align-items:baseline;gap:20px;
          margin-bottom:clamp(10px,2vh,24px)}
  .kicker{font-size:clamp(12px,1.2vw,17px);letter-spacing:.24em;text-transform:uppercase;
          color:var(--accent);font-weight:800}
  .pagenum{font-size:clamp(12px,1.15vw,16px);color:var(--ink2);font-weight:800;
           font-variant-numeric:tabular-nums;letter-spacing:.08em;white-space:nowrap}
  #body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}

  .pagein{animation:pagein .42s cubic-bezier(.2,.85,.3,1);max-height:100%;overflow-y:auto;overflow-x:hidden}
  @keyframes pagein{from{opacity:0;transform:translateY(20px) scale(.994)}to{opacity:1;transform:none}}

  h1{font-size:clamp(46px,8vw,138px);line-height:.96;letter-spacing:-.03em;font-weight:800}
  h2{font-size:clamp(30px,4.5vw,72px);line-height:1.06;letter-spacing:-.02em;font-weight:800}
  h2.sm{font-size:clamp(27px,3.4vw,54px)}
  p{font-size:clamp(20px,2.2vw,38px);line-height:1.34;color:var(--ink2);max-width:26em}
  p.sm{font-size:clamp(18px,1.7vw,28px);line-height:1.42}
  p.big{font-size:clamp(24px,3.1vw,58px);line-height:1.16;font-weight:750;color:var(--ink);letter-spacing:-.012em}
  p.mega{font-size:clamp(32px,4.9vw,94px);line-height:1.06;font-weight:800;color:var(--ink);letter-spacing:-.028em}
  .muted{color:var(--muted)}
  .am{color:var(--accent)}
  .pk{color:var(--pink)}
  .sp{margin-top:clamp(10px,1.9vh,24px)}
  .sp2{margin-top:clamp(20px,3.6vh,50px)}
  strong{font-weight:800;color:var(--ink)}
  .label{font-size:clamp(13px,1.35vw,21px);letter-spacing:.26em;text-transform:uppercase;
         color:var(--accent);font-weight:800;margin-bottom:clamp(10px,1.8vh,22px)}
  .rule{height:1px;background:var(--line);margin:clamp(14px,2.4vh,30px) 0;max-width:24em}

  /* ---------- QR ---------- */
  .qrwrap{display:flex;gap:clamp(22px,3.4vw,64px);align-items:center;flex-wrap:wrap}
  .qrcard{background:#fff;border:2px solid var(--line);border-radius:24px;
          padding:clamp(12px,1.4vw,22px);width:clamp(180px,22vw,340px);box-shadow:var(--shadow);
          position:relative}
  .qrcard::after{content:'';position:absolute;inset:-9px;border-radius:30px;
                 border:2px dashed var(--soft);animation:ring 3.4s linear infinite}
  @keyframes ring{to{transform:rotate(360deg)}}
  .qrcard svg{display:block;width:100%;height:auto;position:relative;z-index:1}
  .qrurl{margin-top:9px;text-align:center;color:var(--ink);font-weight:800;
         font-size:clamp(11px,1.05vw,17px);position:relative;z-index:1}
  .rules{list-style:none;display:flex;flex-direction:column;gap:clamp(6px,1.3vh,16px)}
  .rules li{font-size:clamp(21px,2.5vw,46px);line-height:1.24;font-weight:750;letter-spacing:-.012em}
  .qstrip{background:var(--card);border:2px solid var(--line);border-radius:16px;
          padding:clamp(12px,1.7vh,20px) clamp(14px,1.6vw,26px);margin-top:clamp(16px,2.8vh,34px);
          display:flex;gap:clamp(14px,2.4vw,44px);flex-wrap:wrap;box-shadow:var(--shadow)}
  .qstrip div{font-size:clamp(14px,1.35vw,22px);color:var(--ink2);line-height:1.35;flex:1 1 28%}
  .qstrip b{color:var(--accent);margin-right:.65em;font-weight:800}

  /* ---------- LIVE panel ---------- */
  .lvhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
          margin-bottom:clamp(5px,.9vh,10px)}
  .lvhead h2{font-size:clamp(19px,2.05vw,33px)}
  .lvmeta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .livebadge{display:inline-flex;align-items:center;gap:8px;background:#e6f8ef;
             border:1.5px solid #b6e7cd;color:#0c7a48;font-weight:800;font-size:13px;
             letter-spacing:.16em;padding:5px 12px;border-radius:999px}
  .livebadge i{width:9px;height:9px;border-radius:50%;background:var(--live);display:block;
               animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(18,160,94,.55)}
                   50%{opacity:.75;box-shadow:0 0 0 7px rgba(18,160,94,0)}}
  .ticknum{font-size:clamp(19px,2vw,31px);font-weight:800;color:var(--accent);
           font-variant-numeric:tabular-nums;line-height:1}
  .ticklab{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .panel{display:flex;flex-direction:column;gap:clamp(4px,.62vh,8px);overflow:auto;padding-right:4px}
  .qcard{background:var(--card);border:2px solid var(--line);border-radius:11px;
         padding:clamp(4px,.58vh,8px) clamp(10px,1.1vw,18px);transition:border-color .25s,background .25s}
  .qcard.rev{border-color:var(--accent);background:var(--card2)}
  .qrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .qt{font-size:clamp(13px,1.26vw,20px);font-weight:750;line-height:1.22;color:var(--ink)}
  .qright{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .qn{font-size:clamp(12px,1.1vw,16px);color:var(--muted);font-weight:800;white-space:nowrap;
      font-variant-numeric:tabular-nums}
  .bars{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .bar{display:flex;align-items:center;gap:8px;font-size:clamp(10px,.96vw,15px)}
  .bar .lab{flex:0 0 clamp(140px,19vw,330px);color:var(--ink2);line-height:1.22;transition:color .2s}
  .bar .track{flex:1;height:clamp(8px,1.05vh,14px);background:#e7edfb;border-radius:6px;
              overflow:hidden;min-width:56px}
  .bar .fill{display:block;height:100%;width:0;background:#9fb2e0;border-radius:6px;
             transition:width .5s cubic-bezier(.25,.9,.3,1), background .25s}
  .bar .num{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;
            min-width:6.4em;text-align:right;font-weight:800}
  .bar.win .fill{background:var(--accent)}
  .bar.win .lab{color:var(--ink);font-weight:800}
  .bar.win .num{color:var(--accent)}
  .bar.bump .fill{background:var(--live)}
  .bar.bump .num{color:var(--live)}
  .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.b{font:inherit;font-weight:750;cursor:pointer;border-radius:9px;border:1.5px solid var(--line2);
           background:#fff;color:var(--ink2);padding:4px 11px;font-size:clamp(10px,.92vw,14px);
           transition:transform .09s, border-color .15s, background .15s, color .15s}
  button.b:hover{border-color:var(--accent);color:var(--accent)}
  button.b:active{transform:scale(.96)}
  button.b.warn{border-color:#e8b7cc;color:var(--pink)}
  button.b.warn:hover{background:#fdf0f6;border-color:var(--pink);color:var(--pink)}
  button.b.go{border-color:var(--accent);background:var(--accent);color:#fff}
  button.b.go:hover{background:var(--accent2);color:#fff}
  button.b.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
  .truth{display:none;margin-top:3px;padding:3px 9px;border-radius:8px;background:var(--soft);
         border:1.5px solid var(--line2);font-size:clamp(10px,1.02vw,15px);font-weight:750;color:var(--accent2);line-height:1.28}
  .truth.show{display:block;animation:pagein .35s ease}

/* ==================== engine ==================== */
const $ = id => document.getElementById(id);
const bodyEl = $('body'), kickerEl = $('kicker'), notesEl = $('notes'), nbEl = $('nb');
const pagenumEl = $('pagenum'), toastEl = $('toast');
const railStopsEl = $('railstops'), railFillEl = $('railfill');
const pillEl = $('livepill'), lpnumEl = $('lpnum'), lpsparkEl = $('lpspark');

/* ---------- story rail: 7 stops, pages map onto them ---------- */
const RAIL = ['27 Jun','The title','3 days','Viral','August','20 Sep','The 5 Ps'];
const PAGE_STOP = [0, 3, 4, 4, 4, 5, 6, 6, 6];      /* page index -> rail stop (9 pages) */

function buildRail(){
  railStopsEl.innerHTML = RAIL.map((lab,i) =>
    `<div class="rstop" data-i="${i}"><span class="rdot"></span><span class="rlab">${lab}</span></div>`).join('');
}
function paintRail(){
  const stop = PAGE_STOP[cur] ?? 0;
  [...railStopsEl.children].forEach((el,i) => {
    el.classList.toggle('cur', i === stop);
    el.classList.toggle('done', i < stop);
  });
  const n = RAIL.length - 1;
  railFillEl.style.width = (n ? (stop / n * 100) : 0) + '%';
}

/* ---------- live pill ---------- */
let spark = [];
function paintPill(total){
  if(!lpnumEl) return;
  lpnumEl.textContent = total.toLocaleString('en-US');
  spark.push(total);
  if(spark.length > 22) spark.shift();
  const max = Math.max(1, ...spark), w = 54, h = 16;
  const pts = spark.map((v,i) =>
    `${(i / Math.max(1, spark.length - 1) * w).toFixed(1)},${(h - (v / max) * (h - 2) - 1).toFixed(1)}`).join(' ');
  lpsparkEl.innerHTML = `<polyline points="${pts}"/>`;
}

let cur = 0, notesOpen = false;
let key = localStorage.getItem(LS_KEY) || '';
let live = { counts:{}, ctrl:{}, manual:false, showTruth:{}, manualCounts:{}, prev:{} };
let pollTimer = null, liveEls = null, gapAnimated = false;

/* ---------- 4-minute presentation timer ---------- */
const TOTAL_SECONDS = 240;
let tRunning = false, tAnchor = 0, tAccum = 0, tRAF = null;
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };

function paintTimer(elapsed){
  const remaining = TOTAL_SECONDS - elapsed;
  const box = $('timer'), v = $('tval'), l = $('tlab');
  if(!box) return;
  if(elapsed === 0 && !tRunning){ v.textContent = mmss(TOTAL_SECONDS); l.textContent = 'press T'; }
  else if(remaining >= 0){ v.textContent = mmss(remaining); l.textContent = 'left'; }
  else { v.textContent = '+' + mmss(-remaining); l.textContent = 'over'; }
  box.classList.toggle('run', tRunning && remaining >= 60);
  box.classList.toggle('low', tRunning && remaining < 60 && remaining >= 0);
  box.classList.toggle('over', remaining < 0);
  if(!tRunning && elapsed === 0) box.classList.remove('run','low','over');
}
function tickTimer(){
  if(!tRunning) return;
  paintTimer(tAccum + (performance.now() - tAnchor) / 1000);
  tRAF = requestAnimationFrame(tickTimer);
}
function toggleTimer(){
  if(tRunning){
    tAccum += (performance.now() - tAnchor) / 1000;
    tRunning = false; cancelAnimationFrame(tRAF); paintTimer(tAccum);
  } else {
    tAnchor = performance.now(); tRunning = true; tickTimer();
  }
}
function resetTimer(){
  tRunning = false; cancelAnimationFrame(tRAF); tAccum = 0; paintTimer(0);
}
function bindTimer(){
  const box = $('timer'); if(!box || box._bound) return;
  box._bound = true;
  box.addEventListener('click', e => { e.shiftKey ? resetTimer() : toggleTimer(); });
}

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastEl._h); toastEl._h = setTimeout(()=>toastEl.classList.remove('on'), 1700);
}
function countUp(el, to, dur){
  const t0 = performance.now();
  (function step(t){
    const p = Math.min(1, (t - t0) / (dur || 900));
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * e).toLocaleString('en-US');
    if(p < 1) requestAnimationFrame(step);
  })(t0);
}

function syncFull(){
  const anyTruth = QUESTIONS.some(q => live.showTruth[q.id]);
  const on = SLIDES[cur].special === 'live' && (anyTruth || live.manual);
  document.body.classList.toggle('live-full', on);
}

function render(){
  document.querySelectorAll('body > .bleedbg').forEach(e => e.remove());
  const s = SLIDES[cur];
  kickerEl.textContent = s.kicker || '';
  pagenumEl.textContent = (cur + 1) + ' / ' + SLIDES.length;
  paintRail();
  try{ history.replaceState(null, '', '#' + (cur + 1)); }catch(e){}

  /* bleed pages let the artwork own the whole viewport */
  const bleed = s.layout === 'bleed' || s.layout === 'bottom';
  document.body.classList.toggle('bleed', bleed);
  pillEl.classList.toggle('hide', s.special === 'live');

  if(s.special === 'live'){
    liveEls = null;
    buildLive();
    updateLive();
    const panel = bodyEl.firstElementChild;
    if(panel) panel.classList.add('grow');
  } else {
    liveEls = null; gapAnimated = false;
    const just = s.layout === 'bottom' ? 'flex-end' : 'center';
    bodyEl.innerHTML = '<div class="pagein" style="display:flex;flex-direction:column;justify-content:' + just +
                       ';height:100%">' + (s.html || '') + '</div>';
    /* lift the full-bleed artwork out of the animated wrapper so it truly covers the viewport */
    const bg = bodyEl.querySelector('.bleedbg');
    if(bg) document.body.appendChild(bg);
  }
  nbEl.innerHTML = s.note || '';
  syncFull();
  bindTimer();
}

/* ---------- LIVE panel: built once, updated in place (keeps animations alive) ---------- */
function buildLive(){
  if(liveEls) return;

  const cards = QUESTIONS.map((q, qi) => `
    <div class="qcard" data-q="${q.id}">
      <div class="qrow">
        <div class="qt">${qi + 1}. ${q.short}</div>
        <div class="qright">
          <span class="qn" data-role="n">0 answers</span>
          <button class="b" data-act="lock" data-q="${q.id}">Lock</button>
          <button class="b" data-act="truth" data-q="${q.id}">Reveal truth</button>
        </div>
      </div>
      <div class="bars">
        ${q.opts.map(o => `<div class="bar" data-k="${o.k}">
            <span class="lab">${o.t}</span>
            <span class="track"><span class="fill"></span></span>
            <span class="num">0 &nbsp;0%</span>
          </div>`).join('')}
      </div>
      <div class="truth" data-role="truth">TRUTH → ${q.truth}</div>
      ${q.id === 'q4' ? `<div class="gap" data-role="gap">
          <div class="g"><span class="n pre" data-role="big">0</span><span class="r" data-role="bigbar" style="width:0"></span><span class="t">clicked “Going”</span></div>
          <div class="g"><span class="n pre" data-role="small">0</span><span class="r tiny" data-role="smallbar" style="width:0"></span><span class="t">showed up</span></div>
        </div>` : ''}
    </div>`).join('');

  bodyEl.innerHTML = `<div class="pagein" style="display:flex;flex-direction:column;height:100%;min-height:0">
      <div class="lvhead">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <h2>Live results</h2>
          <span class="livebadge"><i></i>LIVE</span>
        </div>
        <div class="lvmeta">
          <div style="text-align:right"><div class="ticknum" id="ticknum">0</div><div class="ticklab">answers in</div></div>
          <div class="ctrls">
            <button class="b warn" data-act="reset">⟲ &nbsp;Reset all</button>
            <button class="b" data-act="manual">Manual entry</button>
            <button class="b" data-act="truthall">Reveal all truths</button>
            <button class="b" data-act="key">Key…</button>
          </div>
        </div>
      </div>
      <div class="panel">${cards}</div>
    </div>`;

  liveEls = { tick: $('ticknum'), cards:{} };
  bodyEl.querySelectorAll('.qcard').forEach(card => {
    const qid = card.dataset.q;
    const ref = {
      root: card,
      n: card.querySelector('[data-role="n"]'),
      truth: card.querySelector('[data-role="truth"]'),
      gap: card.querySelector('[data-role="gap"]'),
      lock: card.querySelector('button[data-act="lock"]'),
      truthBtn: card.querySelector('button[data-act="truth"]'),
      bars: {}
    };
    card.querySelectorAll('.bar').forEach(b => { ref.bars[b.dataset.k] = b; });
    if(ref.gap){
      ref.big = ref.gap.querySelector('[data-role="big"]');
      ref.small = ref.gap.querySelector('[data-role="small"]');
      ref.bigbar = ref.gap.querySelector('[data-role="bigbar"]');
      ref.smallbar = ref.gap.querySelector('[data-role="smallbar"]');
    }
    liveEls.cards[qid] = ref;
  });

  bodyEl.querySelectorAll('button[data-act]').forEach(b =>
    b.addEventListener('click', () => liveAction(b.dataset.act, b.dataset.q)));
}

function onManualInput(){
  if(!liveEls) return;
  for(const q of QUESTIONS){
    const ref = liveEls.cards[q.id];
    const m = live.manualCounts[q.id] || {};
    const tot = Object.values(m).reduce((a,b)=>a+b,0);
    ref.n.textContent = tot + (tot === 1 ? ' answer' : ' answers');
    q.opts.forEach(o => {
      const n = m[o.k] || 0, pc = tot ? Math.round(n / tot * 100) : 0;
      const bar = ref.bars[o.k];
      bar.querySelector('.fill').style.width = pc + '%';
      const inp = bar.querySelector('input');
      if(!inp) bar.querySelector('.num').textContent = n + ' \u00a0' + pc + '%';
    });
  }
}

function updateLive(){
  if(!liveEls) return;
  let grand = 0;

  for(const q of QUESTIONS){
    const ref = liveEls.cards[q.id];
    const counts = live.counts[q.id] || {};
    const shown = live.manual ? (live.manualCounts[q.id] || {}) : counts;
    const tot = Object.values(shown).reduce((a,b)=>a+b,0);
    grand += tot;
    ref.n.textContent = tot + (tot === 1 ? ' answer' : ' answers');

    q.opts.forEach(o => {
      const n = shown[o.k] || 0;
      const pc = tot ? Math.round(n / tot * 100) : 0;
      const bar = ref.bars[o.k];
      bar.querySelector('.fill').style.width = pc + '%';
      const inp = bar.querySelector('input');
      if(!inp) bar.querySelector('.num').textContent = n + ' \u00a0' + pc + '%';
      bar.classList.toggle('win', !!live.showTruth[q.id] && o.k === q.win);

      const before = live.prev[q.id] ? (live.prev[q.id][o.k] || 0) : null;
      if(!live.manual && before !== null && n > before){
        bar.classList.add('bump');
        clearTimeout(bar._t);
        bar._t = setTimeout(()=>bar.classList.remove('bump'), 900);
      }
    });

    const locked = live.ctrl['locked_' + q.id] === '1';
    ref.lock.textContent = locked ? 'Locked' : 'Lock';
    ref.lock.classList.toggle('on', locked);

    const show = !!live.showTruth[q.id];
    ref.root.classList.toggle('rev', show);
    ref.truth.classList.toggle('show', show);
    ref.truth.querySelectorAll('.redact').forEach(r => r.classList.toggle('open', show));
    ref.truthBtn.textContent = show ? 'Hide truth' : 'Reveal truth';
    ref.truthBtn.classList.toggle('on', show);

    if(ref.gap){
      ref.gap.classList.toggle('show', show);
      if(show && !gapAnimated){
        gapAnimated = true;
        ref.big.classList.remove('open'); ref.small.classList.remove('open');   /* bars shut */
        setTimeout(() => {
          if(!gapAnimated) return;
          ref.big.classList.add('open'); ref.small.classList.add('open');      /* bars slide away */
          countUp(ref.big, 2000000, 1150);
          countUp(ref.small, 150, 1150);
          ref.bigbar.style.width = 'calc(100% - 4px)';
          ref.smallbar.style.width = '6px';
        }, 850);
      }
      if(!show){
        gapAnimated = false;
        ref.big.classList.remove('open'); ref.small.classList.remove('open');
        ref.bigbar.style.width = '0';
        ref.smallbar.style.width = '0';
      }
    }
  }

  liveEls.tick.textContent = grand.toLocaleString('en-US');
  live.prev = JSON.parse(JSON.stringify(live.counts));
}

async function control(payload){
  if(!key){ openSetup(); return null; }
  try{
    const r = await fetch(API + '/api/control', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({key}, payload))
    });
    const d = await r.json();
    if(!d.ok){ toast(d.err === 'forbidden' ? 'Wrong key — press Key… to fix' : ('Error: ' + d.err)); return null; }
    return d;
  }catch(e){ toast('Network error'); return null; }
}

async function liveAction(act, q){
  if(act === 'reset'){
    if(!confirm('Clear every vote? Use this before a new run or while testing.')) return;
    const d = await control({action:'reset'});
    if(d){
      live.counts = {}; live.prev = {}; live.manualCounts = {}; live.showTruth = {};
      gapAnimated = false; updateLive(true); syncFull(); toast('All votes cleared');
    }
    return;
  }
  if(act === 'manual'){
    live.manual = !live.manual;
    document.body.classList.toggle('live-full', live.manual);
    const btn = bodyEl.querySelector('button[data-act="manual"]');
    btn.textContent = live.manual ? 'Manual: ON' : 'Manual entry';
    btn.classList.toggle('on', live.manual);
    for(const qq of QUESTIONS){
      const ref = liveEls.cards[qq.id];
      qq.opts.forEach(o => {
        const num = ref.bars[o.k].querySelector('.num');
        if(live.manual){
          live.manualCounts[qq.id] = live.manualCounts[qq.id] || {};
          if(num.querySelector('input')) return;
          const inp = document.createElement('input');
          inp.className = 'mi'; inp.type = 'number'; inp.min = '0';
          inp.dataset.q = qq.id; inp.dataset.k = o.k;
          inp.value = live.manualCounts[qq.id][o.k] || 0;
          inp.style.cssText = 'width:5.6em;font:inherit;font-size:.92em;padding:3px 7px;border-radius:8px;' +
                              'border:1.5px solid var(--line2);background:#fff;color:var(--ink);text-align:right';
          inp.addEventListener('input', onManualInput);
          num.replaceChildren(inp);
        } else {
          const inp = num.querySelector('input');
          if(inp){ const s = document.createElement('span'); num.replaceChildren(s); }
        }
      });
    }
    updateLive();
    return;
  }
  if(act === 'key'){ openSetup(); return; }
  if(act === 'truthall'){
    const anyOff = QUESTIONS.some(x => !live.showTruth[x.id]);
    if(anyOff) gapAnimated = false;
    QUESTIONS.forEach(x => { live.showTruth[x.id] = anyOff; });
    updateLive(); syncFull(); return;
  }
  if(act === 'lock'){
    const isLocked = live.ctrl['locked_' + q] === '1';
    const d = await control({action: isLocked ? 'unlock' : 'lock', q});
    if(d){ live.ctrl['locked_' + q] = isLocked ? '0' : '1'; updateLive(); toast(isLocked ? 'Unlocked' : 'Locked'); }
    return;
  }
  if(act === 'truth'){
    live.showTruth[q] = !live.showTruth[q];
    if(!live.showTruth[q]) gapAnimated = false;
    updateLive(); syncFull(); return;
  }
}

async function poll(){
  try{
    const r = await fetch(API + '/api/state', {cache:'no-store'});
    const d = await r.json();
    if(!d.ok) return;
    live.counts = d.counts || {};
    live.ctrl = d.ctrl || {};

    /* the pill is live on every page — that is the whole point */
    const grand = QUESTIONS.reduce((a,q) =>
      a + Object.values(live.counts[q.id] || {}).reduce((x,y)=>x+y,0), 0);
    paintPill(grand);

    if(SLIDES[cur].special !== 'live') return;
    if(live.manual) return;
    const ae = document.activeElement;
    if(ae && ae.tagName === 'INPUT') return;
    if($('setup').classList.contains('on')) return;
    updateLive();
  }catch(e){}
}
function startPolling(){ if(!pollTimer){ poll(); pollTimer = setInterval(poll, 1500); } }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

function next(){ if(cur < SLIDES.length - 1){ cur++; liveEls = null; gapAnimated = false; render(); } }
function prev(){ if(cur > 0){ cur--; liveEls = null; gapAnimated = false; render(); } }
function goto(i){ cur = Math.max(0, Math.min(SLIDES.length - 1, i)); liveEls = null; gapAnimated = false; render(); }

function openSetup(){ $('keyin').value = key; $('setup').classList.add('on'); setTimeout(()=>$('keyin').focus(), 60); }
$('keysave').addEventListener('click', ()=>{
  key = $('keyin').value.trim();
  localStorage.setItem(LS_KEY, key);
  $('setup').classList.remove('on');
  toast(key ? 'Key saved' : 'Key cleared');
});
$('keycancel').addEventListener('click', ()=>$('setup').classList.remove('on'));

document.addEventListener('keydown', e => {
  if($('setup').classList.contains('on')){
    if(e.key === 'Enter') $('keysave').click();
    if(e.key === 'Escape') $('keycancel').click();
    return;
  }
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  const k = e.key.toLowerCase();
  if(k==='arrowright'||k===' '||k==='enter'||k==='pagedown'){ e.preventDefault(); next(); return; }
  if(k==='arrowleft'||k==='pageup'){ e.preventDefault(); prev(); return; }
  if(k==='l'){ goto(LIVE_INDEX); return; }
  if(k==='n'){ notesOpen = !notesOpen; notesEl.classList.toggle('open', notesOpen);
               document.body.classList.toggle('notes-open', notesOpen); return; }
  if(k==='t'){ e.shiftKey ? resetTimer() : toggleTimer(); return; }
  if(k==='f'){ document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.(); return; }
  if(k==='home'){ goto(0); return; }
  if(k==='end'){ goto(SLIDES.length - 1); return; }
});

/* deep link: hudsonwang.com/game/#12 jumps straight to page 12 (survives a refresh mid-talk) */
(function(){
  const n = parseInt((location.hash || '').replace('#',''), 10);
  if(n >= 1 && n <= SLIDES.length) cur = n - 1;
})();

buildRail();
render();
startPolling();
</script>
