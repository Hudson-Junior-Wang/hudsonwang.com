<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Area 51 — Week 5 · The 5 Ps</title>
<style>
  :root{
    --bg:#0c1130;
    --bg2:#131b45;
    --card:#182252;
    --card2:#1e2a63;
    --line:#2b3772;
    --ink:#f2f5ff;
    --muted:#94a2cc;
    --accent:#a8c0ff;
    --accent2:#c9d8ff;
    --deep:#6f86d8;
    --pink:#f2aec4;
    --ok:#7fe0b0;
    --bad:#ff8f9a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 12% -8%, #1b2560 0%, rgba(27,37,96,0) 62%),
      radial-gradient(900px 600px at 96% 106%, #1a3a6b 0%, rgba(26,58,107,0) 60%),
      var(--bg);
    color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:relative;height:100vh;display:flex;flex-direction:column;
         padding:clamp(22px,4vh,52px) clamp(26px,5vw,96px) 82px}
  .kicker{font-size:clamp(12px,1.2vw,16px);letter-spacing:.24em;text-transform:uppercase;
          color:var(--accent);font-weight:800;margin-bottom:clamp(12px,2.4vh,28px);min-height:1.2em}
  #body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
  h1{font-size:clamp(40px,7.8vw,124px);line-height:.97;letter-spacing:-.028em;font-weight:800}
  h2{font-size:clamp(30px,4.7vw,74px);line-height:1.05;letter-spacing:-.018em;font-weight:800}
  h2.sm{font-size:clamp(26px,3.4vw,54px)}
  h3{font-size:clamp(20px,2.2vw,34px);font-weight:800}
  p{font-size:clamp(18px,2.1vw,34px);line-height:1.36;color:#e4e9fb;max-width:27em}
  p.sm{font-size:clamp(16px,1.6vw,25px)}
  p.big{font-size:clamp(24px,3.1vw,54px);line-height:1.2;font-weight:700}
  p.mega{font-size:clamp(30px,4.6vw,86px);line-height:1.1;font-weight:800;letter-spacing:-.02em}
  .muted{color:var(--muted)}
  .am{color:var(--accent)}
  .pk{color:var(--pink)}
  .sp{margin-top:clamp(12px,2.2vh,26px)}
  .sp2{margin-top:clamp(22px,4vh,52px)}
  strong{font-weight:800;color:#fff}
  em{color:var(--muted);font-style:italic}
  .label{font-size:clamp(12px,1.3vw,19px);letter-spacing:.24em;text-transform:uppercase;
         color:var(--accent);font-weight:800;margin-bottom:clamp(10px,1.8vh,20px)}
  .fade{animation:rise .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* qr */
  .qrwrap{display:flex;gap:clamp(20px,3vw,56px);align-items:flex-start;flex-wrap:wrap}
  .qrcard{background:#fff;border-radius:22px;padding:clamp(12px,1.4vw,22px);
          width:clamp(170px,21vw,330px);box-shadow:0 18px 50px -20px rgba(0,0,0,.75)}
  .qrcard svg{display:block;width:100%;height:auto}
  .qrurl{margin-top:10px;text-align:center;color:#0c1130;font-weight:800;
         font-size:clamp(11px,1.05vw,17px)}
  .rules li{list-style:none;font-size:clamp(19px,2.3vw,40px);line-height:1.35;font-weight:700}
  .qlist{display:flex;flex-direction:column;gap:clamp(5px,1vh,11px)}
  .qlist div{font-size:clamp(14px,1.4vw,22px);color:#dbe2f8}
  .qlist b{color:var(--accent);margin-right:.7em}

  /* live panel */
  .panel{display:flex;flex-direction:column;gap:clamp(7px,1.2vh,15px);overflow:auto;padding-right:6px}
  .qcard{background:var(--card);border:2px solid var(--line);border-radius:16px;
         padding:clamp(9px,1.3vh,17px) clamp(13px,1.5vw,24px)}
  .qcard.rev{border-color:var(--accent);background:var(--card2)}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  .qhead .qt{font-size:clamp(14px,1.5vw,25px);font-weight:750;line-height:1.25}
  .qhead .qn{font-size:clamp(12px,1.1vw,17px);color:var(--muted);font-weight:700;white-space:nowrap}
  .bars{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .bar{display:flex;align-items:center;gap:10px;font-size:clamp(12px,1.2vw,20px)}
  .bar .lab{flex:0 0 clamp(150px,20vw,360px);color:#ccd6f2;line-height:1.25}
  .bar .track{flex:1;height:clamp(12px,1.5vh,20px);background:#101740;border-radius:6px;
              overflow:hidden;min-width:60px}
  .bar .fill{display:block;height:100%;background:#46568f;transition:width .35s ease}
  .bar .num{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;
            min-width:5.6em;text-align:right;font-weight:700}
  .bar.win .fill{background:var(--accent)}
  .bar.win .lab{color:#fff;font-weight:800}
  .bar.win .num{color:var(--accent)}
  .ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  button.b{font:inherit;font-weight:750;cursor:pointer;border-radius:11px;border:2px solid var(--line);
           background:#1a2358;color:#dbe2f8;padding:7px 14px;font-size:clamp(11px,1.05vw,16px);transition:.12s}
  button.b:hover{border-color:var(--deep)}
  button.b.warn{border-color:var(--pink);color:var(--pink)}
  button.b.go{border-color:var(--accent);background:var(--accent);color:#0c1130}
  button.b.on{border-color:var(--accent);color:var(--accent);background:#202c6a}
  .truth{margin-top:10px;padding:10px 14px;border-radius:11px;background:#202c6a;
         border:1px solid var(--deep);font-size:clamp(13px,1.3vw,22px);font-weight:750;color:var(--accent2)}
  .gap{margin-top:12px;padding:clamp(10px,1.6vh,20px) clamp(14px,1.6vw,26px);
       background:#0f1638;border:1px dashed var(--deep);border-radius:13px}
  .gap .g{display:flex;align-items:center;gap:14px;font-size:clamp(15px,1.8vw,32px);font-weight:800;line-height:1.2}
  .gap .g .n{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--accent);min-width:5.6em}
  .gap .g .r{flex:1;height:clamp(14px,2vh,26px);background:var(--accent);border-radius:5px;min-width:2px}
  .gap .g .r.tiny{background:var(--pink)}
  .gap .g .t{flex:0 0 auto;color:var(--muted);font-size:.62em;font-weight:700}

  /* cards */
  .cols{display:flex;gap:clamp(14px,2.2vw,40px);flex-wrap:wrap}
  .col{flex:1 1 300px;background:var(--card);border:2px solid var(--line);border-radius:18px;
       padding:clamp(14px,2vh,28px) clamp(16px,1.8vw,32px)}
  .col.hi{border-color:var(--accent);background:var(--card2)}
  .col .lab{font-size:clamp(11px,1.1vw,16px);letter-spacing:.16em;text-transform:uppercase;
            color:var(--muted);font-weight:800;margin-bottom:10px}
  .col.hi .lab{color:var(--accent)}
  .col .txt{font-size:clamp(17px,2vw,32px);line-height:1.3;font-weight:650}
  .col .txt.sm{font-size:clamp(15px,1.6vw,25px);font-weight:600;line-height:1.55}

  /* chrome */
  #chrome{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
          align-items:center;padding:11px clamp(26px,5vw,96px);font-size:12.5px;color:#5b668f;
          background:linear-gradient(180deg,rgba(12,17,48,0),rgba(12,17,48,.97) 45%);pointer-events:none}
  #chrome .k{display:flex;gap:12px;flex-wrap:wrap}
  kbd{font-family:inherit;font-size:11px;font-weight:700;color:#b6c1e4;border:1px solid #313d7a;
      border-bottom-width:2px;border-radius:5px;padding:2px 6px;margin-right:4px;background:#151d4a}
  #dots{display:flex;gap:4px;max-width:46vw;flex-wrap:wrap;justify-content:flex-end}
  #dots i{display:block;width:11px;height:3px;border-radius:2px;background:#28325f}
  #dots i.on{background:#4a5aa0}
  #dots i.cur{background:var(--accent)}
  #notes{position:fixed;left:0;right:0;bottom:0;max-height:46vh;overflow:auto;background:#111842;
         border-top:2px solid var(--accent);padding:16px clamp(26px,5vw,96px) 20px;
         transform:translateY(101%);transition:transform .22s;z-index:30}
  #notes.open{transform:none}
  #notes .nk{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
             font-weight:800;margin-bottom:10px}
  #notes .nb{font-size:16px;line-height:1.62;color:#ccd6f2;max-width:72em}
  #notes .nb b{color:#fff}#notes .nb ul{margin:8px 0 0 1.15em}#notes .nb li{margin:4px 0}
  body.notes-open #stage{padding-bottom:46vh}
  body.notes-open #chrome{opacity:0}
  .nflag{position:fixed;top:14px;right:clamp(26px,5vw,96px);font-size:11px;letter-spacing:.18em;
         text-transform:uppercase;color:#39447a;font-weight:800;z-index:31}
  .nflag.on{color:var(--accent)}
  #setup{position:fixed;inset:0;background:rgba(8,11,30,.95);display:none;place-items:center;z-index:60;padding:24px}
  #setup.on{display:grid}
  #setup .box{background:#141c48;border:2px solid var(--deep);border-radius:20px;
              padding:26px 28px;max-width:560px;width:100%}
  #setup h3{margin-bottom:10px}
  #setup p{font-size:15px;color:var(--muted);margin-bottom:16px;line-height:1.55}
  #setup input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:11px;
               border:2px solid var(--line);background:#0c1130;color:#fff;margin-bottom:14px}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#202c6a;
         border:1px solid var(--deep);color:var(--accent2);padding:9px 16px;border-radius:999px;
         font-size:13px;font-weight:750;opacity:0;transition:opacity .25s;z-index:70;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="nflag" id="nflag">N · notes</div>
<div class="toast" id="toast"></div>

<div id="stage">
  <div class="kicker" id="kicker"></div>
  <div id="body"></div>
</div>

<div id="chrome">
  <div class="k">
    <span><kbd>→</kbd> next page</span>
    <span><kbd>←</kbd> back</span>
    <span><kbd>L</kbd> live results</span>
    <span><kbd>N</kbd> notes</span>
    <span><kbd>F</kbd> fullscreen</span>
  </div>
  <div id="dots"></div>
</div>

<div id="notes"><div class="nk">Presenter notes · 讲解备注</div><div class="nb" id="nb"></div></div>

<div id="setup">
  <div class="box">
    <h3>Presenter key</h3>
    <p>Paste your control key once. It is stored only in this browser and never written into the page.</p>
    <input id="keyin" type="password" placeholder="control key" autocomplete="off">
    <div style="display:flex;gap:10px">
      <button class="b go" id="keysave">Save</button>
      <button class="b" id="keycancel">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ==================== config ==================== */
const API = 'https://storm51-vote.hudsonwang.workers.dev';
const LS_KEY = 's51_ctrl_key';

/* ==================== questions (must match /play) ==================== */
const QUESTIONS = [
  { id:'q1', short:'How many clicked “Going”?',
    opts:[{k:'a',t:'About 40,000'},{k:'b',t:'About 400,000'},{k:'c',t:'About 2,000,000'}],
    win:'c', truth:'About 2,000,000 clicked “Going”. Another 1,500,000 clicked “Interested”.' },
  { id:'q2', short:'What did the US Air Force do?',
    opts:[{k:'a',t:'Ignored it'},{k:'b',t:'Issued a public statement'},{k:'c',t:'Sent in troops'}],
    win:'b', truth:'The Air Force issued a public statement, discouraging anyone from coming.' },
  { id:'q3', short:'How many did the county prepare for?',
    opts:[{k:'a',t:'About 500'},{k:'b',t:'About 4,000'},{k:'c',t:'About 40,000'}],
    win:'c', truth:'Lincoln County prepared for 40,000 people — in a county with 184 hotel rooms.' },
  { id:'q4', short:'How many actually showed up?',
    opts:[{k:'a',t:'About 150'},{k:'b',t:'About 15,000'},{k:'c',t:'About 150,000'}],
    win:'a', truth:'About 150 people reached the two entrances.' },
  { id:'q5', short:'How did it end?',
    opts:[{k:'a',t:'The base was overrun'},{k:'b',t:'7 arrests — public urination'},{k:'c',t:'Nothing at all'}],
    win:'b', truth:'7 arrests. Public urination, alcohol offences, indecent exposure.' }
];

/* ==================== slides — one idea per page ==================== */
const SLIDES = [

/* 1 cover */
{ kicker:'PMGT1852 · Week 5 · Facilitation',
  html:`<h1>The <span class="am">5 Ps</span></h1>
    <p class="sp2" style="font-size:clamp(17px,1.9vw,30px);letter-spacing:.03em;color:#c9d4f5">
      Purpose &nbsp;·&nbsp; Product &nbsp;·&nbsp; Participants &nbsp;·&nbsp; Probable Issues &nbsp;·&nbsp; Process</p>
    <p class="big sp2">A meeting with <span class="am">2,000,000 participants</span><br>that was never planned at all.</p>
    <p class="muted sp2" style="font-size:clamp(17px,1.9vw,29px)">
      “They Can't Stop All of Us.” &nbsp;·&nbsp; Storm Area 51 &nbsp;·&nbsp; 20 September 2019</p>`,
  note:`<b>开场只说一句</b>
  <ul><li>「今天讲 Week 5 的 5 Ps。我用一个案例串起来——一场有 <b>200 万人报名、却从没开过筹备会</b>的『会』。」</li>
  <li>别说"这是个玩笑活动"或"最后没人来"，那会毁掉后面的悬念。</li></ul>` },

/* 2–8 timeline */
{ kicker:'The event · 1 of 7',
  html:`<div class="label">27 Jun 2019</div>
    <p class="mega">Late at night, a 21-year-old in California creates a Facebook event.</p>
    <p class="mega sp2 am">It is a joke.</p>`,
  note:`<b>时间线第 1 页</b><ul><li>只说事实，不加评论。念完直接翻页。</li></ul>` },

{ kicker:'The event · 2 of 7',
  html:`<div class="label">The title</div>
    <p class="mega">“Storm Area 51,<br>They Can't Stop<br>All of Us.”</p>`,
  note:`<b>时间线第 2 页</b><ul><li>这是全场笑点的核心句，念慢一点。</li>
  <li>可以补一句：「注意这句话的逻辑——它赌的是<b>人够多，就拦不住</b>。」</li></ul>` },

{ kicker:'The event · 3 of 7',
  html:`<div class="label">What it asked</div>
    <p class="mega">Everyone meet at the gate of a classified US Air Force base.</p>
    <p class="mega sp am">And go in.</p>
    <p class="mega sp am">To see the aliens.</p>`,
  note:`<b>时间线第 3 页</b><ul><li>三句分三个节拍念，中间各停半秒。</li></ul>` },

{ kicker:'The event · 4 of 7',
  html:`<div class="label">The first three days</div>
    <p class="mega">Almost nobody responds.</p>`,
  note:`<b>时间线第 4 页 ★ 关键停顿</b>
  <ul><li><b>这一页要停住</b>。一个字都不多说，直接翻页，让落差自己发生。</li></ul>` },

{ kicker:'The event · 5 of 7',
  html:`<div class="label">Then</div>
    <p class="mega">It went viral.</p>
    <p class="mega sp am">Worldwide.</p>`,
  note:`<b>时间线第 5 页</b><ul><li>不要在这里说数字（200 万）——那是测试题 Q1 的答案。</li></ul>` },

{ kicker:'The event · 6 of 7',
  html:`<div class="label">August</div>
    <p class="big">Lincoln County, Nevada starts drafting an <span class="am">emergency declaration</span>.</p>
    <p class="big sp2">Rachel, Nevada — population <span class="am">56</span> — posts a warning on its own website:</p>
    <p class="big sp am">there is not enough food, water or fuel here.</p>`,
  note:`<b>时间线第 6 页</b>
  <ul><li>仍然不提数字 40,000（那是 Q3 的答案）。只说"县里开始起草紧急状态声明"。</li>
  <li>「56 人的小镇」这个对比要念出来。</li></ul>` },

{ kicker:'The event · 7 of 7',
  html:`<div class="label">20 Sep 2019</div>
    <p class="mega">The day arrives.</p>`,
  note:`<b>时间线最后一页</b><ul><li>念完直接切到扫码页，不要预告结果。</li></ul>` },

/* 9 qr */
{ kicker:'Scan · 30 seconds · no login',
  html:`<div class="qrwrap">
      <div class="qrcard"><svg viewBox="0 0 33 33" preserveAspectRatio="xMidYMid meet" width="33" height="33"><path fill="#fff" d="M0 0h33v33h-33z"/><path stroke="#000" d="M2 2.5h7m6 0h2m3 0h1m3 0h7m-29 1h1m5 0h1m1 0h1m1 0h4m1 0h4m3 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h2m2 0h2m1 0h2m2 0h1m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m5 0h2m3 0h1m1 0h1m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m3 0h10m2 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m3 0h3m6 0h2m1 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-18 1h4m2 0h1m-17 1h3m1 0h2m2 0h2m3 0h1m1 0h1m2 0h2m5 0h2m-28 1h2m2 0h2m2 0h1m2 0h1m2 0h1m1 0h1m1 0h5m1 0h2m2 0h1m-29 1h1m2 0h2m1 0h1m2 0h4m3 0h1m5 0h1m2 0h1m1 0h1m-26 1h4m6 0h1m1 0h1m3 0h2m3 0h3m2 0h1m-29 1h1m1 0h2m2 0h2m5 0h2m2 0h1m2 0h2m1 0h1m2 0h3m-28 1h1m2 0h1m3 0h3m1 0h1m1 0h2m3 0h1m2 0h2m1 0h2m1 0h1m-26 1h6m3 0h1m1 0h2m1 0h3m1 0h1m1 0h3m1 0h2m-27 1h3m3 0h2m1 0h1m5 0h2m3 0h1m1 0h2m1 0h2m-29 1h1m1 0h1m3 0h2m1 0h2m1 0h3m1 0h6m1 0h3m1 0h2m-25 1h1m3 0h2m2 0h1m3 0h2m2 0h2m1 0h1m2 0h1m-27 1h1m1 0h2m2 0h3m1 0h2m2 0h4m4 0h2m2 0h1m-23 1h2m1 0h2m1 0h2m5 0h2m2 0h2m1 0h5m-28 1h3m2 0h1m1 0h3m5 0h3m1 0h7m-19 1h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m3 0h2m1 0h2m-29 1h7m2 0h4m3 0h2m1 0h2m1 0h1m1 0h1m1 0h2m-28 1h1m5 0h1m1 0h2m1 0h3m1 0h1m2 0h1m1 0h1m3 0h1m2 0h2m-29 1h1m1 0h3m1 0h1m4 0h3m1 0h1m2 0h1m1 0h8m-28 1h1m1 0h3m1 0h1m1 0h1m2 0h4m1 0h1m1 0h2m4 0h1m1 0h2m-28 1h1m1 0h3m1 0h1m1 0h2m1 0h2m2 0h4m1 0h1m2 0h1m2 0h1m1 0h1m-29 1h1m5 0h1m1 0h3m2 0h2m1 0h1m1 0h1m1 0h2m2 0h2m1 0h1m-28 1h7m2 0h1m5 0h2m1 0h3m2 0h1m3 0h1"/></svg><div class="qrurl">hudsonwang.com/play</div></div>
      <div style="flex:1 1 420px;min-width:300px">
        <ul class="rules">
          <li class="am">This is just a game.</li>
          <li class="sp">No wrong answers.</li>
          <li class="sp">Nobody is being graded.</li>
          <li class="sp">Nobody sees what you picked.</li>
          <li class="sp2">Guess. That's all.</li>
        </ul>
      </div>
    </div>
    <div class="sp2 col" style="border-color:var(--line);max-width:none">
      <div class="lab">What you'll be asked</div>
      <div class="qlist">
        <div><b>1</b>How many people clicked “Going”?</div>
        <div><b>2</b>What did the US Air Force do about it?</div>
        <div><b>3</b>How many people did the county prepare for?</div>
        <div><b>4</b>How many actually showed up?</div>
        <div><b>5</b>How did the whole thing end?</div>
      </div>
    </div>`,
  note:`<b>扫码页 —— 三个必须说的点</b>
  <ul><li>① <b>「这只是个游戏，没有对错，不计分，没人看得到你选了什么。」</b>——国际学生容易紧张不敢答，这句一定要说。</li>
  <li>② 5 道题<b>全部提前公布</b>（故意放这儿）——他们知道后面会问什么，听时间线时会主动记。</li>

/* ==================== engine ==================== */
const $ = id => document.getElementById(id);
const bodyEl = $('body'), kickerEl = $('kicker'), notesEl = $('notes'), nbEl = $('nb'), dotsEl = $('dots');

let cur = 0, notesOpen = false;
let key = localStorage.getItem(LS_KEY) || '';
let live = { counts:{}, ctrl:{}, manual:false, showTruth:{}, manualCounts:{} };
let pollTimer = null;
const LIVE_INDEX = SLIDES.findIndex(s => s.special === 'live');

SLIDES.forEach(()=>dotsEl.appendChild(document.createElement('i')));

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1600);
}

function render(){
  const s = SLIDES[cur];
  kickerEl.innerHTML = s.kicker || '&nbsp;';

  if(s.special === 'live'){
    bodyEl.innerHTML = liveHTML();
    bindLive();
    startPolling();
  } else {
    stopPolling();
    bodyEl.innerHTML = `<div class="fade">${s.html || ''}</div>`;
  }
  nbEl.innerHTML = s.note || '';
  [...dotsEl.children].forEach((d,k)=>{ d.className = k===cur ? 'cur' : (k<cur ? 'on' : ''); });
}

/* ---------- live results panel ---------- */
function liveHTML(){
  const total = id => Object.values(live.counts[id] || {}).reduce((a,b)=>a+b,0);

  const rows = QUESTIONS.map((q, qi) => {
    const c = live.counts[q.id] || {};
    const shown = live.manual ? (live.manualCounts[q.id] || {}) : c;
    const tt = live.manual ? Object.values(shown).reduce((a,b)=>a+b,0) : total(q.id);

    const bars = q.opts.map(o => {
      const n = shown[o.k] || 0;
      const pc = tt ? Math.round(n/tt*100) : 0;
      const win = live.showTruth[q.id] && o.k === q.win;
      const body = live.manual
        ? `<input class="mi" data-q="${q.id}" data-k="${o.k}" type="number" min="0" value="${n}"
             style="width:5.5em;font:inherit;font-size:.9em;padding:3px 7px;border-radius:8px;
                    border:1px solid var(--line);background:#0c1130;color:#fff">`
        : `<span class="num">${n} &nbsp;${pc}%</span>`;
      return `<div class="bar ${win?'win':''}">
        <span class="lab">${o.t}</span>
        <span class="track"><span class="fill" style="width:${pc}%"></span></span>
        ${body}
      </div>`;
    }).join('');

    const locked = live.ctrl['locked_'+q.id] === '1';
    const truth = live.showTruth[q.id] ? `
      <div class="truth">TRUTH → ${q.truth}</div>
      ${q.id==='q4' ? `
        <div class="gap">
          <div class="g"><span class="n">2,000,000</span><span class="r"></span><span class="t">clicked “Going”</span></div>
          <div class="g" style="margin-top:8px"><span class="n">150</span><span class="r tiny" style="max-width:6px"></span><span class="t">showed up</span></div>
        </div>` : ''}` : '';

    return `<div class="qcard ${live.showTruth[q.id]?'rev':''}">
      <div class="qhead">
        <div class="qt">${qi+1}. ${q.short}</div>
        <div class="qn">${tt} answer${tt===1?'':'s'}</div>
      </div>
      <div class="bars">${bars}</div>
      <div class="ctrls">
        <button class="b ${locked?'on':''}" data-act="lock" data-q="${q.id}">${locked?'Locked':'Lock'}</button>
        <button class="b ${live.showTruth[q.id]?'on':''}" data-act="truth" data-q="${q.id}">${live.showTruth[q.id]?'Hide truth':'Reveal truth'}</button>
      </div>
      ${truth}
    </div>`;
  }).join('');

  return `
    <div class="qhead" style="margin-bottom:14px">
      <h2 class="sm" style="font-size:clamp(22px,2.6vw,42px)">Live results</h2>
      <div class="ctrls" style="margin:0">
        <button class="b warn" data-act="reset">⟲ &nbsp;Reset all</button>
        <button class="b ${live.manual?'on':''}" data-act="manual">${live.manual?'Manual: ON':'Manual entry'}</button>
        <button class="b" data-act="truthall">Reveal all truths</button>
        <button class="b" data-act="key">Key…</button>
      </div>
    </div>
    <div class="panel">${rows}</div>`;
}

function bindLive(){
  bodyEl.querySelectorAll('button[data-act]').forEach(b =>
    b.addEventListener('click', () => liveAction(b.dataset.act, b.dataset.q)));
  bodyEl.querySelectorAll('input.mi').forEach(inp => {
    inp.addEventListener('input', () => {
      const q = inp.dataset.q, k = inp.dataset.k;
      live.manualCounts[q] = live.manualCounts[q] || {};
      live.manualCounts[q][k] = Math.max(0, parseInt(inp.value,10) || 0);
      const card = inp.closest('.qcard');
      const m = live.manualCounts[q];
      const tot = Object.values(m).reduce((a,b)=>a+b,0);
      const opts = QUESTIONS.find(x=>x.id===q).opts;
      card.querySelectorAll('.bar').forEach((row,i)=>{
        const fill = row.querySelector('.fill');
        if(fill) fill.style.width = (tot ? Math.round((m[opts[i].k]||0)/tot*100) : 0) + '%';
      });
      const nEl = card.querySelector('.qn');
      if(nEl) nEl.textContent = tot + ' answer' + (tot===1?'':'s');
    });
  });
}

async function control(payload){
  if(!key){ openSetup(); return null; }
  try{
    const r = await fetch(API + '/api/control', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({key}, payload))
    });
    const d = await r.json();
    if(!d.ok){ toast(d.err === 'forbidden' ? 'Wrong key — press Key… to fix' : ('Error: ' + d.err)); return null; }
    return d;
  }catch(e){ toast('Network error'); return null; }
}

async function liveAction(act, q){
  if(act === 'reset'){
    if(!confirm('Clear every vote? Use this before a new run or while testing.')) return;
    const d = await control({action:'reset'});
    if(d){ live.counts = {}; live.manualCounts = {}; live.showTruth = {}; render(); toast('All votes cleared'); }
    return;
  }
  if(act === 'manual'){ live.manual = !live.manual; render(); return; }
  if(act === 'key'){ openSetup(); return; }
  if(act === 'truthall'){
    const anyOff = QUESTIONS.some(x => !live.showTruth[x.id]);
    QUESTIONS.forEach(x => live.showTruth[x.id] = anyOff);
    render(); return;
  }
  if(act === 'lock'){
    const isLocked = live.ctrl['locked_'+q] === '1';
    const d = await control({action: isLocked ? 'unlock' : 'lock', q});
    if(d){ live.ctrl['locked_'+q] = isLocked ? '0' : '1'; render(); toast(isLocked?'Unlocked':'Locked'); }
    return;
  }
  if(act === 'truth'){ live.showTruth[q] = !live.showTruth[q]; render(); return; }
}

/* ---------- polling ---------- */
async function poll(){
  try{
    const r = await fetch(API + '/api/state', {cache:'no-store'});
    const d = await r.json();
    if(!d.ok) return;
    live.counts = d.counts || {};
    live.ctrl = d.ctrl || {};
    if(SLIDES[cur].special !== 'live') return;
    if(live.manual) return;
    const ae = document.activeElement;
    if(ae && ae.tagName === 'INPUT') return;
    if($('setup').classList.contains('on')) return;
    render();
  }catch(e){}
}
function startPolling(){ if(!pollTimer){ poll(); pollTimer = setInterval(poll, 1500); } }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

/* ---------- navigation ---------- */
function next(){ if(cur < SLIDES.length-1){ cur++; render(); } }
function prev(){ if(cur > 0){ cur--; render(); } }
function goto(i){ cur = Math.max(0, Math.min(SLIDES.length-1, i)); render(); }

/* ---------- setup ---------- */
function openSetup(){ $('keyin').value = key; $('setup').classList.add('on'); setTimeout(()=>$('keyin').focus(), 60); }
$('keysave').addEventListener('click', ()=>{
  key = $('keyin').value.trim();
  localStorage.setItem(LS_KEY, key);
  $('setup').classList.remove('on');
  toast(key ? 'Key saved' : 'Key cleared');
  if(SLIDES[cur].special === 'live') render();
});
$('keycancel').addEventListener('click', ()=>$('setup').classList.remove('on'));

/* ---------- keys ---------- */
document.addEventListener('keydown', e => {
  if($('setup').classList.contains('on')){
    if(e.key === 'Enter') $('keysave').click();
    if(e.key === 'Escape') $('keycancel').click();
    return;
  }
  const ae = document.activeElement;
  if(ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  const k = e.key.toLowerCase();
  if(k==='arrowright'||k===' '||k==='enter'||k==='pagedown'){ e.preventDefault(); next(); return; }
  if(k==='arrowleft'||k==='pageup'){ e.preventDefault(); prev(); return; }
  if(k==='l'){ goto(LIVE_INDEX); return; }
  if(k==='n'){ notesOpen=!notesOpen; notesEl.classList.toggle('open',notesOpen);
               document.body.classList.toggle('notes-open',notesOpen); $('nflag').classList.toggle('on',notesOpen); return; }
  if(k==='f'){ document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.(); return; }
  if(k==='home'){ goto(0); return; }
  if(k==='end'){ goto(SLIDES.length-1); return; }
});

render();
</script>
