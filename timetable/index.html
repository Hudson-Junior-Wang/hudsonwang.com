<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程表 - USYD Semester 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: #fafafa; color: #333; min-height: 100vh;
    padding: 48px 20px;
  }
  .subtitle { text-align: center; color: #999; margin-bottom: 36px; font-size: 13px; letter-spacing: .5px; }

  /* ── timetable grid ── */
  .wrap { max-width: 1060px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: 72px repeat(5, 1fr);
    grid-template-rows: 48px repeat(12, 72px);
    border: 1px solid #ececec;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }

  /* day headers */
  .hdr {
    display: flex; align-items: center; justify-content: center;
    font-weight: 500; font-size: 13px; letter-spacing: .3px;
    background: #fafafa; color: #666;
    border-bottom: 1px solid #ececec;
  }
  .hdr:first-child { background: #fff; }

  /* time gutter */
  .time {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #b3b3b3;
    font-family: 'SF Mono', 'Fira Code', monospace;
    border-bottom: 1px solid #f4f4f4;
  }
  .cell { border-bottom: 1px solid #f4f4f4; position: relative; }

  /* ── event blocks (positioned over cells) ── */
  .event {
    position: absolute; left: 3px; right: 3px; top: 3px;
    border-radius: 8px; padding: 7px 10px;
    border: 1px solid transparent;
    display: flex; flex-direction: column; gap: 2px;
    cursor: pointer; transition: transform .12s, box-shadow .12s;
    z-index: 5; overflow: hidden;
  }
  .event:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,.08); z-index: 20; }

  .ev-sub { font-weight: 600; font-size: 12px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-type { font-size: 10px; opacity: .75; }
  .ev-time { font-size: 10px; opacity: .65; font-family: 'SF Mono', monospace; }
  .ev-room { font-size: 9px; opacity: .6; line-height: 1.3; word-break: break-word; }
  .ev-note { font-size: 9px; opacity: .6; margin-top: 1px; }

  /* pastel color themes */
  .c-buss     { background: #e8f1fd; color: #1d4ed8; border-color: #d3e4fb; }
  .c-pmgt1711 { background: #fdf3e3; color: #b45309; border-color: #f8e4c4; }
  .c-pmgt1852 { background: #e6f7ef; color: #047857; border-color: #cfeee0; }
  .c-pmgt1865 { background: #f1ecfd; color: #6d28d9; border-color: #e3d9fa; }

  .assessment { border-left: 3px solid #f43f5e; }

  /* ── mobile stacked list (replaces the grid on phones) ── */
  .mobile-list { display: none; }
  .ml-day { margin-bottom: 14px; }
  .ml-day-hd {
    font-size: 13px; font-weight: 600; color: #555;
    padding: 8px 14px; border-radius: 8px 8px 0 0;
    background: #f5f5f5; border: 1px solid #ececec; border-bottom: none;
  }
  .ml-day-hd .ml-cnt { font-size: 11px; color: #aaa; font-weight: 400; margin-left: 6px; }
  .ml-ev {
    padding: 11px 14px; border: 1px solid #ececec; border-top: none;
    background: #fff; color: #333;
  }
  .ml-ev:last-child { border-radius: 0 0 8px 8px; }
  .ml-ev .ml-sub { font-size: 13px; font-weight: 600; }
  .ml-ev .ml-time { font-size: 11px; color: #999; margin: 3px 0; font-family: 'SF Mono', monospace; }
  .ml-ev .ml-room { font-size: 11px; color: #666; line-height: 1.45; word-break: break-word; }
  .ml-ev .ml-note { font-size: 10px; color: #aaa; margin-top: 3px; }

  .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  @media (max-width: 700px) {
    body { padding: 28px 14px; }
    .subtitle { margin-bottom: 24px; }
    .grid-scroll { display: none; }          /* hide grid entirely */
    .mobile-list { display: block; }         /* show stacked list */
  }
</style>
</head>
<body>

<p class="subtitle">University of Sydney · Semester 2 · 2026</p>

<div class="wrap">
  <div class="grid-scroll">
  <div class="grid" id="grid">

    <!-- row 1: day headers -->
    <div class="hdr"></div>
    <div class="hdr">Monday</div>
    <div class="hdr">Tuesday</div>
    <div class="hdr">Wednesday</div>
    <div class="hdr">Thursday</div>
    <div class="hdr">Friday</div>

    <!-- rows 2-13: 08:00 – 19:00 -->
    <div class="time">08:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">09:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">10:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">11:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">12:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">13:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">14:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">15:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">16:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">17:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">18:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    <div class="time">19:00</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>
  </div>
</div>

<!-- Mobile stacked list (fills in from JS; grid is hidden on phones) -->
<div class="mobile-list" id="mobileList"></div>

<script>
(function() {
  /* abbreviate day headers on narrow screens */
  function abbreviateDays() {
    if (window.innerWidth <= 700) {
      var map = { Monday:'Mon', Tuesday:'Tue', Wednesday:'Wed', Thursday:'Thu', Friday:'Fri' };
      document.querySelectorAll('.hdr').forEach(function(h){
        if (map[h.textContent]) h.textContent = map[h.textContent];
      });
    }
  }
  abbreviateDays();
  window.addEventListener('resize', abbreviateDays);
  /* grid layout constants:
     row 1 = header
     rows 2-13 = 08:00 through 19:00
     each cell is 56px tall (48px header)
     col 1=time, 2=Mon, 3=Tue, 4=Wed, 5=Thu, 6=Fri

     Helper: time string -> start row & pixel offset
     08:00 → row 2, 09:00 → row 3, ... 19:00 → row 13
     map hour to row: row = hour - 6   (8→2, 9→3, ... 19→13)
  */
  const HEADER_H = 48;
  const CELL_H   = 72;

  function hourToRow(h) { return h - 6; } /* 8→2, 14→8, etc. */

  /* an event occupies from startHour to endHour in column col (2..6) */
  var ALL_EVENTS = [];
  function placeEvent(subject, type, day, startH, startM, endH, endM, room, note, cls) {
    ALL_EVENTS.push({ subject: subject, type: type, day: day,
      startH: startH, startM: startM, endH: endH, endM: endM,
      room: room, note: note, cls: cls });

    const col = day; /* Mon=2 ... Fri=6 */
    const startRow = hourToRow(startH);
    const endRow   = hourToRow(endH);

    /* event occupies rows startRow through endRow-1 (height spans N rows) */
    const span = endRow - startRow;

    /* calculate top offset from minutes */
    const topPx = (startM / 60) * CELL_H;

    const grid = document.getElementById('grid');

    /* find the cell at (startRow, col) — that's our anchor */
    /* cells are laid out row-major: row 1 has 6 kids, row 2 has 6, etc. */
    const kids = grid.children;
    const anchorIdx = (startRow - 1) * 6 + (col - 1);
    const anchor = kids[anchorIdx];

    const heightPx = span * CELL_H - topPx + (endM / 60) * CELL_H - 4;

    const div = document.createElement('div');
    div.className = 'event ' + cls;
    div.style.top = topPx + 'px';
    div.style.height = heightPx + 'px';

    div.innerHTML = [
      '<div class="ev-sub">' + subject + '</div>',
      '<div class="ev-type">' + type + '</div>',
      '<div class="ev-time">' + pad(startH) + ':' + pad(startM) + ' – ' + pad(endH) + ':' + pad(endM) + '</div>',
      '<div class="ev-room">' + room + '</div>',
      note ? '<div class="ev-note">' + note + '</div>' : ''
    ].join('');

    anchor.appendChild(div);
  }

  function pad(n) { return String(n).padStart(2,'0'); }

  /* ─── events ─── */

  /* BUSS1020 Lecture — Mon 14:00-16:00, Online */
  placeEvent('BUSS1020 Lecture', 'Lecture – Online Q&A', 2,
    14,0, 16,0,
    'Camperdown/Darlington, Sydney (Online delivery)',
    '3/8—21/9, 12/10—26/10', 'c-buss');

  /* BUSS1020 Workshop — Wed 10:00-12:00 */
  placeEvent('BUSS1020 Workshop', 'Workshop', 4,
    10,0, 12,0,
    'H69.01.133 Business School Codrington Building BS Codrington Computer Lab (5) 133',
    '5/8—23/9, 7/10—4/11', 'c-buss');

  /* PMGT1711 Tutorial — Wed 16:00-18:00 */
  placeEvent('PMGT1711 Tutorial', 'Tutorial', 4,
    16,0, 18,0,
    'J05.03.361 Civil Engineering Building Civil Engineering Seminar Room 361',
    '5/8—23/9, 7/10—4/11', 'c-pmgt1711');

  /* PMGT1852 Tutorial — Thu 10:00-12:00 */
  placeEvent('PMGT1852 Tutorial', 'Tutorial', 5,
    10,0, 12,0,
    'H70.02.2050 Belinda Hutchinson Building BHB Seminar Room 2050',
    '13/8—17/9, 8/10—29/10', 'c-pmgt1852');

  /* PMGT1852 Lecture — Fri 11:00-13:00, only 3 sessions */
  placeEvent('PMGT1852 Lecture', 'Lecture', 6,
    11,0, 13,0,
    'H70.01.1040 Belinda Hutchinson Building BHB Lecture Theatre 1040',
    '仅 3 次: 7/8, 25/9, 6/11', 'c-pmgt1852');

  /* PMGT1865 Tutorial — Thu 17:00-19:00 */
  placeEvent('PMGT1865 Tutorial', 'Tutorial', 5,
    17,0, 19,0,
    'H70.03.3090 Belinda Hutchinson Building BHB Learning Studio 3090 (24/9: J05.03.365 Civil Eng Computer Lab)',
    '6/8—3/9, 17/9—24/9, 8/10—29/10', 'c-pmgt1865');

  /* PMGT1865 Assessment — Fri 16:00-18:00, only 2 sessions */
  placeEvent('PMGT1865 Assessment', 'Assessment', 6,
    16,0, 18,0,
    'A31.04.4002\u2002Sydney Nanoscience Hub (SNH)\u2002SNH Lecture Theatre 4002 (Messel)',
    '仅 2 次: 11/9,\u20026/11', 'c-pmgt1865 assessment');

  /* ─── mobile stacked list (no horizontal scroll needed) ─── */
  var DAY_NAMES = { 2:'Monday', 3:'Tuesday', 4:'Wednesday', 5:'Thursday', 6:'Friday' };
  var DAY_SHORT = { 2:'Mon', 3:'Tue', 4:'Wed', 5:'Thu', 6:'Fri' };
  var mobileList = document.getElementById('mobileList');
  var html = '';
  for (var d = 2; d <= 6; d++) {
    var dayEvents = ALL_EVENTS.filter(function(e){ return e.day === d; });
    if (!dayEvents.length) continue;
    dayEvents.sort(function(a,b){ return a.startH*60+a.startM - (b.startH*60+b.startM); });
    html += '<div class="ml-day"><div class="ml-day-hd">' + DAY_NAMES[d] +
      '<span class="ml-cnt">' + dayEvents.length + ' 门</span></div>';
    dayEvents.forEach(function(e){
      html += '<div class="ml-ev">' +
        '<div class="ml-sub">' + e.subject + '</div>' +
        '<div class="ml-time">' + pad(e.startH) + ':' + pad(e.startM) + ' – ' + pad(e.endH) + ':' + pad(e.endM) + '</div>' +
        '<div class="ml-room">' + e.room + '</div>' +
        (e.note ? '<div class="ml-note">' + e.note + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
  }
  mobileList.innerHTML = html;

})();
</script>

</body>
</html>
