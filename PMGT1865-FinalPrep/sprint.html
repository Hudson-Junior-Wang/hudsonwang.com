</style></head><body><a class="skip" href="#content">跳到学习内容</a><aside class="rail" id="rail"><div class="brand">PMGT1865</div><div class="small">ZERO TO FINAL · 零基础速通</div><nav id="nav" aria-label="速通目录"></nav><a href="./">← 原题库 / 7 道样卷</a><p class="small">不刷 178 题。先学 12 个模块，再用 24 题定位漏洞。</p><div class="version">SPRINT · 2026-11-06 · v1</div></aside><main><header><button class="quiet menu" id="menu" aria-controls="rail" aria-expanded="false">目录</button><span id="breadcrumb">零基础学习路线</span><a href="./">保留原题库 ↗</a></header><div id="warning" class="status" role="alert" hidden>本地保存不可用。请导出速通进度备份，关闭页面会丢失当前改动。</div><div id="notice" role="status"></div><section id="content" tabindex="-1"></section><input type="file" id="import-file" accept="application/json" hidden></main><script>
'use strict';
const MODULES=[{"title": "先理解这门课在做什么", "en": "Project, scope & WBS", "week": "1–2", "body": "\n<p class=\"lead\">想象你要办一场音乐节：交什么成果？哪些事情先做？要多少人和钱？供应商什么时候到？实际落后了怎么办？这就是这门课的主线。<\/p>\n<h2>1 · 先分清六个词<\/h2><dl><dt>Project（——和日常运营有什么不同？）<\/dt><dd>为创造独特成果而开展的临时工作，有开始与结束；temporary 不等于时间短。筹办一次特定音乐节是 project，持续日常经营是 operations。<\/dd><dt>Deliverable / objective<\/dt><dd>Deliverable 是交付物，例如获批的安全方案；objective 是目标，例如在规定时间和预算内完成交付。不能把“开会”自动当成成果。<\/dd><dt>Acceptance criteria<\/dt><dd>用什么可验证标准判断交付合格。教学示例：“方案获得授权方批准”比“做好安全工作”更可检查；不是新增案例的官方要求。<\/dd><dt>Constraint / assumption<\/dt><dd>Constraint 是必须遵守的边界，例如固定活动日期；assumption 是暂时视为成立、仍需验证的条件。“假设供应商有档期”不等于供应商已承诺。<\/dd><dt>Scope / scope creep（——所有变更都不能做吗？）<\/dt><dd>Scope 界定包含与不包含的工作；scope creep 是未经适当控制的范围蔓延。合理变更可以批准，但要分析时间、成本与资源影响，并留记录。<\/dd><\/dl>\n<h2>2 · 全课是一条链<\/h2><p><b>Scope → WBS → activities → dependencies → schedule → resources → budget → procurement → progress → control。<\/b>前面漏工作，后面的精确计算仍会失真。<\/p><p>WBS (Work Breakdown Structure——它是时间表吗？) 把范围分解到可估算、分配、控制的 work package。WBS 管“做什么”，network 管“先后依赖”，Gantt 用时间轴显示安排，OBS 管“组织里有哪些角色”。<\/p>\n<h2>3 · 阶段与管理维度<\/h2><p>五个管理阶段：Initiation、Planning、Execution、Monitoring & Control、Closure。监控贯穿执行，不是全部做完才检查。<\/p><p>10 knowledge areas：Integration、Scope、Schedule/Time、Cost、Quality、Resource/Human Resource、Communications、Risk、Procurement、Stakeholder。这是管理维度，不是依次完成的十个阶段。<\/p><p>排程动作：识别活动 → 排 dependencies → 估 duration → 编 schedule → 检查维护。估算可用 expert judgement、analogous（相似经验）、parametric（单位率）、bottom-up（逐项汇总）与 three-point；取决于信息和精度，不存在永远最佳方法。<\/p>\n<aside>本路线依据现有 Week 1–5、7–10 living notes。Week 6 客座讲座没有实质材料；Week 11–13 无新授课。七类样卷不证明实际考试只有七题，也不建立时长、权重或开闭卷规则。<\/aside>", "qs": [{"q": "Which item is a constraint?", "opts": ["The supplier may be available", "The festival date is fixed", "Weather is expected to be fine", "Attendance is estimated"], "answer": 1, "explain": "Constraint 是必须遵守的硬边界，其他是待验证或估计的条件。"}, {"q": "What does a WBS primarily describe?", "opts": ["Reporting lines", "Activity sequence", "Decomposition of project scope", "Actual expenditure"], "answer": 2, "explain": "WBS 拆做什么；network 表示先后；OBS 表示组织。"}]}, {"title": "CPM：自己算出项目何时结束", "en": "Critical Path Method", "week": "2", "body": "\n<p class=\"lead\">两个前序都做完，后续才能开工；较慢那条支路决定等待多久。这就是 forward pass 取 max 的直觉。<\/p>\n<h2>1 · 六个参数<\/h2><p>Duration 是工期；ES/EF 是最早开始/结束，LS/LF 是不拖项目完工的最晚开始/结束；total float（——最多能推迟多久而不拖项目？）是两套时间的差。这里从 0 开始连续计时，工期 4 的活动从 0 到 4。<\/p>\n<p>普通 FS、无 lag 的网络：<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mtable columnalign=\"right left\"><mtr><mtd><mrow><mi>E<\/mi><msub><mi>S<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mtext>max<\/mtext><mo stretchy=\"false\">(<\/mo><mi>E<\/mi><msub><mi>F<\/mi><mtext>predecessors<\/mtext><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>E<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mi>E<\/mi><msub><mi>S<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><msub><mi>D<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>L<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mtext>min<\/mtext><mo stretchy=\"false\">(<\/mo><mi>L<\/mi><msub><mi>S<\/mi><mtext>successors<\/mtext><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>L<\/mi><msub><mi>S<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mi>L<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><mo>-<\/mo><msub><mi>D<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>T<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mi>L<\/mi><msub><mi>S<\/mi><mi>i<\/mi><\/msub><mo>-<\/mo><mi>E<\/mi><msub><mi>S<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mi>L<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><mo>-<\/mo><mi>E<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mtd><\/mtr><\/mtable><\/math>\n<p>Forward pass 从左往右取所有前序 EF 的最大值；backward pass 从终点往回取所有后序 LS 的最小值。多个终点可连到一个共同零工期终点；本例终点 LF 设为项目最早完工时间。<\/p>\n<h2>2 · 样卷完整走一遍<\/h2><p>A 工期 4；B 工期 3、前序 A；C 工期 2、前序 A；D 工期 4、前序 B；E 工期 3、前序 C 和 D。<\/p><pre>Start → A → B → D ─┐\n          └→ C ────┴→ E → Finish<\/pre>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><msub><mi>S<\/mi><mi>E<\/mi><\/msub><mo>=<\/mo><mtext>max<\/mtext><mo stretchy=\"false\">(<\/mo><mn>6<\/mn><mo>,<\/mo><mn>11<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>11<\/mn><mo>,<\/mo><mspace width=\"1em\"/><mi>E<\/mi><msub><mi>F<\/mi><mi>E<\/mi><\/msub><mo>=<\/mo><mn>11<\/mn><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>14<\/mn><\/mrow><\/math>\n<p>逆推 E 的 LF 14，LS 11；C 必须在 11 之前完成，所以 C 的 LS 是 9。<\/p>\n<table><tr><th>活动<\/th><th>D<\/th><th>前序<\/th><th>ES<\/th><th>EF<\/th><th>LS<\/th><th>LF<\/th><th>TF<\/th><\/tr><tr><td>A<\/td><td>4<\/td><td>—<\/td><td>0<\/td><td>4<\/td><td>0<\/td><td>4<\/td><td>0<\/td><\/tr><tr><td>B<\/td><td>3<\/td><td>A<\/td><td>4<\/td><td>7<\/td><td>4<\/td><td>7<\/td><td>0<\/td><\/tr><tr><td>C<\/td><td>2<\/td><td>A<\/td><td>4<\/td><td>6<\/td><td>9<\/td><td>11<\/td><td>5<\/td><\/tr><tr><td>D<\/td><td>4<\/td><td>B<\/td><td>7<\/td><td>11<\/td><td>7<\/td><td>11<\/td><td>0<\/td><\/tr><tr><td>E<\/td><td>3<\/td><td>C,D<\/td><td>11<\/td><td>14<\/td><td>11<\/td><td>14<\/td><td>0<\/td><\/tr><\/table>\n<p><b>Critical path（——为什么是最长而非最短？）为 A–B–D–E，工期 14 天。<\/b>它控制项目最早完成时间；本例这些活动 TF 为零。另一支 A–C–E 只有 9 天，因此 C 有 5 天 TF。可以存在多条 critical paths。<\/p>\n<h2>3 · Total float 与 free float<\/h2><p>Total float 不拖项目完工；free float 不拖紧后活动最早开始。在简单 FS 无 lag 网络中：<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>F<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mtext>min<\/mtext><mo stretchy=\"false\">(<\/mo><mi>E<\/mi><msub><mi>S<\/mi><mtext>successors<\/mtext><\/msub><mo stretchy=\"false\">)<\/mo><mo>-<\/mo><mi>E<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math>\n<p>本例 C 的两种 float 都为 5，但一般不一定相同。一条路径上的 float 可能共享，不能把每项 TF 当可独立累加的额外时间。<\/p><aside>答题顺序：画图 → 顺推 → 逆推 → float → 关键路径 → 工期。不要把并行活动全部串起来相加工期；这里的 max/min 不能原样套到所有重叠关系。<\/aside>", "qs": [{"q": "E has predecessor finishes 6 and 11, and duration 3. Its EF is:", "opts": ["9 days", "11 days", "14 days", "20 days"], "answer": 2, "explain": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>E<\/mi><msub><mi>S<\/mi><mi>E<\/mi><\/msub><mo>=<\/mo><mtext>max<\/mtext><mo stretchy=\"false\">(<\/mo><mn>6<\/mn><mo>,<\/mo><mn>11<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>11<\/mn><\/mrow><\/math>，再 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>E<\/mi><msub><mi>F<\/mi><mi>E<\/mi><\/msub><mo>=<\/mo><mn>11<\/mn><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>14<\/mn><\/mrow><\/math>。"}, {"q": "In the worked CPM network, total float of C is:", "opts": ["0 days", "2 days", "3 days", "5 days"], "answer": 3, "explain": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>T<\/mi><msub><mi>F<\/mi><mi>C<\/mi><\/msub><mo>=<\/mo><mn>9<\/mn><mo>-<\/mo><mn>4<\/mn><mo>=<\/mo><mn>5<\/mn><\/mrow><\/math> 天，不是它本身 2 天工期。"}]}, {"title": "重叠网络：箭头不一定是做完再做", "en": "FS / SS / FF / SF & lag", "week": "3", "body": "\n<p class=\"lead\">先看箭头管哪两个时点，再计算。FS 管前项结束到后项开始；SS 管两个开始；FF 管两个结束；SF 管前项开始到后项结束。<\/p><p>课件 FTS/STS/FTF/STF 对应 FS/SS/FF/SF。Lag（——和 float 有何不同？）是逻辑要求的等待；lead 是提前量，常用负 lag 表示；float 是整个网络算出的调度余量。<\/p>\n<h2>1 · 关系本质是约束<\/h2><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mtable columnalign=\"right left\"><mtr><mtd><mrow><mi>F<\/mi><mi>S<\/mi><mo>:<\/mo><mspace width=\"0.25em\"/><mi>E<\/mi><msub><mi>S<\/mi><mi>j<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>≥<\/mo><mi>E<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><mi>L<\/mi><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>S<\/mi><mi>S<\/mi><mo>:<\/mo><mspace width=\"0.25em\"/><mi>E<\/mi><msub><mi>S<\/mi><mi>j<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>≥<\/mo><mi>E<\/mi><msub><mi>S<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><mi>L<\/mi><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>F<\/mi><mi>F<\/mi><mo>:<\/mo><mspace width=\"0.25em\"/><mi>E<\/mi><msub><mi>F<\/mi><mi>j<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>≥<\/mo><mi>E<\/mi><msub><mi>F<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><mi>L<\/mi><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>S<\/mi><mi>F<\/mi><mo>:<\/mo><mspace width=\"0.25em\"/><mi>E<\/mi><msub><mi>F<\/mi><mi>j<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>≥<\/mo><mi>E<\/mi><msub><mi>S<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><mi>L<\/mi><\/mrow><\/mtd><\/mtr><\/mtable><\/math>\n<p>单一控制约束在最早排程中取等号。多个前序或 SS+FF 复合关系，先全部换成后项 ES 下界，再取最大。FF 先求后项 EF，再减后项工期，不能直接当 ES。<\/p>\n<h2>2 · 样卷计算表<\/h2><table><tr><th>活动<\/th><th>D<\/th><th>关系<\/th><th>ES<\/th><th>EF<\/th><th>LS<\/th><th>LF<\/th><th>TF<\/th><\/tr><tr><td>A<\/td><td>15<\/td><td>起点<\/td><td>0<\/td><td>15<\/td><td>0<\/td><td>15<\/td><td>0<\/td><\/tr><tr><td>B<\/td><td>5<\/td><td>A FF+3<\/td><td>13<\/td><td>18<\/td><td>13<\/td><td>18<\/td><td>0<\/td><\/tr><tr><td>C<\/td><td>2<\/td><td>A SS+10<\/td><td>10<\/td><td>12<\/td><td>21<\/td><td>23<\/td><td>11<\/td><\/tr><tr><td>D<\/td><td>8<\/td><td>B FS+2<\/td><td>20<\/td><td>28<\/td><td>20<\/td><td>28<\/td><td>0<\/td><\/tr><tr><td>E<\/td><td>5<\/td><td>C FS+0<\/td><td>12<\/td><td>17<\/td><td>23<\/td><td>28<\/td><td>11<\/td><\/tr><tr><td>F<\/td><td>10<\/td><td>D,E FS+0<\/td><td>28<\/td><td>38<\/td><td>28<\/td><td>38<\/td><td>0<\/td><\/tr><\/table>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mtable columnalign=\"right left\"><mtr><mtd><mrow><mi>E<\/mi><msub><mi>F<\/mi><mi>B<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mn>15<\/mn><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>18<\/mn><mo>,<\/mo><mspace width=\"1em\"/><mi>E<\/mi><msub><mi>S<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>18<\/mn><mo>-<\/mo><mn>5<\/mn><mo>=<\/mo><mn>13<\/mn><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>E<\/mi><msub><mi>S<\/mi><mi>C<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mn>0<\/mn><mo>+<\/mo><mn>10<\/mn><mo>=<\/mo><mn>10<\/mn><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>E<\/mi><msub><mi>S<\/mi><mi>D<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mn>18<\/mn><mo>+<\/mo><mn>2<\/mn><mo>=<\/mo><mn>20<\/mn><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>E<\/mi><msub><mi>S<\/mi><mi>F<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mtext>max<\/mtext><mo stretchy=\"false\">(<\/mo><mn>28<\/mn><mo>,<\/mo><mn>17<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>28<\/mn><mo>,<\/mo><mspace width=\"1em\"/><mi>E<\/mi><msub><mi>F<\/mi><mi>F<\/mi><\/msub><mo>=<\/mo><mn>38<\/mn><\/mrow><\/mtd><\/mtr><\/mtable><\/math>\n<h2>3 · 逆推也反用原来的关系<\/h2><p>F 的 LF 38、LS 28；D 的 LF 28、LS 20。B 须在 D 开始前 2 天结束：<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>L<\/mi><msub><mi>F<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mi>L<\/mi><msub><mi>S<\/mi><mi>D<\/mi><\/msub><mo>-<\/mo><mn>2<\/mn><mo>=<\/mo><mn>18<\/mn><mo>,<\/mo><mspace width=\"1em\"/><mi>L<\/mi><msub><mi>S<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>13<\/mn><\/mrow><\/math>\n<p>A 经 B 的 FF 得 LF 上限 15；经 C 的 SS 得 LS 上限 11，即 LF 上限 26。取更紧的 LF 15，A 的 LS 为 0。<\/p><p><b>控制链 A–B–D–F，完工 38 天。<\/b>不能把链上工期直接相加；要保留带 lag 的实际控制时点。E 只写 C 的样卷关系按 FS+0 处理，答卷注明假设。<\/p>", "qs": [{"q": "A finishes at 15. B lasts 5 days with A FF+3. B starts at:", "opts": ["13", "15", "18", "23"], "answer": 0, "explain": "先 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>E<\/mi><msub><mi>F<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>15<\/mn><mo>+<\/mo><mn>3<\/mn><mo>=<\/mo><mn>18<\/mn><\/mrow><\/math>，再 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>E<\/mi><msub><mi>S<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>18<\/mn><mo>-<\/mo><mn>5<\/mn><mo>=<\/mo><mn>13<\/mn><\/mrow><\/math>。"}, {"q": "Which statement is correct?", "opts": ["Lag equals float", "FF prevents any overlap", "SS constrains starts", "All links use predecessor EF for successor ES"], "answer": 2, "explain": "SS 是 start-to-start。Lag 是依赖要求，float 是计算出的网络余量。"}]}, {"title": "PERT：三个估计怎样变成概率", "en": "Three-point estimates & uncertainty", "week": "4", "body": "\n<p class=\"lead\">a 是 optimistic，m 是 most likely，b 是 pessimistic。先算每项平均和波动，再用平均工期找 critical path，最后算项目概率。<\/p>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>T<\/mi><msub><mi>E<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>a<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><mn>4<\/mn><msub><mi>m<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><msub><mi>b<\/mi><mi>i<\/mi><\/msub><\/mrow><mn>6<\/mn><\/mfrac><mo>,<\/mo><mspace width=\"1em\"/><msub><mi>σ<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>b<\/mi><mi>i<\/mi><\/msub><mo>-<\/mo><msub><mi>a<\/mi><mi>i<\/mi><\/msub><\/mrow><mn>6<\/mn><\/mfrac><mo>,<\/mo><mspace width=\"1em\"/><msubsup><mi>σ<\/mi><mi>i<\/mi><mn>2<\/mn><\/msubsup><mo>=<\/mo><mfrac><mrow><mo stretchy=\"false\">(<\/mo><msub><mi>b<\/mi><mi>i<\/mi><\/msub><mo>-<\/mo><msub><mi>a<\/mi><mi>i<\/mi><\/msub><msup><mo stretchy=\"false\">)<\/mo><mn>2<\/mn><\/msup><\/mrow><mn>36<\/mn><\/mfrac><\/mrow><\/math>\n<p>Project standard deviation（——为什么不直接相加标准差？）在传统独立活动、固定关键路径、正态近似的简化 PERT 下：<\/p>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>T<\/mi><mi>E<\/mi><mo>=<\/mo><munder><mo largeop=\"true\" stretchy=\"false\">∑<\/mo><mrow><mi>i<\/mi><mo>∈<\/mo><mi>C<\/mi><mi>P<\/mi><\/mrow><\/munder><mi>T<\/mi><msub><mi>E<\/mi><mi>i<\/mi><\/msub><mo>,<\/mo><mspace width=\"1em\"/><mi>S<\/mi><mo>=<\/mo><msqrt><mrow><munder><mo largeop=\"true\" stretchy=\"false\">∑<\/mo><mrow><mi>i<\/mi><mo>∈<\/mo><mi>C<\/mi><mi>P<\/mi><\/mrow><\/munder><msubsup><mi>σ<\/mi><mi>i<\/mi><mn>2<\/mn><\/msubsup><\/mrow><\/msqrt><mo>,<\/mo><mspace width=\"1em\"/><mi>z<\/mi><mo>=<\/mo><mfrac><mrow><msub><mi>T<\/mi><mrow><mi>t<\/mi><mi>a<\/mi><mi>r<\/mi><mi>g<\/mi><mi>e<\/mi><mi>t<\/mi><\/mrow><\/msub><mo>-<\/mo><mi>T<\/mi><mi>E<\/mi><\/mrow><mi>S<\/mi><\/mfrac><\/mrow><\/math>\n<p>先加方差再开方。仅汇总所选 critical path；不能把并行支路全加。查标准正态左侧累计表，得到目标日期或之前完成概率。目标晚于平均，z 应为正，概率应超过一半。<\/p>\n<h2>1 · 样卷标准公式计算<\/h2><table><tr><th>活动<\/th><th>前序<\/th><th>a<\/th><th>m<\/th><th>b<\/th><th>TE<\/th><th>σ²<\/th><\/tr><tr><td>A<\/td><td>—<\/td><td>3<\/td><td>5<\/td><td>9<\/td><td>5.3333…<\/td><td>1<\/td><\/tr><tr><td>B<\/td><td>A<\/td><td>4<\/td><td>6<\/td><td>10<\/td><td>6.3333…<\/td><td>1<\/td><\/tr><tr><td>C<\/td><td>A<\/td><td>2<\/td><td>4<\/td><td>8<\/td><td>4.3333…<\/td><td>1<\/td><\/tr><\/table>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mtable columnalign=\"right left\"><mtr><mtd><mrow><mi>T<\/mi><msub><mi>E<\/mi><mi>A<\/mi><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mo>+<\/mo><mn>4<\/mn><mo>×<\/mo><mn>5<\/mn><mo>+<\/mo><mn>9<\/mn><\/mrow><mn>6<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>32<\/mn><mn>6<\/mn><\/mfrac><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>T<\/mi><msub><mi>E<\/mi><mrow><mi>A<\/mi><mo>-<\/mo><mi>B<\/mi><\/mrow><\/msub><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mfrac><mn>35<\/mn><mn>3<\/mn><\/mfrac><mo>=<\/mo><mn>11.6667<\/mn><mo>…<\/mo><mo>&gt;<\/mo><mi>T<\/mi><msub><mi>E<\/mi><mrow><mi>A<\/mi><mo>-<\/mo><mi>C<\/mi><\/mrow><\/msub><mo>=<\/mo><mn>9.6667<\/mn><mo>…<\/mo><\/mrow><\/mtd><\/mtr><mtr><mtd><mi>S<\/mi><\/mtd><mtd><mrow><mo>=<\/mo><msqrt><mrow><mn>1<\/mn><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msqrt><mo>=<\/mo><msqrt><mn>2<\/mn><\/msqrt><\/mrow><\/mtd><\/mtr><mtr><mtd><mi>z<\/mi><\/mtd><mtd><mrow><mo>=<\/mo><mfrac><mrow><mn>14<\/mn><mo>-<\/mo><mn>35<\/mn><mo>/<\/mo><mn>3<\/mn><\/mrow><msqrt><mn>2<\/mn><\/msqrt><\/mfrac><mo>≈<\/mo><mn>1.65<\/mn><\/mrow><\/mtd><\/mtr><\/mtable><\/math>\n<p>标准公式口径：关键路径 A–B，目标 14 天，z 取 1.65 查表约 <b>95.05%<\/b>，不是交付保证。<\/p>\n<aside><b>样卷解答口径差异：<\/b>其单项 TE 取整为 5、6、4，项目 TE 为 11；S 先取 1.41，z 得 2.13，查表为 98.34%。不能把它与标准未取整结果混用。考试按指定取整；若没指定，写清口径并提前问老师。<\/aside>\n<h2>2 · 反求有 99% 把握的日期<\/h2><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>T<\/mi><mrow><mn>99<\/mn><mo>%<\/mo><\/mrow><\/msub><mo>=<\/mo><mi>T<\/mi><mi>E<\/mi><mo>+<\/mo><mn>2.33<\/mn><mi>S<\/mi><\/mrow><\/math>\n<p>标准未取整 TE、S 得约 14.96 天。2.33 是常用正态表值。多条接近的关键路径、路径切换与活动相关性都会影响单路径近似；PERT 不能消灭风险。<\/p>", "qs": [{"q": "Using the standard formula, TE for (3,5,9) is:", "opts": ["5.00", "5.33", "5.67", "6.00"], "answer": 1, "explain": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>T<\/mi><mi>E<\/mi><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mo>+<\/mo><mn>4<\/mn><mo>×<\/mo><mn>5<\/mn><mo>+<\/mo><mn>9<\/mn><\/mrow><mn>6<\/mn><\/mfrac><mo>=<\/mo><mfrac><mn>32<\/mn><mn>6<\/mn><\/mfrac><mo>≈<\/mo><mn>5.33<\/mn><\/mrow><\/math>，本题明确不采用样卷整数化。"}, {"q": "Two independent critical activities each have variance 1. Project standard deviation is:", "opts": ["1", "2", "About 1.41", "4"], "answer": 2, "explain": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>S<\/mi><mo>=<\/mo><msqrt><mrow><mn>1<\/mn><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msqrt><mo>=<\/mo><msqrt><mn>2<\/mn><\/msqrt><mo>≈<\/mo><mn>1.41<\/mn><\/mrow><\/math>，先加方差再开方。"}]}, {"title": "资源估算：人时不等于天数", "en": "Work, productivity & duration", "week": "5", "body": "\n<p class=\"lead\">10 人各做 1 小时，是 10 person-hours，但只过去 1 小时。Work 是工作量，duration 是经过多久，units 是投入人数或资源比例。<\/p>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>W<\/mi><mi>o<\/mi><mi>r<\/mi><mi>k<\/mi><mo>=<\/mo><mi>D<\/mi><mi>u<\/mi><mi>r<\/mi><mi>a<\/mi><mi>t<\/mi><mi>i<\/mi><mi>o<\/mi><mi>n<\/mi><mo>×<\/mo><mi>U<\/mi><mi>n<\/mi><mi>i<\/mi><mi>t<\/mi><mi>s<\/mi><mo>,<\/mo><mspace width=\"1em\"/><mi>D<\/mi><mi>u<\/mi><mi>r<\/mi><mi>a<\/mi><mi>t<\/mi><mi>i<\/mi><mi>o<\/mi><mi>n<\/mi><mo>=<\/mo><mfrac><mrow><mi>W<\/mi><mi>o<\/mi><mi>r<\/mi><mi>k<\/mi><\/mrow><mrow><mi>U<\/mi><mi>n<\/mi><mi>i<\/mi><mi>t<\/mi><mi>s<\/mi><\/mrow><\/mfrac><\/mrow><\/math>\n<p>人时除人数得小时，再除每天工作小时才得工作日。简式假设工作可按人数分配，不代表任何任务加人都能线性加速。<\/p>\n<h2>1 · 效率因子的方向要看单位<\/h2><p>给的是生产率（每人时产出）时乘效率；给的是单位工作量（每件需人时）时除效率。<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>p<\/mi><mrow><mi>e<\/mi><mi>f<\/mi><mi>f<\/mi><mi>e<\/mi><mi>c<\/mi><mi>t<\/mi><mi>i<\/mi><mi>v<\/mi><mi>e<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>p<\/mi><mrow><mi>s<\/mi><mi>t<\/mi><mi>a<\/mi><mi>n<\/mi><mi>d<\/mi><mi>a<\/mi><mi>r<\/mi><mi>d<\/mi><\/mrow><\/msub><mo>×<\/mo><mi>e<\/mi><mo>,<\/mo><mspace width=\"1em\"/><msub><mi>w<\/mi><mrow><mi>a<\/mi><mi>d<\/mi><mi>j<\/mi><mi>u<\/mi><mi>s<\/mi><mi>t<\/mi><mi>e<\/mi><mi>d<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><msub><mi>w<\/mi><mrow><mi>s<\/mi><mi>t<\/mi><mi>a<\/mi><mi>n<\/mi><mi>d<\/mi><mi>a<\/mi><mi>r<\/mi><mi>d<\/mi><\/mrow><\/msub><mi>e<\/mi><\/mfrac><\/mrow><\/math>\n<p>课件参数估算：每台 40 person-hours、效率 0.8，调整为 50；25 台合计 1,250 person-hours；5 人需 250 小时，8 小时工作日下为 31.25 天。<\/p>\n<h2>2 · 样卷分段人员题<\/h2><table><tr><th>输入<\/th><th>数值<\/th><\/tr><tr><td>焊缝/返工<\/td><td>150 m / 5%<\/td><\/tr><tr><td>标准生产率/效率<\/td><td>2.5 m 每人时 / 0.85<\/td><\/tr><tr><td>人员<\/td><td>前 4 天 2 人，第 5 天起 3 人<\/td><\/tr><tr><td>工作日/费率<\/td><td>8 小时 / AUD 80 每人时<\/td><\/tr><\/table>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mtable columnalign=\"right left\"><mtr><mtd><mi>Q<\/mi><\/mtd><mtd><mrow><mo>=<\/mo><mn>150<\/mn><mo>×<\/mo><mn>1.05<\/mn><mo>=<\/mo><mn>157.5<\/mn><mspace width=\"0.25em\"/><mtext>m<\/mtext><\/mrow><\/mtd><\/mtr><mtr><mtd><mi>p<\/mi><\/mtd><mtd><mrow><mo>=<\/mo><mn>2.5<\/mn><mo>×<\/mo><mn>0.85<\/mn><mo>=<\/mo><mn>2.125<\/mn><mspace width=\"0.25em\"/><mtext>m/person-hour<\/mtext><\/mrow><\/mtd><\/mtr><mtr><mtd><mi>W<\/mi><\/mtd><mtd><mrow><mo>=<\/mo><mfrac><mn>157.5<\/mn><mn>2.125<\/mn><\/mfrac><mo>=<\/mo><mn>74.117647<\/mn><mo>…<\/mo><mspace width=\"0.25em\"/><mtext>person-hours<\/mtext><\/mrow><\/mtd><\/mtr><mtr><mtd><msub><mi>W<\/mi><mrow><mn>1<\/mn><mo>-<\/mo><mn>4<\/mn><\/mrow><\/msub><\/mtd><mtd><mrow><mo>=<\/mo><mn>2<\/mn><mo>×<\/mo><mn>8<\/mn><mo>×<\/mo><mn>4<\/mn><mo>=<\/mo><mn>64<\/mn><mspace width=\"0.25em\"/><mtext>person-hours<\/mtext><\/mrow><\/mtd><\/mtr><mtr><mtd><mi>D<\/mi><\/mtd><mtd><mrow><mo>=<\/mo><mn>4<\/mn><mo>+<\/mo><mfrac><mrow><mn>74.117647<\/mn><mo>…<\/mo><mo>-<\/mo><mn>64<\/mn><\/mrow><mrow><mn>3<\/mn><mo>×<\/mo><mn>8<\/mn><\/mrow><\/mfrac><mo>≈<\/mo><mn>4.42<\/mn><mspace width=\"0.25em\"/><mtext>days<\/mtext><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>C<\/mi><mi>o<\/mi><mi>s<\/mi><mi>t<\/mi><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mn>74.117647<\/mn><mo>…<\/mo><mo>×<\/mo><mn>80<\/mn><mo>≈<\/mo><mn>5929.41<\/mn><\/mrow><\/mtd><\/mtr><\/mtable><\/math>\n<p>第 5 个工作日内结束；若问占用多少整工作日，应说明需要 5 天。按实际使用人时付费为 AUD 5,929.41，若整日最低收费另有条款，须按条款重算。<\/p><aside>校验：效率低应该更慢，返工多应该工作更多；人员变化只作用于相应时间段。不要先取整人时再乘费率。<\/aside>", "qs": [{"q": "Standard productivity is 2.5 m/hour at efficiency 0.85. Effective productivity is:", "opts": ["2.94 m/hour", "2.125 m/hour", "3.35 m/hour", "0.34 m/hour"], "answer": 1, "explain": "生产率乘效率：<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>2.5<\/mn><mo>×<\/mo><mn>0.85<\/mn><mo>=<\/mo><mn>2.125<\/mn><\/mrow><\/math>。"}, {"q": "Why not divide all welding work by three workers for the whole task?", "opts": ["Work equals duration", "Workers are always paid daily", "Only two workers are present in Days 1–4", "Efficiency exceeds one"], "answer": 2, "explain": "前四天只能贡献 64 person-hours，再把剩余工作分给三人。"}]}, {"title": "资源安排：让时间表实际可执行", "en": "Loading, smoothing, levelling & RACI", "week": "5", "body": "\n<p class=\"lead\">两项活动逻辑上能并行，但都需要同一个人或同一台设备，就可能根本做不到。逐日 demand 要和 availability 对照。<\/p>\n<h2>1 · 从资源需求到配置<\/h2><p>资源含人、技术/设备、材料与资金。材料通常 consumed，人和设备 applied。步骤：识别资源 → 何时需要并安排 → 如何获得（Make / Team / Buy）。<\/p><p>Resource loading 为活动分配 units/rates，按天加总，resource histogram 展示峰谷；超过 day-by-day availability 或 resource calendar 的容量就是 overallocation。<\/p>\n<h2>2 · 两种优化<\/h2><table><tr><th>方法<\/th><th>优先约束<\/th><th>动作<\/th><\/tr><tr><td>Resource smoothing（——可随意拖工期吗？）<\/td><td>保持所需时间安排<\/td><td>利用非关键活动 float 削峰填谷，维护逻辑<\/td><\/tr><tr><td>Resource levelling<\/td><td>资源限制<\/td><td>延后、拆分、调配或获取资源；必要时改变工期<\/td><\/tr><\/table><p>阅读中的 unlimited levelling 试图维持 CPM 工期并降低投入；limited levelling 固定资源量并尽量缩短工期，可能延长原工期。不要说所有 levelling 都必然延长。<\/p>\n<h2>3 · RUF 的课件计算<\/h2><p>总工作量 64 resource-days，项目可用窗口 11 天，峰值从 11 人降为 7 人：<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>R<\/mi><mi>U<\/mi><msub><mi>F<\/mi><mrow><mi>b<\/mi><mi>e<\/mi><mi>f<\/mi><mi>o<\/mi><mi>r<\/mi><mi>e<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mn>64<\/mn><mrow><mn>11<\/mn><mo>×<\/mo><mn>11<\/mn><\/mrow><\/mfrac><mo>×<\/mo><mn>100<\/mn><mo>%<\/mo><mo>≈<\/mo><mn>52.9<\/mn><mo>%<\/mo><mo>,<\/mo><mspace width=\"1em\"/><mi>R<\/mi><mi>U<\/mi><msub><mi>F<\/mi><mrow><mi>a<\/mi><mi>f<\/mi><mi>t<\/mi><mi>e<\/mi><mi>r<\/mi><\/mrow><\/msub><mo>=<\/mo><mfrac><mn>64<\/mn><mrow><mn>7<\/mn><mo>×<\/mo><mn>11<\/mn><\/mrow><\/mfrac><mo>×<\/mo><mn>100<\/mn><mo>%<\/mo><mo>≈<\/mo><mn>83.1<\/mn><mo>%<\/mo><\/mrow><\/math>\n<p>阅读的标签排版有歧义，这里按 worked equations；分母为峰值人数乘 11 天窗口。RUF 高不证明所有冲突都解决，也不自动证明质量更好。<\/p>\n<h2>4 · 谁执行，谁拍板<\/h2><p>HR planning 包括角色/职责、技能、培训、报告线、人员日历、获取/退出、绩效、冲突与升级。OBS 显示组织关系；RAM 把 WBS 与 OBS 交叉；RACI 是 RAM 形式。<\/p><dl><dt>R — Responsible<\/dt><dd>实际干活，至少一个，可有多个。<\/dd><dt>A — Accountable（——和 R 怎么区分？）<\/dt><dd>最终审批/负责，通常每项一个。<\/dd><dt>C — Consulted / Contributor；I — Informed<\/dt><dd>C 提供意见与贡献；I 被告知。不要给所有人都填 A。<\/dd><\/dl>", "qs": [{"q": "Which technique mainly reduces peaks within float while respecting the required finish date?", "opts": ["Resource smoothing", "All levelling must extend duration", "Scope creep", "Cost-plus contracting"], "answer": 0, "explain": "Smoothing 优先保留时间约束；levelling 优先解决资源限制。"}, {"q": "Which RACI role normally has a single final sign-off owner?", "opts": ["Responsible", "Accountable", "Consulted", "Informed"], "answer": 1, "explain": "A 最终审批/负责，R 实际执行；通常每项一个 A。"}]}, {"title": "成本：estimate、baseline、budget 分清", "en": "Cost estimates, overheads & reserves", "week": "7", "body": "\n<p class=\"lead\">Estimate 预计花多少；time-phased baseline 规定何时计划形成多少成本；cash flow 规定何时收付款和余额够不够。<\/p><h2>1 · 四个成本管理动作<\/h2><p>Plan Cost Management 定方法；Estimate Costs 估各项资源/活动；Determine Budget 汇总与批准基线；Control Costs 监控和处理授权变更。信息变多要更新估计，但不能回改历史基线隐藏偏差。<\/p><p>Direct cost 可归到具体工作；indirect/overhead 是共享费用。Labour rate 若已加载 overhead 不能再加。Analogous 快但依赖可比性；parametric 依赖单位率；bottom-up 逐项汇总较细但耗时。<\/p>\n<h2>2 · Riverside 层级<\/h2><table><tr><th>层级<\/th><th>AUD<\/th><th>含义<\/th><\/tr><tr><td>Activity estimates<\/td><td>540,000<\/td><td>已定义工作<\/td><\/tr><tr><td>Project contingency<\/td><td>40,000<\/td><td>known unknowns<\/td><\/tr><tr><td>Cost baseline<\/td><td>580,000<\/td><td>工作包加 contingency<\/td><\/tr><tr><td>Management reserve<\/td><td>20,000<\/td><td>unknown unknowns<\/td><\/tr><tr><td>Total budget<\/td><td>600,000<\/td><td>授权资金上限<\/td><\/tr><\/table>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>B<\/mi><mi>a<\/mi><mi>s<\/mi><mi>e<\/mi><mi>l<\/mi><mi>i<\/mi><mi>n<\/mi><mi>e<\/mi><mo>=<\/mo><mn>540000<\/mn><mo>+<\/mo><mn>40000<\/mn><mo>=<\/mo><mn>580000<\/mn><mo>,<\/mo><mspace width=\"1em\"/><mi>B<\/mi><mi>u<\/mi><mi>d<\/mi><mi>g<\/mi><mi>e<\/mi><mi>t<\/mi><mo>=<\/mo><mn>580000<\/mn><mo>+<\/mo><mn>20000<\/mn><mo>=<\/mo><mn>600000<\/mn><\/mrow><\/math>\n<p>Contingency（——能直接拿来免费加范围吗？）处理不确定性，不是新增范围的零用钱；management reserve 由 sponsor 控制，使用须授权。Profit/margin 是报价维度，不等于 reserve。<\/p>\n<aside>来源差异必须保留：Week 7 p16 的 “above baseline” 与 p12/18 冲突，本页采用可核对的 540k → 580k → 600k。p9 把分摊 overhead 放入工作包和基线，p10 的单列间接费放预算内、基线外。新题声明 allocation policy 与费率是否已加载，避免重复计费。Week 10 的 activity EVM BAC 用 540k。<\/aside>\n<h2>3 · 估算区间不是概率<\/h2><table><tr><th>阶段<\/th><th>低侧误差<\/th><th>高侧误差<\/th><\/tr><tr><td>ROM<\/td><td>−25%<\/td><td>+75%<\/td><\/tr><tr><td>Preliminary/analogous<\/td><td>−15%<\/td><td>+50%<\/td><\/tr><tr><td>Budgetary<\/td><td>−10%<\/td><td>+25%<\/td><\/tr><tr><td>Definitive<\/td><td>−5%<\/td><td>+10%<\/td><\/tr><\/table><p>Final 范围未指定。上表不是 confidence level，也不是保证。Funding limit reconciliation 要逐期比较支出与供资能力，不能只看总额。<\/p>", "qs": [{"q": "What is the Riverside cost baseline under Week 7 p12/18?", "opts": ["540,000", "560,000", "580,000", "600,000"], "answer": 2, "explain": "工作包 540k 加 contingency 40k 得 580k；再加 reserve 20k 是总预算。"}, {"q": "Overhead is already loaded into internal labour rates. What should you do?", "opts": ["Add it again", "Avoid double-counting it", "Remove labour from baseline", "Treat spending as physical progress"], "answer": 1, "explain": "同一费用只计一次；基线内外按题目具体分配政策。"}]}, {"title": "时间分段预算：钱放进正确的月", "en": "Time-phased budget", "week": "7", "body": "\n<p class=\"lead\">总额只告诉你一共花多少；time-phased budget 才告诉你某时点计划形成多少工作成本。<\/p><p>样卷规则：劳务按工作日均匀分摊；goods 整笔记入 receipt month。真实题目如另有成本发生方式，要按题意。<\/p>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>B<\/mi><mi>u<\/mi><mi>d<\/mi><mi>g<\/mi><mi>e<\/mi><msub><mi>t<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>m<\/mi><\/mrow><\/msub><mo>=<\/mo><mi>B<\/mi><mi>u<\/mi><mi>d<\/mi><mi>g<\/mi><mi>e<\/mi><msub><mi>t<\/mi><mi>i<\/mi><\/msub><mo>×<\/mo><mfrac><mrow><mi>D<\/mi><mi>a<\/mi><mi>y<\/mi><msub><mi>s<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>m<\/mi><\/mrow><\/msub><\/mrow><mrow><mi>T<\/mi><mi>o<\/mi><mi>t<\/mi><mi>a<\/mi><mi>l<\/mi><mspace width=\"0.25em\"/><mi>d<\/mi><mi>a<\/mi><mi>y<\/mi><msub><mi>s<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mfrac><mo>,<\/mo><mspace width=\"1em\"/><mi>C<\/mi><mi>u<\/mi><mi>m<\/mi><mi>u<\/mi><mi>l<\/mi><mi>a<\/mi><mi>t<\/mi><mi>i<\/mi><mi>v<\/mi><msub><mi>e<\/mi><mi>m<\/mi><\/msub><mo>=<\/mo><mi>C<\/mi><mi>u<\/mi><mi>m<\/mi><mi>u<\/mi><mi>l<\/mi><mi>a<\/mi><mi>t<\/mi><mi>i<\/mi><mi>v<\/mi><msub><mi>e<\/mi><mrow><mi>m<\/mi><mo>-<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>+<\/mo><mi>P<\/mi><mi>e<\/mi><mi>r<\/mi><mi>i<\/mi><mi>o<\/mi><msub><mi>d<\/mi><mi>m<\/mi><\/msub><\/mrow><\/math>\n<h2>样卷：先数日，再分摊，再累计<\/h2><p>每月 30 个工作日，日期区间含首尾。B 从 M1 D11 到 M2 D10，分成 20+10 天；D 从 M2 D25 到 M3 D14，分成 6+14 天。<\/p><table><tr><th>任务<\/th><th>输入/时点<\/th><th>M1<\/th><th>M2<\/th><th>M3<\/th><\/tr><tr><td>A labour<\/td><td>24,000；M1 D1–24<\/td><td>24,000<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>B labour<\/td><td>48,000；20+10 天<\/td><td>32,000<\/td><td>16,000<\/td><td>0<\/td><\/tr><tr><td>C goods<\/td><td>30,000；M2 D20 收货<\/td><td>0<\/td><td>30,000<\/td><td>0<\/td><\/tr><tr><td>D labour<\/td><td>20,000；6+14 天<\/td><td>0<\/td><td>6,000<\/td><td>14,000<\/td><\/tr><tr><td>E labour<\/td><td>6,000；M3 D10–19<\/td><td>0<\/td><td>0<\/td><td>6,000<\/td><\/tr><tr><th>当月<\/th><td><\/td><th>56,000<\/th><th>52,000<\/th><th>20,000<\/th><\/tr><tr><th>累计<\/th><td><\/td><th>56,000<\/th><th>108,000<\/th><th>128,000<\/th><\/tr><\/table>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>B<\/mi><mrow><mi>M<\/mi><mn>1<\/mn><\/mrow><\/msub><mo>=<\/mo><mn>48000<\/mn><mo>×<\/mo><mfrac><mn>20<\/mn><mn>30<\/mn><\/mfrac><mo>=<\/mo><mn>32000<\/mn><mo>,<\/mo><mspace width=\"1em\"/><msub><mi>D<\/mi><mrow><mi>M<\/mi><mn>2<\/mn><\/mrow><\/msub><mo>=<\/mo><mn>20000<\/mn><mo>×<\/mo><mfrac><mn>6<\/mn><mn>20<\/mn><\/mfrac><mo>=<\/mo><mn>6000<\/mn><\/mrow><\/math>\n<p>问 cumulative 要交累计列。最终累计应等于总预算 AUD 128,000；逐期取整如有尾差按规定调整，不能破坏总额。<\/p><aside>Receipt 不等于 payment：收货月记成本，付款月由条款决定。不要把 goods 按其等待工期分摊。<\/aside>", "qs": [{"q": "Labour budget 48,000 covers 30 days; 20 days occur in Month 1. Month 1 allocation is:", "opts": ["16,000", "24,000", "32,000", "48,000"], "answer": 2, "explain": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>48000<\/mn><mo>×<\/mo><mfrac><mn>20<\/mn><mn>30<\/mn><\/mfrac><mo>=<\/mo><mn>32000<\/mn><\/mrow><\/math>。"}, {"q": "Month 1 cost is 56,000 and Month 2 cost is 52,000. Cumulative Month 2 cost is:", "opts": ["52,000", "56,000", "108,000", "128,000"], "answer": 2, "explain": "累计 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>56000<\/mn><mo>+<\/mo><mn>52000<\/mn><mo>=<\/mo><mn>108000<\/mn><\/mrow><\/math>，不是仅写当月成本。"}]}, {"title": "现金流：预算够也可能付不出账", "en": "Cash flow & funding gaps", "week": "7", "body": "\n<p class=\"lead\">Cash flow 问账户现在能付多少钱。预算是授权/计划，不等于自动到账的资金。<\/p>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>C<\/mi><mi>l<\/mi><mi>o<\/mi><mi>s<\/mi><mi>i<\/mi><mi>n<\/mi><msub><mi>g<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><mi>O<\/mi><mi>p<\/mi><mi>e<\/mi><mi>n<\/mi><mi>i<\/mi><mi>n<\/mi><msub><mi>g<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mi>R<\/mi><mi>e<\/mi><mi>c<\/mi><mi>e<\/mi><mi>i<\/mi><mi>p<\/mi><mi>t<\/mi><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo>-<\/mo><mi>P<\/mi><mi>a<\/mi><mi>y<\/mi><mi>m<\/mi><mi>e<\/mi><mi>n<\/mi><mi>t<\/mi><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo>,<\/mo><mspace width=\"1em\"/><mi>O<\/mi><mi>p<\/mi><mi>e<\/mi><mi>n<\/mi><mi>i<\/mi><mi>n<\/mi><msub><mi>g<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msub><mo>=<\/mo><mi>C<\/mi><mi>l<\/mi><mi>o<\/mi><mi>s<\/mi><mi>i<\/mi><mi>n<\/mi><msub><mi>g<\/mi><mi>t<\/mi><\/msub><\/mrow><\/math>\n<h2>1 · 样卷滚动表<\/h2><p>题目说预算 AUD 60,000，但没说已到账。初始现金本题按 0；若另有 opening balance，就用给定数。<\/p><table><tr><th>月<\/th><th>期初<\/th><th>流入<\/th><th>流出<\/th><th>期末<\/th><\/tr><tr><td>M1<\/td><td>0<\/td><td>20,000<\/td><td>15,000<\/td><td>5,000<\/td><\/tr><tr><td>M2<\/td><td>5,000<\/td><td>10,000<\/td><td>25,000<\/td><td>−10,000<\/td><\/tr><tr><td>M3<\/td><td>−10,000<\/td><td>5,000<\/td><td>10,000<\/td><td>−15,000<\/td><\/tr><\/table>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>C<\/mi><mi>l<\/mi><mi>o<\/mi><mi>s<\/mi><mi>i<\/mi><mi>n<\/mi><msub><mi>g<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mn>5000<\/mn><mo>+<\/mo><mn>10000<\/mn><mo>-<\/mo><mn>25000<\/mn><mo>=<\/mo><mo>-<\/mo><mn>10000<\/mn><\/mrow><\/math>\n<p>M2 开始 funding gap；M3 累计缺口 15,000。不能每月忘记结转，更不能拿总预算当现金。<\/p>\n<h2>2 · Riverside 提款安排<\/h2><p>Week 7 A–D 练习：初始 120k，可另提最多 80k，每周末最低余额 85k。课件 W4 提 24k、W7 提 49k，总提 73k。最终累计流入 193k，流出 108k，剩 85k，另有 7k 未提款。<\/p><p>Venue 成本 W6 确认、45k 在 W7 付款，预算表和 cash 表跨期不同。没有提款次数限制时，“尽晚提款”不能唯一推导课件两次方案；周末够钱也不证明周中每笔都付得出。<\/p><aside>负值提示要提前融资、协调到账或合同付款条款，不能把负号擦掉，也不能为了报表好看任意拖欠供应商。<\/aside>", "qs": [{"q": "Opening cash 5,000; receipts 10,000; payments 25,000. Closing cash is:", "opts": ["30,000", "−10,000", "−15,000", "10,000"], "answer": 1, "explain": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mn>5000<\/mn><mo>+<\/mo><mn>10000<\/mn><mo>-<\/mo><mn>25000<\/mn><mo>=<\/mo><mo>-<\/mo><mn>10000<\/mn><\/mrow><\/math>，资金缺口。"}, {"q": "Goods received in Week 6 are paid in Week 7. Which statement is best?", "opts": ["Both must be in Week 6", "Recognised cost and cash payment can be in different weeks", "No cost exists in Week 6", "Budget is automatically a receipt"], "answer": 1, "explain": "成本形成与付款时点可不同；依收货/成本政策与付款条款。"}]}, {"title": "MS Project：软件算，不替你判断", "en": "Practical workflow & baseline", "week": "8", "body": "\n<p class=\"lead\">先输入正确范围、依赖与日历，再让软件算。红色 critical bars 不能救错误输入。<\/p>\n<h2>操作顺序<\/h2><ol><li>模板另存，输入任务，显示 ID 和 WBS，缩进建立层级。<\/li><li>按 project calendar 转换周与工作日，输入 duration 与 predecessor，不能默认一周七个工作日。<\/li><li>Gantt Chart Format → Critical Tasks；检查关键路径与逻辑。<\/li><li>Resource Sheet 输入 Work resources、Max Units、standard rate，再给任务分配。<\/li><li>Information indicator 与 Resource Graph 查看 overallocation。<\/li><li><b>Before levelling 先 Set Baseline<\/b>，然后 Leveling Options 与 levelling，用 Tracking Gantt 对比。<\/li><li>课件非劳务固定成本用 Type Cost 的 Non Labour resource，在任务 Cost view 分配金额。<\/li><li>Report → Costs → Cash Flow 按周显示，与手算预算比较。<\/li><\/ol>\n<h2>三个考点<\/h2><dl><dt>WBS vs ID（——缩进时哪个随层级变？）<\/dt><dd>课件缩进操作 WBS 变化、ID 不变；不能推广成插删行时 ID 永不重排。<\/dd><dt>Baseline vs current schedule<\/dt><dd>Baseline 是批准参考；Tracking Gantt 看当前与参考差异。不能做完 levelling 后补存假装没有延期。<\/dd><dt>Level only within available slack<\/dt><dd>课件未勾选，并允许拆分剩余工作，因此不保证 finish date 不变，执行后再检查工期、逻辑与关键路径。<\/dd><\/dl>\n<aside>名为 Cash Flow 的软件报告展示的是 costs/cumulative costs，不自动证明 sponsor receipts、付款时序或现金余额。Canvas MPT/XLSX 练习数据未提供，本页不声称已实际运行 MS Project。<\/aside>", "qs": [{"q": "When should the workshop comparison baseline be saved?", "opts": ["After hiding variances", "Before resource levelling", "Only at closure", "After all work is complete"], "answer": 1, "explain": "先存 pre-levelling baseline，Tracking Gantt 才能对比调整影响。"}, {"q": "Does the demonstrated MS Project Cash Flow report alone prove sufficient cash balance?", "opts": ["Always", "If cumulative cost is positive", "No; receipts and payment timing are also needed", "No; budgets never matter"], "answer": 2, "explain": "累计成本不等于收付款现金余额。"}]}, {"title": "采购：买什么、怎么买、谁担风险", "en": "Make / Team / Buy & contracts", "week": "9", "body": "\n<p class=\"lead\">Procurement 不是最后才去下单。选型、招标、合同与交付有 lead time，要从 date required 倒排采购活动。<\/p>\n<h2>1 · 三种来源与四个过程<\/h2><p>Make 为本组织内部做；Team 为组织间 partnering/JV/alliance 等合作；Buy 向外部采购。Team 与 Buy 都需采购计划，分类取决于组织边界，同一项目可共存。<\/p><p>Plan Procurement：决定外部范围、方法、时间、预算；Conduct：RFP、收标、评价、授标；Administer：监督履约、处理授权变更；Close：未结事项、合同结算、档案与教训。<\/p>\n<h2>2 · 采购表与 SOW<\/h2><p>至少包含 goods/services、budget、date required、RACI、Team/Buy decision、contract type、supplier / published evaluation criteria。供应商名字和评选准则要分清。<\/p><p>SOW / Scope of Supply（——为什么也要写 exclusions？）说明目的、包含与不含、数量、质量/性能、地点、接口、预算/时间/资源约束与规格引用。范围清晰，报价、验收与变更才可比较。<\/p>\n<h2>3 · 三种计价合同<\/h2><table><tr><th>类型<\/th><th>支付<\/th><th>适用/风险<\/th><\/tr><tr><td>Fixed Price<\/td><td>定义范围的固定总价，可里程碑付款<\/td><td>范围明确稳定；供应商通常承担更多既定范围内超支风险<\/td><\/tr><tr><td>Cost Plus<\/td><td>允许的实际成本加 fee<\/td><td>范围不确定/研发；买方成本暴露较高，需监督<\/td><\/tr><tr><td>Time & Material<\/td><td>约定工时费率加材料<\/td><td>咨询等；费率固定不等于总价固定，监督工时与范围<\/td><\/tr><\/table><p>实际风险依条款、变更、责任原因。Fixed price 不代表供应商承担一切新增工作；cost-plus 不代表什么都能报；T&M 费率若已含利润，不再加一次。<\/p>\n<h2>4 · 合同与 probity<\/h2><p>课件 essentials：offer & acceptance、consideration/form、intent、capacity、legality、freely given consent。实际法律效果取决于司法辖区与情境，简化课堂例子不是绝对法律规则。代表组织签约先检查 authority/delegations。<\/p><p>Probity / ethics / transparency：按公开 evaluation criteria，不看完报价暗改准则；lowest price 不自动等于 best value；替代方案按事先规则和适当采购/法律建议处理。<\/p>\n<h2>5 · Strategy 不是 pricing type<\/h2><p>Design & Build 打包设计建造；Design, Build & Operate 加运营；Management Contracting 提供管理；Partnership 按约分享成本/收益；JV 建立临时实体、贡献股权并分风险。它们不是 Fixed Price 的同义词。<\/p>\n<h2>6 · 案例会分析什么<\/h2><p><b>Sydney Water P4S：<\/b>课件十年、三个区域 consortia，结合 planning partner/shared purchasing，面向长期重复工作。需要稳定管线、足够规模与有竞争力的供应市场；relational 不消除监督、竞争或 lock-in。判断 Make/Team/Buy 看 scope certainty、repetition、core capability、capable suppliers。<\/p><p><b>F-35：<\/b>政府向 prime 为 Buy，产业协作含 Team+Buy，政府间伙伴安排为 Team。研发设计不明确时 cost-plus，成熟生产逐步转向 fixed-price/incentive；concurrency 带来 retrofit。发动机由政府另签，不自动是 prime 分包；伙伴地位不保证工业订单。课堂历史参与国列表不当作当前新闻事实。<\/p><aside>短答：判断 → 用四项测试举证 → 一项具体风险 → 对应缓解措施。可讨论数据/支持访问与共同治理，不凭空声称已有技术权利。本页不是实际法律建议。<\/aside>", "qs": [{"q": "Which statement about Time & Material is correct?", "opts": ["Total price is always fixed", "Agreed hourly rates do not guarantee final total cost", "No monitoring is needed", "Profit must be added twice"], "answer": 1, "explain": "固定费率不固定总工时/材料量，所以不保证最终总价。"}, {"q": "After seeing bids, may you quietly change published evaluation criteria?", "opts": ["Yes, for a familiar supplier", "Yes, for extra features", "Yes, for lowest price", "No; that undermines probity"], "answer": 3, "explain": "按事先公开的准则公平评价，不根据偏好暗改标准。"}]}, {"title": "EVM：做了多少，花得值不值", "en": "Earned Value Management", "week": "10", "body": "\n<p class=\"lead\">计划完成 30k 工作，实际只做 25k，却花 28k：进度落后，已完成工作也花超了。只比“花的钱少于计划钱”会误判。<\/p>\n<h2>1 · 四个输入先说人话<\/h2><dl><dt>BAC<\/dt><dd>Budget at Completion，该范围全部完成的预算。<\/dd><dt>PV（——等于实际支出吗？）<\/dt><dd>Planned Value，状态日前计划应完成工作的预算价值，也叫 BCWS。<\/dd><dt>EV<\/dt><dd>Earned Value，实际完成工作的预算价值，也叫 BCWP。按预算率算，不按实际花费。<\/dd><dt>AC<\/dt><dd>Actual Cost，完成这些工作对应的实际成本。<\/dd><\/dl>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>P<\/mi><mi>V<\/mi><mo>=<\/mo><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><mo>×<\/mo><mi>P<\/mi><mi>l<\/mi><mi>a<\/mi><mi>n<\/mi><mi>n<\/mi><mi>e<\/mi><mi>d<\/mi><mspace width=\"0.25em\"/><mi>f<\/mi><mi>r<\/mi><mi>a<\/mi><mi>c<\/mi><mi>t<\/mi><mi>i<\/mi><mi>o<\/mi><mi>n<\/mi><mo>,<\/mo><mspace width=\"1em\"/><mi>E<\/mi><mi>V<\/mi><mo>=<\/mo><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><mo>×<\/mo><mi>A<\/mi><mi>c<\/mi><mi>t<\/mi><mi>u<\/mi><mi>a<\/mi><mi>l<\/mi><mspace width=\"0.25em\"/><mi>f<\/mi><mi>r<\/mi><mi>a<\/mi><mi>c<\/mi><mi>t<\/mi><mi>i<\/mi><mi>o<\/mi><mi>n<\/mi><\/mrow><\/math>\n<p>统一 scope、status date、币种和当期/累计口径。百分比换小数；项目先汇总 PV/EV/AC，再算 ratios，不能平均各项 CPI/SPI。<\/p>\n<h2>2 · 都从 EV 出发<\/h2><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mtable columnalign=\"right left\"><mtr><mtd><mrow><mi>C<\/mi><mi>V<\/mi><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mi>E<\/mi><mi>V<\/mi><mo>-<\/mo><mi>A<\/mi><mi>C<\/mi><mo>,<\/mo><mspace width=\"1em\"/><mi>C<\/mi><mi>P<\/mi><mi>I<\/mi><mo>=<\/mo><mfrac><mrow><mi>E<\/mi><mi>V<\/mi><\/mrow><mrow><mi>A<\/mi><mi>C<\/mi><\/mrow><\/mfrac><\/mrow><\/mtd><\/mtr><mtr><mtd><mrow><mi>S<\/mi><mi>V<\/mi><\/mrow><\/mtd><mtd><mrow><mo>=<\/mo><mi>E<\/mi><mi>V<\/mi><mo>-<\/mo><mi>P<\/mi><mi>V<\/mi><mo>,<\/mo><mspace width=\"1em\"/><mi>S<\/mi><mi>P<\/mi><mi>I<\/mi><mo>=<\/mo><mfrac><mrow><mi>E<\/mi><mi>V<\/mi><\/mrow><mrow><mi>P<\/mi><mi>V<\/mi><\/mrow><\/mfrac><\/mrow><\/mtd><\/mtr><\/mtable><\/math>\n<p>CV 正 / CPI 大于 1：成本有利；反之 over budget。SV 正 / SPI 大于 1：工作价值进度领先；反之 behind schedule。<b>SV 单位是钱，不是天。SPI 不告诉你 critical path 延期几天。<\/b>零分母报 N/A，不填 0 或无穷。<\/p>\n<h2>3 · 样卷计算表<\/h2><table><tr><th>指标<\/th><th>数值<\/th><th>含义<\/th><\/tr><tr><td>BAC<\/td><td>100,000<\/td><td>全部范围预算<\/td><\/tr><tr><td>PV<\/td><td>30,000<\/td><td>计划应完成<\/td><\/tr><tr><td>EV<\/td><td>25,000<\/td><td>实际做成的预算价值<\/td><\/tr><tr><td>AC<\/td><td>28,000<\/td><td>实际花费<\/td><\/tr><tr><td>CV<\/td><td>−3,000<\/td><td>已完成工作花超 3k<\/td><\/tr><tr><td>SV<\/td><td>−5,000<\/td><td>落后 5k 预算工作价值<\/td><\/tr><tr><td>CPI<\/td><td>0.892857…<\/td><td>一元成本取得约 0.893 元预算价值<\/td><\/tr><tr><td>SPI<\/td><td>0.833333…<\/td><td>完成计划工作价值约 83.3%<\/td><\/tr><\/table>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>C<\/mi><mi>V<\/mi><mo>=<\/mo><mn>25000<\/mn><mo>-<\/mo><mn>28000<\/mn><mo>=<\/mo><mo>-<\/mo><mn>3000<\/mn><mo>,<\/mo><mspace width=\"1em\"/><mi>S<\/mi><mi>V<\/mi><mo>=<\/mo><mn>25000<\/mn><mo>-<\/mo><mn>30000<\/mn><mo>=<\/mo><mo>-<\/mo><mn>5000<\/mn><\/mrow><\/math>\n<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>C<\/mi><mi>P<\/mi><mi>I<\/mi><mo>=<\/mo><mfrac><mn>25000<\/mn><mn>28000<\/mn><\/mfrac><mo>,<\/mo><mspace width=\"1em\"/><mi>S<\/mi><mi>P<\/mi><mi>I<\/mi><mo>=<\/mo><mfrac><mn>25000<\/mn><mn>30000<\/mn><\/mfrac><\/mrow><\/math>\n<h2>4 · Forecast 先读假设<\/h2><p>ETC 为还需花费；EAC 为预计最终总成本；VAC 为预算减预计总成本。<\/p><p><b>剩余按原计划效率（过去偏差不再重复）：<\/b><\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><mi>T<\/mi><mi>C<\/mi><mo>=<\/mo><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><mo>-<\/mo><mi>E<\/mi><mi>V<\/mi><mo>,<\/mo><mspace width=\"1em\"/><mi>E<\/mi><mi>A<\/mi><mi>C<\/mi><mo>=<\/mo><mi>A<\/mi><mi>C<\/mi><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><mo>-<\/mo><mi>E<\/mi><mi>V<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math>\n<p><b>过去的成本效率延续：<\/b><\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><mi>T<\/mi><mi>C<\/mi><mo>=<\/mo><mfrac><mrow><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><mo>-<\/mo><mi>E<\/mi><mi>V<\/mi><\/mrow><mrow><mi>C<\/mi><mi>P<\/mi><mi>I<\/mi><\/mrow><\/mfrac><mo>,<\/mo><mspace width=\"1em\"/><mi>E<\/mi><mi>A<\/mi><mi>C<\/mi><mo>=<\/mo><mfrac><mrow><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><\/mrow><mrow><mi>C<\/mi><mi>P<\/mi><mi>I<\/mi><\/mrow><\/mfrac><mo>,<\/mo><mspace width=\"1em\"/><mi>V<\/mi><mi>A<\/mi><mi>C<\/mi><mo>=<\/mo><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><mo>-<\/mo><mi>E<\/mi><mi>A<\/mi><mi>C<\/mi><\/mrow><\/math>\n<p>本例效率延续，用未取整 CPI：<\/p><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>E<\/mi><mi>A<\/mi><mi>C<\/mi><mo>=<\/mo><mfrac><mn>100000<\/mn><mrow><mn>25000<\/mn><mo>/<\/mo><mn>28000<\/mn><\/mrow><\/mfrac><mo>=<\/mo><mn>112000<\/mn><mo>,<\/mo><mspace width=\"1em\"/><mi>V<\/mi><mi>A<\/mi><mi>C<\/mi><mo>=<\/mo><mn>100000<\/mn><mo>-<\/mo><mn>112000<\/mn><mo>=<\/mo><mo>-<\/mo><mn>12000<\/mn><\/mrow><\/math>\n<p>若剩余按计划则 EAC 103,000。差别来自假设，不是一个公式永远更好。<\/p><aside><b>样卷取整差异：<\/b>样卷先把 CPI 取为 0.89，再算 EAC，整数答案 112,360；用未取整 CPI 得 112,000。以题目要求为准，写明口径。默认保留中间精度，显示值不代替内部值。<\/aside>\n<h2>5 · 解释与可靠性<\/h2><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>C<\/mi><mi>o<\/mi><mi>m<\/mi><mi>p<\/mi><mi>l<\/mi><mi>e<\/mi><mi>t<\/mi><mi>i<\/mi><mi>o<\/mi><mi>n<\/mi><mo>=<\/mo><mfrac><mrow><mi>E<\/mi><mi>V<\/mi><\/mrow><mrow><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><\/mrow><\/mfrac><mo>×<\/mo><mn>100<\/mn><mo>%<\/mo><mo>,<\/mo><mspace width=\"1em\"/><mi>B<\/mi><mi>u<\/mi><mi>d<\/mi><mi>g<\/mi><mi>e<\/mi><mi>t<\/mi><mspace width=\"0.25em\"/><mi>u<\/mi><mi>s<\/mi><mi>e<\/mi><mi>d<\/mi><mo>=<\/mo><mfrac><mrow><mi>A<\/mi><mi>C<\/mi><\/mrow><mrow><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><\/mrow><\/mfrac><mo>×<\/mo><mn>100<\/mn><mo>%<\/mo><\/mrow><\/math>\n<p>花钱比例不是物理进度。EVM 依赖可靠 percent complete、整合 scope/time/cost baseline 与及时成本；不得追溯改基线藏偏差，也不可把未来未履行采购承诺当已挣得价值或已完成工作的 AC。<\/p><p>Riverside activity BAC 540k，项目 PV 371,850、EV 324,650、AC 337,500；CPI 约 0.9619、SPI 约 0.8731，成本与进度均不利。E 的价值偏差最大，但还要结合 permit/procurement 依赖和固定活动日定管理优先级。精确延误天数不能从这张表得出。<\/p><p>Week 7 cost baseline 含 contingency；Week 10 称 integrated performance baseline 不含。保留来源术语，不混用 540k、580k、600k。EVM 更适合稳定、可测的 hard projects；探索性工作可用于清楚的组件或近程 work packages。它是调查和行动的起点，不自动诊断原因。<\/p>", "qs": [{"q": "EV is 25,000 and AC is 28,000. Which is correct?", "opts": ["CV +3,000; under budget", "CV −3,000; over budget for achieved work", "SV is −3,000 days", "CPI exceeds one"], "answer": 1, "explain": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>C<\/mi><mi>V<\/mi><mo>=<\/mo><mn>25000<\/mn><mo>-<\/mo><mn>28000<\/mn><mo>=<\/mo><mo>-<\/mo><mn>3000<\/mn><\/mrow><\/math>，已完成工作成本超支；别只比较 AC 和 PV。"}, {"q": "Remaining work will be performed as originally planned. Which EAC applies?", "opts": ["BAC / CPI in every case", "AC + (BAC − EV)", "EV − PV", "BAC + PV"], "answer": 1, "explain": "剩余原计划成本 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><mo>-<\/mo><mi>E<\/mi><mi>V<\/mi><\/mrow><\/math> 作 ETC，再加 AC；当前成本效率持续才用 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B<\/mi><mi>A<\/mi><mi>C<\/mi><\/mrow><mrow><mi>C<\/mi><mi>P<\/mi><mi>I<\/mi><\/mrow><\/mfrac><\/math>。"}]}];
const KEY='pmgt1865-zero-sprint-v1';
const $=s=>document.querySelector(s);
const allQ=MODULES.flatMap((m,i)=>m.qs.map((q,j)=>({...q,id:i+'-'+j,module:i})));
const ids=new Set(allQ.map(q=>q.id));
function valid(s){const answers={},read={};if(s&&typeof s==='object'){for(const [id,v] of Object.entries(s.answers||{}))if(ids.has(id)&&Number.isInteger(v)&&v>=0&&v<4)answers[id]=v;for(const [id,v]of Object.entries(s.read||{}))if(/^\d+$/.test(id)&&+id<MODULES.length&&v===true)read[id]=true;}return{answers,read};}
let state={answers:{},read:{}},storageError=false;
try{state=valid(JSON.parse(localStorage.getItem(KEY)||'{}'));}catch{storageError=true;}
$('#warning').hidden=!storageError;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#warning').hidden=true;}catch{$('#warning').hidden=false;}}
function correct(q){return state.answers[q.id]===q.answer;}
function answered(q){return state.answers[q.id]!==undefined;}
function stats(){return{done:allQ.filter(answered).length,right:allQ.filter(correct).length,read:Object.keys(state.read).length};}
function nav(){const s=stats();$('#nav').innerHTML='<button data-go="home">学习路线<span>'+s.read+'/12 已自查 · '+s.right+'/24 答对</span></button>'+MODULES.map((m,i)=>'<button data-go="m'+i+'">'+String(i+1).padStart(2,'0')+' '+m.title.split('：')[0]+'<i>'+(state.read[i]?'✓':'')+'</i><span>Week '+m.week+'</span></button>').join('')+'<button data-go="final">24 题综合自测<span>先完成学习，再集中查漏</span></button>';const key=location.hash.slice(1)||'home';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===key));}
function go(k){if(location.hash==='#'+k)render();else location.hash=k;}
function tools(){return '<div class="toolbar"><button class="quiet" data-export>导出速通进度</button><button class="quiet" data-import>导入速通进度</button><button class="quiet" data-reset>重置速通进度</button></div><p class="scope-note">速通进度单独保存在此浏览器。导入/重置不影响原 241 题题库；两个页面的备份格式独立。</p>';}
function home(){const s=stats();return '<span class="eyebrow">LEARN FIRST · LESS DRILLING</span><h1>没学过，也从这里开始。</h1><p class="lead intro">不是把 178 题砍成一堆答案，而是把这门课串成一条可以理解、计算、复述的路线。</p><div class="metrics"><div><strong>12</strong><span>知识模块</span></div><div><strong>7</strong><span>核心计算题型</span></div><div><strong>'+s.read+'/12</strong><span>自查完成（不等于掌握）</span></div><div><strong>'+s.right+'/24</strong><span>自测答对 · 已答 '+s.done+'</span></div></div><div class="route"><b>推荐第一轮：约 5 小时，再留时间闭卷重做</b><p>约 60 分钟读模块 1–3 → 约 60 分钟学 PERT/资源 → 约 60 分钟成本/预算/现金流 → 约 60 分钟软件/采购/EVM → 约 60 分钟做 24 题和重做样卷。时间是安排建议，不是掌握保证。</p><p><b>只剩 2 小时？</b>先 1 → 2 → 3 → 4 → 5 → 8 → 9 → 12，优先七类计算；再快速过 6、7、10、11。应急路线不是全知识覆盖。</p><p><b>过关标准：</b>不看讲解能解释为什么，能闭卷重做七种样卷题，能说明单位、假设与取整。选择题全对不能替代画图与手算。</p><button class="primary" data-go="m0">从第 1 模块开始 →</button> <button class="quiet" data-go="final">直接自测</button></div><div class="grid">'+MODULES.map((m,i)=>'<article class="card"><span class="eyebrow">'+String(i+1).padStart(2,'0')+' / WEEK '+m.week+'</span><h3>'+m.title+'</h3><p>'+m.en+'</p><div class="small">2 道自测 · '+(state.read[i]?'已自查':'未标记')+'</div><button class="quiet" data-go="m'+i+'">学习本模块 →</button></article>').join('')+'</div><div class="source"><b>来源与边界</b><p>依据课程 living notes（学习者提供的 Week 1–5、7–10 材料提炼）与已记录样卷计算编写。Week 6 客座讲座无实质材料；Week 11–13 无新教学。不是官方题目、答案或考试预测；考试安排以课程通知为准。</p><p>Week 7 Cost Estimation 28 页；Week 8 MS Project 31 页；Week 9 Procurement 29 页；Week 10 EVM 36 页。Reserve/overhead 差异与 PERT/EVM 取整差异在对应模块保留。</p></div>'+tools();}
function quiz(q){const done=answered(q),pick=state.answers[q.id];return '<article class="quiz-card" id="q-'+q.id+'" data-qid="'+q.id+'" data-answer="'+q.answer+'"><div class="quiz-meta">SOURCE-GROUNDED PRACTICE · 自拟自测 · 模块 '+(q.module+1)+'</div><h3>'+q.q+'</h3>'+q.opts.map((o,i)=>'<button class="opt '+(done&&i===q.answer?'correct':'')+' '+(done&&pick===i&&i!==q.answer?'wrong':'')+'" data-pick="'+i+'" data-q="'+q.id+'" '+(done?'disabled':'')+' aria-pressed="'+(pick===i)+'">'+'ABCD'[i]+'. '+o+(done&&i===q.answer?' ✓':'')+(done&&pick===i&&i!==q.answer?' ✗':'')+'</button>').join('')+'<div class="explanation" '+(done?'':'hidden')+'><b>'+(correct(q)?'回答正确':'先看错因，再回讲解')+' · 正确答案 '+'ABCD'[q.answer]+'</b><div>'+q.explain+'</div></div></article>';}
function lesson(i){const m=MODULES[i];return '<span class="eyebrow">MODULE '+(i+1)+' / 12 · WEEK '+m.week+'</span><h1>'+m.title+'</h1><p class="small">'+m.en+' · 先读，再自己在纸上重做</p><article class="lesson">'+m.body+'<div class="source">来源：PMGT1865 living notes · Week '+m.week+'；计算例题注明为样卷或课件示例。问题为依据以上知识自拟的练习，不是官方题库。<br>自查不是成绩：勾选仅表示你尝试复述，不会计入正确题数。</div><label class="check"><input type="checkbox" data-read="'+i+'" '+(state.read[i]?'checked':'')+'> 我已尝试不看讲解复述要点，并在纸上重做本模块计算（如有）。</label></article><h2>两题自测 · 答后立即讲错因</h2>'+allQ.filter(q=>q.module===i).map(quiz).join('')+'<div class="toolbar"><button class="quiet" data-retry="'+i+'">只重做本模块错题</button></div><div class="bottom-nav"><button class="quiet" data-go="'+(i?'m'+(i-1):'home')+'">← '+(i?'上一模块':'学习路线')+'</button><button class="primary" data-go="'+(i<11?'m'+(i+1):'final')+'">'+(i<11?'下一模块':'24 题综合自测')+' →</button></div>';}
function final(){const s=stats();return '<span class="eyebrow">CHECK UNDERSTANDING · NOT A SCORE PROMISE</span><h1>24 题，定位知识漏洞。</h1><p class="lead">已答 '+s.done+' / 24，答对 '+s.right+'，答错 '+(s.done-s.right)+'。模块内与这里共享答案，不重复累计。</p><p>英文题干/选项，中文解析。先写计算再答；这些题覆盖关键检查点，不声称每个细节都有独立一题。</p><div class="quiz-map">'+allQ.map((q,i)=>'<button class="chip '+(answered(q)?correct(q)?'correct':'wrong':'')+'" data-jump="q-'+q.id+'" aria-label="跳到第 '+(i+1)+' 题">'+(i+1)+'</button>').join('')+'</div><div class="toolbar"><button class="quiet" data-retry="all">只重做错题（保留答对项）</button><a class="primary" href="./?sample=1#sq1">去原页手算七种样卷 →</a></div><aside class="route"><b>最后一轮必须能做</b><p>画 network、填 CPM 表、读关系与 lag、做 PERT 概率、分段算 work/duration/cost、做 period/cumulative budget 和 rolling cash balance、按假设选 EAC。概念上区分 WBS/OBS/RACI、smoothing/levelling、reserves、合同风险与 baseline。</p><p>错题回对应模块。答对不证明会手算；遮住例题答案再重做。</p></aside>'+allQ.map(q=>'<p class="small"><button class="quiet" data-go="m'+q.module+'">回学模块 '+(q.module+1)+'</button></p>'+quiz(q)).join('')+tools();}
let resetArmed=false,resetTimer;
function render(){resetArmed=false;clearTimeout(resetTimer);nav();const k=location.hash.slice(1)||'home',match=/^m(\d+)$/.exec(k);let title='学习路线';if(match&&+match[1]<MODULES.length){$('#content').innerHTML=lesson(+match[1]);title='模块 '+(+match[1]+1)+' / 12';}else if(k==='final'){$('#content').innerHTML=final();title='综合自测';}else{$('#content').innerHTML=home();}$('#breadcrumb').textContent='零基础速通 / '+title;document.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='table-wrap';t.replaceWith(w);w.append(t);});$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.jump){document.getElementById(b.dataset.jump)?.scrollIntoView({block:'start'});return;}if(b.hasAttribute('data-pick')){const q=allQ.find(x=>x.id===b.dataset.q);if(!q||answered(q))return;state.answers[q.id]=+b.dataset.pick;save();const card=b.closest('.quiz-card');card.outerHTML=quiz(q);nav();if(location.hash==='#final'){const y=scrollY;render();scrollTo(0,y);}return;}if(b.hasAttribute('data-retry')){let count=0;allQ.filter(q=>(b.dataset.retry==='all'||q.module===+b.dataset.retry)&&answered(q)&&!correct(q)).forEach(q=>{delete state.answers[q.id];count++;});save();const y=scrollY;render();scrollTo(0,y);$('#notice').textContent=count?'已解锁 '+count+' 道错题，正确答案与自查记录保留。':'当前范围没有错题。';return;}if(b.hasAttribute('data-reset')){if(!resetArmed){resetArmed=true;b.textContent='再点一次：只清空速通记录';clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArmed=false;b.textContent='重置速通进度';},4000);return;}state={answers:{},read:{}};save();render();$('#notice').textContent='已重置速通记录，原题库未更改。';}if(b.hasAttribute('data-export')){const blob=new Blob([JSON.stringify({app:KEY,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PMGT1865-zero-sprint-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}if(b.hasAttribute('data-import'))$('#import-file').click();});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-read')){if(e.target.checked)state.read[e.target.dataset.read]=true;else delete state.read[e.target.dataset.read];save();nav();}});
$('#import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>500000)throw Error('备份文件过大');const raw=JSON.parse(await f.text());if(raw.app!==KEY||!raw.state||typeof raw.state.answers!=='object')throw Error('不是速通页有效备份');const incoming=valid(raw.state);state.answers={...state.answers,...incoming.answers};state.read={...state.read,...incoming.read};save();render();$('#notice').textContent='导入成功：按有效题号合并，未出现的本地记录保留。';}catch(err){$('#notice').textContent='导入失败：'+err.message;}e.target.value='';});
$('#menu').addEventListener('click',()=>{const open=$('#rail').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');}});document.addEventListener('click',e=>{if(innerWidth<=760&&!e.target.closest('#rail')&&!e.target.closest('#menu')){$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');}});window.addEventListener('hashchange',()=>{$('#notice').textContent='';render();});render();
</script></body></html>
