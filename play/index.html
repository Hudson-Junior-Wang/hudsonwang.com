<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex">
<title>Storm Area 51 — Guess</title>
<style>
  :root{
    --amber:#ffc400;
    --amber-dim:#6b5200;
    --bg:#0a0a0c;
    --card:#16161b;
    --line:#2b2b34;
    --ink:#ffffff;
    --muted:#9a9aa6;
    --ok:#3ddc84;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;
    color:var(--amber);
  }
  header .q{color:#4a4a56;letter-spacing:.14em}
  #prog{height:3px;background:#1c1c22}
  #prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .35s cubic-bezier(.3,.9,.3,1)}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 20px 26px;gap:18px}
  h1{font-size:clamp(22px,6.4vw,30px);line-height:1.22;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:14px;color:var(--muted);line-height:1.5}
  .opts{display:flex;flex-direction:column;gap:12px;margin-top:4px}
  button.opt{
    font:inherit;text-align:left;color:var(--ink);cursor:pointer;
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:20px 18px;font-size:17px;font-weight:650;line-height:1.35;
    display:flex;align-items:center;gap:14px;
    transition:transform .08s, border-color .15s, background .15s;
    width:100%;
  }
  button.opt .tick{
    width:24px;height:24px;flex:0 0 24px;border-radius:50%;
    border:2px solid #3a3a46;display:grid;place-items:center;
    font-size:13px;color:transparent;
  }
  button.opt:active{transform:scale(.978)}
  button.opt.sel{border-color:var(--amber);background:#1e1a0c}
  button.opt.sel .tick{border-color:var(--amber);background:var(--amber);color:#0a0a0c}
  button.opt:disabled{cursor:default}
  .toast{
    margin-top:6px;font-size:14px;color:var(--ok);font-weight:700;
    display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .2s;
  }
  .toast.on{opacity:1}
  .done{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
  .done .big{font-size:clamp(26px,8vw,38px);font-weight:800;line-height:1.15}
  .done .big span{color:var(--amber)}
  footer{padding:0 20px 18px;font-size:12px;color:#3f3f4a;line-height:1.5}
  .warn{color:var(--amber);font-weight:700}
  #net{display:none;background:#241a00;border:1px solid var(--amber-dim);color:#ffd75e;
       font-size:13px;padding:10px 14px;border-radius:10px;line-height:1.45}
  #net.on{display:block}
  a{color:var(--amber)}
</style>
</head>
<body>

<header>
  <span>Storm Area 51</span>
  <span class="q" id="qtag"></span>
</header>
<div id="prog"><i id="progbar"></i></div>

<main id="main"></main>

<footer id="foot">Just a guessing game. No wrong answers.</footer>

<script>
/* ============ config ============ */
const API = 'https://storm51-vote.hudsonwang.workers.dev';

/* ============ questions ============ */
const QUESTIONS = [
  {
    id:'q1',
    title:'How many people clicked “Going”?',
    sub:'A Facebook event, created as a joke.',
    opts:[
      {k:'a', t:'About 40,000'},
      {k:'b', t:'About 400,000'},
      {k:'c', t:'About 2,000,000'}
    ]
  },
  {
    id:'q2',
    title:'What did the US Air Force do about it?',
    sub:'A joke, about a classified military base.',
    opts:[
      {k:'a', t:'Ignored it completely'},
      {k:'b', t:'Issued a public statement'},
      {k:'c', t:'Sent in troops'}
    ]
  },
  {
    id:'q3',
    title:'The county has only 184 hotel rooms. How many people did it prepare for?',
    sub:'Lincoln County, Nevada. August 2019.',
    opts:[
      {k:'a', t:'About 500'},
      {k:'b', t:'About 4,000'},
      {k:'c', t:'About 40,000'}
    ]
  },
  {
    id:'q4',
    title:'How many people actually showed up?',
    sub:'20 September 2019.',
    opts:[
      {k:'a', t:'About 150'},
      {k:'b', t:'About 15,000'},
      {k:'c', t:'About 150,000'}
    ]
  },
  {
    id:'q5',
    title:'How did the whole thing end?',
    sub:'The final score.',
    opts:[
      {k:'a', t:'The base was overrun'},
      {k:'b', t:'7 arrests — public urination'},
      {k:'c', t:'Nothing happened at all'}
    ]
  }
];

/* ============ state ============ */
const LS_ID = 's51_voter';
const LS_ANS = 's51_answers';

let voterId = localStorage.getItem(LS_ID);
if(!voterId){
  voterId = 'v-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  localStorage.setItem(LS_ID, voterId);
}
let answers = {};
try{ answers = JSON.parse(localStorage.getItem(LS_ANS) || '{}') || {}; }catch(e){ answers = {}; }

let idx = 0;
let online = true;

const $ = id => document.getElementById(id);

/* first unanswered question */
function firstUnanswered(){
  for(let i=0;i<QUESTIONS.length;i++) if(!answers[QUESTIONS[i].id]) return i;
  return QUESTIONS.length;
}

function setProgress(){
  const n = Object.keys(answers).length;
  $('progbar').style.width = (n / QUESTIONS.length * 100) + '%';
  $('qtag').textContent = n >= QUESTIONS.length ? 'done' : `${Math.min(n+1, QUESTIONS.length)} of ${QUESTIONS.length}`;
}

function render(){
  const m = $('main');
  setProgress();

  if(idx >= QUESTIONS.length){
    m.innerHTML = `
      <div class="done">
        <div class="big">All done.<br><span>Look at the big screen.</span></div>
        <div class="sub">Your answers are in. Nothing else to do — enjoy the show.</div>
      </div>`;
    $('foot').textContent = 'You can close this page now.';
    return;
  }

  const q = QUESTIONS[idx];
  const chosen = answers[q.id];
  m.innerHTML = `
    <div>
      <h1>${q.title}</h1>
      <div class="sub" style="margin-top:10px">${q.sub}</div>
    </div>
    <div class="opts">
      ${q.opts.map(o => `
        <button class="opt ${chosen===o.k?'sel':''}" data-k="${o.k}">
          <span class="tick">✓</span><span>${o.t}</span>
        </button>`).join('')}
    </div>
    <div class="toast ${chosen?'on':''}" id="toast">✓ Locked in — you can change it if you want.</div>
    <div id="net">Slow network. If this doesn’t go through, just raise your hand.</div>
  `;

  m.querySelectorAll('button.opt').forEach(b => {
    b.addEventListener('click', () => choose(q, b.dataset.k));
  });
}

async function choose(q, k){
  const prev = answers[q.id];
  answers[q.id] = k;
  localStorage.setItem(LS_ANS, JSON.stringify(answers));
  render();

  if(prev === k) return;

  try{
    const r = await fetch(API + '/api/vote', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({q:q.id, opt:k, voter:voterId})
    });
    const d = await r.json();
    if(!d.ok && d.err === 'locked'){
      $('toast').textContent = 'Voting has closed on this one.';
      $('toast').classList.add('on');
      return;
    }
    if(!d.ok) throw new Error(d.err || 'failed');
    online = true;
    $('net').classList.remove('on');
  }catch(e){
    online = false;
    $('toast').textContent = 'Saved on your phone — we’ll retry.';
    $('toast').classList.add('on');
    const n = $('net'); if(n) n.classList.add('on');
    retryLater(q, k);
    return;
  }

  /* auto-advance after a beat */
  setTimeout(() => {
    if(answers[q.id] === k && idx < QUESTIONS.length){
      const next = idx + 1;
      if(next < QUESTIONS.length){ idx = next; render(); }
      else { idx = QUESTIONS.length; render(); }
    }
  }, 900);
}

/* if the network hiccups, retry once quietly */
function retryLater(q, k){
  let tries = 0;
  const t = setInterval(async () => {
    tries++;
    try{
      const r = await fetch(API + '/api/vote', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({q:q.id, opt:k, voter:voterId})
      });
      const d = await r.json();
      if(d.ok){ clearInterval(t); const n=$('net'); if(n) n.classList.remove('on');
                $('toast').textContent = '✓ Sent.'; $('toast').classList.add('on'); }
    }catch(e){}
    if(tries >= 8) clearInterval(t);
  }, 4000);
}

idx = firstUnanswered();
render();
</script>
</body>
</html>
