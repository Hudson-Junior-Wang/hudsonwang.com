<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing · hudsonwang.com</title>
<meta name="description" content="Writing by Hudson.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#8a5a44">
<!-- MathLive：和桌面 App 用的是同一份（vendor/mathlive），网页上的公式与编辑器里长得一样 -->
<link rel="stylesheet" href="vendor/mathlive/mathlive-fonts.css">
<!-- 公式的排版规则（分数/根号/上下标）只存在于 MathLive 的运行时样式表里，
     字体文件里没有 —— 缺了它公式会显示成一行裸 LaTeX。这份是从 App 里抓出来的。 -->
<link rel="stylesheet" href="vendor/mathlive/mathlive-layout.css">
<script src="vendor/mathlive/mathlive.min.js"></script>
<style>
  :root{
    --bg:#fbfaf7; --ink:#23211d; --muted:#7c776e; --faint:#a8a399;
    --line:#e7e3da; --accent:#8a5a44; --accent-soft:#f0e8e1; --sidebar:#f5f2ec;
    --maxw:720px;
    --serif:"Newsreader",Georgia,"Songti SC","Source Han Serif SC",serif;
    --sans:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
       line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{display:flex;min-height:100vh;align-items:stretch}

  /* ---------- 侧栏：钉子在最上面，然后是按文件夹铺开的树 ---------- */
  aside{width:290px;flex:0 0 290px;background:var(--sidebar);border-right:1px solid var(--line);
        padding:30px 20px 60px;display:flex;flex-direction:column}
  .tl{margin-top:0;flex:1 1 auto;overflow-y:auto}
  .grp{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
       color:var(--faint);margin:18px 0 4px}
  .grp:first-child{margin-top:0}
  .node{display:flex;align-items:baseline;gap:8px;padding:7px 8px;border-radius:8px;
        cursor:pointer;font-size:14px;color:var(--muted);line-height:1.4}
  .node:hover{background:#ece7df;color:var(--ink)}
  .node.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .node.is-folder{color:var(--ink);font-weight:500}
  .tw{width:13px;flex:0 0 13px;font-size:9px;color:var(--faint);font-family:var(--sans);
      transition:transform .12s}
  .node.open .tw{transform:rotate(90deg)}
  .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cloud{font-size:10px;color:var(--accent);opacity:.75}
  .kids{margin-left:14px}
  .kids[hidden]{display:none}

  /* ---------- 正文 ---------- */
  main{flex:1 1 auto;min-width:0;padding:56px 40px 140px;display:flex;justify-content:center}
  .page{width:100%;max-width:var(--maxw)}
  .crumb{font-family:var(--sans);font-size:12.5px;color:var(--faint);margin:0 0 14px}
  .crumb a:hover{color:var(--accent)}
  h1.title{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:-.02em;
           line-height:1.25;margin:0 0 10px}
  .lead{font-family:var(--serif);font-size:19px;color:#46423b;margin:6px 0 10px;max-width:600px}
  .meta{font-family:var(--sans);font-size:12.5px;color:var(--faint);margin:0 0 30px;
        display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .meta .pill{background:var(--accent-soft);border-radius:999px;padding:2px 9px;color:var(--accent)}

  article{font-family:var(--serif);font-size:19px;line-height:1.8;color:#26231f}
  article h1{font-size:28px;line-height:1.3;margin:36px 0 12px}
  article h2{font-size:23px;line-height:1.35;margin:32px 0 10px}
  article h3{font-size:19.5px;line-height:1.4;margin:26px 0 8px}
  article p{margin:0 0 16px}
  article ul,article ol{margin:0 0 16px;padding-left:26px}
  article li{margin:6px 0}
  article blockquote{margin:20px 0;padding:2px 0 2px 16px;border-left:3px solid var(--line);color:var(--muted)}
  article hr{border:none;border-top:1px solid var(--line);margin:30px 0}
  article table{border-collapse:collapse;margin:20px 0;font-size:16px;width:100%}
  article th,article td{border:1px solid var(--line);padding:8px 11px;text-align:left}
  article th{background:var(--sidebar);font-weight:600}
  article math-field{font-size:1.05em;vertical-align:middle}
  /* 网页是只读的：MathLive 给每个公式挂的"软键盘 / 菜单"按钮是编辑用的，
     在只读页面上既没用又会误导（点了真能弹出来），所以整个藏掉。 */
  article math-field{pointer-events:none; background:none; border:none; padding:0}
  /* 编辑态才需要的容器外观（虚线框、内边距）在只读页面上全部去掉 */
  article .formula, article [data-formula-latex]{
    background:none !important; border:none !important; box-shadow:none !important;
    padding:0 !important; min-width:0 !important;
  }
  article math-field::part(virtual-keyboard-toggle),
  article math-field::part(menu-toggle){display:none !important}
  article .ML__virtual-keyboard-toggle,
  article .ML__menu-toggle{display:none !important}
  article .formula-display,article math-field[display]{display:block;text-align:center;margin:20px 0}
  article .ho-omitted-image{color:var(--faint);font:12px var(--sans)}
  article .ho-omitted-image::after{content:"Image awaiting sync"}
  .state{color:var(--muted);font-size:15px;line-height:1.8}
  .state.big{padding:40px 0}

  .mobile-header,.drawer-close,.home-picker{display:none}
  button{touch-action:manipulation}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .pin-toggle{display:flex;align-items:center;gap:8px;width:100%;border:0;
    background:none;padding:10px 0;cursor:pointer;text-align:left;font-family:var(--sans)}
  .pin-toggle::before{content:"▶";font-size:9px}
  .pin-toggle[aria-expanded="true"]::before{content:"▼"}
  .table-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:20px 0}
  .table-scroll table{margin:0}
  article pre{max-width:100%;overflow-x:auto;white-space:pre;padding:12px;background:var(--sidebar)}
  article img,article video,article svg{max-width:100%;height:auto}
  article .formula-display,article math-field[display]{max-width:100%;overflow-x:auto}
  @media (prefers-reduced-motion:reduce){aside{transition:none !important}}
  @media (max-width:820px){
    .mobile-header{display:flex;position:sticky;top:0;z-index:20;align-items:center;
      justify-content:space-between;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);
      padding:12px max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left))}
    .mobile-brand{font-family:var(--serif);font-size:20px;font-weight:600}
    .mobile-brand small{display:block;font:11px var(--sans);color:var(--muted)}
    .menu-button,.drawer-close{min-height:44px;min-width:44px;border:1px solid var(--line);
      border-radius:10px;background:var(--sidebar);color:var(--ink);font:14px var(--sans);cursor:pointer}
    .menu-button{padding:8px 14px}
    .drawer-close{display:block;position:absolute;right:14px;top:18px}
    .wrap{min-height:calc(100svh - 76px)}
    aside{position:fixed;inset:0 auto 0 0;z-index:40;width:min(340px,88vw);height:100vh;height:100dvh;
      padding:calc(26px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
      transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility .2s;
      box-shadow:12px 0 40px #23211d15}
    .tl{min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
    .node{min-height:44px;align-items:center;padding:10px 8px}
    .pin-toggle{min-height:44px}
    body.menu-open{overflow:hidden}
    body.menu-open aside{transform:translateX(0);visibility:visible}
    .drawer-backdrop{position:fixed;inset:0;z-index:30;background:#23211d66;border:0;
      padding:0;width:100%;height:100%;cursor:pointer}
    main{padding:28px max(20px,env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
    h1.title{font-size:clamp(26px,7vw,32px);overflow-wrap:anywhere}
    .lead{font-size:18px}
    .meta{gap:6px 10px;margin-bottom:24px}
    article{font-size:18px;overflow-wrap:anywhere}
    article h1{font-size:26px} article h2{font-size:22px}
    article blockquote{margin:18px 0;padding-left:12px}
    article ul,article ol{padding-left:24px}
    article table{font-size:15px}
    article th,article td{padding:8px;min-width:90px}
    .crumb a{display:inline-flex;align-items:center;min-height:44px}
    .crumb{margin-bottom:8px}
    .home-picker{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;
      margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--accent-soft);
      color:var(--accent);font:14px var(--sans);cursor:pointer}
  }
</style>
</head>
<body>
<header class="mobile-header">
  <a class="mobile-brand" href="#/">Writing<small>hudsonwang.com</small></a>
  <button class="menu-button" id="menu-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false">☰ Browse</button>
</header>
<button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="Close navigation" tabindex="-1" hidden></button>
<div class="wrap">
  <aside id="site-sidebar" aria-label="Writing navigation">
    <button class="drawer-close" id="drawer-close" type="button" aria-label="Close navigation">✕</button>
    <nav class="tl" id="tree" aria-label="Document list"><p class="state">Loading…</p></nav>
  </aside>
  <main id="main-content"><div class="page" id="page"></div></main>
</div>

<script>
/* 同步服务（Cloudflare Worker）。调试时可以带 ?api=http://127.0.0.1:8787 指到本地。 */
const API = (function () {
  try {
    const q = new URLSearchParams(location.search).get("api");
    if (q) { localStorage.setItem("ho.writing.api", q); return q.replace(/\/+$/, ""); }
  } catch (e) {}
  try {
    const saved = localStorage.getItem("ho.writing.api");
    if (saved) return saved.replace(/\/+$/, "");
  } catch (e) {}
  return "https://hudsonwang-writing-sync.hudsonwang.workers.dev";
})();

const treeEl = document.getElementById("tree");
const pageEl = document.getElementById("page");
let items = [];                 // 站点清单
let pinnedOpen = false;        // Pinned 默认折叠，重绘时保留本次状态
const expanded = {};            // 文件夹展开状态

const esc = (v) => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const num = (n) => Number(n) || 0;

/* Defense in depth for published document HTML. */
function sanitize(html) {
  const t = document.createElement("template");
  t.innerHTML = String(html || "");
  t.content.querySelectorAll("script,iframe,object,embed,link,base,meta,style,form,input,button,svg,foreignObject,template,video,audio,source")
    .forEach(n => n.remove());
  t.content.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(a => {
      const name = a.name.toLowerCase();
      const value = a.value.replace(/[\u0000-\u0020\u007f]/g, "");
      const raster = n.tagName === "IMG" && name === "src" &&
        /^data:image\/(?:png|jpeg|gif|webp);base64,[A-Za-z0-9+/]+={0,2}$/i.test(value);
      if (name.startsWith("on") || ["srcdoc", "srcset", "id", "name", "formaction"].includes(name) ||
          (["href", "src", "xlink:href", "background", "poster"].includes(name) &&
           !raster && /^(?:javascript|vbscript|data|file|blob):/i.test(value)) ||
          (name === "style" && /url\s*\(|expression\s*\(|@import/i.test(a.value))) n.removeAttribute(a.name);
    });
    if (n.tagName === "IMG") { n.loading = "lazy"; n.decoding = "async"; n.referrerPolicy = "no-referrer"; }
  });
  return t.innerHTML;
}
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(Number(ms)), p = (x) => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
         " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
const childrenOf = (pid) => items
  .filter(i => (i.parentId || null) === pid && !i.archived)
  .sort((a, b) => num(a.order) - num(b.order));
// Shortcut order is global and separate from each folder's normal sibling order.
function pinnedOf(list) {
  return list.map((item, index) => ({ item, index, rank:
      (typeof item.pinOrder === "number" || (typeof item.pinOrder === "string" && item.pinOrder.trim() !== ""))
        && Number.isFinite(Number(item.pinOrder)) ? Number(item.pinOrder) : index }))
    .filter(entry => entry.item.pinned && entry.item.type === "file" && !entry.item.archived)
    .sort((a, b) => a.rank - b.rank || a.index - b.index)
    .map(entry => entry.item);
}

/* ---------- 手机目录：遮罩、键盘与焦点 ---------- */
const mobileQuery = window.matchMedia('(max-width:820px)');
const sidebar = document.getElementById('site-sidebar');
const menuToggle = document.getElementById('menu-toggle');
const backdrop = document.getElementById('drawer-backdrop');
const closeButton = document.getElementById('drawer-close');
let menuReturnFocus = null;
function setMenu(open, restoreFocus = true) {
  open = Boolean(open && mobileQuery.matches);
  if (open) menuReturnFocus = document.activeElement;
  document.body.classList.toggle('menu-open', open);
  menuToggle.setAttribute('aria-expanded', String(open));
  backdrop.hidden = !open;
  sidebar.inert = mobileQuery.matches && !open;
  document.querySelector('main').inert = open;
  document.querySelector('.mobile-header').inert = open;
  if (open) {
    sidebar.setAttribute('role', 'dialog');
    sidebar.setAttribute('aria-modal', 'true');
    closeButton.focus();
  } else {
    sidebar.removeAttribute('role');
    sidebar.removeAttribute('aria-modal');
    if (restoreFocus && mobileQuery.matches && menuReturnFocus) menuReturnFocus.focus();
  }
}
menuToggle.addEventListener('click', () => setMenu(true));
closeButton.addEventListener('click', () => setMenu(false));
backdrop.addEventListener('click', () => setMenu(false));
mobileQuery.addEventListener('change', () => setMenu(false));
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('menu-open')) return;
  if (e.key === 'Escape') { e.preventDefault(); setMenu(false); }
  if (e.key === 'Tab') {
    const links = [...sidebar.querySelectorAll('a[href],button')].filter(el => el.getClientRects().length);
    const first = links[0], last = links[links.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
treeEl.addEventListener('click', e => {
  const node = e.target.closest('a.node:not(.is-folder)');
  if (node) setMenu(false);
});
pageEl.addEventListener('click', e => {
  if (e.target.closest('[data-open-menu]')) setMenu(true);
});
setMenu(false, false);

/* ---------- 侧栏树 ---------- */
function renderTree() {
  treeEl.innerHTML = "";
  const pinned = pinnedOf(items);
  const group = (label) => {
    const g = document.createElement("div");
    g.className = "grp";
    g.textContent = label;
    treeEl.appendChild(g);
  };
  function nodeFor(item) {
    const node = document.createElement("a");
    node.className = "node" + (item.type === "folder" ? " is-folder" : "") +
                     (item.type === "folder" && expanded[item.id] ? " open" : "");
    node.dataset.id = item.id;
    node.href = "#/" + item.id;
    const tw = document.createElement("span");
    tw.className = "tw"; tw.textContent = item.type === "folder" ? "▶" : "";
    node.appendChild(tw);
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = item.name || "(Untitled)";
    node.appendChild(nm);
    if (item.enabled) {
      const c = document.createElement("span");
      c.className = "cloud"; c.textContent = "☁"; c.title = "Published to the web";
      node.appendChild(c);
    }
    return node;
  }
  function add(item, container) {
    const node = nodeFor(item);
    container.appendChild(node);
    if (item.type !== "folder") return;
    if (!(item.id in expanded)) expanded[item.id] = childrenOf(item.id).length > 0;
    const kids = document.createElement("div");
    kids.className = "kids";
    kids.hidden = !expanded[item.id];
    node.addEventListener("click", (e) => {
      e.preventDefault();                       // 文件夹只展开/收起，不跳转
      expanded[item.id] = !expanded[item.id];
      kids.hidden = !expanded[item.id];
      node.classList.toggle("open", expanded[item.id]);
    });
    childrenOf(item.id).forEach(k => add(k, kids));
    container.appendChild(kids);
  }
  if (pinned.length) {
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'grp pin-toggle';
    toggle.textContent = 'Pinned · ' + pinned.length;
    toggle.setAttribute('aria-controls', 'pinned-items');
    toggle.setAttribute('aria-expanded', String(pinnedOpen));
    const list = document.createElement('div');
    list.id = 'pinned-items';
    list.hidden = !pinnedOpen;
    pinned.forEach(i => add(i, list));
    toggle.addEventListener('click', () => {
      pinnedOpen = !pinnedOpen;
      list.hidden = !pinnedOpen;
      toggle.setAttribute('aria-expanded', String(pinnedOpen));
    });
    treeEl.append(toggle, list);
  }
  const roots = childrenOf(null);
  if (roots.length) { group("All"); roots.forEach(i => add(i, treeEl)); }
  if (!items.length) {
    treeEl.innerHTML = '<p class="state">No writing published yet.</p>';
  }
}

/* ---------- 首页：文稿列表 ---------- */
function renderHome() {
  document.title = "Writing · hudsonwang.com";
  treeEl.querySelectorAll(".node.active").forEach(n => n.classList.remove("active"));
  pageEl.innerHTML =
    '<button class="home-picker" type="button" data-open-menu>Browse writing →</button>';
}

/* ---------- 单篇 ---------- */
async function renderDoc(id) {
  treeEl.querySelectorAll(".node").forEach(n => n.classList.toggle("active", n.dataset.id === id));
  const item = items.find(i => i.id === id) || {};
  pageEl.innerHTML = '<p class="crumb"><a href="#/">← All writing</a></p><p class="state">Loading…</p>';
  try {
    const res = await fetch(API + "/v1/doc/" + encodeURIComponent(id), { cache: "no-store" });
    if (!res.ok) throw new Error("This document is no longer available on the website.");
    const doc = await res.json();
    const name = item.name || "Untitled";
    const content = sanitize(doc.content);
    const text = document.createElement("template");
    text.innerHTML = content;
    const characters = [...(text.content.textContent || "")].length;
    document.title = name + " · hudsonwang.com";
    pageEl.innerHTML =
      '<p class="crumb"><a href="#/">← All writing</a></p>' +
      '<h1 class="title">' + esc(name) + '</h1>' +
      '<p class="meta">' +
        '<span class="pill">' + esc((characters / 1000).toFixed(1)) + 'k characters</span>' +
        '<span>Updated ' + esc(fmtTime(doc.updatedAt || doc.syncedAt)) + '</span>' +
      '</p>' +
      '<article>' + content + '</article>';
    pageEl.querySelectorAll('article table').forEach(table => {
      const scroll = document.createElement('div');
      scroll.className = 'table-scroll';
      scroll.tabIndex = 0;
      scroll.setAttribute('role', 'region');
      scroll.setAttribute('aria-label', 'Table, scroll horizontally');
      table.before(scroll);
      scroll.appendChild(table);
    });
    // 公式：只读 + 真正渲染出来。
    // App 存的是 data-formula-latex（真正的 LaTeX 源码），元素的子节点是它自己的
    // 纯文本回退；这里把 LaTeX 喂回去，MathLive 才会画出分式/根号/上下标。
    pageEl.querySelectorAll('article math-field').forEach(function (mf) {
      const holder = mf.closest('[data-formula-latex]');
      const latex = (holder && holder.getAttribute('data-formula-latex')) ||
                    mf.getAttribute('data-formula-latex') || mf.getAttribute('latex') || '';
      if (latex) { try { mf.value = latex; } catch (e) { mf.setAttribute('latex', latex); } }
      mf.innerHTML = '';                       // 丢掉纯文本回退，只留 MathLive 画出来的
      mf.setAttribute('read-only', '');
      mf.removeAttribute('contenteditable');
      mf.removeAttribute('tabindex');
      mf.setAttribute('aria-readonly', 'true');
    });
    // 纯文本回退那一层也藏掉（否则会和渲染出来的公式重叠）
    pageEl.querySelectorAll('article .formula-fallback').forEach(function (el) {
      el.style.display = 'none';
    });
    window.scrollTo(0, 0);
  } catch (e) {
    pageEl.innerHTML = '<p class="crumb"><a href="#/">← All writing</a></p>' +
      '<p class="state big">' + esc(e.message) + '</p>';
  }
}

/* ---------- 路由：/ 列表，#/<id> 单篇 ---------- */
function route() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if (!id) { renderHome(); return; }
  const hit = items.find(i => i.id === id);
  if (hit && hit.type === "folder") { expanded[id] = true; renderTree(); renderHome(); return; }
  renderDoc(id);
}
window.addEventListener("hashchange", route);

/* ---------- 起步 ---------- */
async function load() {
  try {
    const res = await fetch(API + "/v1/tree", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const tree = await res.json();
    items = Array.isArray(tree.items) ? tree.items : [];
    renderTree();
    route();
  } catch (e) {
    treeEl.innerHTML = '<p class="state">Unable to reach the sync service: ' + esc(e.message) + '</p>';
    pageEl.innerHTML = '<p class="state big">Unable to reach the sync service: ' + esc(e.message) + '</p>';
  }
}
load();
</script>
</body>
</html>
