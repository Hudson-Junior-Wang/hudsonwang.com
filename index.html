<p>After completing this module, you will be able to:</p>
<ul><li>Describe the features of complex adaptive systems, including emergence and self-organisation</li><li>Identify the characteristics of structural complexity in projects</li><li>Interpret reinforcing and balancing feedback loops in a system</li><li>Use a causal loop diagram (CLD) to represent interdependencies in a complex project system</li></ul>
<h3>Note of Slides</h3>
<h3>1. Why Complex Projects Require Systems Thinking</h3>
<p>Complex projects often experience delays, cost overruns, poor performance, and failure because they involve many stakeholders, competing interests, political challenges, and interconnected activities.</p>
<p>Systems thinking helps project managers avoid reductionist thinking. Instead of viewing a project as a collection of separate tasks, it considers the relationships, interactions, feedback, and wider environment that influence project outcomes.</p>
<p>Complex project management is not a “one best way” approach. Successful project managers must select and adapt different tools according to the situation. They need to think like:</p>
<ul><li>Artists, by choosing appropriate methods for each situation.</li><li>Scientists, by analysing evidence and synthesising information.</li><li>Politicians, by influencing stakeholders and managing relationships.</li></ul>
<h3>2. Complex Adaptive Systems</h3>
<p>A complex project can be understood as a Complex Adaptive System (CAS). A CAS consists of many interacting elements, such as people, organisations, technologies, and processes. These elements adapt and change in response to one another and to the external environment.</p>
<p>Because of these interactions, overall project behaviour may be surprising or unpredictable. New patterns can emerge even when nobody has directly planned or designed them.</p>
<p>Common characteristics of a CAS include:</p>
<ul><li>Hierarchy</li><li>Communication</li><li>Control</li><li>Emergence</li><li>Self-organisation</li><li>Phase transitions</li><li>Non-linearity</li><li>Adaptiveness</li><li>Sensitivity to initial conditions</li></ul>
<p>Not every complex project behaves as a CAS, but these concepts are useful for understanding project behaviour.</p>
<h3>Emergence</h3>
<p>Emergence occurs when the interaction of several activities or events creates an outcome that is significantly different from what would be expected from the individual parts.</p>
<p>A jumbo jet project may be highly complicated because it contains many parts, but it may not be complex. By contrast, making mayonnaise is complex because egg yolks, oil, and lemon juice combine to create a new substance with properties that cannot be understood simply by examining the ingredients. This transformation is also difficult to reverse.</p>
<h3>Self-Organisation</h3>
<p>Self-organisation refers to the ability of a system to develop patterns or order without direct external control.</p>
<p>For project leadership, this suggests that leaders should sometimes act as facilitators, support distributed leadership, and allow teams to organise themselves. However, self-organisation does not mean that there is no causality or that the outcome will always be positive.</p>
<p>Project leaders can influence emergence by creating suitable containers. Containers are structures, boundaries, rules, or conditions that guide the direction of emerging behaviour.</p>
<h3>The Edge of Chaos</h3>
<p>The edge of chaos is the zone between complete order and complete disorder. It is often where systems are most creative, adaptive, and capable of learning.</p>
<ul><li>Too much order creates rigidity and prevents adaptation.</li><li>Too much chaos makes coordination and purposeful action impossible.</li><li>Effective projects require enough structure for coordination and enough flexibility for innovation.</li></ul>
<h3>3. Types of Project Complexity</h3>
<p>Project complexity may involve several dimensions:</p>
<p>Structural complexity: A large number of interrelationships and dependencies.</p>
<p>Technical complexity: Radical innovation or unfamiliar technology.</p>
<p>Directional complexity: Lack of clarity about goals or project direction.</p>
<p>Temporal complexity: Changes in the project environment over time.</p>
<p>Relational or socio-cultural complexity: Conflicting relationships, values, interests, and power dynamics.</p>
<h3>Structural Complexity</h3>
<p>Structural complexity is common in large engineering, construction, information technology, defence, and infrastructure projects.</p>
<p>Typical questions include:</p>
<ul><li>How do all the parts fit together?</li><li>How can all the interdependencies be managed?</li><li>How can risks that depend on one another be identified?</li><li>How can a project with many simultaneous activities be scheduled?</li></ul>
<p>Structural complexity is caused by the large number of interdependent tasks, risks, behaviours, teams, and contracts. Even when individual activities can be estimated accurately, the relationships between them can create uncertainty about time, cost, resources, and outcomes.</p>
<p>Traditional methodologies such as PMBOK, PRINCE2, and Waterfall have limitations because they:</p>
<ul><li>Assume relatively linear relationships between activities.</li><li>Struggle to represent reciprocal interactions.</li><li>Do not easily accommodate uncertainty about goals and methods.</li><li>Often ignore systemic and holistic effects.</li><li>Do not adequately capture feedback, delays, and changing dynamics.</li></ul>
<p>Structural complexity also affects:</p>
<ul><li>Communication: Formal communication channels may become too rigid, while informal networks become increasingly important.</li><li>Control: Strong structures can absorb shocks, but excessive control reduces adaptability.</li><li>Initial conditions: Early decisions can create inertia, making it difficult to change direction later.</li><li>Coordination: Large numbers of tasks and teams require clear roles, reliable communication, and strong integration.</li></ul>
<h3>4. System Dynamics</h3>
<p>System Dynamics (S — D) is a useful approach for analysing structurally complex projects. It views systems as networks of interacting feedback loops rather than simple chains of cause and effect.</p>
<p>Important features of System Dynamics include:</p>
<ul><li>Multiple intersecting feedback loops.</li><li>Non-linear relationships.</li><li>Positive feedback loops that amplify growth or decline.</li><li>Negative feedback loops that regulate behaviour.</li><li>Delays between causes and effects.</li><li>Effects that may be separated across time and distance.</li></ul>
<h3>Causal Loop Diagrams</h3>
<p>Causal Loop Diagrams represent relationships between variables..</p>
<p>S or “+” means that two variables move in the same direction.</p>
<p>O or “−” means that two variables move in opposite directions.</p>
<p>A reinforcing loop amplifies change and may produce growth or decline.</p>
<p>A balancing loop counteracts change and tends to maintain stability.</p>
<p>Time delays show that an effect may occur significantly later than its cause.</p>
<p>For example, increased study time may improve marks, while higher marks may reduce exam anxiety. However, increased anxiety may reduce study effectiveness, creating a feedback relationship.</p>
<h3>Channel Tunnel Example</h3>
<p>In the Channel Tunnel shuttle wagon project, the Intergovernmental Commission could approve designs only after work had been completed. Designs were repeatedly returned for rework. The rework changed other features, which then required further approval.</p>
<p>This created a destructive reinforcing loop:</p>
<p>Approval requirements caused rework. Rework changed the design. Design changes required further approval. Further approval delays caused more rework.</p>
<h3>5. Critique of System Dynamics</h3>
<p>System Dynamics is not a form of Hard Systems Thinking because its model is not treated as a final system to be implemented. Instead, the model is used to support individual and organisational learning.</p>
<p>However, social systems can be difficult to model because human motivations, intentions, and behaviours are difficult to define accurately. Definitions and relationships may also change over time.</p>
<p>System Dynamics is most useful in complicated-unitary situations, where people share broadly similar values or interests. It is less straightforward when stakeholders have fundamentally different values or conflicting interests.</p>
<h3>6. Practical Lessons for Project Managers</h3>
<p>Project managers can apply the following lessons:</p>
<ul><li>Look beyond visible problems and search for underlying feedback patterns.</li><li>Consider unintended consequences and delays between actions and results.</li><li>Avoid treating symptoms without addressing the causes.</li><li>Look for small interventions that may create significant improvements.</li><li>Recognise that the project manager is part of the system, not an outside observer.</li><li>Avoid blaming the environment or other people for project problems.</li><li>Be prepared to change existing mental models through double-loop or triple-loop learning.</li><li>Balance structure and flexibility according to the level of project complexity.</li><li>Manage within complexity rather than attempting to eliminate or control it completely.</li></ul>
<h3>Note of Chapter 2</h3>
<h3>1. Complexity Is a Matter of Perception</h3>
<p>Complexity is not only an objective property of a project; it is also influenced by how people perceive the situation.</p>
<ul><li>People with a narrow focus may fail to see complexity because they ignore information outside their area of expertise.</li><li>Experienced practitioners may also overlook complexity because they can quickly identify the most important signals and ignore background noise.</li><li>Less experienced managers may see a situation as confusing because they are unable to distinguish important information from irrelevant details.</li></ul>
<p>Managers cannot focus on every part of a project at the same time. They must identify the most significant issues or pivot points that currently influence the project’s direction. These pivot points may change as the project develops.</p>
<h3>2. Categorising Project Complexity</h3>
<p>Projects can be classified according to the main sources of complexity:</p>
<ul><li>Structural complexity: A large number of interdependent elements.</li><li>Technical complexity: Difficult or innovative technical designs.</li><li>Directional complexity: Unclear or changing goals and project direction.</li><li>Temporal complexity: Changes in the project environment over time.</li></ul>
<p>These categories help managers identify possible causes and remedies. However, the categories are not completely separate. A project may experience several types of complexity at the same time.</p>
<p>Categorisation is useful because it creates structure and supports communication. However, it can also create limitations. Managers may focus too heavily on the categories themselves and overlook connections between categories or characteristics that do not fit neatly into any category.</p>
<h3>3. Navigating Complexity</h3>
<p>There is no single formula or framework that works for every complex project. A situation may appear chaotic until the manager identifies the right signals or “markers.” These markers provide points of reference and help make the situation more manageable.</p>
<p>Expert practitioners often develop an intuitive understanding of how to simplify complexity appropriately. Until this expertise is developed, managers should:</p>
<ul><li>Examine each situation on its own terms.</li><li>Identify the most important sources of uncertainty.</li><li>Apply suitable tools and methods.</li><li>Continue monitoring the situation as it changes.</li></ul>
<p>Simplifying complexity does not mean ignoring important information. It means focusing attention on the factors that have the greatest influence on the project at a particular time.</p>
<h3>4. Changing Perspectives</h3>
<p>Managing complexity requires the ability to move between different levels and angles of analysis.</p>
<p>A manager may need to shift between:</p>
<ul><li>A broad overview of the entire project.</li><li>A detailed examination of a specific task or problem.</li><li>Intermediate levels between the overall system and individual components.</li><li>Different perspectives, such as organisational structure, products, outcomes, stakeholders, or processes.</li></ul>
<p>This can be compared to changing between the perspective of an eagle, which sees the whole landscape, and a mouse, which sees small details close up.</p>
<p>Project management tools can help managers change perspectives. For example:</p>
<ul><li>An organisational breakdown structure focuses on responsibilities and organisational relationships.</li><li>A product breakdown structure focuses on outputs, deliverables, and project results.</li></ul>
<p>Using more than one tool can reveal different aspects of the same project and generate new options for action. The ability to deliberately change perspective is therefore an important management skill.</p>
<h3>5. Reflective Practice</h3>
<p>Reflection is essential for learning and improvement. Managers should reflect on:</p>
<ul><li>How the project matched the four types of complexity.</li><li>How the sources of complexity changed over time.</li><li>Whether the selected tools were effective.</li><li>How different tools and methods interacted.</li><li>Whether the management approach suited the specific project context.</li><li>How the project could have been managed differently.</li></ul>
<p>Reflective practice helps managers learn from experience rather than simply repeating existing routines. It connects action, evaluation, and future improvement.</p>
<h3>6. Quantity, Ambiguity, and Interconnectedness</h3>
<p>Complexity generally increases through the interaction of three factors:</p>
<h3>Quantity</h3>
<p>The greater the number of elements in a project, the more difficult it becomes to monitor the whole system.</p>
<h3>Ambiguity</h3>
<p>Ambiguity exists when the final state of a project, problem, or solution is unclear. It makes detailed planning difficult because the manager must continue to investigate and redefine the situation.</p>
<h3>Interconnectedness</h3>
<p>Interconnectedness refers to the relationships and dependencies between project elements. When uncertain elements influence one another, the project becomes much more difficult to understand and control.</p>
<p>A project with one uncertain element may still be manageable if the rest of the project is stable. However, when several uncertain elements are interdependent, the number of possible outcomes increases rapidly.</p>
<p>For example:</p>
<ul><li>One uncertain element with four possible states creates four possible outcomes.</li><li>Three interdependent uncertain elements with four possible states each create 64 possible outcomes.</li><li>Eight such elements create 65,536 possible outcomes.</li></ul>
<p>This expansion is not linear. Once the number of elements and relationships passes a certain threshold, a project may undergo a phase transition from being merely complicated to being genuinely complex. At this point, emergent and non-linear behaviours may appear, and the overall system can no longer be predicted by analysing its individual parts separately.</p>
<h3>7. The Satisficing Zone</h3>
<p>In complex projects, managers rarely have unlimited time, information, or resources. As a result, they often seek a solution that is good enough rather than perfectly optimal.</p>
<p>This is known as satisficing, a concept associated with Herbert Simon. A satisficing decision is rational when the cost of searching for a better solution is greater than the likely benefit.</p>
<p>The acceptable solution may change during the project because:</p>
<ul><li>Goals may change.</li><li>New information may become available.</li><li>Stakeholder expectations may shift.</li><li>The external environment may develop in an unexpected way.</li><li>Continuing to search for a better solution may no longer be worthwhile.</li></ul>
<p>In some projects, the criteria for success are unclear until the product or outcome reaches the market. Therefore, the project team may need to decide when the result is sufficiently satisfactory rather than waiting for a clearly defined optimal solution.</p>
<h3>8. Problem and Solution Spaces</h3>
<p>A project problem is not always a single clearly defined issue. It can be understood as a range of possible problem definitions, known as the problem space.</p>
<p>Similarly, the possible responses form a solution space.</p>
<p>Both spaces may change as the project develops:</p>
<ul><li>Client requirements may alter the problem space.</li><li>New information may redefine the problem.</li><li>Available resources may expand or restrict the solution space.</li><li>Changes in one part of the project may affect other problem and solution spaces.</li></ul>
<p>Therefore, project tasks and deliverables should often be viewed as ranges of possibilities rather than fixed points.</p>
<h3>Key Takeaways</h3>
<ul><li>Complexity depends partly on perception and the observer’s perspective.</li><li>Categorisation helps structure thinking but can also create blind spots.</li><li>Managers should identify important pivot points and update their focus over time.</li><li>Complex projects require flexible movement between different levels and perspectives.</li><li>Reflection is necessary for continuous learning and improvement.</li><li>Complexity increases with the quantity, ambiguity, and interconnectedness of project elements.</li><li>Beyond a certain threshold, projects may display phase transitions, emergence, and non-linear behaviour.</li><li>Managers often need to pursue satisfactory solutions rather than perfect solutions.</li><li>Problem and solution spaces are fluid and may change throughout the project lifecycle.</li></ul>
<h3>Note of Chapter 3</h3>
<h3>1. Definition</h3>
<p>Structurally complex projects are projects with a large number of interdependent tasks, teams, contracts, risks, and organisational relationships.</p>
<p>They are most common in:</p>
<ul><li>Engineering</li><li>Construction</li><li>Information technology</li><li>Defence</li><li>Shipbuilding</li><li>Large infrastructure projects</li></ul>
<p>Typical questions include:</p>
<ul><li>How do all the parts fit together?</li><li>How can we track all the interdependencies?</li><li>How can the project be scheduled?</li><li>Which risks may trigger other risks?</li><li>How can the whole project be kept under control?</li></ul>
<p>The main challenges involve project organisation, scheduling, contract management, communication, risk management, and coordination between interrelated activities.</p>
<h3>2. Complexity Theory Perspective</h3>
<p>Individual components of a structurally complex project may appear ordinary when examined separately. However, as more elements are added, the number of possible interactions increases rapidly.</p>
<p>After the project passes a critical threshold, it may experience a phase transition. At this point:</p>
<ul><li>Emergent behaviour begins to appear.</li><li>The project becomes more sensitive to its initial conditions.</li><li>Communication patterns become more rigid.</li><li>The system develops strong internal inertia.</li><li>Non-linear effects become increasingly difficult to predict.</li></ul>
<p>The main source of ambiguity in structurally complex projects is usually uncertainty about the combined effects of time, cost, resources, and quality.</p>
<p>Even when each individual activity can be estimated accurately, a change in one area may create a chain reaction across many other areas. The overall complexity therefore comes less from uncertainty within individual tasks and more from the massive number of connections between tasks.</p>
<h3>3. Communication</h3>
<p>Communication in Complexity Theory refers to how information moves between subsystems and between the project and its external environment.</p>
<p>Structurally complex projects usually have:</p>
<ul><li>Formal, rule-based communication channels.</li><li>Clearly defined reporting procedures.</li><li>Information flows controlled by roles, protocols, and security requirements.</li><li>Efficient communication for specific types of predetermined information.</li></ul>
<p>These systems can respond quickly to familiar signals, but they may ignore information that does not fit established procedures. Important information may also be delayed if the right people are excluded from formal communication channels.</p>
<p>As projects become larger, informal communication networks usually develop to fill gaps in the formal system. However, if informal information conflicts with formal reports, team members may lose trust in the official communication system.</p>
<h3>4. Control and Adaptation</h3>
<p>In Complexity Theory, control means the ability of a system to maintain its form and stability. This differs from the traditional project management definition of control, which focuses on achieving planned performance.</p>
<p>Structurally complex projects normally have:</p>
<ul><li>Firmly defined roles and responsibilities.</li><li>Strong hierarchies.</li><li>Explicit procedures and internal controls.</li><li>Stable patterns of interaction.</li></ul>
<p>This creates a rigid form of stability. It can help the project absorb short-term shocks without major disruption, but it also makes the project slow to adapt to major environmental changes.</p>
<p>A large project behaves like a container ship: once it is moving in a particular direction, changing course requires considerable time and effort. Different parts of the project may respond to change, but the entire system is unlikely to adapt quickly.</p>
<h3>5. Sensitivity to Initial Conditions</h3>
<p>Early decisions strongly influence the later direction of a structurally complex project.</p>
<p>Once the project structure, contracts, processes, and schedules are established, inertia tends to keep the project moving in the same direction. This can happen even when external conditions change or the original direction is no longer appropriate.</p>
<p>Because of this dependence on initial conditions:</p>
<ul><li>Early planning quality is extremely important.</li><li>Poor assumptions can become embedded in the project structure.</li><li>Later changes may be expensive and difficult.</li><li>The project may break apart rather than successfully reorganise.</li></ul>
<h3>6. Order and Chaos</h3>
<p>Structurally complex projects usually operate best closer to the order side of the order–chaos spectrum.</p>
<p>They require:</p>
<ul><li>Clear organisational structures.</li><li>Strong coordination.</li><li>Reliable communication.</li><li>Defined responsibilities.</li><li>Strict integration and control.</li></ul>
<p>Too much internal disorder can quickly produce non-linear and emergent effects. If the project becomes excessively chaotic, it may collapse rather than adapt into a new structure.</p>
<p>However, excessive rigidity can also prevent the project from responding to major environmental change. The management challenge is to create a structure that is stable enough to coordinate the project but not so rigid that adaptation becomes impossible.</p>
<h3>7. Shipbuilding as an Example</h3>
<p>Shipbuilding illustrates structural complexity because it involves:</p>
<ul><li>Many specialised people and organisations.</li><li>Multiple shipyards and suppliers.</li><li>Numerous components and contracts.</li><li>Parallel activities across the supply chain.</li><li>Strict inspection and testing requirements.</li><li>Complex scheduling and approval procedures.</li><li>Extensive communication and governance systems.</li></ul>
<p>A defect in one component may affect hundreds of dependent elements. Delays, cost increases, and quality problems can therefore spread throughout the project.</p>
<p>Reducing personnel may also remove important redundancy. The absence of one key technician can create major delays if nobody else has the necessary knowledge. Informal communication networks that previously supported the formal system may also weaken.</p>
<h3>8. Major Project Management Challenges</h3>
<h3>Early Feasibility and Definition</h3>
<p>The early phases are critical. Poor analysis of options, incomplete scope definition, unrealistic cost estimates, and insufficient risk analysis can create serious problems later.</p>
<p>Political or stakeholder pressure may force a project to begin before adequate planning is completed. This often produces over-optimistic budgets and schedules.</p>
<h3>Executive Support</h3>
<p>Executives should protect the time and resources required for:</p>
<ul><li>Detailed option analysis.</li><li>Realistic cost estimation.</li><li>Comprehensive risk analysis.</li><li>Appropriate contingency planning.</li></ul>
<p>During implementation and handover, executives should also support rapid escalation and decision-making while helping the project team maintain awareness of the wider environment.</p>
<h3>Project Manager Capabilities</h3>
<p>Project managers need traditional skills in:</p>
<ul><li>Scheduling.</li><li>Cost control.</li><li>Organisation.</li><li>Integration.</li><li>Contract management.</li><li>Risk management.</li></ul>
<p>They also need to:</p>
<ul><li>Move between the big picture and detailed issues.</li><li>Think creatively when risks emerge.</li><li>Develop several possible responses.</li><li>Make timely and decisive decisions.</li><li>Maintain a multi-perspective view of the project.</li><li>Understand financial processes and organisational constraints.</li></ul>
<p>In a fast-changing environment, delayed decisions may create more risks than an occasional incorrect decision.</p>
<h3>Team Support</h3>
<p>Project teams are often made up of highly specialised professionals. Their detailed knowledge is essential, but excessive focus on individual tasks may cause them to overlook issues that cross organisational or technical boundaries.</p>
<p>Teams need:</p>
<ul><li>Regular interface meetings.</li><li>Integrating roles that connect different specialists.</li><li>Strong document control and reporting.</li><li>Sufficient staffing and knowledge redundancy.</li></ul>
<p>Reducing the team to the absolute minimum may create false savings and increase safety, continuity, and knowledge-management risks.</p>
<h3>9. Financial and Scheduling Issues</h3>
<p>Large structurally complex projects often have poor cost performance because of:</p>
<ul><li>Inadequate early planning.</li><li>Insufficient feasibility resources.</li><li>Over-optimistic estimates.</li><li>Weak risk analysis.</li><li>Pressure to provide unrealistic certainty.</li></ul>
<p>Earned Value Management can link scope, schedule, and cost. It helps managers estimate the financial consequences of schedule delays.</p>
<p>Schedules should be treated as active management and prediction tools, not documents created only for project approval. They should be updated frequently, sometimes daily, because schedule changes may reveal emerging risks affecting cost, scope, quality, and delivery.</p>
<p>Fast-tracking increases complexity because implementation begins before design and specifications are complete. It may combine structural, technical, directional, and temporal complexity, leading to a high probability of cost and schedule overruns.</p>
<h3>10. Risk Management and Procurement</h3>
<p>Risk lists and matrices are useful, but they may encourage managers to examine each risk separately. This can hide connections and feedback loops between risks.</p>
<p>In structurally complex projects:</p>
<ul><li>Risks may compound.</li><li>One risk may trigger several others.</li><li>Positive feedback loops may create vicious circles.</li><li>Sudden crises may emerge after a period of apparent stability.</li></ul>
<p>Causal mapping and System Dynamics can help identify relationships and potential escalation patterns that linear risk analysis may miss.</p>
<p>Procurement should be considered creatively. Traditional contracts may be effective when the project is well defined, but collaborative arrangements such as partnerships and alliances may be more suitable when uncertainty and interdependence are high. These approaches require trust and cultural change, which can be difficult in industries with adversarial contracting traditions.</p>
<h3>11. Common Traps</h3>
<p>Important traps include:</p>
<ul><li>Rushing the feasibility phase.</li><li>Underestimating time and cost.</li><li>Focusing too much on detail during implementation.</li><li>Ignoring the wider project context.</li><li>Analysing risks individually rather than systemically.</li><li>Overlooking problems that cross organisational boundaries.</li><li>Allowing disputes to continue for too long.</li><li>Removing redundancy from the project team.</li><li>Failing to update schedules and cost estimates.</li><li>Ignoring early signs of reinforcing risk loops.</li></ul>
<h3>Key Takeaways</h3>
<ul><li>Structural complexity comes mainly from large numbers of interdependent elements.</li><li>Accurate estimates for individual tasks do not guarantee accurate project-level predictions.</li><li>Formal structures improve stability but may reduce adaptability.</li><li>Initial decisions can create strong project inertia.</li><li>Communication systems must support both formal reporting and informal information needs.</li><li>Early feasibility, cost estimation, and risk analysis are critical to project success.</li><li>Project managers must combine detailed control with a broad systemic perspective.</li><li>Risks should be analysed as connected patterns rather than isolated items.</li><li>Adequate staffing, redundancy, frequent schedule updates, and rapid escalation are essential.</li><li>Structurally complex projects require robust organisation, but also enough flexibility to respond to change.</li></ul>
<h3>Note of Video 1</h3>
<p>Main idea:</p>
<p>Complex systems theory studies how interactions between individual components—or “agents”—produce larger system-wide behaviors.</p>
<p>Key concepts:</p>
<ul><li>Nonlinearity and chaos: Small changes can lead to large, unpredictable outcomes—the “butterfly effect.”</li><li>Emergence: Complex patterns arise from simple rules followed by individual agents.</li><li>Feedback loops:</li><li>Positive feedback amplifies change, encouraging growth or decline.</li><li>Negative feedback stabilizes a system.</li><li>Adaptability: Complex systems evolve through ongoing interactions with their environment.</li><li>Analytical tools: Network theory, chaos theory, and computational models help researchers study these systems.</li><li>Applications: Biology, ecosystems, social behavior, technology, economics, weather, and financial markets.</li></ul>
<h3>Takeaway:</h3>
<p>Complex systems theory provides a unified way to understand dynamic, interconnected systems and can help us anticipate behavior and design better interventions—although perfect prediction is often impossible.</p>
<h3>Note of Video 2</h3>
<p>Main idea:</p>
<p>Causal loop diagrams (CLDs) help visualize how variables influence one another over time. They clarify mental models, reveal recurring system patterns, and support better discussion of complex problems.</p>
<p>Core components:</p>
<ul><li>Variables: Things, actions, conditions, or feelings.</li><li>Causal links: Arrows showing how one variable affects another.</li><li>Polarity:</li><li>Positive (+): Variables move in the same direction—more leads to more, or less leads to less.</li><li>Negative (−): Variables move in opposite directions—more leads to less, or less leads to more.</li><li>Delays: Marked links showing that an effect takes time to appear.</li></ul>
<p>Two major feedback loops:</p>
<ul><li>Reinforcing loops (R): Amplify change. For example, more population → more births → more population. These can create exponential growth or decline.</li><li>Balancing loops (B): Counteract change and promote stability. For example, higher body temperature → more sweating → cooling, or more deaths → fewer people available to die later.</li></ul>
<p>Examples discussed:</p>
<ul><li>Population growth, births, deaths, and life expectancy</li><li>Compound interest and technology adoption</li><li>Supply and demand</li><li>Traffic density and speed</li><li>Inequality and conflict</li><li>Greenhouse gases and climate change</li><li>Cattle, grass, grazing, and soil erosion</li></ul>
<p>Important lesson:</p>
<p>A diagram’s conclusions depend on its assumptions and context. Delays, resource limits, technology, and social beliefs can significantly change how a system behaves. CLDs are simplified models for understanding relationships—not perfect predictions.</p>
<h3>Takeaway:</h3>
<p>To read a causal loop diagram, trace each relationship, identify its polarity, follow the loop, and decide whether it reinforces or balances change.</p>
<h3>Note of Video 3</h3>
<p>Main idea:</p>
<p>Emergence occurs when separate components or systems interact and produce something new—often with properties that cannot be predicted simply by studying the parts individually.</p>
<p>Examples from the video:</p>
<ul><li>Biology: Individual cells organize into chambers and begin pumping, creating a functioning heart.</li><li>Chemistry: Hydrogen and oxygen have distinct properties, but together they form water.</li><li>Music: Two people playing instruments can create a musical result that neither produces alone.</li><li>Cosmology: The universe can be understood as a dynamic system whose large-scale behavior emerges over time.</li></ul>
<p>Key lesson:</p>
<p>As systems become more interconnected, new patterns, structures, and behaviors can arise from the relationships among their parts. Understanding a complex system therefore requires studying both its components and how they interact.</p>
<h3>Takeaway:</h3>
<p>The whole can have capabilities and characteristics that do not exist in the parts alone. Systems thinking helps us recognize and explain these emergent properties.</p>
<h3>Note of Video 4</h3>
<p>Main idea:</p>
<p>A complex project is not simply a large project. Its complexity emerges over time from many interconnected people, processes, technologies, goals, and external conditions that are difficult to predict or control.</p>
<p>Sources of project complexity:</p>
<ul><li>Structural complexity: Multiple partners, stakeholders, suppliers, or organizational interfaces.</li><li>Technical complexity: Difficult technologies, systems, or integration requirements.</li><li>Directional complexity: Misaligned goals, priorities, or definitions of success.</li><li>Temporal complexity: Changing conditions, dependencies, deadlines, and effects that unfold over time.</li><li>Socio-cultural complexity: Human interactions, diverse perspectives, communication challenges, and unconscious bias.</li></ul>
<p>What project leaders need:</p>
<p>Managing complex projects requires more than controlling the traditional scope–budget–schedule triangle. Professionals also need:</p>
<ul><li>Soft and people skills</li><li>Leadership and team-development abilities</li><li>Systemic risk awareness</li><li>Strong decision-making in uncertain environments</li></ul>
<h3>Takeaway:</h3>
<p>Complex projects should be understood as dynamic systems rather than fully predictable plans. Effective leaders recognize where complexity comes from, engage the people involved, and adapt decisions and governance as the project evolves.</p>`;

<h3>Week 3 Workshop — Completed Draft</h3>
<p>Note: The guide says each group will be assigned one scenario. All three scenarios are completed below; submit or present only the scenario assigned to your group.</p>
<h3>Activity 1 — Complex Projects as Complex Adaptive Systems</h3>

<h3>Ride-share algorithms and traffic distribution</h3>
<ul><li>Ride-share companies identify intersections that benefit their business.</li><li>They modify their routing algorithms.</li><li>More vehicles are directed through particular intersections.</li><li>Traffic becomes concentrated in new locations.</li><li>The original traffic model becomes less accurate.</li><li>Engineers then modify the system again.</li></ul>

<h3>Activity 2 — Causal Loop Diagram</h3>
<h3>Suggested topic</h3>
<p>A suitable topic is:</p>
<p>The feedback relationships between financial pressure, employment, sleep, health, screen time, and emotional wellbeing.</p>
<p>Suggested variables:</p>
<ul><li>Financial pressure</li><li>Employment or job-seeking effort</li><li>Income or financial resources</li><li>Screen time</li><li>Sleep</li><li>Health</li><li>Emotional wellbeing</li><li>Uncompleted household chores</li></ul>
<h3>Loop R1: Financial Pressure and Screen Time</h3>
<h3>Causal relationships</h3>
<p>Financial pressure → Screen time: S — More financial pressure may lead to more screen use as a way to escape or relax. Screen time → Sleep: O — More screen time can reduce sleep duration or sleep quality. Sleep → Emotional wellbeing: S — Better sleep generally improves emotional wellbeing. Emotional wellbeing → Financial pressure: O — Better emotional wellbeing may improve a person’s ability to deal with financial problems, reducing financial pressure.</p>
<p>There are two O links in this loop. Because the number of O links is even, this is:</p>
<h3>R1 — Reinforcing Loop</h3>
<p>The possible vicious cycle is:</p>
<p>Financial pressure increases → screen time increases → sleep decreases → emotional wellbeing declines → financial pressure increases further</p>
<h3>Loop B1: Financial Pressure and Employment Effort</h3>
<h3>Causal relationships</h3>
<p>Financial pressure → Employment or job-seeking effort: S — More financial pressure may motivate a person to work more hours, seek employment, or search for additional income. Employment effort → Income or financial resources: S — More employment effort may increase income or available financial resources. Income or financial resources → Financial pressure: O — Improved financial resources reduce financial pressure.</p>
<p>There is one O link in this loop. Because the number of O links is odd, this is:</p>
<h3>B1 — Balancing Loop</h3>
<p>The balancing process is:</p>
<p>Financial pressure increases → employment effort increases → income increases → financial pressure decreases</p>
<p>This loop depends on the assumption that additional employment effort can produce stable income.</p>
<h3>Loop R2: Household Chores, Sleep, and Health</h3>
<h3>Causal relationships</h3>
<p>Uncompleted household chores → Sleep: O — More uncompleted chores may take time away from rest and reduce sleep. Sleep → Health: S — Better sleep generally improves physical and mental health. Health → Uncompleted household chores: O — Poorer health can make it more difficult to complete household chores, increasing the backlog.</p>
<p>There are two O links in this loop. Therefore, this is:</p>
<h3>R2 — Reinforcing Loop</h3>
<p>The possible vicious cycle is:</p>
<p>More uncompleted chores → less sleep → poorer health → more difficulty completing chores → more uncompleted chores</p>
<h3>How to Draw the Diagram</h3>
<h3>Drawing R1</h3>
<p>Place four variables in a circular arrangement:</p>
<ul><li>Financial pressure</li><li>Screen time</li><li>Sleep</li><li>Emotional wellbeing</li></ul>
<p>Connect them as follows:</p>
<ul><li>Financial pressure → Screen time → Sleep → Emotional wellbeing → Financial pressure</li></ul>
<p>Label the arrows:</p>
<ul><li>Financial pressure → Screen time: S</li><li>Screen time → Sleep: O</li><li>Sleep → Emotional wellbeing: S</li><li>Emotional wellbeing → Financial pressure: O</li></ul>
<p>Write R1 inside or next to the closed loop.</p>
<h3>Drawing B1</h3>
<p>Draw a triangle containing:</p>
<ul><li>Financial pressure</li><li>Employment or job-seeking effort</li><li>Income or financial resources</li></ul>
<p>Connect them as follows:</p>
<ul><li>Financial pressure → Employment effort → Income → Financial pressure</li></ul>
<p>Label the arrows:</p>
<ul><li>Financial pressure → Employment effort: S</li><li>Employment effort → Income: S</li><li>Income → Financial pressure: O</li></ul>
<p>Write B1 inside or next to the loop.</p>
<h3>Drawing R2</h3>
<p>Draw another triangle containing:</p>
<ul><li>Uncompleted household chores</li><li>Sleep</li><li>Health</li></ul>
<p>Connect them as follows:</p>
<ul><li>Uncompleted chores → Sleep → Health → Uncompleted chores</li></ul>
<p>Label the arrows:</p>
<ul><li>Uncompleted chores → Sleep: O</li><li>Sleep → Health: S</li><li>Health → Uncompleted chores: O</li></ul>
<p>Write R2 inside or next to the loop.</p>
<h3>Important drawing rule</h3>
<p>A causal loop diagram must form a closed loop. The arrows must eventually return to the variable where the loop began.</p>
<p>If the arrows only move from one cause to several effects and never return to the starting point, the result is a cause map—not a feedback loop.</p>
<p>Remember:</p>
<ul><li>An even number of O links = Reinforcing loop, R.</li><li>An odd number of O links = Balancing loop, B.</li></ul>
<h3>Wrap-up Reflection</h3>
<h3>What loop surprised you?</h3>
<p>The most surprising loop is the financial pressure–screen time–sleep–emotional wellbeing reinforcing loop.</p>
<p>Screen time may appear to be only an individual habit, but it can be part of a larger system. Financial pressure can increase anxiety, which may lead to more screen use as a coping mechanism. More screen use can reduce sleep, and poor sleep can reduce emotional wellbeing. Reduced emotional wellbeing can then make it harder to deal with financial problems.</p>
<h3>How might it apply to a project?</h3>
<p>The same pattern can occur in project management:</p>
<p>Schedule pressure increases → overtime increases → sleep and energy decrease → errors and rework increase → the project falls further behind → schedule pressure increases again</p>
<p>This is a reinforcing loop.</p>
<p>A project manager should therefore not respond to every delay simply by requiring more overtime. Possible intervention points include:</p>
<ul><li>Adjusting unrealistic deadlines;</li><li>Adding staff or other resources;</li><li>Removing unnecessary work;</li><li>Identifying fatigue and errors early;</li><li>Reducing rework;</li><li>Providing recovery time for the project team.</li></ul>
<h3>Final conclusion</h3>
<p>Complex project outcomes are rarely caused by one factor alone. They result from interactions between people, organisations, technology, constraints, and feedback loops.</p>
<p>Causal loop diagrams help project teams identify:</p>
<ul><li>Which behaviours are emerging;</li><li>Which loops amplify problems;</li><li>Which loops stabilise the system;</li><li>Where an intervention may have the greatest effect.</li></ul>`;

const view = document.getElementById("view");
const nav  = document.getElementById("nav");
const body = document.body;

function sectionDone(sec){ return sec.notes.filter(n=>n.html).length; }

function buildNav(){
  nav.innerHTML="";
  const moreSections = []; // temporarily hidden
  const topSections  = SECTIONS.filter(s=>s.group!=="more");
  function addSection(sec){
    const done=sectionDone(sec);
    const wrap=document.createElement("div");
    wrap.className="sec";
    wrap.dataset.sec=sec.id;

    const head=document.createElement("button");
    head.className="sec-head";
    head.innerHTML=`<span class="caret">▶</span><span class="name">${sec.title}</span>`+
      `<span class="count">${done}</span>`;
    head.addEventListener("click",()=>wrap.classList.toggle("open"));
    wrap.appendChild(head);

    const list=document.createElement("div");
    list.className="sec-notes";
    sec.notes.forEach((note,i)=>{
      const a=document.createElement("a");
      a.className="note-link"+(note.html?"":" empty");
      a.dataset.target=`${sec.id}/${i}`;
      a.href=`#/${sec.id}/${i}`;
      a.innerHTML=`<span class="nl-num">${note.num}</span>${note.html?note.title:"To be updated"}`;
      list.appendChild(a);
    });
    wrap.appendChild(list);
    nav.appendChild(wrap);
  }
  topSections.forEach(addSection);

  // Collapsible "More Courses" group for everything else
  if (moreSections.length){
    const grp=document.createElement("div");
    grp.className="sec group-more";
    const gh=document.createElement("button");
    gh.className="sec-head";
    gh.innerHTML=`<span class="caret">▶</span><span class="name">More Courses</span>`+
      `<span class="count">${moreSections.length}</span>`;
    gh.addEventListener("click",()=>grp.classList.toggle("open"));
    grp.appendChild(gh);
    const gl=document.createElement("div");
    gl.className="sec-notes";
    moreSections.forEach(sec=>{
      const done=sectionDone(sec);
      const sub=document.createElement("div");
      sub.className="sec";
      sub.dataset.sec=sec.id;
      const sh=document.createElement("button");
      sh.className="sec-head";
      sh.innerHTML=`<span class="caret">▶</span><span class="name">${sec.title}</span>`+
        `<span class="count">${done}</span>`;
      sh.addEventListener("click",()=>sub.classList.toggle("open"));
      sub.appendChild(sh);
      const sl=document.createElement("div");
      sl.className="sec-notes";
      sec.notes.forEach((note,i)=>{
        const a=document.createElement("a");
        a.className="note-link"+(note.html?"":" empty");
        a.dataset.target=`${sec.id}/${i}`;
        a.href=`#/${sec.id}/${i}`;
        a.innerHTML=`<span class="nl-num">${note.num}</span>${note.html?note.title:"To be updated"}`;
        sl.appendChild(a);
      });
      sub.appendChild(sl);
      gl.appendChild(sub);
    });
    grp.appendChild(gl);
    nav.appendChild(grp);
  }
}

function renderNote(sec,idx){
  const note=sec.notes[idx];
  if(note.html){
    view.innerHTML=`
      <span class="backlink" data-go="${sec.id}">← ${sec.title}</span>
      <p class="crumb">${sec.title} · Note ${note.num}</p>
      <article>
        <h1>${note.num} · ${note.title}</h1>
        <p class="meta">Study notes · written up by Hudson Junior</p>
        ${note.html}
      </article>`;
  }else{
    view.innerHTML=`
      <span class="backlink" data-go="${sec.id}">← ${sec.title}</span>
      <div class="empty-state">
        <div class="mk">✎</div>
        <h2>To be updated</h2>
        <p>This page (${sec.title}, note ${note.num}) is still empty. I haven't written these notes yet — the course isn't finished.</p>
        <p class="sub">I'm adding pages whenever I find time between classes. Thanks for your patience.</p>
      </div>`;
  }
  view.querySelectorAll("[data-go]").forEach(el=>{
    el.addEventListener("click",()=>location.hash=`#/${el.dataset.go}`);
  });
}

function highlightNav(secId,noteIdx){
  document.querySelectorAll(".sec").forEach(s=>{
    if(s.dataset.sec===secId) s.classList.add("open");
  });
  document.querySelectorAll(".note-link").forEach(a=>a.classList.remove("active"));
  if(noteIdx!=null){
    const a=document.querySelector(`.note-link[data-target="${secId}/${noteIdx}"]`);
    if(a) a.classList.add("active");
  }
}

function router(){
  const hash=location.hash.replace(/^#\/?/,"");
  const parts=hash.split("/").filter(Boolean);
  closeMobileNav();
  window.scrollTo(0,0);

  if(parts.length===0){ renderHome(); highlightNav(null); return; }
  const sec=SECTIONS.find(s=>s.id===parts[0]);
  if(!sec){ renderHome(); highlightNav(null); return; }
  if(parts.length===1){ renderSection(sec); highlightNav(sec.id); return; }
  const idx=parseInt(parts[1],10);
  if(isNaN(idx)||!sec.notes[idx]){ renderSection(sec); highlightNav(sec.id); return; }
  renderNote(sec,idx); highlightNav(sec.id,idx);
}

/* ---------- mobile nav ---------- */
const menuBtn=document.getElementById("menuBtn");
const scrim=document.getElementById("scrim");
function closeMobileNav(){ body.classList.remove("nav-open"); }
menuBtn.addEventListener("click",()=>body.classList.toggle("nav-open"));
scrim.addEventListener("click",closeMobileNav);

document.querySelector("[data-home]").addEventListener("click",e=>{
  // let hash change handle render
});

/* ---------- desktop sidebar collapse ---------- */
const sidebarToggle=document.getElementById("sidebarToggle");
const sidebarShow=document.getElementById("sidebarShow");
function setSidebar(collapsed){
  body.classList.toggle("sidebar-collapsed",collapsed);
  try{ localStorage.setItem("hw_sidebar_collapsed",collapsed?"1":"0"); }catch(e){}
}
sidebarToggle.addEventListener("click",()=>setSidebar(true));
sidebarShow.addEventListener("click",()=>setSidebar(false));
try{ if(localStorage.getItem("hw_sidebar_collapsed")==="1") body.classList.add("sidebar-collapsed"); }catch(e){}

buildNav();
window.addEventListener("hashchange",router);
router();
</script>
</body>
