<ul><li>Indented outline: Hierarchical text structure using indentation levels to show main points and subpoints.</li><li>Organisational chart: Visual diagram of a company’s structure, showing roles and reporting lines.</li><li>Free format: Unstructured layout with no predefined organization or formatting rules.</li></ul>
<h3>WBS elements/components and dictionary</h3>
<ul><li>WBS component/element – “an entry in the WBS that can be at  any level” – PMBOK Guide.</li><li>WBS dictionary – “a document that describes each component in  the WBS … includes a brief description, defined deliverable(s), a lost  if associated activities and sometimes other information” – PMBOK  Guide.</li></ul>
<h3>Work Packages</h3>
<ul><li>”A deliverable … at the lowest level of each branch of a WBS” –  PMBOK Guide.</li><li>Work activities are defined and makes no sense to break further  down.</li></ul>
<h3>WBS by phase</h3>
<ul><li>Groups deliverables byproject stages (e.g., design → build → test).</li></ul>
<p>WBS by design/product components</p>
<ul><li>Structures deliverables by physical parts (e.g., engine, chassis for a car).</li></ul>
<h3>WBS by work function</h3>
<ul><li>WBS by work function: Organizes tasks by specialized roles (e.g., engineering, marketing).</li></ul>
<h3>WBS structure considerations</h3>
<ul><li>Have 3-9 child elements for each parent.</li><li>Uniquely name each component in the WBS.</li></ul>
<h3>Establish change control</h3>
<ul><li>Plans must be made for dealing with change.</li><li>Every change to a project must be formally proposed, example, using a form.</li><li>Change request – “request to expand or reduce the project scope,  modify policies, processes, plans or procedures, modify costs or  budgets, or revise schedules” – PMBOK Guide.</li><li>Change control system – “a collection of formally documented  procedures that define how project deliverables and documentation  will be controlled, changed and approved” – PMBOK Guide.</li></ul>
<h3>Activities</h3>
<ul><li>“A component of work performed during the course of a project” –  PMBOK Guide.</li></ul>
<h2>Section 6</h2>
<h3>Project time management processes</h3>
<p>Define activities.</p>
<p>Sequence activities.</p>
<p>Estimate activity resources.</p>
<p>Develop schedule.</p>
<p>Control schedule.</p>
<h3>Program Evaluation and review technique (PERT)</h3>
<ul><li>Estimates most likely time needed to complete a project.</li><li>Estimates level of confidence in completing a project in a particular  time.</li><li>Useful in research and development projects.</li></ul>
<h3>Critical path method (CPM)</h3>
<ul><li>Used in very large projects.</li><li>Minimum total project duration.</li><li>Useful in the construction industry.</li></ul>
<h3>Activity on Node (AON) pr Precedence Diagramming Method (PDM)</h3>
<ul><li>Work activities are represented by a node and arrows connect activities representing the work of the event.</li><li>Precedence Diagramming Method (PDM) - "a schedule network diagramming technique in which the scheduled activities are represented by boxes or nodes…" - PMBOK Guide.</li></ul>
<h3>Creation of Project Schedules</h3>
<ul><li>Identify all activities.</li><li>Determine logical order in network diagram.</li><li>Assign resources to each activity.</li><li>Estimate time required for that activity.</li><li>Compare emerging schedule with imposed dates.</li><li>Consider project budget and cash flow, quality demands and risk  factors.</li></ul>
<h3>The project managers’ responsibility</h3>
<ul><li>Resist pressure to dictate a schedule.</li><li>Determine a schedule that is possible.</li><li>Persuade stakeholders that the schedule makes sense.</li><li>Deliver the project per the agreed-upon schedule.</li></ul>
<h3>List project milestones</h3>
<ul><li>Complete toon of a major deliverables.</li><li>Completion of a critical activity.</li><li>Prior to a large financial commitment.</li><li>Merging point in the project schedule.</li></ul>
<h3>Sequence activities</h3>
<ul><li>Predecessor activity - "the scheduled activity that determines when the logical successor activity can begin or end" - PMBOK  Guide.</li><li>The following activity is called a successor activity.</li><li>Place a successor activity after its predecessor.</li><li>Successor activity - "The schedule activity that follows a predecessor activity, as determined by their logical relationship" - PMBOK Guide.</li></ul>
<h3>Leads and lags</h3>
<ul><li>The most common type of logical dependency is Finish-to-start  (FS).</li><li>Leads are helpful if a project needs to be completed quickly.</li><li>Finish-to-start -"the logical relationship where initiation of work of  the successor activity depends on completion of work of the predecessor activity." - PMBOK Guide.</li><li>Lead - "a modification of a logical relationship that allows an  acceleration of the successor activity." - PMBOK Guide.</li><li>Lag - "a modification of a logical relationship that directs a delay in  the successor activity" - PMBOK Guide.</li></ul>
<h3>Finish-to-Finish Relationships</h3>
<ul><li>Finish-to-finish- "the logical relationship where completion of work  of the successor activity cannot finish until the completion of work of  the predecessor activity" - PMBOK Guide.</li></ul>
<h3>Start-to-start relationships</h3>
<ul><li>Start-to-start - "The logical relationship where initiation of the  successor schedule activity depends on the initiation of the  predecessor schedule activity" - PMBOK Guide.</li></ul>
<h3>Start-to-finish relationships</h3>
<ul><li>Start-to-finish - "the logical relationship where completion of the successor schedule activity is dependent on the initiation of the predecessor schedule activity" - PMBOK Guide.</li></ul>
<h3>Activity Duration Estimation</h3>
<ul><li>Changing assumptions and constraints could change estimates.</li><li>Duration - "The total number of work periods (not including holidays or other non-work time) required to complete a schedule activity." PMBOK Guide.</li></ul>
<h3>Estimate activity duration</h3>
<ul><li>Identify the output that will be created.</li><li>Identify the skill level required to perform the work.</li><li>Disregard predetermined completion points.</li><li>When using a past project as a guide, use actual time not initial</li></ul>
<h3>Estimates for activities.</h3>
<ul><li>Keep time estimates in the same unit of measure.</li><li>Elapsed units versus normal units (eg. Days versus days, or melon versus months).</li></ul>
<h3>Suggestions for creating realistic time estimates</h3>
<p>Verify all time estimations with the people doing the work.</p>
<p>Estimate times of completion of work without initial reference to a  calendar.</p>
<p>Make sure all time units are identical: working days, work week,  months (consider time off for company holidays).</p>
<p>Consider time constraints - unexpected meetings, interruptions,  inaccuracy in work instructions, emergencies/illness, learning curves,  vacation, rework, resources pr information not available on time.</p>
<p>Acknowledge tendency toward optimistic or pessimistic estimations.</p>
<p>First establish a realistic estimate.</p>
<p>Adjust estimates based on size, familiarity, and complexity differences.</p>
<h3>Learning Curves</h3>
<ul><li>The more times a person performs an activating, the better and faster he or she becomes.</li><li>Rate of improvement can be studied and predicted.</li><li>Time necessary to perform an activity is calculated based upon a rate of improvement.</li><li>Time estimates are found in learning curve tables.</li><li>Rapid learning leads to faster performances times.</li><li>PMs should plan for learning that takes place.</li><li>PMs should create and sustain an environment that encourages and expects rapid learning.</li></ul>
<h3>Develop Project Schedules</h3>
<ul><li>Identify the critical path:<ul><li>Two-ass method and enumeration method.</li><li>Critical path - “…the sequence of activities that determines the duration of the project…the longest path through the project.” PMBOK Guide.</li></ul></li></ul>
<h3>Two-Pass Method</h3>
<ul><li>Used to determine the amount of slack each activity has.</li><li>Make two logical passes through the constructed network:<ul><li>The forward pass.</li><li>The backward pass.</li></ul></li><li>Forward pass - “the calculation of the early start and early finish  dates for the uncompleted portions of all network activities.” PMBOK  Guide.</li></ul>
<h3>Times important to each activity</h3>
<ul><li>Early start date (EF) - “the earliest possible point in time on which uncompleted portions of a schedule activity can start…” PMBOK  Guide.</li><li>Early finish date (ES) - “the earliest possible point in time on which uncompleted portions of a schedule activity can finish…”  PMBOK Guide.</li><li>Late start date (EF) - “the latest possible point in time that a schedule activity may begin…” PMBOK Guide.</li><li>Late finish date (ES) - “the latest possible point in time that a schedule activity may be completed…” PMBOK Guide.</li></ul>
<h3>Schedule example first pass</h3>
<ul><li>Start at the beginning of the project and ask how soon each activity can begin and end.</li></ul>
<h3>Second or Backward Pass</h3>
<ul><li>How late can each activity be finished and started?</li><li>Backward pass - “the calculation of late finish dates and late start dates for the uncompleted portions of all schedule activities.” PMBOK Guide.</li></ul>
<h3>Schedule example second pass</h3>
<ul><li>Start at the end of the project and ask how late each activity can finish and begin.</li></ul>
<h3>Float and the critical path</h3>
<ul><li>Compute the critical path based on float (slack).</li><li>Activities with no float or very little float need to be scheduled very carefully.</li><li>Float = Late Start – Early Start (Float = LS – ES).</li><li>Critical path is the sequence of activities that have no float.</li><li>Total float - “the total amount of time a schedule activity may be delayed from its early start date without delaying the project finish  date.” PMBOK Guide.</li><li>Free float - “the amount of time a schedule activity can be delayed without delaying the early start of any immediately following schedule activities” PMBOK Guide.</li></ul>
<h3>Enumeration Method</h3>
<ul><li>All paths are identified and timed if the team needs to compress the schedule.</li></ul>
<h3>Program Evaluation and Review Technique (PERT)</h3>
<ul><li>Aid to understanding how variability in the duration of individual activities impacts the entire project schedule.</li><li>Create 3 estimates of time to complete each activity:<ul><li>Optimistic.</li><li>Most likely.</li><li>Pessimistic.</li></ul></li><li>Estimated time = [Optimistic +4(Most likely) + Pessimistic]/6</li><li>PERT considerations</li><li><b>Advantages:</b><ul><li>Reinforces the degree of uncertainty that exists in project schedules.-Calculations indicate that expected time is longer than most likely time.</li></ul></li><li><b>Difficulties:</b><ul><li>Takes more effort to create 3 estimates.</li><li>No guarantee how good the estimates are.</li><li>May underestimate the risk of a schedule running long.</li></ul></li></ul>
<h3>Show the project schedule on a Gantt Chart</h3>
<ul><li>An easier to understand tool for communicating a project schedule.</li><li>A horizontal bar chart showing each activity early start and finish.</li><li>Show a bar for each activity stretched over a time line.</li><li>Gantt chart - “a graphic display of schedule related information.” - PMBOK Guide.</li></ul>
<h3>Build the Logical Network Diagram</h3>
<p>Enter tasks and milestones.</p>
<p>Understand task dependencies.</p>
<p>Define dependencies using a task table and mouse.</p>
<p>Define or delete a dependency series.</p>

<h2>Section 7</h2>
<h3>Estimate Resource needs</h3>
<ul><li>How many resources of each type and skill or knowledge level are needed.</li><li>Consider support needs such as information systems and human resources</li><li>Consider constraints placed upon how people are hired, scheduled and released.</li><li>Estimate activity resources - "the process of estimating the types and quantities of resources required to perform each scheduled activity." - PMBOK Guide.</li></ul>
<h3>Create a staffing management plan</h3>
<ul><li>Identify potential resources.</li><li>Determine resource availability.</li><li>Decide timing issues.</li><li>Staffing management plan - "the document that describes when and how human resource equipment will be met" PMBOK Guide.</li></ul>
<h3>Assign a resource to each activity</h3>
<ul><li>Show resource responsibilities on RACI chart.</li><li>Show resource assignments on Gantt Chart.</li><li>Summarise resource responsibilities with histogram.</li></ul>
<h3>Show resource responsibilities on RACI Chart</h3>
<ul><li>Responsibility Assignment Matrix (RAM).</li><li>RACI is a form of RAM.</li><li>RACI - Responsible, Accountable, Consult, Inform.</li><li>Responsibility assignment matrix (RAM) - "a structure that relates the project organisational breakdown to the work breakdown structure… each component of the project's scope of work is assigned to a person or team." PMBOK Guide.</li></ul>
<table><tr><th>WBS</th><th>Activity</th><th>Who 1?</th><th>Who 2?</th></tr><tr><td>The work breakdown structure</td><td>Project activities that correspond to the WBS</td><td>Who will be involved</td><td>May be more than one person</td></tr></table>
<h3>A note on effort/work versus duration</h3>
<ul><li>There is a difference between work and duration.</li><li>By default, work is calculated in hours and follows this formula:</li><li>Work = Duration * Units (W=D*U)       (units refers to resources)</li><li>Duration = Work/Units       (to solve for the duration rather than work)</li><li>Effort-driven scheduling - is when the work remains constant and  the duration is changed.<ul><li>Work (effort) remains constant and determines (drives) the way that  the W=D*U formula will be calculated.</li></ul></li></ul>
<h3>Methods of resolving resource overloads</h3>
<ul><li>Recorder the activities.</li><li>Acquire or borrow additional resources.</li><li>Reduce project scope or extend project schedule.</li><li>Inform the sponsor of severe overloads.</li><li>Resource level the overloaded person's schedule.</li><li>Ask if the resource is willing to do overtime (with care and attention).</li></ul>
<h3>Resource levelling</h3>
<ul><li>Delay activities so the person doesn't perform as many activities at  the same time (most common).</li><li>Delay non-critical activities by an amount no more than their slack.</li><li>Allow the project to slip - reduces peak demand and smoothers the  period to period resource usage.</li><li>Resource levelling - "any form of schedule network analysis in  which scheduling decisions… are driven by resource constraints." -  PMBOK Guide.</li><li>If non-critical activities must be completed at the rate of effort in the  original schedule, reassign activities to another worker.</li></ul>
<h3>Compress the project schedule</h3>
<ul><li>Actions to reduce the critical path.</li><li>Crashing.</li><li>Fast tracking.</li></ul>
<h3>Actions to reduce the critical path</h3>
<ul><li>Reduce the projects scope and/or quality.</li><li>Overlap sequential activities.</li><li>Partially overlap sequential activities.</li><li>Increase the number of work hours/days.</li><li>Schedule activities at the same time.</li><li>Shorten the duration of critical activities.</li><li>Shorten activities by assigning more resources.</li><li>Shorten activities that cost the least to speed up.</li></ul>
<h3>Compress the project schedule</h3>
<ul><li>Crashing may cost more money to speed up the schedule.</li><li>Fast tracking may increase the risk to speed up the schedule.</li><li>Crashing - "a specific type pf project schedule compression</li></ul>
<p>technique… performed by taking action to decrease the total project  duration… how to get the maximum schedule duration for the least  additional cost." PMBOK Guide.</p>
<ul><li>Fast tracking - "a specific project schedule compression technique</li></ul>
<p>that change network logic to… perform schedule activities in parallel." PMBOK Guide.</p>
<h3>Crashing</h3>
<ul><li>Certain activities are performed at a faster than normal pace.</li><li>Crashing example - in "All-Crash" Mode.</li></ul>

<h3>Introduction to Project Budgeting</h3>
<ul><li>Cost management plan - "the document that sets out the format and establishes the activities and criteria for planning, structuring and controlling the project costs." PMBOK Guide.</li></ul>
<h3>Purposes of the Cost management plan</h3>
<ul><li>Provides feedback linking the project to business objectives.</li><li>Provides detail and summary information.</li><li>Helps project stakeholders focus in schedule, performance and cost.</li></ul>
<h3>Estimate cost</h3>
<ul><li>Cost estimating - "the process of developing an approximation of</li></ul>
<p>the cost of the resources needed to complete project activities." - PMBOK Guide.</p>
<h3>Types of costs - fixed vs variable</h3>
<ul><li>Fixed costs remain the same regardless of volume of work.</li><li>Variable costs vary directly with the volume of use.</li><li>Fixed and variable costs involve consideration of the project scope.</li></ul>
<h3>Types of costs - Direct vs indirect</h3>
<ul><li>Direct costs only occur because of the project:<ul><li>Direct labor.</li><li>Other direct costs - material, travel, consultants, subcontracts, purchased parts and computer time.</li></ul></li><li>Indirect costs are necessary costs not associated with one specific  project:<ul><li>Buildings (eg council rates), utilities, insurance and clerical assistance.</li><li>Costs are allocated across projects.</li></ul></li></ul>
<h3>Types of costs - recurring vs nonrecurring</h3>
<ul><li>Recurring costs repeat as the project work continues.<ul><li>Cost of writing and printing architectural diagrams; laying bricks. -Occur during project evaluation.</li></ul></li><li>Nonrecurring costs happen only once during a project.<ul><li>Design development.</li><li>Occur during project planning and closing.</li></ul></li></ul>
<h3>Types of costs - regular vs expedited</h3>
<ul><li>Regular costs occur when progress can be made y normal work</li></ul>
<p>hours and purchasing agreements (the preferred cost).</p>
<ul><li>Expedited costs occur when the project must be conducted faster</li></ul>
<p>than normal.</p>
<p>-Overtime and extra charge apply.</p>
<h3>Types of costs - estimate vs contingency</h3>
<ul><li>Estimate - "a quantified assessment of the likely amount… it should always include an indication of accuracy." PMBOK Guide.</li><li>Reserve - "a provision in the project management plan to mitigate cost and/or schedule risk. Often used with a modifier (e.g management reserve, contingency reserve) to provide further detail on what types of risk are meant to be mitigated.”  - PMBOK Guide.</li></ul>
<h3>Types of costs - accrual vs cash accounting</h3>
<ul><li>Accrual - transaction are recorded in the time period the expense</li></ul>
<p>occurred.</p>
<ul><li>Cash - records transactions when the money is spent.</li><li>Cash accounting is more frequently used on projects.</li></ul>

<h3>Methods of estimating costs</h3>
<ul><li>Analogous estimating.</li><li>Parametric estimating.</li><li>Bottom-up estimating.</li></ul>
<h3>Analogous estimating</h3>
<ul><li>Consider a similar project as a cost estimating starting point.</li><li>Requires experience performing similar projects and actual cost of</li></ul>

<h3>Parametric estimating</h3>
<ul><li>Involves finding more information regarding the project.</li><li>Parametric estimating - "an estimating technique that uses a statistical relationship between historical data and other variables to calculate project costs.</li></ul>

<ul><li>Most detailed - specifications need to be very clear.</li><li>Time consuming.</li><li>Most accurate for of estimating.</li><li>Ensure every item is included.</li><li>Bottom-up estimating - "a method of estimating a component of  work. The work is decomposed into more detail. AN estimate is  prepared of what is needed to meet the requirements of each of the  lower, more detailed pieces of work, and these estimates are then  aggregated into a total quantity for the project." - PMBOK Guide.</li></ul>

<table><tr><th>none</th><th>Analogous</th><th>Parametric</th><th>Bottom-up</th></tr><tr><td>Amount of information required</td><td>Least</td><td>Middle</td><td>Most</td></tr><tr><td>Amount of time required</td><td>Least</td><td>Middle</td><td>Most</td></tr><tr><td>Accuracy Obtained</td><td>Lowest</td><td>Middle</td><td>Highest</td></tr></table>
<h3>Project cost estimating issues</h3>
<ul><li>Supporting detail.</li><li>Causes of variation.</li><li>Vendor and analysis.</li><li>Value engineering.</li><li>Activity-based costing.</li><li>Time value of money.</li><li>International currency fluctuations.</li></ul>
<h3>Supporting detail</h3>
<ul><li>Describe the scope, method used to create the estimate,</li></ul>
<p>assumptions, constraints and range of possible outcomes.</p>
<h3>Vendor Bid analysis</h3>
<ul><li>Use vendor bid analysis to determine whether the price is</li></ul>

<ul><li>Method of double-checking all the chosen methods for</li></ul>

<ul><li>Direct and indirect costs add up to the cost baseline.</li><li>The cost baseline is an integral part of the project management</li></ul>

<p><b>WHAT IS A PROJECT?</b></p>
<ul><li>Most authoritative definition is from BS 6079-2:2000 (Project Management Vocabulary): "A unique process, consisting of a set of co-ordinated and controlled activities with start and finish dates, undertaken to achieve objectives conforming to specific requirements, including constraints of time, cost and resources.”</li><li>A project has a definite STARTING point and a definite FINISHING point, and must meet specified objectives.</li></ul>

<p>THE THREE FUNDAMENTAL CRITERIA (PROJECT TRIANGLE)</p>
<p>Completed ON TIME.</p>
<p>Accomplished WITHIN BUDGETED COST.</p>
<p>Meet PRESCRIBED QUALITY requirements (also called "performance”).</p>
<ul><li>Represented by the well-known PROJECT TRIANGLE (Fig 1.2).</li><li>In safety-critical industries (airlines, railways, mining) a fourth criterion - SAFETY - turns the triangle into a PROJECT DIAMOND (Fig 1.3).</li><li>Safety is placed in the CENTRE of the triangle/diamond to emphasize its importance - shown as the "S” symbol.</li></ul>
<p>PRIORITY EXAMPLES FOR EACH CRITERION</p>
<p>(a) TIME-BOUND PROJECT</p>
<ul><li>A scoreboard for a tennis tournament must be finished by the opening match, even if cost rises and secondary features (e.g., service-speed display) are dropped. Cost and performance may be sacrificed for the unalterable start date.</li></ul>
<p>(b) COST-BOUND PROJECT</p>
<ul><li>A local-authority housing development cannot exceed budget because the government housing grant is frozen at a fixed sum. May cut the number of units or reduce the specification of internal fittings, even if the programme overruns.</li></ul>
<p>(c) PERFORMANCE (QUALITY)-BOUND PROJECT</p>
<ul><li>An armaments manufacturer must meet the client's performance spec (range, accuracy, rate of fire) for a rocket launcher, even if delivery is delayed and cost rises. (In wartime, spec might be relaxed for speed.)</li></ul>
<p>(d) SAFETY-BOUND PROJECT</p>
<ul><li>Required by law, enshrined in the Health and Safety at Work Act.</li><li>Safe practices must be built into every project PLUS constant monitoring.</li><li>Argument: ALL projects are safety-bound - sacrificing safety for speed or profit can put stakeholders in real trouble, even in jail.</li><li>A serious accident can destroy the company even if it does not end the project.</li></ul>
<p>DISASTER CASE STUDIES (why safety comes first)</p>
<ul><li>Piper Alpha gas platform, North Sea, July 1988: 167 killed, cost Occidental and its insurers millions of dollars.</li><li>Buncefield oil depot, England, 2009: massive destruction, huge costs to Total Oil.</li><li>Texas City refinery, March 2005: 15 killed, 170 injured (BP).</li><li>Deepwater Horizon, Gulf of Mexico, April 2010: 11 fatalities, seriously damaged BP's reputation and share price.</li><li>Series of railway accidents in 2000: led to winding up of British Rail and one of its main contractors.</li><li>Toyota recall of millions of cars: Chairman Toyoda publicly stated priorities - 1st safety, 2nd quality, 3rd volume.</li><li>Key point: project manager can be reprimanded or dismissed for failing any of the three "corner criteria", but the one offence that can land a PM IN JAIL is non-compliance with Health and Safety regulations.</li></ul>
<p>PRIORITY ORDER - ACRONYM: SAPETICA</p>
<p>Order of importance: SAFETY, PERFORMANCE, TIME, COST.</p>
<ul><li>S - Safety: if not safe, costs lives and/or destroys the constructor and other stakeholders.</li><li>P - Performance: if not acceptable, the project is a waste of time and money.</li><li>T - Time: if late, still may succeed, but may cause financial loss.</li><li>C - Cost: if over budget, the project can still be viable - extra money can usually be found.</li><li>Famous example: SYDNEY OPERA HOUSE - so far over budget that extra money was raised via a New South Wales State lottery; today it is a celebrated landmark.</li></ul>
<p><b>KEY TAKEAWAYS</b></p>
<ul><li>Time, cost and quality/performance CAN be juggled by the project manager to suit changing needs.</li><li>SAFETY CANNOT be compromised under any circumstances.</li><li>Priorities among the other three can shift with political climate or commercial needs, even within a project's life cycle; the PM must constantly re-evaluate them with the sponsor/client.</li><li>Ideally all criteria are met (true for many well-run projects).</li></ul>
<h3>Note of Video 1</h3>
<p>The Stratified Project Time and Cost Estimation — Video Notes</p>
<p>One-line summary This video introduces a paper (by Rajabi Assadabadi, 2018, published in the European Journal of Operational Research) proposing a "stratified decision-making approach" that integrates risk and uncertainty into the computation of project time and cost estimates, producing more reliable estimates.</p>
<p><b>Problem background</b></p>
<ul><li>Estimating project time and cost is challenging due to high levels of risk and uncertainty in the early stages of a project</li><li>As a result, the reliability of estimates during project planning remains poor</li><li>Poor estimates can lead to failure to deliver the project within the "iron triangle" (time, cost, scope)</li></ul>
<p>Case study: Australian Attack-class submarine project</p>
<ul><li>In 2016, the Australian government signed a contract with France for 12 Attack-class submarines</li><li>Estimated cost at signing: $50 billion AUD (~$3,000 per Australian taxpayer)</li><li>First batch planned for delivery in the early 2030s</li><li>Outcome: significant delay in the design stage; new estimates put the cost at ~$90 billion instead of $50 billion</li><li>Chain reaction: if first-batch delivery is delayed, Australia must decide whether to upgrade the existing Collins-class fleet to keep it in service until the new submarines arrive — and that upgrade is an expensive, multi-year project in itself</li><li>Takeaway: reliable estimates in projects are critical</li></ul>
<p><b>The proposed approach</b></p>
<ul><li>2018: Rajabi Assadabadi proposed the "stratified decision-making approach”</li><li>It is capable of integrating risk and uncertainty into the decision-making process</li><li>The paper argues the same approach can be used to integrate risk into the computation of project time and cost</li><li>This is the basis of the newly proposed concept: "stratified project time and cost estimation”</li></ul>
<p><b>Getting the paper</b></p>
<ul><li>Contact the authors on ResearchGate or via email</li></ul>
<h3>Note of Video 2</h3>
<p>Typical Project Phases — Video Notes (projectmanager.com, Devon Dean)</p>
<p>Core concept Every project consists of four basic phases: Initiation, Planning, Execution, and Closing. Each phase has its own sub-phases, and each sub-phase itself cycles through the same four phases at a smaller scale.</p>
<p><b>1. Initiation</b></p>
<ul><li>Happens before the team is even assembled</li><li>Build the business case and feasibility study</li><li>Convince the board/stakeholders the project has sufficient ROI (return on investment) to justify dollars, mind share, and human capital</li><li>Gather forces and ideas; start early thinking on budget and required skill types</li></ul>
<p><b>2. Planning</b></p>
<ul><li>Begins after the board approves the business case and awards funding</li><li>Produce the project schedule, resource plan, firmer budget, and cash flow plan</li><li>Identify skills needed on the team; start interviewing candidates</li><li>Exit criteria: schedule, statement of work (SOW), terms of reference, and an assembled team ready to start</li></ul>
<p><b>3. Execution</b></p>
<ul><li>The "meat" of the project where most activities occur</li><li>Project manager implements many controlling processes:</li><li>Risk management, issues management, change control management</li><li>Communications management, additional planning</li><li>Integration management across all stakeholders and systems</li></ul>
<p><b>4. Closing</b></p>
<ul><li>Package up deliverables for the phase</li><li>Cancel/close out vendor subcontracts</li><li>Obtain acceptance of the deliverables</li></ul>
<p>Phases are recursive (sub-phases)</p>
<ul><li>Each phase contains its own mini initiation→planning→execution→closing cycle</li><li>Example: Design phase<ul><li>Initiation: high-level specification / high-level design document</li><li>Planning: discuss architecture and how systems fit together</li><li>Execution: write the functional specification / detailed design spec; control activities — deliver on time, monitor progress, inspect for quality</li><li>Closing: get acceptance of the design, buy-in from technical people and the team that they can execute on it</li></ul></li><li>Example: Implementation phase<ul><li>Initiation: bring team together, kickoff meeting</li><li>Planning: itemized task list, buy-in on each task, accountability for effort and deliverables</li><li>Execution: team does the work while PM monitors and adjusts</li><li>Closing: acceptance testing, package and hand over to operations</li><li>Optional extra phase: Change management (e.g., after delivering an ERP system, for people/process change)</li></ul></li></ul>
<p>Activity level over time (graph)</p>
<ul><li>Initiation: ramp-up of personal activity (plus 1–2 team members), peaks, then trails off — feasibility study, business case, numbers/ROI, presentations</li><li>Planning: starts slightly in parallel with initiation; some activity that peters off similarly</li><li>Execution: the biggest phase, most of the work; ramps up the team, completes deliverables, finishes tasks</li><li>Closing: activity before deliverables are signed off; must agree acceptance criteria and get user buy-in</li></ul>
<p><b>Key tip</b></p>
<ul><li>Show artifacts to users throughout the project and get incremental sign-off on each deliverable — otherwise the closing phase pushes out and hurts your budget.</li></ul>
<p>Source: projectmanager.com</p>
<h3>Note of Video 3</h3>
<p>How to Write a Scope of Work Document — Video Notes (projectmanager.com)</p>
<p>What is a Scope of Work (SOW)?</p>
<ul><li>An agreement on the work to be performed on the project</li><li>Includes:<ul><li>What deliverables, products, or results are produced</li><li>Timeline for the project</li><li>Important/critical milestones</li><li>Types of reports needed and specifically who receives them</li></ul></li></ul>
<p>Typical template contents</p>
<p>Glossary — defines the terms referenced in the SOW</p>
<p>Problem statement — detail on the problem being solved</p>
<p>Goals</p>
<p>Objectives and deliverables to be produced</p>
<p>Administrative information about the project</p>
<p>Timeline</p>
<p><b>Three "must practices”</b></p>
<p>Be specific</p>
<ul><li>Be precise when defining terms so everyone has a clear, common understanding</li><li>Define exactly who does what and by when</li><li>Avoids traps: confusion (who does what/when, what terms mean), miscommunication → disputes</li></ul>
<p>Include visuals</p>
<ul><li>Paint a picture of what the end result will look like once implemented</li><li>Show what people will be able to do after the project</li><li>"A picture is worth a thousand words”</li><li>Avoids the trap of misinterpretation</li></ul>
<p>Get sign-offs</p>
<ul><li>Authorized approvers must sign off on the SOW</li><li>Also sign off at critical milestones and deliverables</li><li>Avoids traps: people's "selective amnesia," disputes, and costly rework</li></ul>
<p>Closing</p>
<ul><li>projectmanager.com software can help manage and track your SOW document</li></ul>
`;

<h3>The Strategic Importance of Time, Cost, and Resource Management in Project Management: An Academic Analysis</h3>
<p><b>1. Theoretical Foundations</b></p>
<p>The primacy of time, cost, and resource management derives from the Iron Triangle (Atkinson, 1999) and the Project Management Body of Knowledge (PMBOK) framework, which define project success as the simultaneous satisfaction of scope, schedule, and budget constraints. Resource management underpins all three: resources (human, financial, material, technological) are the conversion mechanism through which time and money become deliverable value. Without disciplined management of these levers, the project's constraint system collapses.</p>
<p><b>2. Time Management</b></p>
<p>Network analysis (CPM/PERT): Critical Path Method identifies the longest dependency chain; any delay on critical activities directly lengthens total project duration (Kelley &amp; Walker, 1959). This is why schedule slippage is the most cited cause of project failure (PMI, 2023 Pulse of the Profession).</p>
<p>Time-value economics: Duration directly compounds cost through carrying costs, opportunity costs, and market-window erosion. In time-sensitive industries (construction, software, pharmaceuticals), late delivery can invalidate the business case entirely.</p>

<p><b>3. Cost Management</b></p>
<p>Cost estimation &amp; control: Earned Value Management (EVM) integrates schedule and budget into a single variance index (CV, SV, SPI, CPI), providing early-warning signals that enable corrective steering rather than post-mortem accounting (Fleming &amp; Koppelman, 2000).</p>

/* ============================================================
   RENDERING
   ============================================================ */
const view = document.getElementById("view");
const nav  = document.getElementById("nav");
const body = document.body;

function sectionDone(sec){ return sec.notes.filter(n=>n.html).length; }

function buildNav(){
  nav.innerHTML="";
  const moreSections = SECTIONS.filter(s=>s.group==="more");
  const topSections  = SECTIONS.filter(s=>s.group!=="more");
  function addSection(sec){
    const done=sectionDone(sec);
    const wrap=document.createElement("div");
    wrap.className="sec";
    wrap.dataset.sec=sec.id;

    const head=document.createElement("button");
    head.className="sec-head";
    head.innerHTML=`<span class="caret">▶</span><span class="name">${sec.title}</span>`+
      `<span class="count">${done}</span>`;
    head.addEventListener("click",()=>wrap.classList.toggle("open"));
    wrap.appendChild(head);

    const list=document.createElement("div");
    list.className="sec-notes";
    sec.notes.forEach((note,i)=>{
      const a=document.createElement("a");
      a.className="note-link"+(note.html?"":" empty");
      a.dataset.target=`${sec.id}/${i}`;
      a.href=`#/${sec.id}/${i}`;
      a.innerHTML=`<span class="nl-num">${note.num}</span>${note.html?note.title:"To be updated"}`;
      list.appendChild(a);
    });
    wrap.appendChild(list);
    nav.appendChild(wrap);
  }
  topSections.forEach(addSection);

  // Collapsible "More Courses" group for everything else
  if (moreSections.length){
    const grp=document.createElement("div");
    grp.className="sec group-more";
    const gh=document.createElement("button");
    gh.className="sec-head";
    gh.innerHTML=`<span class="caret">▶</span><span class="name">More Courses</span>`+
      `<span class="count">${moreSections.length}</span>`;
    gh.addEventListener("click",()=>grp.classList.toggle("open"));
    grp.appendChild(gh);
    const gl=document.createElement("div");
    gl.className="sec-notes";
    moreSections.forEach(sec=>{
      const done=sectionDone(sec);
      const sub=document.createElement("div");
      sub.className="sec";
      sub.dataset.sec=sec.id;
      const sh=document.createElement("button");
      sh.className="sec-head";
      sh.innerHTML=`<span class="caret">▶</span><span class="name">${sec.title}</span>`+
        `<span class="count">${done}</span>`;
      sh.addEventListener("click",()=>sub.classList.toggle("open"));
      sub.appendChild(sh);
      const sl=document.createElement("div");
      sl.className="sec-notes";
      sec.notes.forEach((note,i)=>{
        const a=document.createElement("a");
        a.className="note-link"+(note.html?"":" empty");
        a.dataset.target=`${sec.id}/${i}`;
        a.href=`#/${sec.id}/${i}`;
        a.innerHTML=`<span class="nl-num">${note.num}</span>${note.html?note.title:"To be updated"}`;
        sl.appendChild(a);
      });
      sub.appendChild(sl);
      gl.appendChild(sub);
    });
    grp.appendChild(gl);
    nav.appendChild(grp);
  }
}

function renderHome(){
  const topSections = SECTIONS.filter(s=>s.group!=="more");
  const moreSections = SECTIONS.filter(s=>s.group==="more");
  let rows="";
  topSections.forEach((sec,i)=>{
    const done=sectionDone(sec);
    rows+=`<div class="toc-row" data-go="${sec.id}">
        <span class="toc-idx">${String(i+1).padStart(2,"0")}</span>
        <span class="toc-name">${sec.title}</span>
        <span class="toc-tag ${done?"has":""}">${done}</span>
      </div>`;
  });
  if (moreSections.length){
    rows+=`<div class="toc-group" id="tocMoreGroup">
      <button class="toc-group-hd" id="tocMoreBtn"><span class="caret">▶</span><span class="toc-group-name">More Courses</span><span class="toc-tag">${moreSections.length}</span></button>
      <div class="toc-group-body" id="tocMoreBody" style="display:none">`;
    moreSections.forEach((sec,i)=>{
      const done=sectionDone(sec);
      rows+=`<div class="toc-row toc-sub" data-go="${sec.id}">
          <span class="toc-idx">${String(topSections.length+i+1).padStart(2,"0")}</span>
          <span class="toc-name">${sec.title}</span>
          <span class="toc-tag ${done?"has":""}">${done}</span>
        </div>`;
    });
    rows+=`</div></div>`;
  }
  view.innerHTML=`
    <p class="crumb">Welcome</p>
    <h1 style="font-size:36px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px">A quiet place for my notes.</h1>
    <p class="home-lead">Hi — I'm Hudson Junior. This is where I keep and share the notes I take from the courses I'm working through. It grows slowly, in public.</p>
    <p class="crumb" style="margin-top:26px">Courses</p>
    <div class="toc">${rows}</div>
  `;
  view.querySelectorAll("[data-go]").forEach(el=>{
    el.addEventListener("click",()=>location.hash=`#/${el.dataset.go}`);
  });
  const moreBtn=document.getElementById("tocMoreBtn");
  const moreBody=document.getElementById("tocMoreBody");
  if (moreBtn){
    moreBtn.addEventListener("click",()=>{
      const open=moreBody.style.display!=="none";
      moreBody.style.display=open?"none":"block";
      moreBtn.querySelector(".caret").textContent=open?"▶":"▼";
    });
  }
}

function renderSection(sec){
  const done=sectionDone(sec);
  let rows="";
  sec.notes.forEach((note,i)=>{
    rows+=`<div class="ov-note" data-go="${sec.id}/${i}">
      <span class="ov-num">${note.num}</span>
      <span class="ov-title ${note.html?"":"muted"}">${note.html?note.title:"To be updated"}</span>
      <span class="ov-status ${note.html?"has":""}">${note.html?"Published":"Soon"}</span>
    </div>`;
  });
  const intro = done
    ? `${done} note${done>1?"s":""} written so far. More on the way.`
    : `Nothing here yet — these notes haven't been written. This course isn't finished, and I'll fill these pages in as I go. Check back soon.`;
  view.innerHTML=`
    <p class="crumb">Course</p>
    <h1>${sec.title}</h1>
    <p class="meta">${intro}</p>
    <div class="ov-notes">${rows}</div>
  `;
  view.querySelectorAll("[data-go]").forEach(el=>{
    el.addEventListener("click",()=>location.hash=`#/${el.dataset.go}`);
  });
}

function renderNote(sec,idx){
  const note=sec.notes[idx];
  if(note.html){
    view.innerHTML=`
      <span class="backlink" data-go="${sec.id}">← ${sec.title}</span>
      <p class="crumb">${sec.title} · Note ${note.num}</p>
      <article>
        <h1>${note.num} · ${note.title}</h1>
        <p class="meta">Study notes · written up by Hudson Junior</p>
        ${note.html}
      </article>`;
  }else{
    view.innerHTML=`
      <span class="backlink" data-go="${sec.id}">← ${sec.title}</span>
      <div class="empty-state">
        <div class="mk">✎</div>
        <h2>To be updated</h2>
        <p>This page (${sec.title}, note ${note.num}) is still empty. I haven't written these notes yet — the course isn't finished.</p>
        <p class="sub">I'm adding pages whenever I find time between classes. Thanks for your patience.</p>
      </div>`;
  }
  view.querySelectorAll("[data-go]").forEach(el=>{
    el.addEventListener("click",()=>location.hash=`#/${el.dataset.go}`);
  });
}

function highlightNav(secId,noteIdx){
  document.querySelectorAll(".sec").forEach(s=>{
    if(s.dataset.sec===secId) s.classList.add("open");
  });
  document.querySelectorAll(".note-link").forEach(a=>a.classList.remove("active"));
  if(noteIdx!=null){
    const a=document.querySelector(`.note-link[data-target="${secId}/${noteIdx}"]`);
    if(a) a.classList.add("active");
  }
}

function router(){
  const hash=location.hash.replace(/^#\/?/,"");
  const parts=hash.split("/").filter(Boolean);
  closeMobileNav();
  window.scrollTo(0,0);

  if(parts.length===0){ renderHome(); highlightNav(null); return; }
  const sec=SECTIONS.find(s=>s.id===parts[0]);
  if(!sec){ renderHome(); highlightNav(null); return; }
  if(parts.length===1){ renderSection(sec); highlightNav(sec.id); return; }
  const idx=parseInt(parts[1],10);
  if(isNaN(idx)||!sec.notes[idx]){ renderSection(sec); highlightNav(sec.id); return; }
  renderNote(sec,idx); highlightNav(sec.id,idx);
}

const scrim=document.getElementById("scrim");
function closeMobileNav(){ body.classList.remove("nav-open"); }
menuBtn.addEventListener("click",()=>body.classList.toggle("nav-open"));
scrim.addEventListener("click",closeMobileNav);

document.querySelector("[data-home]").addEventListener("click",e=>{
  // let hash change handle render
});

/* ---------- desktop sidebar collapse ---------- */
const sidebarToggle=document.getElementById("sidebarToggle");
const sidebarShow=document.getElementById("sidebarShow");
function setSidebar(collapsed){
  body.classList.toggle("sidebar-collapsed",collapsed);
  try{ localStorage.setItem("hw_sidebar_collapsed",collapsed?"1":"0"); }catch(e){}
}
sidebarToggle.addEventListener("click",()=>setSidebar(true));
sidebarShow.addEventListener("click",()=>setSidebar(false));
try{ if(localStorage.getItem("hw_sidebar_collapsed")==="1") body.classList.add("sidebar-collapsed"); }catch(e){}

buildNav();
window.addEventListener("hashchange",router);
router();
</script>
