<p>Range = max − min. Simple but dominated by outliers (5→4 becomes 119 with one extreme value).</p>

<p>Coefficient of variation = SD ÷ mean — unitless, relative measure for comparing variability across data sets in different units (e.g., Stock A: $50, SD 5 → 10%; Stock B: $100, SD 5 → 5%).</p>

<p>Each measure locates the central point of the data using a different method.</p>
<p><b>2. Mean (Arithmetic Mean / Sample Mean)</b></p>
<ul><li>The mean is the statistical term for average; it measures the centre of a numerical data set.</li><li>A mean calculated from a sample is called the sample mean.</li><li>The symbol for the sample mean is X̄ ("X-bar") — an X with a bar across the top.</li><li>Formula:&lt;br&gt;X̄ = Σ Xᵢ / n  =  (X₁ + X₂ + ⋯ + Xₙ) / n</li></ul>
<p>Sigma (Σ) notation</p>
<ul><li>Σ is the Greek capital letter sigma → "sum of”.</li><li>ΣXᵢ means: sum the values Xᵢ, where i = 1, 2, …, n (i refers to the iᵗʰ value in the data set; n is the sample size / last value).</li><li>Expanded: X₁ + X₂ + X₃ + … + Xₙ, then divide the total by n.</li></ul>
<p>Symbol Meaning</p>
<ul><li>X̄: Sample mean ("pronounced x-bar”)</li><li>Σ: Sigma = sum of</li><li>n: Sample size</li><li>Xᵢ: The iᵗʰ data value</li><li>X₁ … Xₙ: The observed values</li></ul>
<p>Limitations of the mean</p>
<p>Only usable for numerical data — you must be able to add the numbers (e.g., can't use it for eye colour).</p>
<p>Affected by extreme outliers — one extreme value can change the mean substantially.</p>
<p><b>3. Median</b></p>
<ul><li>The median is simply the middle value: 50% of the data lies above it and 50% below it.</li><li>To find it: sort the sample from smallest to largest, then take the middle value (odd n) or the average of the two middle values (even n).</li></ul>
<p>Position formula: Median position = (n + 1) / 2   (in the ordered data)</p>
<p>Important: this formula gives the position of the median — NOT the median value itself.</p>
<ul><li>Odd n (e.g., n = 5): (5 + 1)/2 = 3 → median = 3rd observation when sorted.</li><li>Even n (e.g., n = 6): (6 + 1)/2 = 3.5 → halfway between position 3 and 4 → average of the values in positions 3 and 4.</li></ul>
<p>When to use the median</p>
<ul><li>When you expect extreme values and don't want them to influence the centre of the data.</li><li>Useful for asymmetric / skewed distributions — e.g., house prices: a suburb with mostly modest houses but one or two multi-million-dollar homes → the mean gets driven up, but the median is unaffected.</li><li>Can be used for numerical data and ordinal categorical data (ordered categories).</li></ul>
<p><b>4. Mode</b></p>
<ul><li>The mode is the value that occurs most often in the data set — the outcome with the highest frequency.</li><li>Example (slide p.6): in the data set, 9 has the highest frequency → Mode = 9.</li><li>If several values share the same top frequency → multimodal distribution; if exactly two → bimodal distribution. (There can also be no mode.)</li><li>Like the median, the mode is not affected by outliers (it's just about frequency).</li><li>Can be used for both numerical and categorical data, but is typically used for categorical data — and it is the only measure that can be used for nominal (unordered) categorical data, e.g., eye colour, country of origin.</li></ul>
<p><b>5. Quick Comparison Table</b></p>
<table><tr><th>Property</th><th>Mean</th><th>Median</th><th>Mode</th></tr><tr><td>Definition</td><td>Sum ÷ n</td><td>Middle value (sorted)</td><td>Most frequent value</td></tr><tr><td>Data types</td><td>Numerical only</td><td>Numerical + ordinal</td><td>Numerical + any categorical (incl. nominal)</td></tr><tr><td>Outlier sensitivity</td><td>High</td><td>None / robust</td><td>None</td></tr><tr><td>Best for</td><td>Symmetric, outlier-free data</td><td>Skewed data (e.g., house prices)</td><td>Categorical data (esp. nominal)</td></tr><tr><td>Key formula</td><td>X̄ = ΣXᵢ/n</td><td>Position = (n+1)/2</td><td>-</td></tr></table>
<p>Key takeaways: always plot the data first (histogram/number line) before choosing a summary; if outliers or skew are present, prefer the median; use the mode when dealing with categories; the mean is the most common but the most fragile.</p>
<h3>Check your understanding</h3>
<p>The mean is the most common measure of central tendency. Which of the following statements are also true of the mean?</p>
<ul><li>The mean tries to find the middle of the distribution.</li></ul>
<p>Which of the following statements, regarding the median, is correct?</p>
<ul><li>The median is not sensitive to extreme values.</li><li>The median is often used for house prices so as not to be affected by occasional large outliers.</li></ul>
<p>Which of the following statements, regarding the mode, is correct?</p>
<ul><li>The mode is not sensitive to extreme values.</li><li>The mode can be used for numerical and categorical data – but is often more relevant for categorical data.</li></ul>
<h3>Measures of Central Tendency</h3>
<p>Definitions of - Mean - Median – Mode</p>
<p>Means: The mean (μ) is the sum of all the values divided by the number of observations. The mean is also called the average.</p>
<p>Median: The median is the middle value when the observations are arranged in order.</p>
<p>Mode: This is the most commonly occurring value.</p>
<h3>Geometric Mean</h3>
<p>In the section above, the "mean" you learned was the Arithmetic mean. It is used for numerical data types whose values are typically combined using addition or subtraction. For for those that are typically combined using multiplication we use the Geometric Mean. To calculate the geometric mean of n values, we multiple the values together and then take the nth root.  The Geometric mean of 2, 2, and 16 is 4.</p>
<p>Mean of Xg = (X1 * X2 * … * Xn) ^ (1/2)</p>
<h3>Geometric Rate of Return</h3>
<p>Rates of return are values that typically multiplied. However, before compounding (multiplying) rates that are given as a percentage (eg., a CPI of 3%) we add 1 in order to keep the base quantity (e.g, to apply a 3% CPI increase, we multiply by a factor of 1.03). When we convert a factor back to a rate, we subtract 1.</p>
<p>For example, an interest rate of 10% (0.1) p.a, after 2 years is worth 21%, which we work out as (1 + 0.1) * (1 + 0.1) - 1 = 0.21</p>
<p>When we calculate the geometric mean for a rate of return, we need to do the same. Our new formula is:</p>
<p>Mean of Rg = ((1 + R1) * (1 + R2) * … * (1 + Rn)) ^ (1/n) - 1</p>
<p>where  Ri  is the rate of return in time period i.</p>
<p>Consider an investment of $100,000 that halved in value to $50,000 at the end of year one and then doubled back to $100,000 in the second year. The first year return was -50% (-0.5). The second year return was 100% (1.0). The effective return is 0% (0) pa as the investment amount stayed the same. The arithmetic mean rate of return is (-0.5+1)/2 = 0.25 = 25% which is useless here. The geometric mean rate of return is</p>
<p>( (1+ -0.5) x (1 + 1) )1/2 -1 = 0% which is the expected and correct value.</p>
<h3>Calculate measures of central tendency using Excel</h3>
<p>In excel use: =average(), =mode(), =median(), and =geomean(). If you use Geomean() for rates, you need to first convert the rates to factors, and then convert the answer back to a rate.</p>
<h2>2.2 Variation and shape (I)</h2>
<h3>What are these measures?</h3>
<p>The concepts of variation and shape are covered in this and the following two sub-topics. We begin by addressing the measures of variation - range, variance, standard deviation and the coefficient of variation. Here we examine these descriptive statistics as they relate to a sample. Later, we look at how they relate to the population.</p>
<p>These measures provide information on the spread, variability, or dispersion of the data values.</p>
<h3>Business context: Variance, finance and risk</h3>
<p>Variance forms a major component of modern financial investment and risk management practice. If you would like to know more, read the article, at the link below.</p>
<p>Variance measures the variability (volatility) from an average. Volatility is a measure of risk, so this statistic can help determine the risk an investor might take on when purchasing a specific security.</p>
<h3>Note of Video</h3>
<p><b>1. Overview</b></p>
<p>Variation = the amount of variability / spread of the values in a data set — how far the data sits from the middle.</p>
<p>Two distributions can have the same mean but differ in variation: the tall, narrow one has less variation; the flat, wide one has more (slide p.2 "Same centre, differing variation”).</p>
<p>Four measures of variation covered:</p>
<p>Range — simplest</p>
<p>Variance — preferred measure</p>
<p>Standard Deviation — most common</p>
<p>Coefficient of Variation — used to compare data in different units (e.g., stocks)</p>
<p><b>2. Range</b></p>
<p>Range = Xlargest − Xsmallest</p>
<p>Steps: sort the data smallest → largest, then subtract the smallest value from the largest.</p>
<p>Example (student test scores, slide p.3): largest = 12, smallest = 1 → Range = 12 − 1 = 11</p>
<p>Limitations of the range</p>
<p>Doesn't tell the whole story — it doesn't measure the typical distance from the middle.</p>
<ul><li>Sample 1: median = 9.5, points sit 0.5 / 1.5 / 2.5 from the median → Range = 5</li><li>Sample 2: median = 11.5, most points only 0.5 away (one point, 7, is 4.5 away) → Range = 5 as well (slide p.4)</li></ul>
<p>Heavily influenced by outliers — change one value from 5 to 120: Range jumps from 4 to 119 (slide p.5).</p>
<p>Summary: because the range is based only on the highest and lowest values, it is completely determined by outliers / extreme observations.</p>
<p><b>3. Variance (Sample Variance)</b></p>
<p>The preferred measure — it estimates the typical / average squared deviation (distance) from the mean.</p>
<p>S² = Σ (Xᵢ − X̄)² / (n − 1)</p>
<p>X̄: Sample mean (arithmetic mean)</p>
<p><b>n: Sample size</b></p>
<p>Xᵢ: iᵗʰ value of the variable X</p>
<p>Why square the deviations? Points above the mean have positive deviations; points below have negative ones — they would cancel out and sum to zero. Squaring makes every deviation positive.</p>
<p>Why divide by n − 1 instead of n? The video links to further reading; for a sample we adjust to better estimate the population variance (degrees of freedom).</p>
<p>Worked example</p>
<p>Data: 10, 12, 14, 15, 17, 18, 18, 24 (n = 8)</p>
<p>Sample mean: sum ÷ 8 = X̄ = 16</p>
<p>Subtract 16 from each value, square each deviation</p>
<p>Sum all squared deviations, divide by n − 1 = 7</p>
<p>→ Sample variance S² = 18.5714</p>
<p><b>4. Standard Deviation</b></p>
<p>The most common measure of variation — the square root of the variance.</p>
<p>S = √S²</p>
<p>Units: the standard deviation is in the same units as the original data (e.g., house prices → dollars). The variance would be in dollars².</p>
<p>Example: √18.5714 → S = 4.3095</p>
<p>Comparing three samples with the same mean (15.5)</p>
<table><tr><th>Data set</th><th>Spread of values</th><th>Std. deviation</th></tr><tr><td>B - least spread out</td><td>14 → 17.5 (max 2 from mean)</td><td>S = 0.926</td></tr><tr><td>A — more spread</td><td>11 → 21</td><td>S = 3.338</td></tr><tr><td>C — smaller range, but most points far from the middle</td><td>extremes → large squared deviations</td><td>S = 4.570</td></tr></table>
<p>Shape of the distribution</p>
<ul><li>Larger standard deviation → wider, flatter distribution</li><li>Smaller standard deviation → tall, narrow distribution</li></ul>
<p><b>5. Coefficient of Variation (CV)</b></p>
<p>Used mainly in business (e.g., comparing stock prices). Measures relative variation — variation relative to the mean.</p>
<p>CV = (S / X̄) × 100%</p>
<p>Key property: always expressed as a percentage, so it can compare the variability of two data sets measured in different units (e.g., stocks priced in Pounds, Yen, Australian dollars).</p>
<p>Example: comparing two stocks</p>
<table><tr><th>-</th><th>Stock A</th><th>Stock B</th></tr><tr><td>Average price</td><td>$50</td><td>$8</td></tr><tr><td>Std. deviation</td><td>$5</td><td>$2</td></tr><tr><td>CV</td><td>5/50 × 100% = 10%</td><td>2/8 × 100% = 25%</td></tr></table>
<ul><li>Stock A: typical movement ≈ 10% of its average price.</li><li>Stock B: even though its standard deviation is much smaller ($2 vs $5), its CV is much higher because of the lower average price → Stock B is the much riskier stock.</li></ul>
<p><b>6. Quick Comparison Table</b></p>
<table><tr><th>Measure</th><th>Formula</th><th>Unit</th><th>Outlier Sensitivity</th><th>Best used for</th></tr><tr><td>Range</td><td>Xlargest − Xsmallest</td><td>Same as data</td><td>Very high (2 values only)</td><td>Quick first look</td></tr><tr><td>Variance</td><td>Σ(Xᵢ−X̄)²/(n−1)</td><td>Squared units</td><td>Moderate</td><td>Mathematical basis of spread</td></tr><tr><td>Std. deviation</td><td>√Variance</td><td>Same as data</td><td>Moderate</td><td>General-purpose spread measure; volatility/risk in finance</td></tr><tr><td>Coefficient of variation</td><td>(S/X̄) × 100%</td><td>Unitless (%)</td><td>-</td><td>Comparing variability across different units/scales</td></tr></table>
<p>Key takeaways: the range is simple but outlier-driven; the variance measures the average squared distance from the mean (why we square: stop negative/positive cancelling); the standard deviation brings the measure back to the data's units; the CV allows fair comparison across different units — a smaller SD doesn't mean less risk (Stock B).</p>
<h3>Check your understanding</h3>
<p><b>Range:</b></p>
<p>The difference between the largest and smallest value.</p>
<p>Based solely on the most extreme values of the data set.</p>
<p><b>Variance</b></p>
<p>The average squared deviation, or distance, from the sample mean.</p>
<p>Measured in the data's units squared.</p>
<p><b>Standard Deviation</b></p>
<p>The square root of the variance.</p>
<p>Is one component of the coefficient of variation.</p>
<p><b>Coefficient of variation</b></p>
<p>Always expressed as a percentage.</p>
<p>Used to compare the variability of two or more data sets, measured in different units.</p>
<h3>Measures of Variation</h3>
<p>Range: The range is the difference between the largest and smallest values.</p>
<p>Variance: Variance measures how far a set of numbers are spread out from their average value.</p>
<p>Standard Deviation: Standard deviation is how far the values are away from the mean. It is the square root of the variance.</p>
<p>Coefficient of Variation: The coefficient of variation measures relative variation, and it shows variation relative to the mean.</p>
<h2>2.3 Variation and Shape (II)</h2>
<h3>What are these measures?</h3>
<p>In this sub-topic, we're going to look at three more useful tools for variation and shape - Z-scores, skewness and kurtosis.</p>
<p>We'll finish this sub-topic by learning how to use Microsoft Excel to apply these tools and generate general descriptive statistics.</p>
<h3>Note of Video</h3>
<p><b>1. Overview</b></p>
<p>Three more tools beyond centre and spread:</p>
<p>Z-score — position of an observation in the data set (locates outliers)</p>
<p>Skewness — asymmetry of the distribution</p>
<p>Kurtosis — concentration of values in the centre vs. the tails</p>
<p><b>2. Z-Score</b></p>
<p>Definition: the number of standard deviations a data value is above or below the mean.</p>
<p>Z = (X − X̄) / S</p>
<p>X: The data value</p>
<p>X̄: Sample mean</p>
<p>S: Sample standard deviation</p>
<p>Interpretation:</p>
<ul><li>Positive Z → above the mean; negative Z → below the mean</li><li>Large |Z| → the point is a long way from the mean; small |Z| → close to the mean</li></ul>
<p>Using Z-scores to find outliers</p>
<ul><li>|Z| &gt; 2 → could be considered outliers (~5% of observations in a typical data set)</li><li>|Z| &gt; 3 → more extreme outliers (less than 1% of observations would ever be that far)</li></ul>
<p>Worked example — All Ordinaries stock returns (slide p.2)</p>
<ul><li>Sample mean return X̄ = 0.0205%, standard deviation S = 0.941%</li><li>Return on 24 July = −0.4399%</li></ul>
<p>Z = (−0.4399 − 0.0205) / 0.941 = −0.489</p>
<p>→ A return of −0.4399% is 0.489 standard deviations below the mean → not considered an outlier.</p>
<p>Extreme-outlier thresholds (mean ± 3s):</p>
<ul><li>Below −2.8025% or above +2.8435% → extreme outlier (slide p.3: X−3s = −2.80%, X+3s = 2.84%; 0.8% of returns below, 0.6% above)</li></ul>
<p><b>3. Skewness</b></p>
<p>Definition: the amount of asymmetry in the distribution.</p>
<table><tr><th>Skewness value</th><th>Distribution</th><th>Mean vs. Median</th></tr><tr><td>0</td><td>Symmetric (Mean = Median)</td><td>Equal</td></tr><tr><td>Negative (&lt;0)</td><td>Left-skewed — tail below the mean is longer</td><td>Mean &lt; Median (mean pulled down)</td></tr><tr><td>Positive (&gt;0)</td><td>Right-skewed — tail above the mean is longer</td><td>Mean &gt; Median (mean pulled up)</td></tr></table>
<p><b>4. Kurtosis</b></p>
<p>Definition: the relative concentration of values in the centre of a distribution compared to the tails. Large kurtosis → extreme values are more likely (lots of values in the tails).</p>
<p>How it's computed: distances from the mean raised to the 4th power — extreme values dominate the calculation even more than in the variance.</p>
<p>Excess kurtosis</p>
<p>The bell-shaped normal distribution has kurtosis = 3. We subtract 3 to get excess kurtosis:</p>
<p>Excess kurtosis = Kurtosis − 3</p>
<p><b>0: Exactly bell-shaped / normal</b></p>
<p>Positive: Sharper peak, more peaked/taller, fatter (heavier) tails — more values in tails</p>
<p>Negative: Flatter, tails shut off quickly, fatter shoulders, less/not peaked</p>
<p>Examples: U (≈ −1.2), W (−1), C (−0.594) → low kurtosis — tails shut off quickly, not peaked; N = 0 → normal; L (1.2), S (2), D (3) → high kurtosis — longer tails or peaked in the middle (like the red distribution).</p>
<p>Stock returns typically have high kurtosis — a lot of extreme values in the tails.</p>
<p><b>5. Quick Summary Table</b></p>
<table><tr><th>Measure</th><th>Tells you</th><th>Formula / Rule</th><th>Interpretation</th></tr><tr><td>Z-score</td><td>Position relative to mean</td><td>(X − X̄)/S</td><td>±1, ±2, ±3 SD from mean; |Z|&gt;2, &gt;3 → outliers</td></tr><tr><td>Skewness</td><td>Asymmetry of shape</td><td>cubed deviations ÷ S³</td><td>&lt;0 left-skewed, 0 symmetric, &gt;0 right-skewed</td></tr><tr><td>Kurtosis</td><td>Centre vs. tail concentration</td><td>deviations to 4th power − 3</td><td>&lt;0 flat, 0 normal, &gt;0 peaked/heavy tails</td></tr></table>
<p>Key takeaways: Z-scores standardise any value into "how many standard deviations from the mean" — the standard tool for flagging outliers (±2 ≈ 5%, ±3 ≈ &lt;1%); skewness tells you which tail is longer and which way the mean is pulled (mean &lt; median for left-skewed, mean &gt; median for right-skewed); kurtosis (measured as excess over 3) tells you whether extremes are more likely than the normal distribution — critical for understanding stock-return risk (high kurtosis = fat tails).</p>
<h3>Equations for Z-scores, skewness and kurtosis</h3>
<p>Z-scores: The Z-score is the number of standard deviations a data value is from the mean. A data value could be considered extreme (an outlier) if its Z-score is less than -3.0 or greater than +3.0.</p>
<p>Skewness: Skewness is a shape of distribution and measures the amount of asymmetry in a distribution.</p>
<p>Kurtosis: Kurtosis is a shape of distribution and measures the relative concentration of values in the centre of a distribution as compared with the tail.</p>

<h2>2.4 Variation and shape (III)</h2>
<h3>Let’s explore quartiles and boxplots</h3>
<p>This final sub-topic of variation and shape begins by examining quartiles and the interquartile range (IQR). We then see how these, along with the minimum and maximum, form the "five-number summary" used to construct a box and whisker plot. Finally, we see the link between boxplots and distribution shape.</p>
<h3>Quartile measures</h3>
<p>Quartiles split ranked data into four segments with an equal number of values per segment.</p>
<h3>Key points</h3>
<ul><li>The first quartile, Q1, is the value for which 25% of the observations are smaller and 75% are larger.</li><li>The second quartile, Q2, is the median: 50% of the observations are smaller and 50% are larger.</li><li>The third quartile, Q3, has 25% of the observations larger and 75% smaller.</li></ul>
<p>Note: Q1 and Q3 are measures of non-central location. Q2, the median, is a measure of central tendency.</p>
<h3>Locating quartiles</h3>
<p>You find a quartile by determining the value in the appropriate position in the ranked data, where 'n' is the number of observed  values (or our sample size):</p>
<p>First quartile position: Q1 = (n+1) / 4</p>
<p>Second quartile position:  Q2 = (n + 1) / 2</p>
<p>Third quartile position:  Q3 = 3(n+1) / 4</p>
<p>Note: These formulae just tell you the position of the quartile, not the actual value. To find the value you need to sort your data from smallest to largest and find the value in that position using the three rules below.</p>
<p>Clicking on the grey button, to the right of the figure below, highlights the interactive elements in this figure.  Interact with the figure below for a summary of the three rules to consider when calculating quartile measures.</p>
<h3>Rules for calculating quartile measures</h3>
<ul><li>Rule 1: If the result is a whole number then it is the ranked position to use.</li><li>Rule 2: If the result is a fractional half, then take the average of the values either side of that number.</li><li>Rule 3: If the result is not a whole number or a fractional half, then round the result to the nearest number to find the ranked position.</li></ul>
<h3>The Interquartile Range</h3>
<ul><li>Fact 1: The IQR is calculated as Q3 – Q1.</li><li>Fact 2: IQR measures the spread in the middle 50% of the data.</li><li>Fact 3: IQR is also called the mid-spread.</li><li>Fact 4: IQR is a measure of variability, which is not influenced by outliers or extreme values.</li><li>Fact 5: Measures like Q3, Q1 and IQR, that are not influenced by outliers, are called resistant or robust measures.</li></ul>
<h3>Boxplots</h3>
<p>The boxplot is a graphical display of data based on the five-number summary - five numbers (see below) that help describe the centre, spread, and shape of the data.</p>
<p>Five number summary</p>
<p>X.smallest - Q1 - Median - Q3 - X.largest</p>
<p>Also known as the box and whisker plot, the example below shows you how it got that name - the two boxes in the middle and the two ends that look like whiskers!</p>
<h3>Distribution shape and the boxplot</h3>
<p>Clicking on the grey button, to the right of the figure below, highlights the interactive elements in this figure.  Examine the figure below to see how the shape of the distribution in terms of left-skewed, symmetric, or right-skewed, affects the boxplot. Note also the typical relationship between the mean and median under the three different types of skewness.</p>
<p>Note that with the left-skewed distribution the box plot has a longer left whisker and the area in the box to the left of the median is larger than to the right. For the right-skewed distribution the opposite occurs, and for a symmetric distribution, the boxplot is also symmetric.</p>
<p><b>Left-skewed</b></p>
<ul><li>With a longer tail below the mean, the shape of distribution is left-skewed.</li></ul>
<p><b>Symmetric</b></p>
<ul><li>If the data are symmetric around the median, then the box and central line are centred between the endpoints.</li></ul>
<p><b>Right-skewed</b></p>
<ul><li>With a longer tail above the mean, the shape of distribution is right-skewed.</li></ul>
<h2>2.5 Descriptive measures for populations</h2>
<h3>What are these measures?</h3>
<p>We'll explore descriptive measures for a population in this sub-topic. These include population mean, population variance, and population standard deviation. We also consider the the Empirical Rule and Chebyshev's Rule for describing distributions.</p>
<h3>Descriptive measures - sample versus population</h3>
<p>The descriptive, or summary measures we’ve looked at in earlier sub-topics have been for a sample and are called statistics. The descriptive measures we're exploring in this sub-topic are for a population and are called parameters. The distinction between parameters and statistics is important. Parameters are constants - for example, there is only one true mean for a population. Statistics on the other hand are random variables - every time I take a different sample from a population I am likely to get a different sample mean.</p>
<p>Clicking on the grey button, to the right of the figure below, highlights the interactive elements in this figure.  Click through this figure for a summary of the relevant equations for three key measures for a  population - mean, variance and standard deviation.</p>
<p>Population Mean: The formula changes from the 'sample mean' - the Greek letter 'μ' replaces x-bar. The letter 'n' is replaced by ’N’.</p>
<p>Population Variance: The formula changes from the 'sample variance' - the Greek letter 'μ', replaces x-bar and ‘σ’</p>
<p>replaces 'S'. The letter 'n' is replaced by 'N'. The equation 'n-1' is also replaced by ’N’.</p>
<p>Population Standard Deviation: The formula changes from the 'sample Standard Deviation' - the Greek letter 'μ', replaces x-bar and 'σ' replaces 'S'. The letter 'n' is replaced by 'N'. The equation 'n-1' is also replaced by’N’.</p>
<h3>Formulae - sample versus population</h3>
<p>The formulae used for a population (parameters) are very similar to those used for a sample (statistics). The differences in the parameters formulae include:</p>
<ul><li>Capital 'N', replaces 'n' for the mean</li><li>Capital 'N', replaces 'n-1' for the variance and standard deviation</li><li>Population parameters are generally denoted using Greek letters.</li><li>Sample statistics are usually denoted using Latin letters.</li></ul>
<p>The table below compares the symbols used for the mean, variance, and standard deviation in both settings:</p>
<table><tr><th>Measure</th><th>Sample statistics (Latin letters)</th><th>Population parameters (Greek letters)</th></tr><tr><td>Mean</td><td>x̄</td><td>μ</td></tr><tr><td>Variance</td><td>s²</td><td>σ²</td></tr><tr><td>Standard deviation</td><td>s</td><td>σ</td></tr></table>
<h3>Note of Video</h3>
<p><b>1. Overview: Statistics vs. Parameters</b></p>
<ul><li>Statistics = summary measures of a sample (what we've done so far) — denoted by Latin letters (x̄, s², s)</li><li>Parameters = summary measures of a population — generally denoted by Greek letters (μ, σ², σ)</li></ul>
<p>Formulae are almost identical, with two differences:</p>
<p>Use capital N (population size) instead of small n (sample size)</p>
<p>Variance/standard deviation divide by N — no more n − 1</p>
<p><b>2. Population Formulae (slide p.1)</b></p>
<p>Population mean:      μ = Σ Xᵢ / N = (X₁ + X₂ + ⋯ + Xₙ… Xₙₐₜᵢₒₙ)/N</p>
<p>Actually: μ = (X₁ + X₂ + ⋯ + Xₙ)/N where the sum runs from i = 1 to N</p>
<p>Population variance:  σ² = Σ (Xᵢ − μ)² / N</p>
<p>Note: Σ (uppercase sigma) = summation symbol; lowercase sigma (σ) = population standard deviation.</p>
<p><b>3. The Empirical Rule (for bell-shaped / normal distributions only)</b></p>
<p>The empirical rule describes how data is distributed around the mean μ for a bell-shaped distribution:</p>
<p>μ ± 1σ ≈ 68%</p>
<p>μ ± 2σ ≈ 95%</p>
<p>μ ± 3σ ≈ 99.7%</p>
<p>→ Only 0.3% of the population lies further than 3σ from the mean — this is why |Z| &gt; 3 is treated as an outlier/extreme value.</p>
<p>Worked example — Math SAT scores (slides p.4): μ = 500, σ = 90</p>
<ul><li>68% of scores between 410 and 590 (500 ± 90)</li><li>95% of scores between 320 and 680 (500 ± 180 = 2σ)</li><li>99.7% of scores between 230 and 770 (500 ± 270 = 3σ)</li></ul>
<p>The empirical rule only applies to bell-shaped (normal) distributions.</p>
<p><b>4. Chebyshev's Rule (applies to EVERY data set)</b></p>
<p>For any distribution (regardless of shape):</p>
<p>At least (1 − 1/k²) × 100% of values fall within k standard deviations of the mean, for k &gt; 1</p>
<p>k = 2 (1 − 1/4) × 100% = at least 75%</p>
<p>k = 3 (1 − 1/9) × 100% = at least 89%</p>
<p>These are minimum guarantees — the rule is less strict than the empirical rule but universal.</p>
<p>Worked example — financial returns (slide p.6): μ = 0.5%, σ = 1% (not bell-shaped)</p>
<ul><li>k = 2: at least 75% of returns lie between −1.5% and 2.5% (0.5 ± 2×1)</li><li>k = 3: at least 89% of returns lie between −2.5% and 3.5% (0.5 ± 3×1)</li><li>Equivalent: at most 11% of returns lie outside −2.5% to 3.5%</li></ul>
<p><b>5. Quick Comparison Table</b></p>
<table><tr><th>Rule</th><th>Applies to</th><th>Guarantee</th><th>K = 2</th><th>K = 3</th></tr><tr><td>Empirical Rule</td><td>Bell-shaped (normal) only</td><td>Approximate</td><td>95%</td><td>99.7%</td></tr><tr><td>Chebyshev's Rule</td><td>Any distribution</td><td>At least (minimum)</td><td>75%</td><td>89%</td></tr></table>
<p>Key takeaways: parameters (μ, σ², σ) describe populations with division by N (not n−1); the empirical rule gives tight, precise percentages but only for bell curves; Chebyshev gives conservative minimum bounds valid for every data set — perfect for financial returns, which are rarely bell-shaped.</p>
<h3>The Empirical Rule</h3>
<ul><li>Rule 1: Approximately 68% of the data in a bell-shaped distribution is within ± one Standard Deviation of the mean, or μ ± 1σ.</li><li>Rule 2: Approximately 95% of the data in a bell-shaped distribution lies within ± two Standard Deviations of the mean, or μ ± 2μ.</li><li>Rule 3: Approximately 99.7% of the data in a bell-shaped distribution lies within ± threestandard deviations of the mean, or μ ± 3σ.</li></ul>
<h2>2.6 Organising and visualising data (I): Chart types</h2>
<h3>The right table or graph</h3>
<p>The best table or graph tells a clear and compelling story to achieve the required goal. This sub-topic explores how to do this through examples involving global plastics production and waste management.</p>
<h3>Note of Video</h3>
<p><b>Key Points</b></p>
<p>Charting data is one of the most important workplace skills — regardless of role (social media manager, data scientist, management consultant), every job involves analysing data and communicating findings.</p>
<p><b>What makes a great chart</b></p>
<ul><li>Tells a clear, compelling story with data → crucial for getting approval for new projects and gaining/maintaining manager support</li><li>The best business charts:<ul><li>Take less than 5 seconds to understand</li><li>Make a single point that answers an important business question</li></ul></li></ul>
<p><b>How to build them</b></p>
<p>Understand the business context well</p>
<p>Identify the right questions to answer — often not exactly the questions you were asked</p>
<p>Select the right charts that clearly present the facts</p>
<p>Weave them into a clear, compelling story</p>
<p><b>Why it matters</b></p>
<ul><li>Bad charts don't cause bad decisions — they cause something worse: no decision at all</li><li>If nobody understands what you're showing, nobody will believe you — even if you're right, things grind to a halt</li></ul>
<p><b>Takeaway</b></p>
<ul><li>Learn the principles of charting, then get stuck in and practise — it's the only way to learn. Telling compelling stories backed by facts is one of the most generally applicable skills you can learn at uni, and it will help you heaps in your career.</li></ul>
<h3>Some basic types of tables and charts</h3>
<p>We organise and visualise data to reveal and glean any insights within it, and then communicate that information, especially the main features and patterns. Typically, we use tables for organising and summarising data, and graphs and charts for visualising data. Clicking on the grey button, to the right of the figure below, highlights the interactive elements in this figure. Within this figure, explore common types of tables, graphs and charts.</p>
<p>Data can be divided into:</p>
<ul><li>Categorical: Categorical data can have one variable or multiple variables.</li><li>Numeric: Numeric data can have one variable or multiple variables.</li></ul>
<p>Categorical data, with one variable, can be represented by the following table and chart types:</p>
<ul><li>Summary table: The summary table provides a summary of the data in table form. It shows frequency, amount, percentage or proportion in each category.</li><li>Pie chart: The pie chart is a circle broken into slices that represent categories. The size of each slice of the pie varies according to the percentage in each category. Statisticians don’t use pie charts very often.</li><li>Bar or column chart: A bar or column chart shows the frequency, amount or percentage of values in each category.</li><li>Pareto chart: The pareto chart contains both bars and a line graph. Individual values, for categorical data, are displayed in descending order by bars, and a cumulative total of those values are displayed by the line.</li></ul>
<p>Categorical data, with multiple variables can be represented by the following table and chart types:</p>
<ul><li>Contingency table: The contingency table cross tabulates or tallies the responses of multiple categorical variables.</li><li>Side-by-side bar: The side-by-side chart shows the amount or percentage of values in each category.</li><li>Heat map: A heat map is a graphical representation of data where the individual values are represented as colours.</li><li>Sandkey diagram: A sandkey diagram is a type of flow diagram used to show how items re-group. An alluvial diagram is a specific type of sandkey diagram.</li></ul>
<p>Numerical data, with one variable can be represented by the following table and chart types:</p>
<ul><li>Ordered array: An ordered array is a sequence of data, in rank order, from the smallest value to the largest value.</li><li>Frequency distribution: The frequency distribution is a summary table in which data are arranged into numerically ordered classes.</li><li>Histogram: A histogram is a vertical bar chart of data in a frequency distribution. The vertical axis shows frequency, relative frequency or percentage. The horizontal axis shows the class boundaries (or class midpoints). There are no gaps between adjacent bars for continuous data, but there may be gaps for discrete data.</li></ul>
<h3>Choosing the right graph for your data</h3>
<p>A common error is using an inappropriate chart for the data you have collected. When choosing a graph or chart for your data, consider these questions:</p>
<p>What do you want to learn or communicate?</p>
<p>What are the types of comparisons you want to make?</p>
<p>What types of data have you collected?</p>
`;

<table><tr><th>Scenario</th><th>What happened</th><th>Best move</th><th>Probability</th></tr><tr><td>A</td><td>You chose the correct door; host arbitrarily shows one of the wrong doors</td><td>Stay wins</td><td>1/3</td></tr><tr><td>B</td><td>You chose a wrong door; host shows the other incorrect door</td><td>Switch wins</td><td>2/3</td></tr></table>
<ul><li>Scenario A happens only when you picked the winning door (1/3 of the time).</li><li>Scenario B happens whenever you picked a losing door (2/3 of the time).</li><li>→ Switching wins 2 out of 3 times.</li></ul>
<p><b>The 9-Outcome Chart Proof</b></p>
<ul><li>Car behind Door 1, 2, or 3 × your choice of Door 1, 2, or 3 = 9 possible outcomes.</li><li>If the car is behind Door 1 and you chose Door 1 → stay; if you chose Door 2 or 3 → switch.</li><li>Same logic for the car behind Door 2 or 3.</li><li>Totaling all cases: you should switch in 6 out of 9 outcomes — consistent with the 2/3 result.</li></ul>
<p><b>Takeaway</b></p>
<ul><li>This "paradox" has puzzled scientists and mathematicians because our gut says switching makes no difference.</li><li>But formal calculations and computer simulations consistently show: switching increases your probability of winning.</li><li>So — do you still trust your gut feeling?</li></ul>
<h2>3.1 Basic probability concepts</h2>
<h3>What are these concepts?</h3>
<p>This sub-topic examines basic probability concepts, three common approaches for assessing probability and the concepts of events and sample spaces.</p>
<h3>Basic concepts of probability</h3>
<ul><li><b>Probability:</b> the chance that an uncertain event will occur. Expressed numerically this is always a number between 0 and 1.</li><li><b>Impossible event:</b> an event that has no chance of occurring. Expressed numerically, the probability equals '0'.</li><li><b>Certain event:</b> an event that will definitely occur. Expressed numerically, the probability equals '1'.</li><li><b>Uncertain event:</b> concerns the unpredictability of future events which influence present decisions. As they have not yet occurred, no one can predict what they will be like.</li></ul>
<h3>Note of video — Three approaches to probability</h3>
<p><b>1. A Priori Probability</b></p>
<ul><li>Based on deductive reasoning using prior knowledge of a process.</li><li>No data collection needed — probabilities are derived logically from the structure of the situation.</li></ul>
<p>Formula: P(event) = X / T</p>
<ul><li>X = number of ways the event can occur</li><li>T = total number of possible outcomes</li></ul>
<p>Example 1 — Dice:</p>
<ul><li>A die has 6 equally likely sides → probability of a particular number = 1/6.</li><li>Probability of rolling an even number: 3 even outcomes (2, 4, 6) out of 6 total → 3/6 = 50%.</li></ul>
<p>Example 2 — Tennis tournament:</p>
<ul><li>You are ranked #50 in a tournament of 100 players (ranked 1–100).</li><li>Question: chance your randomly selected first-round opponent is in the top 10?</li><li>X = 10 (ways the event can occur); T = 99 (you cannot play yourself) → P = 10/99 = 0.101.</li></ul>
<p><b>2. Empirical Probability</b></p>
<ul><li>Based on observed data from the past to estimate the likelihood of an event.</li><li>Uses the same X/T structure, where X = number of times the event occurred and T = total number of trials.</li></ul>
<p>Example — Telstra stocks:</p>
<ul><li>Want the probability Telstra's stock goes up today.</li><li>Look back at the last 250 days: stock went up on 121 days.</li><li>Estimated probability = 121/250 = 0.484 (48.4%).</li></ul>
<p><b>3. Subjective Probability</b></p>
<ul><li>Based on expert judgement: past experience, personal opinion, or analysis of a situation.</li><li>Differs from a priori: no prior knowledge of the process.</li><li>Differs from empirical: no past data to observe.</li><li>Used when neither logic nor data is available.</li></ul>
<p>Example questions:</p>
<ul><li>Probability that Facebook dominates social media for the next 5 years.</li><li>Probability that a new startup remains solvent for 10 years (no past data exists).</li><li>Probability that Australia wins the next Ashes test series in England.</li><li>Probability that a particular credit card transaction is fraudulent.</li></ul>
<p><b>Summary</b></p>
<table><tr><th>Approach</th><th>Basis</th><th>Key feature</th></tr><tr><td>A priori</td><td>Prior knowledge of the process</td><td>Deductive reasoning (logic)</td></tr><tr><td>Empirical</td><td>Observed data</td><td>Past observations / trials</td></tr><tr><td>Subjective</td><td>Experience and expertise</td><td>Expert judgement, no data</td></tr></table>
<h3>Sample space</h3>
<p>The set of all possible outcomes from an experiment is called the sample space.</p>
<ul><li>Rolling a dice: the sample space is all possible outcomes, 1–6.</li><li>Deck of cards: the sample space is all 52 cards.</li></ul>
<h3>Simple and joint events</h3>
<p>Events are subsets of the sample space. Each possible outcome of an experiment is called an event. Events can be divided into:</p>
<ul><li>simple events</li><li>joint events.</li></ul>
<p>Simple events are described by a single characteristic. An example of a simple event would be a customer plans to purchase a product.</p>
<p>Joint events are described by two or more characteristics. An example of a joint event would be a customer plans to purchase a product and pays more than $100.</p>
<h3>The complement of an event A</h3>
<p>The complement of an event A is the subset of outcomes that are not part of an event. For example, if the event is 'a customer plans to purchase a product', then the complement of the event would be 'the customer does not plan to purchase the product'. It is noted by the symbol A' (and A followed by an apostrophe). We can find the probability of A' as:</p>
<p>P(A') = 1 − P(A)</p>
<h2>3.2 Basic probability</h2>
<h3>Exploring basic probability</h3>
<p>Two types of probability are joint and marginal. This week we will explore these and how they link with mutually exclusive and collectively exhaustive events. Finally, we will look at the general addition rule, which is used to find the union of two events.</p>
<h3>Note of Video</h3>
<p><b>1. Marginal (Simple) Probability</b></p>
<ul><li>Refers to the probability of a simple event — an event defined by a single characteristic.</li><li>Examples: P(Planned to Purchase), P(Paid &gt; $100).</li><li>Computed from a contingency table using the frequencies in the margins (end of rows/columns), divided by the total sample size — this is the empirical method.</li></ul>
<p>Contingency table (frequencies, n = 365 customers):</p>
<table><tr><th></th><th>Paid &gt; $100</th><th>Paid ≤ 100</th><th>Sub-total</th></tr><tr><td>Planned purchase</td><td>4</td><td>27</td><td>31</td></tr><tr><td>Not planned purchase</td><td>48</td><td>286</td><td>334</td></tr><tr><td>Sub-total</td><td>52</td><td>313</td><td>365</td></tr></table>
<ul><li>P(Planned to Purchase) = 31 / 365</li><li>P(Paid &gt; $100) = 52 / 365</li></ul>
<p><b>2. Joint Probability</b></p>
<ul><li>Considers the occurrence of two or more events (a joint event) — e.g., "plans to purchase AND pays &gt; $100".</li><li>Found in the centre of the contingency table; convert frequency to probability by dividing by the sample size (365).</li><li>P(Planned &amp; &gt; $100) = 4 / 365</li><li>P(Not planned &amp; ≤ $100) = 286 / 365</li></ul>
<p><b>3. Mutually Exclusive &amp; Collectively Exhaustive Events</b></p>
<ul><li>Mutually exclusive (ME): events that cannot occur at the same time. Example: "chosen day is in January" vs "chosen day is in March" — a day cannot be in both.</li><li>Collectively exhaustive (CE): events that together cover the entire sample space, so at least one must occur. Example: weekday / weekend / in January / in spring — covers everything but overlaps (weekdays can be in January), so CE but not ME.</li><li>Weekday vs Weekend alone: both ME and CE.</li><li>Key rule: if events are ME and CE, the sum of their probabilities = 1. If events are only CE (with overlap), their probabilities sum to &gt; 1 (everything is covered more than once).</li></ul>
<p><b>4. Calculation Rules</b></p>
<p>Empirical probability of a joint event A and B:</p>
<ul><li>P(A and B) = (number of outcomes satisfying both A and B) / (total number of elementary outcomes)</li></ul>
<p>Marginal probability from joint probabilities:</p>
<ul><li>P(A) = P(A and B₁) + P(A and B₂) + … + P(A and Bₖ)</li><li>where B₁, B₂, …, Bₖ are k mutually exclusive and collectively exhaustive events.</li><li>Example: P(Paid &gt; 100) = P(&gt;100 and Planned) + P(&gt;$100 and Not planned) = 4/365 + 48/365 = 52/365 ✓ (matches the marginal)</li></ul>
<p>General Addition Rule (union of two events):</p>
<ul><li>P(A or B) = P(A) + P(B) − P(A and B)</li><li>The joint probability is subtracted because the overlap gets counted twice when adding the two marginals.</li><li>If A and B are mutually exclusive, P(A and B) = 0, so the rule simplifies to: P(A or B) = P(A) + P(B)</li></ul>
<p>Worked example:</p>
<ul><li>P(Planned OR Paid &gt; 100) = P(Planned) + P(&gt;100) − P(Planned &amp; &gt;$100)</li><li>= 31/365 + 52/365 − 4/365 = 79/365</li><li>Equivalent view: adding the frequencies 4 + 27 + 48 = 79, over 365.</li></ul>
<p><b>5. Contingency Table of Probabilities (Summary Structure)</b></p>
<p>For two variables A (events A₁, A₂) and B (events B₁, B₂):</p>
<table><tr><th></th><th>B₁</th><th>B₂</th><th>Total</th></tr><tr><td>A₁</td><td>P(A₁ and B₁)</td><td>P(A₁ and B₂)</td><td>P(A₁)</td></tr><tr><td>A₂</td><td>P(A₂ and B₁)</td><td>P(A₂ and B₂)</td><td>P(A₂)</td></tr><tr><td>Total</td><td>P(B₁)</td><td>P(B₂)</td><td>1</td></tr></table>
<ul><li>Blue central cells = joint probabilities; green margin cells = marginal probabilities.</li><li>Marginal probabilities for a variable sum to 1; all four joint probabilities also sum to 1 (bottom-right corner).</li></ul>
<p><b>Key Takeaways</b></p>
<ul><li>Marginal = single event (margins); Joint = two or more events (centre).</li><li>ME events cannot co-occur; CE events cover the whole sample space; ME + CE ⇒ probabilities sum to 1.</li><li>Addition rule: add the marginals, subtract the joint (overlap) — unless events are mutually exclusive, in which case just add.</li></ul>
<h3>Re-cap — probability and the general addition rule</h3>
<p>Marginal probability is also referred to as the probability of a simple event. A simple event is defined by a single characteristic. For example:</p>
<ul><li>The probability of a customer planning to purchase a specific product would be expressed as: P(Planned to purchase).</li><li>The probability of a customer paying greater than $100 for a product would be expressed as: P(Paid &gt; $100).</li></ul>
<p>Joint probability considers the occurrence of two or more events (a joint event or intersection of events). For example:</p>
<ul><li>A customer planning to purchase a product and paying greater than $100: P(Planned to purchase and paid &gt; $100).</li><li>A customer not planning to purchase a product and paying less than or equal to $100: P(Not planned to purchase and paid ≤ $100).</li></ul>
<p>General addition rule: used to find the probability of the union of two events A and B — the probability that either event A or event B, or both A and B occur. The general rule says that the probability of A or B can be found by adding the marginal probabilities of events A and B and then subtracting their joint probability.</p>
<p>P(A or B) = P(A) + P(B) − P(A and B).</p>
<h3>Recap — mutually exclusive/collectively exhaustive events</h3>
<p>Mutually exclusive events cannot occur at the same time. Collectively exhaustive events are ones where one of the events must occur. A set of collectively exhaustive events covers the entire sample space.</p>
<p>Mutually exclusive example: consider randomly choosing a day in 2020. Define the following events: A = All days in January; B = All days in March. Conclusion: Events A and B are mutually exclusive as they cannot occur simultaneously.</p>
<p>Collectively exhaustive example: consider randomly choosing a day in 2020. Define: A = Weekday; B = Weekend; C = January; D = Spring. Conclusion:</p>
<ul><li>Events A, B, C and D are collectively exhaustive (as one of the events must occur), but not mutually exclusive (as a weekday can be in January or in Spring).</li><li>Events A and B are collectively exhaustive (as one of the events must occur), and also mutually exclusive (as the events cannot occur at the same time).</li></ul>
<p>Note that if a set of events, say X, Y and Z, are mutually exclusive and collectively exhaustive then their probabilities sum to 1: P(X) + P(Y) + P(Z) = 1.</p>
<h3>Recap — calculation rules for probabilities</h3>
<p>Empirical probability of joint event A and B: P(A and B) = Number of outcomes satisfying A and B / total number of elementary outcomes.</p>
<p>Marginal probability from a set of joint events: P(A) = P(A and B₁) + P(A and B₂) + ... + P(A and Bₖ), where B₁, B₂..., Bₖ are mutually exclusive and collectively exhaustive events.</p>
<h2>3.3 Conditional probability</h2>
<h3>Exploring this concept</h3>
<p>What is conditional probability? It will be explored in this sub-topic along with the concepts of independence and the multiplication rule.</p>
<h3>Note of Video</h3>
<p><b>1. Definition</b></p>
<ul><li>Conditional probability is the probability of one event given the knowledge that another event has occurred.</li><li>It updates the marginal probability of an event with new information.</li><li>Notation: P(A | B) — read as "probability of A given B" or "A conditional on B".</li></ul>
<p><b>2. The Formula</b></p>
<ul><li>P(A | B) = P(A and B) / P(B)</li><li>P(A and B) = joint probability of A and B</li><li>P(B) = marginal (simple) probability of the event we are conditioning on</li></ul>
<p><b>3. Business Context Examples</b></p>
<ul><li>Probability that a customer buys book A after purchasing book B.</li><li>Probability that a customer clicks through a website given its page design.</li><li>Probability that a customer actually purchases after answering a survey saying they plan to purchase.</li></ul>
<p><b>4. Worked Example (Shop Data, n = 365)</b></p>
<p>Let A = paid &gt; $100, B = planned to purchase.</p>
<table><tr><th></th><th>Paid &gt; $100</th><th>Paid ≤ $100</th><th>Total</th></tr><tr><td>Planned purchase</td><td>4</td><td>27</td><td>31</td></tr><tr><td>Not planned purchase</td><td>48</td><td>286</td><td>334</td></tr><tr><td>Total</td><td>52</td><td>313</td><td>365</td></tr></table>
<ul><li>P(&gt;$100 | planned purchase) = P(&gt;$100 and planned purchase) / P(planned purchase)</li><li>= (4/365) / (31/365) = 4/31 ≈ 0.129</li><li>Intuition: restricting attention to the 31 people who planned to purchase, 4 of them spent more than $100.</li></ul>
<p><b>5. Decision Trees</b></p>
<ul><li>An alternative to the contingency table for representing probability.</li><li>If both variables' decisions happen simultaneously, the order of variables doesn't matter — both orderings end with the same four simple events. The question may suggest a logical ordering based on time, but not always.</li><li>Tree structure (starting with planned purchase):
<ul><li>First-stage branches (from the root node): marginal probabilities — P(planned) = 31/365, P(not planned) = 334/365.</li><li>Second-stage branches: conditional probabilities, conditional on the event on the prior branch — e.g., 4 of the 31 planners spent &gt; $100.</li><li>Final nodes (branch products): joint probabilities — P(planned and &gt;$100) = 4/365, P(planned and ≤$100) = 27/365, P(not planned and &gt;$100) = 48/365, P(not planned and ≤$100) = 286/365.</li></ul></li></ul>
<p><b>6. Practice Problem — Used Car Lot</b></p>
<p>Of the cars on a used car lot: 90% have air conditioning (AC), 40% have a GPS, 35% have both. Question: what is P(GPS | AC)?</p>
<p>Step 1 — Build the contingency table (probabilities):</p>
<table><tr><th></th><th>GPS</th><th>No GPS</th><th>Total</th></tr><tr><td>AC</td><td>0.35</td><td>0.55</td><td>0.90</td></tr><tr><td>No AC</td><td>0.05</td><td>0.05</td><td>0.10</td></tr><tr><td>Total</td><td>0.40</td><td>0.60</td><td>1.00</td></tr></table>
<p>How the numbers are derived:</p>
<ul><li>P(AC) = 0.90 is a marginal → row total; therefore P(No AC) = 0.10 (row must sum to 1).</li><li>P(GPS) = 0.40 is a marginal → column total; therefore P(No GPS) = 0.60.</li><li>P(AC and GPS) = 0.35 is a joint probability (given).</li><li>Top row must sum to 0.90 → P(AC, No GPS) = 0.55.</li><li>GPS column must sum to 0.40 → P(No AC, GPS) = 0.05.</li><li>Joint probabilities must sum to 1 → P(No AC, No GPS) = 0.05.</li></ul>
<p>Step 2 — Apply the conditional formula:</p>
<ul><li>P(GPS | AC) = P(GPS and AC) / P(AC) = 0.35 / 0.90 = 0.3889 (to 4 decimal places).</li></ul>
<p><b>Key Takeaways</b></p>
<ul><li>Conditional probability updates an event's probability using knowledge of a related event.</li><li>Formula: P(A | B) = P(A and B) / P(B).</li><li>Same problem can be represented with either a contingency table or a decision tree — tree branches show marginal → conditional → joint probabilities along the path.</li></ul>
<h3>Re-cap — conditional probability</h3>
<p>The conditional probability of A given that B has occurred: P(A|B) = P(A and B) / P(B).</p>
<h3>Independence</h3>
<p>When the occurrence of one event does not affect the probability of occurrence of another event, the events are said to be independent. For example, events A and B are independent when the probability of A is not affected by the fact that event B has occurred and vice versa.</p>
<p>If events A and B are independent then P(A | B) = P(A) and P(B | A) = P(B).</p>
<h3>Multiplication rule</h3>
<p>The multiplication rule is used to find a joint probability of two events using a conditional probability of one event and marginal probability of the event being conditioned on.</p>
<p>P(A and B) = P(A | B)P(B) and similarly, P(A and B) = P(B | A)P(A).</p>
<p>Note: If A and B are independent, then P(A | B) = P(A) and the multiplication rule simplifies to P(A and B) = P(A)P(B).</p>
<h2>3.4 Bayes' theorem</h2>
<h3>Note of Video</h3>
<p><b>1. What Is Bayes' Theorem?</b></p>
<ul><li>Developed in the 18th century by the Reverend Thomas Bayes.</li><li>Used to revise probabilities when new information arrives — e.g., every time you click a link on Google, the search engine updates its probability that you'll choose another book, click a particular link, or follow an ad.</li><li>Key power: reverses the conditioning between two events — if you know P(A|B) but want P(B|A), Bayes' Theorem lets you flip it.</li></ul>
<p><b>2. Simple Form</b></p>
<p>P(B|A) = P(A|B) × P(B) / P(A)</p>
<p>Where does it come from?</p>
<ul><li>Recall conditional probability: P(A|B) = P(A and B) / P(B)</li><li>Rearrange → Multiplication rule: P(A and B) = P(A|B) × P(B)</li><li>Similarly, P(B|A) = P(A and B) / P(A), so P(A and B) = P(B|A) × P(A)</li><li>Set the two expressions for P(A and B) equal, rearrange → the Bayes' formula.</li></ul>
<p><b>3. General Form</b></p>
<p>P(Bᵢ|A) = P(A|Bᵢ) × P(Bᵢ) / [P(A|B₁)P(B₁) + P(A|B₂)P(B₂) + … + P(A|Bₖ)P(Bₖ)]</p>
<ul><li>Bᵢ = the ith event of k mutually exclusive and collectively exhaustive events</li><li>A = a new event that might impact P(Bᵢ)</li><li>The only difference from the simple form: the denominator P(A) is expanded as the sum of A's intersections with all the Bᵢ events (using the multiplication rule for each intersection).</li></ul>
<p><b>4. Worked Example — M&amp;R Electronics</b></p>
<p>Given:</p>
<ul><li>40% success rate for new model TVs</li><li>In the past, 80% of successful TVs received a favourable report</li><li>Only 30% of unsuccessful TVs received a favourable report</li><li>The new model TV received a favourable report</li></ul>
<p>Question: What is the probability that the new TV will be successful?</p>
<p>Step 1 — Define events:</p>
<ul><li>S = TV is successful, U = TV is unsuccessful (complement of S)</li><li>F = report is favourable</li></ul>
<p>Step 2 — Extract probabilities (prior &amp; conditional):</p>
<ul><li>P(S) = 0.4, P(U) = 1 − 0.4 = 0.6 (prior probabilities)</li><li>P(F|S) = 0.8, P(F|U) = 0.3 (conditional probabilities)</li><li>Goal: find P(S|F) — the revised probability</li></ul>
<p>Step 3 — Apply Bayes' Theorem (general form):</p>
<ul><li>P(S|F) = P(F|S) × P(S) / [P(F|S)P(S) + P(F|U)P(U)]</li><li>= (0.8)(0.4) / [(0.8)(0.4) + (0.3)(0.6)]</li><li>= 0.32 / (0.32 + 0.18)</li><li>= 0.32 / 0.50</li><li>= 0.64</li></ul>
<p>Interpretation: Given the favourable market research report, the revised probability of success rises from 0.4 to 0.64.</p>
<p><b>5. Why It Matters (Business Analytics)</b></p>
<ul><li>Later in the unit, we model relationships between business variables and use those models to forecast — and the models/forecasts are built on conditional probabilities.</li><li>Bayes' Theorem is therefore a core concept in business analytics for updating beliefs with new evidence.</li></ul>
<p><b>Key Takeaways</b></p>
<ul><li>Bayes' Theorem reverses conditioning: P(B|A) = P(A|B)P(B) / P(A).</li><li>The denominator P(A) in the general form is the sum of intersections of A with k mutually exclusive, collectively exhaustive events, computed via the multiplication rule.</li><li>Example result: P(S|F) = 0.64 — the favourable report updates the success probability from 0.4.</li></ul>
<h3>Bayes' Theorem</h3>
<p>Bayes theorem (simple form): The probability of B given A, is equal to the probability of A given B (the reverse conditioning), multiplied by the marginal probability of B, and divided by the marginal probability of A.</p>
<p>Bayes' theorem (general form): The only difference is that the marginal probability in the denominator in the simple form, P(A), has been written out as the sum of the intersections of A with a set of mutually exclusive and collectively exhaustive events, B₁…, Bₖ.</p>
<h2>3.5 Counting rules</h2>
<h3>What are the counting rules?</h3>
<p>In many instances, there are a large number of possible outcomes, and determining the exact number can be difficult. Rules have been developed for counting the exact number of possible outcomes for these situations. This sub-topic discusses five such counting rules.</p>
<h3>Note of Video</h3>
<p>Counting rules for determining the number of possible discrete outcomes of an experiment, useful when a priori probability requires counting many possible events.</p>
<p>Why counting rules matter: A priori probability = (number of ways the event can occur) / (total number of outcomes). When there are many possible events, counting by hand gets tricky and time-consuming — counting rules help.</p>
<p><b>Counting Rule 1 — Multiple Events per Trial (Same Count Each Trial)</b></p>
<ul><li>If any of k events can occur on each of n trials, the number of possible outcomes is kⁿ.</li><li>Example (dice): roll a die 3 times → 6³ = 216 possible outcomes (3 trials × 6 events each).</li><li>Example (customers): whether each of 10 customers purchases (purchase / not) → 2¹⁰ = 1,024 possible outcomes.</li></ul>
<p><b>Counting Rule 2 — Different Number of Events per Trial</b></p>
<ul><li>If trial 1 has k₁ events, trial 2 has k₂ events, …, trial n has kₙ events, the total outcomes are k₁ × k₂ × … × kₙ = Π(kᵢ) (product symbol).</li><li>Example: roll a die (6 events) then flip a coin (2 events) → 6 × 2 = 12 possible outcomes.</li><li>Example (shop): customer plans to purchase or not (2) AND spends &lt; 100 or ≥ 100 (2) → 2 × 2 = 4 possible outcomes.</li></ul>
<p><b>Counting Rule 3 — Factorial (Arranging All Items in Order)</b></p>
<ul><li>The number of ways n items can be arranged in a unique order is n! = n × (n−1) × … × 1.</li><li>Why it works: first position has n choices, second has n−1, etc.</li><li>Example (bookshelf): 5 books → 5! = 5 × 4 × 3 × 2 × 1 = 120 different arrangements.</li></ul>
<p><b>Counting Rule 4 — Permutations (Arranging x of n Items, Order Matters)</b></p>
<ul><li>The number of ways of arranging x objects selected from n objects, where order matters: ⁿPₓ = n! / (n − x)!</li><li>Example (bookshelf): 5 books, put 3 on the shelf → 5! / (5−3)! = 5!/2! = 5 × 4 × 3 = 60 (the 2 × 1 cancels).</li></ul>
<p><b>Counting Rule 5 — Combinations (Selecting x of n Items, Order Irrelevant)</b></p>
<ul><li>The number of ways of selecting x objects from n objects, irrespective of order: ⁿCₓ = n! / [x! (n − x)!]</li><li>Why divide by x!? Permutations (Rule 4) would count each ordering of the same set as different (A,B,C vs A,C,B vs C,B,A — 3! = 6 ways per set), so Rule 4's count is reduced by a factor of x!.</li><li>Example (reading): select 3 of 5 books to read → 5! / [3! (5−3)!] = 120 / [(6)(2)] = 10 different sets.</li></ul>
<p><b>Summary Table</b></p>
<table><tr><th>Rule</th><th>Name</th><th>Formula</th><th>Order matter?</th><th>Example</th></tr><tr><td>1</td><td>Multiple event per trial</td><td>kⁿ</td><td>-</td><td>6³ = 216</td></tr><tr><td>2</td><td>Varying events per trial</td><td>k₁ × k₂ × … × kₙ</td><td>-</td><td>6 × 2 = 12</td></tr><tr><td>3</td><td>Factorial</td><td>n!</td><td>Yes (all items)</td><td>5! = 120</td></tr><tr><td>4</td><td>Permutations</td><td>n! / (n − x)!</td><td>Yes</td><td>⁵P₃ = 60</td></tr><tr><td>5</td><td>Combinations</td><td>n! / [x! (n − x)!]</td><td>No</td><td>⁵C₃ = 10</td></tr></table>
<p><b>Key Takeaways</b></p>
<ul><li>Rules 1–2 count outcomes of repeated trials; Rules 3–5 count arrangements/selections of items.</li><li>The difference between Rule 4 and Rule 5 is whether order matters — combinations divide permutations by x! to remove duplicate orderings.</li><li>These five rules provide the toolkit for determining total outcomes needed for probability calculations.</li></ul>
<h3>'n!'</h3>
<p>n! is spoken as "n factorial" and is a product of 'n' numbers, each one less than the preceding value. You can write a factorial n! by starting with the number n, multiplying it by one less than the previous number, and repeat until you reach 1, at which time you stop: n × (n−1) × ... × 2 × 1.</p>
<p>Note also that zero factorial is defined to be equal to 1, that is, 0! = 1.</p>
<h3>Counting Rules</h3>
<ul><li>Counting rule 1 determines the number of possible outcomes when k events can occur on each of n trials.</li><li>Counting rule 2 is a generalised version of counting rule 1. It allows the number of possible events to differ from trial to trial.</li><li>The third counting rule involves computing the number of ways that a set of items can be arranged in order.</li><li>Counting rule 4 allows you to find out the number of ways in which a subset of an entire group of items can be arranged in order. Each possible arrangement is called a permutation.</li></ul>
<h2>3.6 Ethical Considerations</h2>
<h3>Ethical issues and probability</h3>
<p>Ethical issues can arise when statements related to probability are presented to the public. Probability statements are often incorporated into advertising campaigns to strengthen a particular product or position.</p>
<p><b>Example 1: Lotteries</b></p>
<p>In some instances, the misinterpretation is not intentional, but in other cases - it may be misleading or even unethical.</p>
<p>"We won't stop (the lottery) until we have made everyone a millionaire!" — US state lottery commercial</p>
<p>Although virtually all participants know they are very unlikely to win the lottery, they also have very little idea of how unlikely it is for them to select the winning numbers. They have even less of an idea of the probability of not selecting any winning numbers. Is it possible that the lottery can make everyone a millionaire? Is it ethical to suggest that the purpose of the lottery is to make everyone a millionaire?</p>
<p><b>Example 2: Investments</b></p>
<p>Another example of a potentially unethical application of probability relates to an investment service promising a 90% probability of a 20% return on investment. To make such a claim ethical — the investment service needs to do at least these three things:</p>
<ul><li>Explain the basis on which this probability estimate rests.</li><li>Provide the probability statement in another format (such as 9 chances in 10).</li><li>Explain what happens in the 10% of cases in which the promised 20% of returns do not occur. For example, would this mean the entire investment is lost?</li></ul>
`;

const NOTE_PMGT1852_W2P = `
<h2>Week 2 Prepare</h2>
<h3>Discussion</h3>
<p>Following are some important factors contributing to stakeholder motivation described in this week's lecture. Please describe each of them, then state how it relates to project stakeholder motivation to contribute:</p>
<ol><li>Adam Smith's notion of "self-interest”</li><li>Logic of Consequentiality</li><li>Full rationality versus bounded rationality</li><li>Theory of planned behaviour</li><li>Logic of Appropriateness</li><li>Stakeholder Capabilities</li></ol>
<h3>Sample Answer</h3>
<p><b>1. Adam Smith's "self-interest" </b>— People are primarily driven by their own perceived benefit. In Smith's view, the butcher, brewer, and baker serve our needs not out of benevolence but because it is in their interest to do so. Relation to stakeholders: Stakeholders will contribute when they see clear personal or organizational gain (financial return, power, reputation, learning). Motivation drops when contribution costs more than it returns, so project managers should frame involvement in terms of what stakeholders stand to gain.</p>
<p><b>2. Logic of Consequentiality </b>— Decision-makers choose actions based on anticipated outcomes: they evaluate alternatives, estimate consequences, and pick the option with the best expected result. Relation: Stakeholders are more motivated when the project's outcomes are visible, tangible, and positively valued by them. If consequences seem remote, uncertain, or negative (e.g., job loss, budget cuts), motivation falls — so projects should make benefits explicit and credible.</p>
<p><b>3. Full vs. bounded rationality </b>— Full rationality assumes people have complete information, unlimited processing power, and always optimize. Bounded rationality (Simon) recognizes that people have limited time, information, and cognitive capacity, so they "satisfice" — choosing a good-enough option. Relation: Stakeholders don't weigh every option perfectly; they use heuristics, prior experience, and available (often imperfect) information. Motivation depends on how easy the project makes it to see and act on its benefits — reducing complexity and information overload increases willingness to engage.</p>
<p><b>4. Theory of Planned Behaviour (Ajzen) </b>— Behaviour is predicted by three factors: attitude toward the behaviour (positive/negative evaluation), subjective norms (perceived social pressure), and perceived behavioural control (belief in one's ability to perform it). Relation: A stakeholder contributes when they (a) view participation favourably, (b) believe important others expect it, and (c) feel capable of making a meaningful contribution. Managers can motivate by building positive attitudes, leveraging influential champions, and removing barriers that undermine confidence.</p>
<p><b>5. Logic of Appropriateness (March)</b> — In contrast to consequentiality, people often act based on identity and rules: "What does a person like me do in a situation like this?" They follow norms, roles, and obligations rather than cost-benefit calculation. Relation: Stakeholders contribute when participation fits their professional identity, values, or expected role (e.g., "it's my duty as the client's representative"). Motivation is strengthened by aligning the project with stakeholders' role expectations and organizational norms, not just incentives.</p>
<p><b>6. Stakeholder Capabilities</b> — Motivation alone is insufficient; stakeholders must have the knowledge, skills, resources, authority, and time to contribute effectively. Relation: A stakeholder may be highly willing but unable to contribute (lacking expertise, decision rights, or capacity). Project teams should assess capabilities, provide training and support, and ensure stakeholders are empowered — motivation and capability must both be present for meaningful contribution.</p>
`;

<p>This week, we focus on structural complexity – the kind of complexity that arises when a system has many moving parts, feedback loops, or interconnected elements. You’ll be introduced to the idea of complex adaptive systems (CAS) and the concepts of emergence, self-organization, and the edge of chaos. You’ll also be introduced to causal loop diagrams (CLDs) – a tool for visually mapping dynamic relationships within a system – and you’ll build your own CLD in class to explore how reinforcing and balancing feedback loops shape project outcomes.</p>
