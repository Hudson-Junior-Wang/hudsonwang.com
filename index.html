<p>Phase transition / emergent properties:</p>
<ul><li>Below a threshold → the human mind easily understands the situation</li><li>Past the threshold → variety of potential links becomes too much to hold at once; the project passes from difficult → complex</li><li>At some point it goes through a phase transition and exhibits emergent properties — non-linear behaviour that can't be predicted from the individual parts</li><li>Brain analogy: neurons are fundamentally the same across species; complexity and emergent behaviour arise from the number of neurons and interconnections; huge leaps happen once thresholds pass; multiple thresholds may exist</li><li>In management: past the threshold we can no longer see the whole system, monitor all interrelationships, or tell which elements matter; ability to predict and understand emergent properties diminishes</li></ul>
<p>Worked illustrations (from figures):</p>
<table><tr><th>Figure</th><th>Setup</th><th>Possible outcomes</th></tr><tr><td>2.2</td><td>1 ambiguous aspect, 4 states</td><td>4 possibilities - manageable</td></tr><tr><td>2.3</td><td>3 interconnected ambiguous aspects, 4 states each</td><td>64 possibilities — harder, still OK</td></tr><tr><td>2.4</td><td>8 uncertain areas, 4 states each</td><td>65,536 possibilities — significantly more complex</td></tr></table>
<p>6. 'Satisficing' Zones (Herbert Simon)</p>
<ul><li>Satisficing (Simon 1957) = seeking solutions that are "good enough", rather than optimal — because searching for better solutions expends resources; the better solution must justify its extra search cost</li><li>Satisficing zone (Middleton 1998) = the part of the problem-space where agreement is reached that a satisfactory resolution exists</li><li>In complex projects the satisficing zone can't be specified precisely:<ul><li>Project may close when stakeholders agree goals are achieved — or agree old goals aren't achieved but the project satisfices under new criteria</li><li>Teams may abandon problem-solving when further pursuit becomes redundant under a newly emerged state, or when they can't make adequate sense of it</li></ul></li><li>The satisficing zone in design is ambiguous because goal criteria are typically unknown (Simon 1981) — e.g., a car designed for a new market: success criteria only become apparent after launch</li><li>Linked or contradictory goal criteria further complicate identifying the zone</li></ul>
<p><b>7. Problem and Solution Spaces</b></p>
<ul><li>Ambiguous aspects don't fall into neat options — the final value is a point within a multidimensional space, not a selection from predefined options</li><li>Each area of ambiguity = a paired problem + solution space (both may change as the project develops):<ul><li>Problem space = range in which the final definition of the problem exists — changes with client demands or developments in interconnected areas</li><li>Solution space = range in which a solution will be found — changes with the problem space or growing understanding of what's possible given resources</li></ul></li><li>Ranges are malleable — size, shape, quality change over time; most work packages can be defined as ranges, not single points</li><li>Different kinds of ambiguity have different effects on a project — the different types of ambiguity produce four distinctly different kinds of complexity (structural, technical, directional, temporal), each covered in detail in the next four chapters</li></ul>
<p><b>8. Chapter Summary</b></p>
<p>Complexity is a matter of perception</p>
<ul><li>Not everyone sees the same complexity in a situation — whether you do depends on how you look at it</li><li>Both a too-narrow focus and great experience can hide complexity, though for opposite reasons</li></ul>
<p>Categorisation</p>
<ul><li>How we categorise (and the categories we develop) depends on the methods we use</li><li>Categories enable communication but also blind us to certain characteristics of an object</li></ul>
<p>Problem and solution spaces</p>
<ul><li>Problems and solutions can each be thought of as a point within a range of possible outcomes — both may keep developing throughout the project's life</li></ul>
<p>Where the perception of complexity comes from — the varying influence of three qualities:</p>
<ul><li>Quantity: More interconnected elements → harder to track all states; number of possible outcomes rises rapidly</li><li>Ambiguity: More ambiguity in problem/solution spaces → prevents detailed planning; requires ongoing monitoring and definition</li><li>Interconnectedness: More interlinked elements → project must be seen as an interdependent whole, not separable parts</li></ul>
<p>The four kinds of complexity exhibit these three qualities in different ways.</p>
<p>Key takeaways: complexity isn't an objective property — it lives in the interaction of quantity × ambiguity × interconnectedness, past a threshold beyond which we can't hold the system in mind and emergent, non-linear behaviour appears; the remedy is disciplined categorisation (four source-based types), deliberate perspective-switching (eagle/mouse, OBS/PBS planes), satisficing rather than optimising, seeing work in terms of malleable problem/solution spaces, and reflective practice for deep learning.</p>
<h3>Note of Assumptions and Triple-Loop Learning</h3>
<p><b>1. Core Idea</b></p>
<p>In complex change systems, it's not enough to reflect on actions and results. Teams must also periodically reflect on:</p>
<ul><li>their assumptions about how change happens, and</li><li>their identity and values</li></ul>
<p>— what some call triple loop learning (as Chris Roche put it).</p>
<ul><li>Theories of change are not just "log frames on steroids" — they are about achieving shared understanding and reflecting on assumptions</li><li>Learning = a process of reflection and gaining (new) knowledge and understanding</li><li>You cannot go from data to insight without questioning your assumptions — and this works at different levels, hence different learning loops</li><li>There is little agreement on the concept's origins, so the following framing borrows from the PERL programme in Nigeria</li></ul>
<p><b>2. The Three Learning Loops</b></p>
<p>1. Single loop learning — "Are we doing things right?”</p>
<ul><li>Whether planned activities were achieved and what immediate course corrections are needed</li><li>Often thought of as a thermostat (too hot / too cold)</li><li>Detecting errors and enabling short-term improvements in working practices and results</li><li>Concerned mostly with WHAT we're doing — fixing day-to-day operational problems</li></ul>
<p>2. Double loop learning — "Are we doing the right things?”</p>
<ul><li>Deeper reflection on emerging patterns or trends, over a longer period or across locations</li><li>How we interact with partners and communities, and whether we're doing this the right way</li><li>Reflection on causal assumptions, pathways of change, organisational norms, practices and policies</li><li>Concerned with WHAT and HOW</li></ul>
<p>3. Triple loop learning — "What is right?”</p>
<ul><li>Deepest level; longer timeframes; considers organisational principles and goals (values, mission, vision)</li><li>Beyond patterns of success/failure — asks why we do what we do and who we should be (identity, of the programme and the organisation)</li><li>Concerned with WHY &amp; WHO</li></ul>
<p><b>3. Figure 3.1 — Three Different Levels of Learning</b></p>
<p>The diagram shows four boxes at the top — Organisational contexts | Practices, rationale and policies | Actions | Results — with feedback arrows back, and three loops at increasing depth:</p>
<p>Single loop: Change actions to correct mismatches and errors, based on existing practices, policies and norms</p>
<p>Double loop: Change practices, policies and norms</p>
<p>Triple loop: Change overall organisational rationale and context</p>
<p>(References for further reading: Argyris 1977; Argyris &amp; Schön 1992; Sinek 2009; Ramalingam et al. 2009; Roche 2010; Ørnemark 2015; Prieto Martin et al. 2017; Cabaj 2019.)</p>
<p><b>4. Matching Learning Loops and Assumptions</b></p>
<p>As Chris Argyris (1977) pointed out:</p>
<p>"If people are unaware of the propositions they use [i.e. theories of action], then it appears that they design for themselves private assumptions that are not genuinely self-corrective. They are thus prisoners of their own theories.”</p>
<p>The learning loops map (broadly, though imperfectly) onto four types of assumptions in theories of change:</p>
<table><tr><th>#</th><th>Assumption type</th><th>Meaning</th><th>Chiefly about</th></tr><tr><td>1</td><td>Paradigmatic assumptions</td><td>Structuring assumptions used to order the world into fundamental categories — belief systems, worldviews, philosophies</td><td>WHY / WHO</td></tr><tr><td>2</td><td>Prescriptive assumptions</td><td>What we think ought to happen; how we and other actors should behave; what's deemed appropriate in a context</td><td>WHY / WHO</td></tr><tr><td>3</td><td>Causal assumptions</td><td>How different parts of the world work and the conditions under which they can change; the events/conditions needed (necessary conditions) for a cause to lead to an effect; may be location-specific or hold across locations</td><td>WHAT connects to HOW</td></tr><tr><td>4</td><td>Operational assumptions</td><td>The operating environment for delivering a programme; what it takes to implement — external context (political stability, freedom of expression/movement, environment) and operational logistics (resources, access, participation)</td><td>WHAT</td></tr></table>
<p>The matching table (flipped loops)</p>
<table><tr><th>Learning loop</th><th>Types of Assumption</th><th>Question</th></tr><tr><td>Single loop learning</td><td>Operational assumptions</td><td>WHAT</td></tr><tr><td>Double loop learning</td><td>Causal assumptions</td><td>WHAT &amp; HOW</td></tr><tr><td>Triple loop learning</td><td>Paradigmatic &amp; prescriptive assumptions</td><td>WHY &amp; WHO</td></tr></table>
<p><b>5. How (and How Often) to Ask Each Question</b></p>
<p>"Are we doing things right?" — reflects mostly on operational (implementation) assumptions: access, logistics, what's impeding delivery. Asked very regularly (consciously or not) — this is the "log frame on steroids" territory that's often criticised. Argyris: "You cannot openly confront norms that tell you not to confront policies and objectives.”</p>
<p>"Are we doing the right things?" — reflects on causal assumptions: links between events, whether the approach is right. Asked less frequently (avoid going round in circles) — in line with the rhythm of expected significant change: can be highly structured (e.g., biannual) or less structured (intense-period debriefs, after-action reviews). For trends: why change happens in one context but not another; why a strategy fits location A but not location B.</p>
<p>"What is right?" — the opportunity to reflect on what type of programme/organisation we want to be. Because it's ultimately about organisational identity, it's rare to do more than once a year. Question values and normative assumptions: Are we the right organisation to do this? Does working with these partners contradict our values? Does this approach align with our mission?</p>
<p><b>6. Key Takeaways</b></p>
<ul><li>Data → insight requires questioning assumptions; reflection must happen at multiple depths</li><li>Single loop fixes WHAT (actions); double loop rethinks HOW (practices, policies, causality); triple loop questions WHY &amp; WHO (identity, values, mission)</li><li>Assumptions map onto loops: operational → single, causal → double, paradigmatic + prescriptive → triple</li><li>Frequency of reflection should scale with depth: operational questions often, strategic (causal) questions at the rhythm of significant change, identity questions about once a year</li><li>Being explicit about your assumptions helps you learn better — and stops you being "a prisoner of your own theories"</li></ul>
<h3>Note of The Fifth Discipline Chapter 4</h3>
<p><b>Overview</b></p>
<p>Senge presents 11 "laws" that reveal how systems behave — most of them warnings about why obvious, well-intentioned solutions fail. Together they form the basis for "seeing structures, not events."</p>
<p><b>1. Today's problems come from yesterday's “solutions”</b></p>
<ul><li>Rug merchant story: steps on a bump in his carpet, flattening it — but the bump reappears elsewhere; he keeps jumping until he finally lifts the corner and an angry snake slithers out</li><li>Problems are often caused by our own past solutions: a firm's sales slump this quarter because last quarter's successful rebate program made customers buy early; a manager "solves" high inventory costs but the salesforce now spends 20% of its time handling angry customers waiting for late shipments</li><li>Police example: arresting dealers on Thirtieth Street just moves the crime center to Fortieth Street; intercepting a drug shipment raises prices → more crime by addicts</li><li>Why it goes undetected: those who "solved" the first problem are different from those who inherit the new one</li></ul>
<p><b>2. The harder you push, the harder the system pushes back</b></p>
<ul><li>Boxer the horse (Animal Farm): "I will work harder" — his diligence backfires; it kept the other animals from seeing the pigs’ manipulation</li><li>Key concept: compensating feedback — well-intentioned interventions call forth responses that offset the intervention's benefits</li><li>Examples: 1960s US inner-city housing/job programs → attracted migrants, overcrowding, eroded tax base, worse off by the 1970s; food aid → more people survive → higher population growth → more malnutrition; letting the dollar fall → foreign competitors cut prices in parallel; suppressing guerrillas → more legitimacy → more resistance; aggressive marketing when a product loses appeal → service quality declines → more customers lost</li><li>Personal examples: quitting smoking → weight gain → take up smoking again; the protective mother → a child who never learns to resolve differences</li><li>We not only get drawn into compensating feedback — we often glorify the suffering ("push harder" creed, like Boxer)</li></ul>
<p><b>3. Behavior grows better before it grows worse</b></p>
<ul><li>Low-leverage interventions are alluring because they work in the short term — compensating feedback involves a delay</li><li>Domino cartoon: man relaxes after pushing over one domino, not seeing the chain circling around to strike him from behind</li><li>Why political decision-making is counterproductive: many ways to make things "look better" in the short run (building power bases, pleasing the boss) — the feedback comes back “eventually”</li><li>The delay explains why systemic problems are so hard to recognize — the problem may return 2–4 years later, by which time someone new sits in the chair</li></ul>
<p><b>4. The easy way out usually leads back in</b></p>
<ul><li>Sufi story of the drunk: searching for keys under the street lamp "because there is no light by my doorway”</li><li>We prefer familiar solutions; sometimes the keys are under the lamp, but often they are in the darkness — if the answer were obvious, it would already have been found</li><li>Pushing harder on familiar solutions while fundamental problems persist = reliable indicator of nonsystemic thinking — the "what we need here is a bigger hammer” syndrome</li></ul>
<p><b>5. The cure can be worse than the disease</b></p>
<ul><li>The easy solution can be addictive and dangerous: alcoholism starts as social drinking (a "solution" to stress), then makes the original problems worse</li><li>The most insidious long-term consequence: increased need for more and more of the solution</li><li>Systems term: "Shifting the Burden to the Intervenor" — short-term improvements leading to long-term dependency (federal aid to cities, food relief, welfare — all leave the host system weaker and needing more help)</li><li>More examples: pocket calculators replacing arithmetic knowledge; nursing homes replacing extended families; Cold War shifting peace-from-negotiation to armaments; consultants making companies dependent</li><li>The fix (Meadows): any long-term solution must "strengthen the ability of the system to shoulder its own burdens”</li></ul>
<p><b>6. Faster is slower</b></p>
<ul><li>The tortoise wins the race; all natural systems have intrinsically optimal rates of growth — far less than the fastest possible</li><li>Excessive growth (like cancer) makes the system compensate by slowing down — possibly risking survival (e.g., People Express airlines, Chapter 8)</li><li>Lewis Thomas quote: with a complex social system you "cannot just step in and set about fixing” it</li><li>Warning: systems principles must not become excuses for inaction ("a little knowledge is a dangerous thing") — the real implication is a new type of action rooted in a new way of thinking</li></ul>
<p><b>7. Cause and effect are not closely related in time and space</b></p>
<ul><li>"Effects" = obvious symptoms (drug abuse, unemployment, falling orders, sagging profits); "cause" = the interaction of the underlying system most responsible for generating the symptoms</li><li>The problem: most of us assume cause and effect are close (childhood play teaches us problems are near their solutions)</li><li>Managers act on this: manufacturing problem → look in manufacturing; missed targets → new sales incentives; inadequate housing → build more houses; inadequate food → provide more food</li><li>The beer game (Ch. 3) lesson: the root of our difficulties is neither recalcitrant problems nor evil adversaries — but ourselves — a fundamental mismatch between complex-system reality and our way of thinking; the first step is letting go of the proximity assumption</li></ul>
<p><b>8. Small changes can produce big results — but the areas of highest leverage are often the least obvious</b></p>
<ul><li>Systems thinking = "new dismal science" (obvious solutions fail) — but it also shows small, well-focused actions can produce significant, enduring improvements if placed right: leverage</li><li>High-leverage changes are highly nonobvious — not "close in time and space" to the symptoms</li><li>Buckminster Fuller's "trim tab": a small "rudder on the rudder," a fraction of its size; turning the trim tab one way creates a pressure differential that "sucks" the rudder (and thus the whole ship) the other way — a tiny device with enormous effect, totally nonobvious without understanding hydrodynamics</li><li>There are no simple rules for finding high leverage, but ways of thinking help: learn to see underlying "structures" rather than "events" (systems archetypes), and think in processes of change rather than snapshots</li></ul>
<p><b>9. You can have your cake and eat it too — but not at once</b></p>
<ul><li>Many "knottiest dilemmas" are artifacts of snapshot thinking, not real dilemmas — they resolve when you think about change over time</li><li>Low cost vs. high quality: manufacturers believed they had to choose — but process improvements can eliminate rework, quality inspectors, complaints, warranty costs, and raise loyalty, all over time; investing up front, quality and costs may both rise in the short term, savings harvested over years</li><li>Other false dilemmas: central vs. local control; committed employees vs. competitive labor costs; rewarding individuals vs. having everyone feel valued — rigid "either-or" choices only at a fixed point in time; the leverage is seeing how both improve over time</li></ul>
<p><b>10. Dividing an elephant in half does not produce two small elephants</b></p>
<ul><li>Living systems have integrity — their character depends on the whole; same for organizations</li><li>Three blind men and the elephant: one feels a rug (ear), one a hollow pipe (trunk), one a pillar (leg) — "Given these men's way of knowing, they will never know an elephant" — like heads of manufacturing, marketing, research seeing their own department's problems but not the interactions</li><li>Principle of the system boundary: examine the interactions most important to the issue at hand, regardless of parochial organizational boundaries</li><li>Organizations are designed to hide interactions: rigid internal divisions; "leaving" problems behind for others to clean up (contrast: European cities' green belts vs. US suburban sprawl exporting problems; corporations acquiring new businesses and "harvesting" mature ones)</li><li>If you divide the elephant anyway: a mess — a complicated problem with no leverage, because the leverage lies in interactions invisible from any single piece</li></ul>
<p><b>11. There is no blame</b></p>
<ul><li>We blame outside circumstances — "someone else" (competitors, press, marketplace, government) did it to us</li><li>Systems thinking shows there is no outside — you and the cause of your problems are part of a single system</li><li>The cure lies in your relationship with your “enemy”</li></ul>
<p><b>Key Takeaways</b></p>
<p>Most problems come from yesterday's solutions — quick fixes just move the bump (the snake is always underneath)</p>
<p>Compensating feedback means push harder → push back harder; low-leverage fixes work now, then backfire after a delay</p>
<p>The "bigger hammer" syndrome signals nonsystemic thinking; the "cure" can become addictive (shifting the burden to the intervenor)</p>
<p>Cause and effect are distant in time and space — so high-leverage changes are nonobvious (the trim tab: small, precise, opposite-direction action)</p>
<p>Real dilemmas usually dissolve into process thinking (both/and over time, not either/or now); see the whole system, not the part you hold; and blame is meaningless inside a single system</p>
<h3>Note of Video 1</h3>
<p><b>The Gardener Metaphor</b></p>
<p>A gardener tending flowers finds weeds that can kill his plants:</p>
<ul><li>He cuts the tops of the weeds → they grow back</li><li>He pulls them from the roots → weeks later, harmful weeds grow again</li></ul>
<p>Why? Because he missed the seeds in the soil, ready to grow again.</p>
<p>Something similar happens at work: we correct mistakes, only to have them occur again and again. Mistakes are your weeds — and only triple loop learning can stop them for good.</p>
<p>Work Example — Shift Handover Miscommunication</p>
<p>A miscommunication between supervisors during the shift handover causes a problem.</p>
<p>Single Loop Learning — "Doing things right”</p>
<ul><li>The manager steps in and simply fixes the problem</li><li>Correct the mistake, but don't look at the causes</li><li>The miscommunication happens again</li></ul>
<p>Double Loop Learning — "Doing the right things”</p>
<ul><li>The manager investigates and discovers the root cause: the handover process is not updated / missing elements</li><li>He updates the checklist for supervisors to follow</li><li>Correct the process/procedural causes — but miscommunications still don't disappear</li></ul>
<p>Triple Loop Learning — "Digging deeper at WHY”</p>
<ul><li>The manager looks deeper and tries to understand how his team views the handover process:<ul><li>They don't take it seriously — rush through, just "checking boxes," not really communicating</li><li>Some even do the handover in the car park; the first supervisor shares info but the second isn't listening</li></ul></li><li>He understands the environment and how his team learns — conducts sessions exploring what can happen with rushed handovers</li><li>They change the way they view handovers: supervisors do the handover slowly and clearly — first gives the brief, second repeats what he understood</li><li>Triple loop learning digs deeper at why we do things the way we do — it examines the reasons behind the rules, systems, processes, and desired outcomes. It's about how we decide what is right</li></ul>
<table><tr><th>Loop</th><th>Question</th><th>Focus</th><th>in the example</th></tr><tr><td>Single</td><td>Doing things right?</td><td>Fix the mistake</td><td>Manager fixes the problem directly</td></tr><tr><td>Double</td><td>Doing the right things?</td><td>Fix the process/causes</td><td>Manager updates the handover checklist</td></tr><tr><td>Triple</td><td>Why do we do things this way? What is right?</td><td>Fix mindsets, values &amp; how we learn</td><td>Team changes how they view handovers (slow, clear, repeat back)</td></tr></table>
<p>Remember: it's only by digging deep, questioning assumptions, and challenging systems that you will be able to make the changes you want. Start the learning process — single, double, and most importantly triple loop learning.</p>
<h3>Note of Video 2</h3>
<p><b>Overview</b></p>
<ul><li>The Ladder of Inference was first proposed by Harvard professor Chris Argyris</li><li>Imagine a microscopic ladder in the part of the brain we call the subconscious</li><li>Every time we interact with someone, the experience enters the ladder at the bottom and "zips up" the ladder to exit at the top — this happens thousands of times a day without us knowing it</li></ul>
<p><b>The Seven Rungs</b></p>
<p>Raw data &amp; observations: The raw experience — like what a video recording of the event would capture</p>
<p>Select &amp; filter: We unknowingly filter in specific details based on our preferences, tendencies and what we believe is important</p>
<p>Assign meaning: We interpret what the filtered information is telling us</p>
<p>Develop assumptions: Crucial rung — we start to blur the distinction between fact and story</p>
<p>Draw conclusions: Conclusions form from our assumptions — emotional reactions are created here</p>
<p>Adjust beliefs: We adjust our beliefs about the world and about the people involved</p>
<p>Take action: We act based on our adjusted beliefs</p>
<p>Worked Example — The Stolen Parking Spot</p>
<p>Rung 1 (data): You're cut off in a parking lot — someone pulls in front of you and steals your spot</p>
<p>Rung 2 (filter): You ignore the sunny weather and sale signs; you filter in the grip of your hands on the wheel, rising blood pressure, the squeal of brakes, and the other driver's face as he looks away</p>
<p>Rung 3 (meaning): You were taught to wait your turn — "first come, first served" — and this guy just stole your spot</p>
<p>Rung 4 (assumptions): "That stupid jerk — didn't his parents teach him anything? He must have seen my signal. Why does he think he's more important than everyone else?" Your story creates itself</p>
<p>Rung 5 (conclusions + emotions): He's careless and inconsiderate, needs to be taught a lesson — you feel angry, frustrated, vindictive, justified</p>
<p>Rung 6 (beliefs): "That's the last time I give in — next time, tires will be smoking!”</p>
<p>Rung 7 (action): You back up, pull up behind him, honk, and scream a few choice words</p>
<p>The twist</p>
<p>The man walks over and apologises quickly — his wife, almost due with their first baby, had called from inside the mall: she's in labour and needs the hospital. You're shocked, apologise profusely, and wish him luck.</p>
<p>What happened? Your beliefs were short-circuited by the other person's ladder — his story ("my wife is in labor, I need to get there quick, I'd better apologise") replaced your story.</p>
<p>Key Lesson — Short-Circuiting Your Own Ladder</p>
<p>We have a unique human function: free will. We can short-circuit our own ladder proactively, by choice.</p>
<p>Next time you notice yourself reacting to an experience:</p>
<p>Pay focused attention to your ladder</p>
<p>Ask yourself: What beliefs are at play? Where do they come from?</p>
<p>What data and observations did you filter in as a result of your beliefs — and why?</p>
<p>Are your assumptions valid and supported by facts?</p>
<p>Would a different set of assumptions create different feelings, and lead to new, better conclusions and actions?</p>
<h3>Note of Video 3</h3>
<p><b>1. Senge's Complex Relationship with Technology</b></p>
<ul><li>Senge has spent decades at MIT; his mentor Jay Forrester led the MIT team that built the first digital computers (invented core memory) — the first ~27 general-purpose computers were installed to coordinate North American air defense (1952–53), with IBM as contractor (that's how IBM entered computing)</li><li>Forrester had earlier invented radar; at ~35 he left digital technology entirely — his view: "the real frontier was understanding our human systems, not technology" — technology was "almost more like a production process"; put in enough money and people and you'll get progress</li><li>Senge: we live in the Machine Age (Lewis Mumford's term); "technology" has replaced the word “machine”</li></ul>
<p><b>2. Living Systems vs. Machines (Autopoiesis)</b></p>
<ul><li>Modern biology's consensus definition of life: autopoiesis (Greek poesis = create; self-creating) vs. allopoiesis (created by another) — a machine is allopoetic</li><li>A living system continually recreates itself: most body cells live hours to ~7 years — literally within 7 years the entire system is replaced</li><li>Term originated by Humberto Maturana, Chilean biologist (MIT postdoc; co-creator of the Santiago theory of cognition)</li></ul>
<p><b>3. The Santiago Theory of Cognition</b></p>
<p>Core claim: human beings do not passively perceive reality. We are not cameras:</p>
<ul><li>"We do not perceive the world; we see the world we know how to perceive”</li><li>Perception is a reflection of our history — a woman sees a different world than a man; a salesperson a different world than an engineer; a Chinese person a different world than a Westerner</li><li>We "bring forth" a reality — literally, not metaphorically (the living system interacts with its environment to bring forth awareness)</li><li>Illustration: a camera can record exactly what was said in the last five minutes; no human can — but ask people what they thought and felt and they have no difficulty → there are literally "150 or 200 realities in this room”</li></ul>
<p><b>4. Implications for the Social Domain</b></p>
<ul><li>Human relationships are, by nature, different systems with different realities interacting — i.e., conflict (not used pejoratively)</li><li>Maturana's "withering insight": "When one human being tells another what is real, what they are actually doing is making a demand for obedience" — it asserts "I have a privileged view of reality; you see something delusional; it's my job to correct you”</li><li>The corrective: humility — "I know I don't see everything; what do you see that I don't?" The technical-correct way to respond in conflict: "my listening led me to hear you saying this”</li><li>Connection to the audience's theme: be curious about children's experience with technology rather than "I am right, I'm here to tell you what to do”</li></ul>
<p><b>5. What Systems Thinking Really Means</b></p>
<p>Two colloquial meanings of "system" are NOT it:</p>
<p>Helplessness — "it's not my fault, it's the system” ❌</p>
<p>Technology — "we need a systems expert” ❌</p>
<p>Systems thinking is about interdependence / interconnectedness:</p>
<ul><li>A forest is "imponderable" — a profoundly complex system producing a niche for life to thrive</li><li>Start with "family" substituted for "system" — our archetypal system; cf. structural family therapy: a troubled teenager is often a symptom of the larger family system (how Mom and Dad interact), not the cause</li></ul>
<p><b>6. The Extraordinary Web of Interconnectedness</b></p>
<ul><li>The Industrial Age (not just IT) created a global web: any device, any food — "we literally stand holding the world in our hands”</li><li>Food miles: the average pound of food eaten by an American travels 2,000 miles; the "chain of custody" concept (Senge runs the Global Sustainable Food Lab, 15 years old)</li><li>The river example (seeing the whole system): Northern India's rivers are nearly dry year-round — because the Himalayan/Tibetan Plateau glaciers are contracting (global warming) — because we burn coal — "your dry rivers in India because every night you plug it in." The most common energy source for our sophisticated devices is burning former living things (coal)</li><li>Systems thinking = how do we keep stepping back to see the whole of our impact, not just the piece closest to us</li></ul>
<p><b>7. The Hidden Footprint of the Internet</b></p>
<ul><li>The W3C (protocols that make the internet work) was founded at MIT by Tim Berners-Lee, ~25 years ago</li><li>Electricity footprint: Google's president (5 yrs ago): server farms alone ≥ 5% of world electricity; with all devices intermediated through them, 10–15%, probably closer to 20% — doubling roughly every 3 years; already greater than all the world's lighting</li><li>We spend more energy powering gadgets than homes — and it's "one more way the wealthy impose themselves on the poor": gadget users are the (growing) middle class; the dry riverbeds, ~150 million chronically dehydrated people in Northern India/Pakistan/Afghanistan, and social turmoil are all one interconnected system</li></ul>
<p><b>8. Why This Matters for Education</b></p>
<ul><li>Kids today are the first generation growing up "in the planet" — aware of global imbalances, yet largely pessimistic about the future</li><li>Interconnectedness has gone up; our ability to understand it has gone down. Historically nature was the teacher (indigenous/agrarian learning); 10 years ago 80% of American urban kids thought food came from the grocery store (school-garden movement is helping)</li><li>The systems thinking in education movement (~20 years, in pockets) is where social-emotional learning was ~15 years ago — perhaps ~10 years away from becoming big; it's most natural where there's already commitment to the social-emotional space</li><li>Three sides of the same coin: the social world (friends, families), the natural world, and the individual (the Chinese character for person ≈ heart-mind-system) — all interconnectedness at every level</li></ul>
<p>9. Kids Are Natural Systems Thinkers</p>
<ul><li>Studies migrating programs "upstream" show 4–5-year-old (even preschool) children naturally see and understand interconnectedness — and will cultivate the skill if given half a chance</li><li>Closing video: six-year-old boys at a poor Tucson school, after a playground fight, drew their own feedback-loop map: "mean words → hurt feelings → mean words → fights…" — they explained the reinforcing loop, sketched a behavior-over-time graph, and brainstormed ways to break the loop ("saying sorry kind of worked" — crossed out; trying new ways next time; a leverage: find another friend; convert mean words to nice words/nice feelings)</li></ul>
<p><b>Key Takeaways</b></p>
<p>Technology ≠ the frontier (Forrester): the real frontier is understanding human systems</p>
<p>Living systems are self-creating (autopoietic); machines are created by another — we are not recording devices, so no one sees reality as it is</p>
<p>"Telling another what is real" = a demand for obedience; replace certainty with humility and curiosity</p>
<p>Everything is connected — from the food you eat to the rivers of Northern India to the electricity footprint of the internet (up to ~20% and doubling every 3 years)</p>
<p>Systems thinking in education is on the rise (like SEL 15 years ago) — and children are innately systems thinkers: "How we live is the problem, not our innate capabilities"</p>

<h3>Part B — What kind of learning happened?</h3>

<p>Why — mapped against the three loops from the modules:</p>
<ul><li>Single loop ("are we doing things right?", the thermostat) would have been: the patient's BP stays high → we turn the dial — "reduce salt a bit more, raise the medication dose" — while keeping the belief "salt is the culprit" untouched. Our actions change, our mental model doesn’t.</li><li>Double loop ("are we doing the right things?"): the article broke the feedback loop into our mental model (the module definition: real-world feedback stimulates changes in mental models). The Framingham Offspring Study (2,632 adults, 16-year follow-up) showed that people eating under 2,500 mg sodium/day ended with higher blood pressure; cardiovascular risk vs. sodium is J-shaped (over-restriction may be harmful); potassium, magnesium and calcium showed clearer inverse associations; the researcher concluded current sodium guidelines "may be misguided". This forced us to re-examine the belief itself, not just an action: from "less salt is always better" to "there is no support for pushing healthy adults below 2.3 g; electrolyte balance matters more than salt panic." New understanding → new goals (raise potassium) → new decision rules. That is textbook double-loop learning — "doing the right things", not just doing things right.</li><li>Triple loop ("what is right?" — questioning the governing framework): the article also nudges us onto the third loop. We didn't just doubt our salt belief; the study doubts the guideline's own rationale and decision rule — who decided 2,300 mg, on what evidence, and should that authority itself be re-examined? That is asking why we have these rules in the first place, i.e., reflecting on assumptions about how change happens and whose values frame "right treatment" (public-health agencies vs. the individual; note the sodium-sensitive minority who genuinely do need stricter limits — a pluralist, not unitary, situation). Argyris's warning fits us: "people unaware of the propositions they use... are prisoners of their own theories" — the article briefly freed us.</li></ul>
<h3>Part C — Map the ladder of inference (the main event)</h3>
<p>Two ladders side by side. Guide rungs (bottom→top): Observations → Assumptions → Beliefs → Conclusions → Actions — enriched with the module's insight that the ladder actually starts from a pool of available data and that we select only some of it.</p>
<table><tr><th>Rung (bottom - top)</th><th>Ladder 1 - BEFORE the article</th><th>Ladder 2 - AFTER the article</th></tr><tr><td>Observations (data we selected from the pool)</td><td>Patient has high BP, feels fine; the 2,300 mg guideline; "eat less salt" advice everywhere; relative on a low-salt diet</td><td>Same patient facts + article: Framingham Offspring, 2,632 adults, 16 yrs; &lt;2,500 mg sodium → higher BP; J-shaped curve; K/Mg/Ca inversely linked to BP; "recommendations may be misguided"</td></tr><tr><td>Assumptions (gaps we fill without checking)</td><td>Salt is the main cause; lower sodium is always safer; guidelines rest on solid science</td><td>The study is credible; there's a safe middle range (J-shape); sodium is only part of the story — the whole electrolyte balance matters; some people are sodium-sensitive</td></tr><tr><td>Beliefs (general rules carried forward)</td><td>"Salt causes high BP; a strict low-salt diet is essential to treatment"</td><td>"Pushing sodium below 2.3 g has no proven benefit; adequate potassium, calcium, magnesium matter as much — food balance over salt panic"</td></tr><tr><td>Conclusions (judgements about this case)</td><td>The plan must centre on heavy salt restriction (+ medication)</td><td>Strict salt restriction is not the evidence-based priority; build the diet around K/Mg/Ca-rich foods; extreme "no salt" may even backfire</td></tr><tr><td>Actions</td><td>Advise low-salt diet, ban processed food, count sodium, add meds</td><td>Advise moderate sodium (&lt;2.3 g fine), more fruit/veg/dairy and potassium-rich food; keep meds as needed; stop pushing patients to "eat as little salt as possible"</td></tr></table>
<p>Annotation — where the rungs actually broke (the interesting bit):</p>
<p>The reflexive loop is visible on Ladder 1. The module's slides show the pool of data → data we select → meaning affixed. Our belief "salt is the enemy" made us select the guideline messaging and ignore potassium data that was always there (compare the slide-32 worked example: the manager selected only "design approvals pending" and ignored the council permit delay → wrong bottleneck). We did the same: selected only the anti-salt narrative.</p>
<p>The meaning-affixing step did the work. "Salt raises BP" became "salt is the villain" — a jump from a single fact to a fixed meaning.</p>
<p>The shift point is the assumption rung. Everything above it ("lower is always safer" → "J-shape; too low is as risky as too high") moved once the assumption was questioned — exactly what the ladder is designed to reveal.</p>
<p>The reflexive loop now runs in reverse. With the new belief, our data selection changes too — we suddenly notice potassium on nutrition labels. Beliefs and data selection are a loop, not a chain (the module's point: the more rigid the belief, the smaller the slice of reality we attend to).</p>
<h3>Part D — Gallery walk (draft sticky notes for two other teams’ ladders)</h3>
<p>Leave in each team's corner D (find the contrast on their ladders, not ours):</p>
<ul><li>one thing that stood out — "The reflexive loop is visible in your 'before' ladder: you selected the anti-salt data and skipped the potassium evidence. Did you also notice your own selection at the time? Ours flipped only at the assumption rung — yours?”</li><li>one question — "Your 'after' actions still keep medication as a default. If the belief shifted to 'electrolyte balance matters', should the action rung also mention what to add (K/Mg/Ca foods), and how would you handle a sodium-sensitive patient — does that put you back in HST territory (one best way) or into an SST conversation (whose values decide)?”</li></ul>
<h3>Part E — Before you finish (wrap-up reflections)</h3>
<p>1. What did I learn about my own thinking today? I went from "the guidelines exist" → "salt is the enemy" → "strict low-salt plan" in seconds, never checking the evidence — my data selection was driven by my belief (the reflexive loop), not by reality. I also learned which kind of gap I jump: my assumption rung ("lower is always safer") was doing all the work while I stared at the conclusion. And the 2,300 mg figure was an anchor — a number I treated as established truth rather than a contested recommendation.</p>
<p>2. Did our team change its mind after reading the article? Mostly yes — from "cut salt aggressively" to "moderate sodium + add potassium-rich food." But not unanimously at first: one member's family history of stroke kept him pushing hard on salt, and we realised personal experience can pin a belief in place harder than data — his belief shaped his data selection just like ours did. The article shifted our justification, not instantly our habit; and we noticed the change was double-loop, not single-loop — we didn't merely tweak the salt dosage.</p>
<p>3. How do mental models affect the way we work on projects? Three concrete connections:</p>
<ul><li>HST vs. SST (module positioning): we treated high blood pressure as a simple-unitary problem with one best way (cut salt). The article revealed it as pluralist — competing values, J-shaped uncertainty, a sodium-sensitive minority. On projects, the same error shows up when teams apply hard, model-based tools (PERT, critical path, earned value) to complex, contested situations — "out-of-date solutions to the wrong questions," the module's HST critique.</li><li>Senge's Eleven Laws: our salt plan is a live demonstration of "the cure can be worse than the disease" (over-restriction → J-shape risk), "cause and effect are not closely related in time and space" (the 16-year Framingham follow-up — salt's effects are distant in time, easy to misread), and "the easy way out usually leads back in" (a panic "no salt" fix that pushes the problem elsewhere — onto potassium imbalance).</li><li>Problem/solution spaces &amp; complexity (Chapter 2): we had collapsed the solution space to a single point ("cut salt"). The article showed both spaces are malleable ranges — the problem space itself (what actually causes high BP) was still being defined, and ambiguity × interconnectedness (sodium ↔ potassium balance) had pushed the issue past the threshold into genuine complexity. The fix on projects is the same as on the sheet: deliberate perspective-switching (eagle vs. mouse — step back to the whole system, then back into the detail), and reflective practice — which is exactly what this exercise is.</li></ul>
`;

<ul><li>WBS by work function: Organizes tasks by specialized roles (e.g., engineering, marketing).</li></ul>
<h3>WBS structure considerations</h3>
<ul><li>Have 3-9 child elements for each parent.</li><li>Uniquely name each component in the WBS.</li></ul>
<h3>Establish change control</h3>
<ul><li>Plans must be made for dealing with change.</li><li>Every change to a project must be formally proposed, example, using a form.</li><li>Change request – “request to expand or reduce the project scope,  modify policies, processes, plans or procedures, modify costs or  budgets, or revise schedules” – PMBOK Guide.</li><li>Change control system – “a collection of formally documented  procedures that define how project deliverables and documentation  will be controlled, changed and approved” – PMBOK Guide.</li></ul>
<h3>Activities</h3>
<ul><li>“A component of work performed during the course of a project” –  PMBOK Guide.</li></ul>
<h2>Section 6</h2>
<h3>Project time management processes</h3>
<p>Define activities.</p>
<p>Sequence activities.</p>
<p>Estimate activity resources.</p>
<p>Develop schedule.</p>
<p>Control schedule.</p>
<h3>Program Evaluation and review technique (PERT)</h3>
<ul><li>Estimates most likely time needed to complete a project.</li><li>Estimates level of confidence in completing a project in a particular  time.</li><li>Useful in research and development projects.</li></ul>
<h3>Critical path method (CPM)</h3>
<ul><li>Used in very large projects.</li><li>Minimum total project duration.</li><li>Useful in the construction industry.</li></ul>
<h3>Activity on Node (AON) pr Precedence Diagramming Method (PDM)</h3>
<ul><li>Work activities are represented by a node and arrows connect activities representing the work of the event.</li><li>Precedence Diagramming Method (PDM) - "a schedule network diagramming technique in which the scheduled activities are represented by boxes or nodes…" - PMBOK Guide.</li></ul>
<h3>Creation of Project Schedules</h3>
<ul><li>Identify all activities.</li><li>Determine logical order in network diagram.</li><li>Assign resources to each activity.</li><li>Estimate time required for that activity.</li><li>Compare emerging schedule with imposed dates.</li><li>Consider project budget and cash flow, quality demands and risk  factors.</li></ul>
<h3>The project managers’ responsibility</h3>
<ul><li>Resist pressure to dictate a schedule.</li><li>Determine a schedule that is possible.</li><li>Persuade stakeholders that the schedule makes sense.</li><li>Deliver the project per the agreed-upon schedule.</li></ul>
<h3>List project milestones</h3>
<ul><li>Complete toon of a major deliverables.</li><li>Completion of a critical activity.</li><li>Prior to a large financial commitment.</li><li>Merging point in the project schedule.</li></ul>
<h3>Sequence activities</h3>
<ul><li>Predecessor activity - "the scheduled activity that determines when the logical successor activity can begin or end" - PMBOK  Guide.</li><li>The following activity is called a successor activity.</li><li>Place a successor activity after its predecessor.</li><li>Successor activity - "The schedule activity that follows a predecessor activity, as determined by their logical relationship" - PMBOK Guide.</li></ul>
<h3>Leads and lags</h3>
<ul><li>The most common type of logical dependency is Finish-to-start  (FS).</li><li>Leads are helpful if a project needs to be completed quickly.</li><li>Finish-to-start -"the logical relationship where initiation of work of  the successor activity depends on completion of work of the predecessor activity." - PMBOK Guide.</li><li>Lead - "a modification of a logical relationship that allows an  acceleration of the successor activity." - PMBOK Guide.</li><li>Lag - "a modification of a logical relationship that directs a delay in  the successor activity" - PMBOK Guide.</li></ul>
<h3>Finish-to-Finish Relationships</h3>
<ul><li>Finish-to-finish- "the logical relationship where completion of work  of the successor activity cannot finish until the completion of work of  the predecessor activity" - PMBOK Guide.</li></ul>
<h3>Start-to-start relationships</h3>
<ul><li>Start-to-start - "The logical relationship where initiation of the  successor schedule activity depends on the initiation of the  predecessor schedule activity" - PMBOK Guide.</li></ul>
<h3>Start-to-finish relationships</h3>
<ul><li>Start-to-finish - "the logical relationship where completion of the successor schedule activity is dependent on the initiation of the predecessor schedule activity" - PMBOK Guide.</li></ul>
<h3>Activity Duration Estimation</h3>
<ul><li>Changing assumptions and constraints could change estimates.</li><li>Duration - "The total number of work periods (not including holidays or other non-work time) required to complete a schedule activity." PMBOK Guide.</li></ul>
<h3>Estimate activity duration</h3>
<ul><li>Identify the output that will be created.</li><li>Identify the skill level required to perform the work.</li><li>Disregard predetermined completion points.</li><li>When using a past project as a guide, use actual time not initial</li></ul>
<h3>Estimates for activities.</h3>
<ul><li>Keep time estimates in the same unit of measure.</li><li>Elapsed units versus normal units (eg. Days versus days, or melon versus months).</li></ul>
<h3>Suggestions for creating realistic time estimates</h3>
<p>Verify all time estimations with the people doing the work.</p>
<p>Estimate times of completion of work without initial reference to a  calendar.</p>
<p>Make sure all time units are identical: working days, work week,  months (consider time off for company holidays).</p>
<p>Consider time constraints - unexpected meetings, interruptions,  inaccuracy in work instructions, emergencies/illness, learning curves,  vacation, rework, resources pr information not available on time.</p>
<p>Acknowledge tendency toward optimistic or pessimistic estimations.</p>
<p>First establish a realistic estimate.</p>
<p>Adjust estimates based on size, familiarity, and complexity differences.</p>
<h3>Learning Curves</h3>
<ul><li>The more times a person performs an activating, the better and faster he or she becomes.</li><li>Rate of improvement can be studied and predicted.</li><li>Time necessary to perform an activity is calculated based upon a rate of improvement.</li><li>Time estimates are found in learning curve tables.</li><li>Rapid learning leads to faster performances times.</li><li>PMs should plan for learning that takes place.</li><li>PMs should create and sustain an environment that encourages and expects rapid learning.</li></ul>
<h3>Develop Project Schedules</h3>
<ul><li>Identify the critical path:<ul><li>Two-ass method and enumeration method.</li><li>Critical path - “…the sequence of activities that determines the duration of the project…the longest path through the project.” PMBOK Guide.</li></ul></li></ul>
<h3>Two-Pass Method</h3>
<ul><li>Used to determine the amount of slack each activity has.</li><li>Make two logical passes through the constructed network:<ul><li>The forward pass.</li><li>The backward pass.</li></ul></li><li>Forward pass - “the calculation of the early start and early finish  dates for the uncompleted portions of all network activities.” PMBOK  Guide.</li></ul>
<h3>Times important to each activity</h3>
<ul><li>Early start date (EF) - “the earliest possible point in time on which uncompleted portions of a schedule activity can start…” PMBOK  Guide.</li><li>Early finish date (ES) - “the earliest possible point in time on which uncompleted portions of a schedule activity can finish…”  PMBOK Guide.</li><li>Late start date (EF) - “the latest possible point in time that a schedule activity may begin…” PMBOK Guide.</li><li>Late finish date (ES) - “the latest possible point in time that a schedule activity may be completed…” PMBOK Guide.</li></ul>
<h3>Schedule example first pass</h3>
<ul><li>Start at the beginning of the project and ask how soon each activity can begin and end.</li></ul>
<h3>Second or Backward Pass</h3>
<ul><li>How late can each activity be finished and started?</li><li>Backward pass - “the calculation of late finish dates and late start dates for the uncompleted portions of all schedule activities.” PMBOK Guide.</li></ul>
<h3>Schedule example second pass</h3>
<ul><li>Start at the end of the project and ask how late each activity can finish and begin.</li></ul>
<h3>Float and the critical path</h3>
<ul><li>Compute the critical path based on float (slack).</li><li>Activities with no float or very little float need to be scheduled very carefully.</li><li>Float = Late Start – Early Start (Float = LS – ES).</li><li>Critical path is the sequence of activities that have no float.</li><li>Total float - “the total amount of time a schedule activity may be delayed from its early start date without delaying the project finish  date.” PMBOK Guide.</li><li>Free float - “the amount of time a schedule activity can be delayed without delaying the early start of any immediately following schedule activities” PMBOK Guide.</li></ul>
<h3>Enumeration Method</h3>
<ul><li>All paths are identified and timed if the team needs to compress the schedule.</li></ul>
<h3>Program Evaluation and Review Technique (PERT)</h3>
<ul><li>Aid to understanding how variability in the duration of individual activities impacts the entire project schedule.</li><li>Create 3 estimates of time to complete each activity:<ul><li>Optimistic.</li><li>Most likely.</li><li>Pessimistic.</li></ul></li><li>Estimated time = [Optimistic +4(Most likely) + Pessimistic]/6</li><li>PERT considerations</li><li><b>Advantages:</b><ul><li>Reinforces the degree of uncertainty that exists in project schedules.-Calculations indicate that expected time is longer than most likely time.</li></ul></li><li><b>Difficulties:</b><ul><li>Takes more effort to create 3 estimates.</li><li>No guarantee how good the estimates are.</li><li>May underestimate the risk of a schedule running long.</li></ul></li></ul>
<h3>Show the project schedule on a Gantt Chart</h3>
<ul><li>An easier to understand tool for communicating a project schedule.</li><li>A horizontal bar chart showing each activity early start and finish.</li><li>Show a bar for each activity stretched over a time line.</li><li>Gantt chart - “a graphic display of schedule related information.” - PMBOK Guide.</li></ul>
<h3>Build the Logical Network Diagram</h3>
<p>Enter tasks and milestones.</p>
<p>Understand task dependencies.</p>
<p>Define dependencies using a task table and mouse.</p>
<p>Define or delete a dependency series.</p>
<p>Understand network diagram presentation.</p>
<p>Verify the accuracy of the network logic.</p>
<h2>Section 7</h2>
<h3>Estimate Resource needs</h3>
<ul><li>How many resources of each type and skill or knowledge level are needed.</li><li>Consider support needs such as information systems and human resources</li><li>Consider constraints placed upon how people are hired, scheduled and released.</li><li>Estimate activity resources - "the process of estimating the types and quantities of resources required to perform each scheduled activity." - PMBOK Guide.</li></ul>
<h3>Create a staffing management plan</h3>
<ul><li>Identify potential resources.</li><li>Determine resource availability.</li><li>Decide timing issues.</li><li>Staffing management plan - "the document that describes when and how human resource equipment will be met" PMBOK Guide.</li></ul>
<h3>Assign a resource to each activity</h3>
<ul><li>Show resource responsibilities on RACI chart.</li><li>Show resource assignments on Gantt Chart.</li><li>Summarise resource responsibilities with histogram.</li></ul>
<h3>Show resource responsibilities on RACI Chart</h3>
<ul><li>Responsibility Assignment Matrix (RAM).</li><li>RACI is a form of RAM.</li><li>RACI - Responsible, Accountable, Consult, Inform.</li><li>Responsibility assignment matrix (RAM) - "a structure that relates the project organisational breakdown to the work breakdown structure… each component of the project's scope of work is assigned to a person or team." PMBOK Guide.</li></ul>
<table><tr><th>WBS</th><th>Activity</th><th>Who 1?</th><th>Who 2?</th></tr><tr><td>The work breakdown structure</td><td>Project activities that correspond to the WBS</td><td>Who will be involved</td><td>May be more than one person</td></tr></table>
<h3>A note on effort/work versus duration</h3>
<ul><li>There is a difference between work and duration.</li><li>By default, work is calculated in hours and follows this formula:</li><li>Work = Duration * Units (W=D*U)       (units refers to resources)</li><li>Duration = Work/Units       (to solve for the duration rather than work)</li><li>Effort-driven scheduling - is when the work remains constant and  the duration is changed.<ul><li>Work (effort) remains constant and determines (drives) the way that  the W=D*U formula will be calculated.</li></ul></li></ul>
<h3>Methods of resolving resource overloads</h3>
<ul><li>Recorder the activities.</li><li>Acquire or borrow additional resources.</li><li>Reduce project scope or extend project schedule.</li><li>Inform the sponsor of severe overloads.</li><li>Resource level the overloaded person's schedule.</li><li>Ask if the resource is willing to do overtime (with care and attention).</li></ul>
<h3>Resource levelling</h3>
<ul><li>Delay activities so the person doesn't perform as many activities at  the same time (most common).</li><li>Delay non-critical activities by an amount no more than their slack.</li><li>Allow the project to slip - reduces peak demand and smoothers the  period to period resource usage.</li><li>Resource levelling - "any form of schedule network analysis in  which scheduling decisions… are driven by resource constraints." -  PMBOK Guide.</li><li>If non-critical activities must be completed at the rate of effort in the  original schedule, reassign activities to another worker.</li></ul>
<h3>Compress the project schedule</h3>
<ul><li>Actions to reduce the critical path.</li><li>Crashing.</li><li>Fast tracking.</li></ul>
<h3>Actions to reduce the critical path</h3>
<ul><li>Reduce the projects scope and/or quality.</li><li>Overlap sequential activities.</li><li>Partially overlap sequential activities.</li><li>Increase the number of work hours/days.</li><li>Schedule activities at the same time.</li><li>Shorten the duration of critical activities.</li><li>Shorten activities by assigning more resources.</li><li>Shorten activities that cost the least to speed up.</li></ul>
<h3>Compress the project schedule</h3>
<ul><li>Crashing may cost more money to speed up the schedule.</li><li>Fast tracking may increase the risk to speed up the schedule.</li><li>Crashing - "a specific type pf project schedule compression</li></ul>
<p>technique… performed by taking action to decrease the total project  duration… how to get the maximum schedule duration for the least  additional cost." PMBOK Guide.</p>
<ul><li>Fast tracking - "a specific project schedule compression technique</li></ul>
<p>that change network logic to… perform schedule activities in parallel." PMBOK Guide.</p>
<h3>Crashing</h3>
<ul><li>Certain activities are performed at a faster than normal pace.</li><li>Crashing example - in "All-Crash" Mode.</li></ul>
<h3>Fast tracking</h3>
<ul><li>Activities normally performed in series are performed at the same time.</li></ul>
<h2>Section 8</h2>
<h3>Introduction to Project Budgeting</h3>
<ul><li>Cost management plan - "the document that sets out the format and establishes the activities and criteria for planning, structuring and controlling the project costs." PMBOK Guide.</li></ul>
<h3>Purposes of the Cost management plan</h3>
<ul><li>Provides feedback linking the project to business objectives.</li><li>Provides detail and summary information.</li><li>Helps project stakeholders focus in schedule, performance and cost.</li></ul>
<h3>Estimate cost</h3>
<ul><li>Cost estimating - "the process of developing an approximation of</li></ul>
<p>the cost of the resources needed to complete project activities." - PMBOK Guide.</p>
<h3>Types of costs - fixed vs variable</h3>
<ul><li>Fixed costs remain the same regardless of volume of work.</li><li>Variable costs vary directly with the volume of use.</li><li>Fixed and variable costs involve consideration of the project scope.</li></ul>
<h3>Types of costs - Direct vs indirect</h3>
<ul><li>Direct costs only occur because of the project:<ul><li>Direct labor.</li><li>Other direct costs - material, travel, consultants, subcontracts, purchased parts and computer time.</li></ul></li><li>Indirect costs are necessary costs not associated with one specific  project:<ul><li>Buildings (eg council rates), utilities, insurance and clerical assistance.</li><li>Costs are allocated across projects.</li></ul></li></ul>
<h3>Types of costs - recurring vs nonrecurring</h3>
<ul><li>Recurring costs repeat as the project work continues.<ul><li>Cost of writing and printing architectural diagrams; laying bricks. -Occur during project evaluation.</li></ul></li><li>Nonrecurring costs happen only once during a project.<ul><li>Design development.</li><li>Occur during project planning and closing.</li></ul></li></ul>
<h3>Types of costs - regular vs expedited</h3>
<ul><li>Regular costs occur when progress can be made y normal work</li></ul>
<p>hours and purchasing agreements (the preferred cost).</p>
<ul><li>Expedited costs occur when the project must be conducted faster</li></ul>
<p>than normal.</p>
<p>-Overtime and extra charge apply.</p>
<h3>Types of costs - estimate vs contingency</h3>
<ul><li>Estimate - "a quantified assessment of the likely amount… it should always include an indication of accuracy." PMBOK Guide.</li><li>Reserve - "a provision in the project management plan to mitigate cost and/or schedule risk. Often used with a modifier (e.g management reserve, contingency reserve) to provide further detail on what types of risk are meant to be mitigated.”  - PMBOK Guide.</li></ul>
<h3>Types of costs - accrual vs cash accounting</h3>
<ul><li>Accrual - transaction are recorded in the time period the expense</li></ul>
<p>occurred.</p>
<ul><li>Cash - records transactions when the money is spent.</li><li>Cash accounting is more frequently used on projects.</li></ul>
<h3>Project cost estimate comparisons</h3>
<ul><li>Effort Curve: A blue line shows effort starting low during Initiating, peaking during Planning and Executing, and dropping sharply during Closing.</li><li>Approvals: Key milestones mark each stage transition: Charter, Project Plan, Project Result, and Admin. Closure.</li><li>Estimation Progression: As the project advances, estimates become more precise:</li><li>Order of Magnitude: -40% to +100% accuracy (using Analogous estimating).</li><li>Budget: -30% to +50% accuracy (using Parametric estimating).</li><li>Definitive: -10% to +15% accuracy (using Bottom-up estimating).</li><li>Rolling Wave: An arrow at the bottom indicates a "Rolling Wave" planning approach, suggesting that planning is iterative and detailed as the project progresses.</li></ul>
<h3>Methods of estimating costs</h3>
<ul><li>Analogous estimating.</li><li>Parametric estimating.</li><li>Bottom-up estimating.</li></ul>
<h3>Analogous estimating</h3>
<ul><li>Consider a similar project as a cost estimating starting point.</li><li>Requires experience performing similar projects and actual cost of</li></ul>
<p>similar projects.</p>
<ul><li>Knowledge of how the proposed project differs from the previous,</li><li>Experience with methods used to perform the project.</li><li>Analogous estimating - "an estimating technique that uses parameters such as size, weight or complexity from a previous similar activity as the basis for estimating the same parameter or measure for a future activity." - PMBOK Guide.</li></ul>
<h3>Parametric estimating</h3>
<ul><li>Involves finding more information regarding the project.</li><li>Parametric estimating - "an estimating technique that uses a statistical relationship between historical data and other variables to calculate project costs.</li></ul>
<h3>Bottom-up estimating</h3>
<ul><li>Most detailed - specifications need to be very clear.</li><li>Time consuming.</li><li>Most accurate for of estimating.</li><li>Ensure every item is included.</li><li>Bottom-up estimating - "a method of estimating a component of  work. The work is decomposed into more detail. AN estimate is  prepared of what is needed to meet the requirements of each of the  lower, more detailed pieces of work, and these estimates are then  aggregated into a total quantity for the project." - PMBOK Guide.</li></ul>
<h3>Cost estimating method comparison</h3>
<p>Cost Estimating Method Comparison</p>
<table><tr><th>none</th><th>Analogous</th><th>Parametric</th><th>Bottom-up</th></tr><tr><td>Amount of information required</td><td>Least</td><td>Middle</td><td>Most</td></tr><tr><td>Amount of time required</td><td>Least</td><td>Middle</td><td>Most</td></tr><tr><td>Accuracy Obtained</td><td>Lowest</td><td>Middle</td><td>Highest</td></tr></table>
<h3>Project cost estimating issues</h3>
<ul><li>Supporting detail.</li><li>Causes of variation.</li><li>Vendor and analysis.</li><li>Value engineering.</li><li>Activity-based costing.</li><li>Time value of money.</li><li>International currency fluctuations.</li></ul>
<h3>Supporting detail</h3>
<ul><li>Describe the scope, method used to create the estimate,</li></ul>
<p>assumptions, constraints and range of possible outcomes.</p>
<h3>Vendor Bid analysis</h3>
<ul><li>Use vendor bid analysis to determine whether the price is</li></ul>
<p>reasonable.</p>
<ul><li>For competing bids, assume the lowest responsible offer is fair.</li><li>Prices may be determined in the market place.</li></ul>
<h3>Value engineering</h3>
<ul><li>Method of double-checking all the chosen methods for</li></ul>
<p>accomplishing work (cost) and the features of the project  deliverables (function).</p>
<ul><li>Value is defined as the ratio of function to cost.</li><li>A separate stage may be incorporated late in the project planning to</li></ul>
<p>ensure time is spent on value engineering.</p>
<ul><li>Value engineering - "an approach used to optimise project life</li></ul>
<p>cycle costs, save time, increase profits, improve quality, expand market share, solve problems, and/or use resources more effectively." - PMBOK Guide.</p>
<h3>Life cycle costing</h3>
<ul><li>The total costs of creating and using the project during its useful life.</li><li>Consider disposition costs of the product after its useful life is</li></ul>
<p>complete.</p>
<h3>Time value of money</h3>
<ul><li>Discounting the value of future revenue and cost streams will enable</li></ul>
<p>better project decisions.</p>
<ul><li>Discount future dollars by the appropriate rate.</li><li>The rate depends on the underlying inflation rate plus the cost of</li></ul>
<p>capital.</p>
<h3>Determine budget</h3>
<ul><li>Determine budget - "the process of aggregating the estimated</li></ul>
<p>costs of individual activities or work packages to establish an authorised cost baseline." "PMBOK Guide.</p>
<h3>Aggregating costs</h3>
<ul><li>Direct and indirect costs add up to the cost baseline.</li><li>The cost baseline is an integral part of the project management</li></ul>
<p>plan.</p>
<ul><li>The cost baseline can only be changed through a formal change management process.</li><li>Cost performance baseline - "a specific version of a time-phased budget used to compare actual expenditures to planned expenditures to determine if preventive or corrective action is needed to meet the project objectives," - PMBOK Guide.</li></ul>
<h3>Analysing reserve needs</h3>
<p>Estimating costs of project variation</p>
<table><tr><th>How variation is understood</th><th>Known Knowns</th><th>Known Unknowns</th><th>UnKnown Unknowns</th></tr><tr><td>How it is discovered</td><td>Scope definition create WBS</td><td>Risk identification</td><td>Situation occurs</td></tr><tr><td>Stage when it is usually uncovered</td><td>Initiating or planning</td><td>Initiating or planning</td><td>Executing</td></tr><tr><td>Method of <br>estimating costs</td><td>Estimate directly</td><td>Contingency reserves</td><td>Management receives</td></tr></table>
<ul><li>Known knowns are discovered during planning and can be estimated</li></ul>
<p>directly.</p>
<ul><li>Known unknowns are discovered during risk identification.</li><li>Unknown unknowns (unk unks) are totally unexpected occurrences</li></ul>
<p>that cause an increase in cost and/or schedule.</p>
<ul><li>The amount placed into contingency reserve is calculated during risk analysis.</li><li>The amount placed into management reserve is determined by how much uncertainty management feels exists in the project. The cost baseline, contingency reserve and management reserve are used to determine if sufficient funds are available.</li></ul>
<h3>Determining cash flow</h3>
<ul><li>Expenses are applied to individual activities in the schedule to see when cash is needed.</li><li>Cash may be supplied through organisation budgets on a periodic basis</li><li>The cumulative amount of cash coming in to the project must meet or exceed demands for cash payouts.</li></ul>
<h3>Establishing cost control</h3>
<ul><li>Milestones are used as a typical measuring point:<ul><li>-Identified in the milestone schedule in the project charter.</li><li>-Identified in constructing the project schedule.</li></ul></li><li>Use cash flow projections to determine how much funding is expected to reach each milestone.</li><li>Create enough milestones to keep track of progress without creating an administrative burden.</li></ul>

<h2>Week 1 Online Modules</h2>

<h3>Note of Chapter 1 - Project Definition</h3>
<p>STUDY NOTES - PROJECT DEFINITION</p>
<p><b>SOURCE</b></p>
<ul><li>Book: Project Management, Planning and Control (7th Edition)</li><li>Chapter 1: Project Definition</li><li>Author: Eur Ing Albert Lester CEng, FICE, FIMechE, FIStructE, Hon FAPM</li><li>Publisher: Elsevier, 2017, Pages 1-5</li></ul>
<p><b>WHAT IS A PROJECT?</b></p>
<ul><li>Most authoritative definition is from BS 6079-2:2000 (Project Management Vocabulary): "A unique process, consisting of a set of co-ordinated and controlled activities with start and finish dates, undertaken to achieve objectives conforming to specific requirements, including constraints of time, cost and resources.”</li><li>A project has a definite STARTING point and a definite FINISHING point, and must meet specified objectives.</li></ul>
<p>WHY PROJECT MANAGEMENT? (vs. Line Management)</p>
<ul><li>Project management = MANAGEMENT OF CHANGE.</li><li>Running a functional business = managing a continuum / "business-as-usual”.</li><li>Example: no PM needed to run a sausage-pie factory, but PM IS needed to relocate the factory, build an extension, or produce a new product (new machinery, skills, staff training, marketing).</li><li>Project manager: thrives on change, PROACTIVE to change.</li><li>Line manager: REACTIVE to change, hates disruption. -&gt; This contrast often creates friction when change is introduced.</li><li>Project types: (a) Revenue-generating projects (e.g., improving cash flow). (b) Capital projects (extra expenditure/resources to change the capital base) - the techniques in this book apply most easily here.</li><li>Size does not matter: techniques suit building a cathedral OR a garden shed; moving house is a project too. There is NO upper or lower limit.</li></ul>
<p>THE THREE FUNDAMENTAL CRITERIA (PROJECT TRIANGLE)</p>
<p>Completed ON TIME.</p>
<p>Accomplished WITHIN BUDGETED COST.</p>
<p>Meet PRESCRIBED QUALITY requirements (also called "performance”).</p>
<ul><li>Represented by the well-known PROJECT TRIANGLE (Fig 1.2).</li><li>In safety-critical industries (airlines, railways, mining) a fourth criterion - SAFETY - turns the triangle into a PROJECT DIAMOND (Fig 1.3).</li><li>Safety is placed in the CENTRE of the triangle/diamond to emphasize its importance - shown as the "S” symbol.</li></ul>
<p>PRIORITY EXAMPLES FOR EACH CRITERION</p>
<p>(a) TIME-BOUND PROJECT</p>
<ul><li>A scoreboard for a tennis tournament must be finished by the opening match, even if cost rises and secondary features (e.g., service-speed display) are dropped. Cost and performance may be sacrificed for the unalterable start date.</li></ul>
<p>(b) COST-BOUND PROJECT</p>
<ul><li>A local-authority housing development cannot exceed budget because the government housing grant is frozen at a fixed sum. May cut the number of units or reduce the specification of internal fittings, even if the programme overruns.</li></ul>
<p>(c) PERFORMANCE (QUALITY)-BOUND PROJECT</p>

<p><b>3. Why it matters</b></p>
<ul><li>Building a WBS up front, identifying deliverables, gives a "picture worth a thousand words" — for both the PM and the team.</li><li>It sets the vision for the project objectives.</li></ul>
<p><b>4. Purpose</b></p>
<ul><li>To organize and define the total scope — scope is made up of deliverables.</li></ul>
<p><b>5. Structure (the hierarchy)</b></p>
<ul><li>Top: Project (may contain phases, e.g. Phase 1 / Phase 2, or sub-projects)</li><li>Phases → main deliverables (high-level)</li><li>Deliverables → broken into sub-deliverables</li><li>Sub-deliverables → eventually broken down into work packages (the actual work to be executed)</li><li>Team members complete work packages, which produce the deliverables.</li></ul>
<p><b>6. Main takeaways</b></p>
<ul><li>Understand: the definition, the structure, the purpose, and how to build it.</li><li>Keep decomposing until you reach work packages; the WBS is a simple but powerful picture for teams and projects.</li><li>ProjectManager.com's tool helps you decompose work on your project.</li></ul>
<h3>Note of Video 2</h3>
<p><b>Key Idea</b></p>
<p>Project scheduling is a process — the act of creating your project schedule. It's essential for delivering your project on time.</p>
<p><b>3 Main Steps to Create a Schedule</b></p>
<ol><li>Determine all the work to be performed<ul><li>Identify every piece of work needed to build and deliver the product.</li><li>Start from a high-level view and break it down into work packages.</li></ul></li><li>Determine who performs the work (resources)<ul><li>Ask: Are they employees, outside contractors, or vendor partners?</li><li>Consider union labor — check availability and avoid strike periods.</li><li>Account for holidays, vacations, and availability.</li><li>Identify any specific requirements or subject matter experts (SMEs) needed.</li><li>Decide when to bring them in — for the entire project or only during a specific phase.</li></ul></li><li>Estimate how long the work will take<ul><li>Have the people who will actually do the work make the estimates.</li><li>Use different estimation formulas to derive duration.</li></ul></li></ol>
<p><b>Tips to Remember</b></p>
<ul><li>Include all work associated with delivering the project on time.</li><li>Include activities, deliverables (actual work products), milestones, and planned start/end dates.</li><li>The schedule is a tool for measuring where you are in the project.</li></ul>
<p><b>Best Practice</b></p>

<h3>Note of Video 3</h3>
<p><b>Origins</b></p>
<ul><li>CPM was developed in the 1950s by Morgan Walker (DuPont) and James Kelly (Remington Rand)</li><li>Around the same time, PERT (Program Evaluation and Review Technique) was created by Booz Allen Hamilton + the US Navy</li></ul>
<p><b>CPM vs PERT</b></p>
<table><tr><th>-</th><th>PERT</th><th>CPM</th></tr><tr><td>Diagram style</td><td>Activities on arrows, nodes = connections</td><td>Activities as nodes/boxes, arrows = logical links</td></tr><tr><td>Duration estimate</td><td>Three-point estimates (optimistic/pessimistic/most likely)</td><td>Single point estimates</td></tr></table>
<p><b>Six Steps of CPM</b></p>
<ol><li>Specify activities — based on the Work Breakdown Structure (WBS)</li><li>Sequence activities — understand dependencies between them</li><li>Draw a network diagram — boxes connected by arrows</li><li>Estimate durations — single point estimates per activity</li><li>Identify the critical path — the longest route through the network; it determines project completion time</li><li>Monitor &amp; update — use the critical path as a planning and control tool, updating it to reflect progress</li></ol>
<p><b>Key Concepts</b></p>
<ul><li>Float (slack): how much a non-critical activity's start time can vary without delaying the project end date</li><li>Multiple critical paths: possible when several routes through the network have equal total durations (requires resource flexibility to execute in parallel)</li></ul>
<p><b>CPM ↔ Gantt Chart</b></p>
<ul><li>They are siblings — two different views of the same information (project logic + timeline)</li><li>CPM is strong for understanding project logic and duration; Gantt charts are often preferred for day-to-day scheduling</li><li>High-end planning tools generate both formats from one set of underlying data</li></ul>
<h3>Note of Video 4</h3>
<p>What it covers A step-by-step walkthrough of building a project schedule network and identifying the critical path using PERT/CPM.</p>
<p><b>Key steps</b></p>
<ol><li>Build the network diagram – Convert the activity list (activities + durations + dependencies) into a PERT/CPM network of nodes and arrows.</li><li>Forward Pass – Move left to right: compute Early Start (ES) and Early Finish (EF) for each activity. ES = max EF of all predecessors; EF = ES + duration. This gives the earliest project completion time.</li><li>Backward Pass – Move right to left: compute Late Finish (LF) and Late Start (LS). LF = min LS of all successors; LS = LF − duration.</li><li>Calculate Slack/Float – Float = LS − ES (or LF − EF). Activities with zero float have no scheduling flexibility.</li><li>Find the Critical Path – The sequence of zero-float activities running from start to end. It is the longest path through the network and determines the total project duration — any delay on it delays the whole project.</li></ol>
<p><b>Key takeaways</b></p>
<ul><li>PERT (3-point estimates, probability) vs. CPM (deterministic durations) share the same network logic.</li><li>Critical path = longest path = shortest possible project completion time.</li><li>Non-critical activities have float and can slip without delaying the project — this drives resource leveling/prioritization.</li><li>Use dummy activities to correctly model dependencies in network diagrams.</li></ul>
<p>Practical use: identifying the critical path tells a project manager which tasks need tightest monitoring and where crashing (adding resources to compress time) makes sense.</p>

<table><tr><th>Method</th><th>How it works</th><th>Notes</th></tr><tr><td>Simple random sample</td><td>Each item in the frame has equal chance (e.g., random number generator, Excel)</td><td>Most basic; can be with/without replacement</td></tr><tr><td>Systematic sampling</td><td>Pick a random start, then every k-th item (e.g., 1 in 10 from 40 → sample of 4)</td><td>Convenient, still random</td></tr><tr><td>Stratified sampling</td><td>Divide frame into strata (e.g., gender), random sample within each</td><td>Ensures proportional representation of minority groups; can make statements about subgroups; very common in surveys</td></tr><tr><td>Cluster sampling</td><td>Divide population into natural clusters (e.g., doctors' offices, suburbs), randomly select clusters, then sample within</td><td>Convenient when enumeration is hard (e.g., drug effectiveness, elections by area)</td></tr></table>
